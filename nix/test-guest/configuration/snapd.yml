- name: Configure snapd
  hosts: test_vm
  become: true
  gather_facts: true

  tasks:
    - name: Validate snapd support
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: >-
          snapd is currently configured only for Ubuntu test guests,
          not {{ ansible_facts.distribution }}.

    - name: Refresh Ubuntu package metadata
      ansible.builtin.apt:
        update_cache: true

    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: latest
        install_recommends: false

    - name: Report installed and candidate snapd packages
      ansible.builtin.command:
        cmd: apt-cache policy snapd
      register: snapd_package_policy
      changed_when: false

    - name: Display installed and candidate snapd packages
      ansible.builtin.debug:
        var: snapd_package_policy.stdout_lines

    - name: Start snapd socket activation
      ansible.builtin.systemd_service:
        name: snapd.socket
        enabled: true
        state: started

    - name: Wait for snapd seed
      ansible.builtin.command:
        cmd: snap wait system seed.loaded
      changed_when: false

    - name: Query running snapd version
      ansible.builtin.command:
        cmd: snap version
      register: snapd_version
      changed_when: false

    - name: Display running snapd version
      ansible.builtin.debug:
        var: snapd_version.stdout_lines
