# PROTOTYPE: Configure rootful Podman in a disposable test guest.

- name: Configure rootful Podman
  hosts: test_vm
  become: true
  gather_facts: false

  tasks:
    - name: Install rootful Podman
      ansible.builtin.package:
        name: podman
        state: present

    - name: Enable the rootful Podman API socket
      ansible.builtin.systemd_service:
        name: podman.socket
        enabled: true
        state: started

    - name: Verify rootful Podman
      ansible.builtin.command:
        argv:
          - podman
          - --url
          - unix:///run/podman/podman.sock
          - info
      changed_when: false

    - name: Verify rootful Podman mode
      ansible.builtin.command:
        argv:
          - podman
          - --url
          - unix:///run/podman/podman.sock
          - info
          - --format
          - "{% raw %}{{.Host.Security.Rootless}}{% endraw %}"
      changed_when: false
      register: podman_rootless
      failed_when: podman_rootless.stdout != "false"
