- name: Publish development gateway paths
  ansible.builtin.set_fact:
    ryno_gateway_state_root: "{{ ryno_gateway_service_home }}/.local/share/ryno-test-guest"
    ryno_gateway_config_home: "{{ ryno_gateway_service_home }}/.config"

- name: Create development gateway directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ ryno_gateway_service_user }}"
    group: "{{ ryno_gateway_service_user }}"
  loop:
    - "{{ ryno_gateway_state_root }}"
    - "{{ ryno_gateway_state_root }}/xdg/config"
    - "{{ ryno_gateway_state_root }}/xdg/cache"
    - "{{ ryno_gateway_state_root }}/xdg/data"
    - "{{ ryno_gateway_state_root }}/xdg/state"
    - "{{ ryno_gateway_config_home }}/systemd/user"
  become: true

- name: Generate development gateway credentials
  ansible.builtin.command:
    cmd: "{{ ryno_gateway_bin }} generate-certs --output-dir {{ ryno_gateway_state_root }}/pki"
    creates: "{{ ryno_gateway_state_root }}/pki/jwt/signing.pem"
  become: true
  become_user: "{{ ryno_gateway_service_user }}"

- name: Write development Podman gateway configuration
  ansible.builtin.copy:
    dest: "{{ ryno_gateway_state_root }}/gateway.toml"
    mode: "0600"
    owner: "{{ ryno_gateway_service_user }}"
    group: "{{ ryno_gateway_service_user }}"
    content: |
      [ryno]
      version = 2

      [ryno.gateway]
      bind_address = "127.0.0.1:8080"
      log_level = "info"
      compute_driver = "podman"
      disable_tls = true

      [ryno.gateway.auth]
      allow_unauthenticated_users = true

      [ryno.gateway.gateway_jwt]
      signing_key_path = "{{ ryno_gateway_state_root }}/pki/jwt/signing.pem"
      public_key_path = "{{ ryno_gateway_state_root }}/pki/jwt/public.pem"
      kid_path = "{{ ryno_gateway_state_root }}/pki/jwt/kid"
      gateway_id = "ryno-test-guest"

      [ryno.drivers.podman]
      default_image = "nvcr.io/nvidia/base/ubuntu:24.04"
      supervisor_image = "{{ ryno_supervisor_image }}"
      image_pull_policy = "always"
      network_name = "ryno-test-guest"
      grpc_endpoint = "http://host.containers.internal:8080"
  become: true

- name: Check for the development supervisor image
  ansible.builtin.command:
    cmd: "podman image exists {{ ryno_supervisor_image }}"
  register: ryno_supervisor_image_exists
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ ryno_gateway_service_user }}"

- name: Import the development supervisor image
  ansible.builtin.command:
    cmd: >-
      podman import --change 'ENTRYPOINT ["/ryno-sandbox"]'
      {{ ryno_supervisor_archive }} {{ ryno_supervisor_image }}
  when: ryno_supervisor_image_exists.rc != 0
  become: true
  become_user: "{{ ryno_gateway_service_user }}"

- name: Install the development gateway user service
  ansible.builtin.copy:
    dest: "{{ ryno_gateway_config_home }}/systemd/user/{{ ryno_gateway_service }}"
    mode: "0600"
    owner: "{{ ryno_gateway_service_user }}"
    group: "{{ ryno_gateway_service_user }}"
    content: |
      [Unit]
      Description=Ryno development test guest gateway
      After=podman.socket

      [Service]
      Environment=XDG_CONFIG_HOME={{ ryno_gateway_state_root }}/xdg/config
      Environment=XDG_CACHE_HOME={{ ryno_gateway_state_root }}/xdg/cache
      Environment=XDG_DATA_HOME={{ ryno_gateway_state_root }}/xdg/data
      Environment=XDG_STATE_HOME={{ ryno_gateway_state_root }}/xdg/state
      ExecStart={{ ryno_gateway_bin }} --config {{ ryno_gateway_state_root }}/gateway.toml
      Restart=on-failure

      [Install]
      WantedBy=default.target
  become: true
