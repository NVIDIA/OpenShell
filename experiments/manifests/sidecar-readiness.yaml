apiVersion: v1
kind: Pod
metadata:
  name: sidecar-readiness-test-PLACEHOLDER
spec:
  initContainers:
  - name: readiness-sidecar
    image: ghcr.io/nvidia/openshell/sidecar-readiness:latest
    restartPolicy: Always
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 1
    volumeMounts:
    - name: signal
      mountPath: /tmp/signal
  containers:
  - name: sandbox
    image: ghcr.io/nvidia/openshell/sandbox:latest
    ports:
    - containerPort: 2222
    volumeMounts:
    - name: signal
      mountPath: /tmp/signal
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
  volumes:
  - name: signal
    emptyDir: {}
