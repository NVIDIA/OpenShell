name: Ryno Rust and SDKs

paths:
  - crates
  - examples
  - sdk/go
  - sdk/typescript/src
  - python/ryno

paths-ignore:
  # Integration-test targets are not removed by the Rust cfg override.
  - crates/*/tests
  - python/ryno/_proto
  - sdk/typescript/src/gen
