name: Setup E2E CLI
description: Download architecture-matched prebuilt OpenShell host CLIs for E2E tests

inputs:
  conformance:
    description: Also download the prebuilt openshell-conformance program and set OPENSHELL_CONFORMANCE_BIN
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download prebuilt CLI
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ runner.arch == 'X64' && 'openshell-x86_64-unknown-linux-musl' || 'openshell-aarch64-unknown-linux-musl' }}
        path: .e2e/prebuilt-cli

    - name: Configure prebuilt CLI
      shell: bash
      run: |
        cli="$GITHUB_WORKSPACE/.e2e/prebuilt-cli/openshell"
        chmod +x "$cli"
        "$cli" --version
        echo "OPENSHELL_BIN=$cli" >> "$GITHUB_ENV"

    - name: Download prebuilt openshell-conformance
      if: inputs.conformance == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ runner.arch == 'X64' && 'openshell-conformance-x86_64-unknown-linux-musl' || 'openshell-conformance-aarch64-unknown-linux-musl' }}
        path: .e2e/prebuilt-conformance

    - name: Configure prebuilt openshell-conformance
      if: inputs.conformance == 'true'
      shell: bash
      run: | # zizmor: ignore[github-env] persists only a fixed path under the trusted workspace
        program="$GITHUB_WORKSPACE/.e2e/prebuilt-conformance/openshell-conformance"
        chmod +x "$program"
        "$program" list
        echo "OPENSHELL_CONFORMANCE_BIN=$program" >> "$GITHUB_ENV"
