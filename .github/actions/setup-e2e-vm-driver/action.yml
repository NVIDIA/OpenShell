name: Setup E2E VM Driver
description: Download an architecture-matched prebuilt OpenShell VM driver for E2E tests

outputs:
  binary:
    description: Path to the prebuilt OpenShell VM driver
    value: ${{ steps.configure.outputs.binary }}

runs:
  using: composite
  steps:
    - name: Download prebuilt VM driver
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ runner.arch == 'X64' && 'openshell-driver-vm-x86_64-unknown-linux-gnu' || 'openshell-driver-vm-aarch64-unknown-linux-gnu' }}
        path: .e2e/prebuilt-vm-driver

    - id: configure
      name: Configure prebuilt VM driver
      shell: bash
      run: |
        driver="$GITHUB_WORKSPACE/.e2e/prebuilt-vm-driver/openshell-driver-vm"
        chmod +x "$driver"
        "$driver" --version
        echo "binary=$driver" >> "$GITHUB_OUTPUT"
