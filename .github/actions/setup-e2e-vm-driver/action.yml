name: Setup E2E VM Driver
description: Download an architecture-matched prebuilt Ryno VM driver for E2E tests

runs:
  using: composite
  steps:
    - name: Download prebuilt VM driver
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ runner.arch == 'X64' && 'ryno-driver-vm-x86_64-unknown-linux-gnu' || 'ryno-driver-vm-aarch64-unknown-linux-gnu' }}
        path: .e2e/prebuilt-vm-driver

    - name: Configure prebuilt VM driver
      shell: bash
      run: |
        driver="$GITHUB_WORKSPACE/.e2e/prebuilt-vm-driver/ryno-driver-vm"
        chmod +x "$driver"
        "$driver" --version
        echo "RYNO_VM_DRIVER_BIN=$driver" >> "$GITHUB_ENV"
