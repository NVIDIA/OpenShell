name: Setup Nix
description: Install Nix, configure Cachix, and optionally prepare the development shell

inputs:
  cachix-auth-token:
    description: Token used to write build outputs to Cachix
    required: false
    default: ""

  prepare-shell:
    description: Prepare the development shell, retrying once on failure
    required: false
    default: "false"
  shell-installable:
    description: Development shell to prepare
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}

    - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: openshell
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-auth-token == '' }}

    - name: Prepare Nix development shell
      if: inputs.prepare-shell == 'true'
      shell: bash
      env:
        NIX_SHELL_INSTALLABLE: ${{ inputs.shell-installable }}
      run: |
        # HTTP 416 is not retried by Nix; a fresh invocation restarts downloads.
        if nix develop "$NIX_SHELL_INSTALLABLE" -c true; then
          exit 0
        fi
        echo "::warning::Nix shell preparation failed; retrying once."
        nix develop "$NIX_SHELL_INSTALLABLE" -c true
