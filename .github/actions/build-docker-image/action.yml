name: Build Docker Image
description: Build an OpenShell image for publication or local artifact testing

inputs:
  component:
    description: Docker image and Dockerfile name
    required: true
  binary:
    description: Binary staged in the Docker build context
    required: true
  target-suffix:
    description: Binary artifact target suffix
    required: true
  image-tag:
    description: Docker image tag
    required: true
  github-token:
    description: Token used to push the image when push-image is true
    required: false
    default: ""
  push-image:
    description: Push the image to GHCR
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: $/.github/actions/setup-buildx
      with:
        buildkitd-config: /etc/buildkit/buildkitd.toml

    - name: Log in to GHCR
      if: inputs.push-image == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Download amd64 ${{ inputs.binary }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.binary }}-x86_64-${{ inputs.target-suffix }}
        path: artifact/amd64

    - name: Download arm64 ${{ inputs.binary }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.binary }}-aarch64-${{ inputs.target-suffix }}
        path: artifact/arm64

    - name: Stage ${{ inputs.binary }}
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        install -Dm0755 artifact/amd64/${BINARY} deploy/docker/.build/prebuilt-binaries/amd64/${BINARY}
        install -Dm0755 artifact/arm64/${BINARY} deploy/docker/.build/prebuilt-binaries/arm64/${BINARY}

    - name: Build ${{ inputs.component }} image
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        PUSH_IMAGE: ${{ inputs.push-image }}
      run: |
        set -euo pipefail
        install -d artifacts/images
        common_args=(
          --builder openshell
          --file "deploy/docker/Dockerfile.${COMPONENT}"
          --target "$COMPONENT"
          --tag "ghcr.io/nvidia/openshell/${COMPONENT}:${IMAGE_TAG}"
          --cache-from "type=gha,scope=${COMPONENT}"
        )
        if [ "$PUSH_IMAGE" = "true" ]; then
          docker buildx build \
            "${common_args[@]}" \
            --platform linux/amd64,linux/arm64 \
            --cache-to "type=gha,mode=max,scope=${COMPONENT}" \
            --provenance=mode=min \
            --attest type=sbom \
            --output type=image,push=true,oci-mediatypes=true,oci-artifact=true \
            --output "type=oci,dest=artifacts/images/${COMPONENT}.tar" \
            .
          exit 0
        fi

        for arch in amd64 arm64; do
          docker buildx build \
            "${common_args[@]}" \
            --platform "linux/${arch}" \
            --provenance=false \
            --output "type=docker,dest=artifacts/images/${COMPONENT}-linux-${arch}.tar" \
            .
        done

    - name: Verify SBOM attestation
      if: inputs.push-image == 'true'
      shell: bash
      env:
        IMAGE_REF: ghcr.io/nvidia/openshell/${{ inputs.component }}:${{ inputs.image-tag }}
      run: tasks/scripts/verify-image-sbom.sh "${IMAGE_REF}" --require-cargo

    - name: Upload ${{ inputs.component }} image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: image-${{ inputs.component }}
        path: artifacts
        compression-level: 0
        retention-days: 5
        if-no-files-found: error
