name: Build Docker Image
description: Build and export a multi-platform OpenShell image, optionally pushing it

inputs:
  component:
    description: Docker image and Dockerfile name
    required: true
  binary:
    description: Binary staged in the Docker build context
    required: true
  target-suffix:
    description: Binary artifact target suffix
    required: true
  image-tag:
    description: Docker image tag
    required: true
  push:
    description: Push the image to GHCR during the build
    default: "true"
  github-token:
    description: Token used to push the image
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-buildx

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Download amd64 ${{ inputs.binary }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.binary }}-x86_64-${{ inputs.target-suffix }}
        path: artifact/amd64

    - name: Download arm64 ${{ inputs.binary }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.binary }}-aarch64-${{ inputs.target-suffix }}
        path: artifact/arm64

    - name: Stage ${{ inputs.binary }}
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        install -Dm0755 artifact/amd64/${BINARY} deploy/docker/.build/prebuilt-binaries/amd64/${BINARY}
        install -Dm0755 artifact/arm64/${BINARY} deploy/docker/.build/prebuilt-binaries/arm64/${BINARY}

    - name: Build ${{ inputs.component }} image
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        PUSH_IMAGE: ${{ inputs.push }}
      run: |
        install -d artifacts/images
        push_args=()
        if [[ "${PUSH_IMAGE}" == "true" ]]; then
          push_args+=(--output "type=image,push=true,oci-mediatypes=true,oci-artifact=true")
        fi
        docker buildx build \
          --builder openshell \
          --platform linux/amd64,linux/arm64 \
          --file deploy/docker/Dockerfile.${COMPONENT} \
          --target ${COMPONENT} \
          --tag ghcr.io/ai-openshell/openshell/${COMPONENT}:${IMAGE_TAG} \
          --cache-from type=gha,scope=${COMPONENT} \
          --cache-to type=gha,mode=max,scope=${COMPONENT} \
          --provenance=mode=min \
          --attest type=sbom \
          "${push_args[@]}" \
          --output "type=oci,dest=artifacts/images/${COMPONENT}.tar,oci-mediatypes=true,oci-artifact=true" \
          .

    # E2E jobs load these instead of pulling from a registry, so fork pull
    # requests, which cannot push, still run E2E. skopeo ships on the
    # GitHub-hosted Ubuntu images.
    - name: Export per-platform Docker archives
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        install -d e2e-images
        for arch in amd64 arm64; do
          skopeo --insecure-policy copy --override-os linux --override-arch "${arch}" \
            "oci-archive:artifacts/images/${COMPONENT}.tar" \
            "docker-archive:e2e-images/${COMPONENT}-linux-${arch}.tar:ghcr.io/ai-openshell/openshell/${COMPONENT}:${IMAGE_TAG}"
        done

    - name: Verify SBOM attestation
      if: inputs.push == 'true'
      shell: bash
      env:
        # GitHub-hosted runners also ship podman, which the engine helper
        # prefers; the SBOM check needs Docker's buildx imagetools.
        CONTAINER_ENGINE: docker
        IMAGE_REF: ghcr.io/ai-openshell/openshell/${{ inputs.component }}:${{ inputs.image-tag }}
      run: tasks/scripts/verify-image-sbom.sh "${IMAGE_REF}" --require-cargo

    - name: Upload ${{ inputs.component }} image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: image-${{ inputs.component }}
        path: artifacts
        compression-level: 0
        retention-days: 5
        if-no-files-found: error

    - name: Upload ${{ inputs.component }} amd64 E2E archive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-image-${{ inputs.component }}-linux-amd64
        path: e2e-images/${{ inputs.component }}-linux-amd64.tar
        compression-level: 0
        retention-days: 5
        if-no-files-found: error

    - name: Upload ${{ inputs.component }} arm64 E2E archive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-image-${{ inputs.component }}-linux-arm64
        path: e2e-images/${{ inputs.component }}-linux-arm64.tar
        compression-level: 0
        retention-days: 5
        if-no-files-found: error
