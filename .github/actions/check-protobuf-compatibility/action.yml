name: Check Protobuf Compatibility
description: Check protobuf compatibility against the target or latest stable release using the release train policy. Requires a checkout with full history and tags.

inputs:
  ref:
    description: PR or merge-group target branch/commit, or release tag to qualify.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix

    - name: Check protobuf compatibility
      shell: bash
      env:
        CHECK_REF: ${{ inputs.ref }}
      run: |
        # Retry dependency preparation, then run the compatibility check once.
        nix build --no-link --no-write-lock-file .#check-protobuf-compatibility ||
          nix build --no-link --no-write-lock-file .#check-protobuf-compatibility
        nix run .#check-protobuf-compatibility --no-write-lock-file -- "$CHECK_REF"
