name: Build VM Driver
description: Assemble the compressed VM runtime and build openshell-driver-vm

inputs:
  arch:
    description: Guest architecture used to select the Linux sandbox and VM init artifacts
    required: true
  triple:
    description: Rust target triple of the driver
    required: true
  supervisor-artifact:
    description: Artifact containing the openshell-supervisor binary embedded in the runtime
    required: true
  cargo-version:
    description: Cargo package version embedded in the binary
    required: true
  supervisor-image-tag:
    description: Default supervisor image tag embedded in the binary
    required: false
    default: ""
  entitlements-file:
    description: Path to an entitlements plist for macOS ad-hoc codesigning
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download openshell-sandbox
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: openshell-sandbox-${{ inputs.arch }}-unknown-linux-musl
        path: sandbox

    - name: Download openshell-supervisor
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.supervisor-artifact }}
        path: supervisor

    - name: Download VM guest init
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: openshell-vm-init-${{ inputs.arch }}-unknown-linux-musl
        path: vm-init

    - name: Build VM runtime
      shell: nix develop -c bash -euo pipefail {0}
      run: |
        # HTTP 416 is not retried by Nix; restart the build once on failure.
        nix build .#vm-runtime || nix build .#vm-runtime

    - name: Assemble compressed VM runtime
      shell: nix develop -c bash -euo pipefail {0}
      run: |
        compressed_dir="${RUNNER_TEMP}/vm-runtime-compressed"
        install -d "$compressed_dir"
        cp result/compressed/*.zst "$compressed_dir/"
        zstd -19 -T1 sandbox/openshell-sandbox -o "$compressed_dir/openshell-sandbox.zst"
        zstd -19 -T1 supervisor/openshell-supervisor -o "$compressed_dir/openshell-supervisor.zst"
        zstd -19 -T1 vm-init/openshell-vm-init -o "$compressed_dir/openshell-vm-init.zst"

    - name: Build openshell-driver-vm
      uses: ./.github/actions/build-rust-binary
      env:
        OPENSHELL_VM_RUNTIME_COMPRESSED_DIR: ${{ runner.temp }}/vm-runtime-compressed
      with:
        package: openshell-driver-vm
        binary: openshell-driver-vm
        triple: ${{ inputs.triple }}
        cargo-version: ${{ inputs.cargo-version }}
        supervisor-image-tag: ${{ inputs.supervisor-image-tag }}
        entitlements-file: ${{ inputs.entitlements-file }}
