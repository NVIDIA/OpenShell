name: Feature Request
description: Tell us about a workflow or outcome OpenShell does not yet support.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        ## Tell us what you need

        Describe the request as a user story: what persona is affected, what workflow that persona needs, and why it matters. Describe the desired workflow at the user level, but do not diagnose the gap or design OpenShell's internal implementation. You do not need to include output from an agent. Maintainers and implementers will investigate at the appropriate stage.

        Search existing issues before filing. New features start as issues, not RFC pull requests. If maintainers decide an RFC is necessary, they will request one and assign its number from the issue.

  - type: input
    id: persona
    attributes:
      label: What persona does this impact?
      description: Describe the affected role in the workflow, such as an operator, sandbox creator, or agent.
      placeholder: A gateway operator running OpenShell on Kubernetes
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What does this persona need to be able to do?
      description: Describe the user-facing workflow, capability, or outcome this persona needs, without prescribing OpenShell's internal implementation.
      placeholder: I want running sandboxes to resume after Kubernetes reschedules them during an upgrade.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Why does this matter to the persona?
      description: Describe what happens today and how it affects the persona's work.
      placeholder: Currently, when a node is rolled, its sandboxes are reset and in-progress agent work is lost.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: What workflow exposes the need?
      description: Show the shortest sequence of actions or commands that demonstrates the missing workflow.
      placeholder: |
        1. Start a long-running task in a sandbox.
        2. Drain the Kubernetes node running the sandbox.
        3. Observe the replacement sandbox after it is scheduled.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OpenShell version and the platform, deployment mode, runtime, or integration relevant to this workflow.
      placeholder: |
        - OpenShell: v0.x.x
        - Platform: Kubernetes v1.x
        - Deployment: Helm with the Kubernetes compute driver
    validations:
      required: true
