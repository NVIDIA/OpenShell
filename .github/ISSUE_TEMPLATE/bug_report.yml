name: Bug Report
description: Report unexpected behavior with a clear user story and expected outcome.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Reports

        Describe who encountered the bug, the problem it creates, why it matters, and the observable criteria for a fix. Please check the latest OpenShell release and search existing issues for possible duplicates before filing.

        Do not report security vulnerabilities here; follow [SECURITY.md](https://github.com/NVIDIA/OpenShell/blob/main/SECURITY.md) instead.

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Attest that you personally use OpenShell. Describe the specific use case and behavior you directly encountered or need.
      placeholder: |
        I use OpenShell for <specific use case>.
        I directly encountered or need <specific behavior>.
        This affects <outcome>.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Summarize what is broken or missing in the current behavior. Focus on the issue itself; describe its consequences and current workarounds in Impact / Why This Matters.
      placeholder: Describe the gap or failure in OpenShell's current behavior and when it occurs.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact / Why This Matters
      description: |
        Explain how the bug affects users and what they must do to work around it today. Describe the operational cost, security risk, data loss, blocked workflow, or other concrete consequence. Include evidence where available, but do not diagnose the cause or prescribe the fix.
      placeholder: |
        When this happens, users must...
        This results in...
        This matters because...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the specific, observable outcomes that would demonstrate the bug is fixed.
      placeholder: |
        - [ ] <observable outcome>
        - [ ] <observable outcome>
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide minimal steps using only an OpenShell deployment. Do not install third-party tools solely to reproduce the issue.
      placeholder: |
        1. Run `openshell sandbox create ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: suggested-ux
    attributes:
      label: Suggested UX (if applicable)
      description: If the fix changes configuration, CLI, SDK, or another user interaction, show a notional OpenShell example for human review.
      placeholder: Show the command, configuration, or API interaction you expect.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OpenShell version and relevant OpenShell deployment details.
      placeholder: |
        - OpenShell: v0.x.x (output of `openshell --version`)
        - OS: macOS 15.2 / Ubuntu 24.04 / Windows 11 + WSL2
        - OpenShell deployment mode and runtime: <relevant details>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Include the smallest relevant log excerpt, error message, or stack trace.
        Redact credentials, API keys, tokens, and query parameters before pasting.
      render: shell
    validations:
      required: false
