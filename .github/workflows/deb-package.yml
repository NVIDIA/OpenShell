name: Debian Package

on:
  workflow_call:
    inputs:
      deb-version:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string
      include-vm-driver:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-deb-linux:
    name: Build Debian Package (Linux ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
            cli_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            deb_arch: arm64
            cli_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    # package-deb.sh only stages files, so both architectures build on amd64.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['checkout-ref'] }}

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-${{ matrix.cli_target }}
          path: package-binaries/

      - name: Download gateway artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-gateway-${{ matrix.gnu_target }}
          path: package-binaries/

      - name: Download prover artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-prover-${{ matrix.cli_target }}
          path: package-binaries/

      - name: Download VM driver artifact
        if: inputs['include-vm-driver']
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-driver-vm-${{ matrix.gnu_target }}
          path: package-binaries/

      - name: Configure package inputs
        run: |
          set -euo pipefail
          chmod +x package-binaries/openshell*
          ls -lah package-binaries

      - name: Build Debian package
        run: |
          set -euo pipefail
          if [ "${INPUTS_INCLUDE_VM_DRIVER}" = true ]; then
            export OPENSHELL_DRIVER_VM_BINARY="${PWD}/package-binaries/openshell-driver-vm"
          else
            export OPENSHELL_DEB_OMIT_VM_DRIVER=1
          fi
          OPENSHELL_CLI_BINARY="${PWD}/package-binaries/openshell" \
          OPENSHELL_GATEWAY_BINARY="${PWD}/package-binaries/openshell-gateway" \
          OPENSHELL_PROVER_BINARY="${PWD}/package-binaries/openshell-prover" \
          OPENSHELL_DEB_VERSION="${INPUTS_DEB_VERSION}" \
          OPENSHELL_DEB_ARCH="${{ matrix.deb_arch }}" \
          OPENSHELL_OUTPUT_DIR=artifacts \
            tasks/scripts/package-deb.sh
        env:
          INPUTS_DEB_VERSION: ${{ inputs['deb-version'] }}
          INPUTS_INCLUDE_VM_DRIVER: ${{ inputs['include-vm-driver'] }}

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-linux-${{ matrix.arch }}
          path: artifacts/*.deb
          retention-days: 5
