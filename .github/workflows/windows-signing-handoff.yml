name: Windows signed package attestations

on:
  push:
    branches: [shailendra-nv/windows-security-handoff]
    paths: ['.github/workflows/windows-signing-handoff.yml', 'signing-handoff/signed-release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  attest:
    if: github.repository == 'NVIDIA/OpenShell'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: signing-handoff/signed-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenShell-Windows-0.1.8-signing-candidates
          run-id: 43743849384
          github-token: ${{ github.token }}
          path: candidates
      - name: Verify original GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in arm64 x64; do
            gh attestation verify "candidates/OpenShell-Windows-0.1.8-$arch-unsigned-candidate.zip" \
              --repo NVIDIA/OpenShell \
              --signer-workflow NVIDIA/OpenShell/.github/workflows/windows-packages.yml \
              --signer-digest f258c85b202a78e0b233f39cc8f991069ef509ab \
              --deny-self-hosted-runners \
              --bundle candidates/github-attestation.sigstore.json
          done
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
      - name: Install validation tools
        run: mise install uv@0.10.12 python@3.14.5
      - name: Verify external signing and validation records
        run: mise exec uv@0.10.12 python@3.14.5 -- uv run --no-project python signing-handoff/signed-release/verify-record.py
      - name: Attest final signed archive checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: signing-handoff/signed-release/OpenShell-Windows-0.1.8-SHA256SUMS
          predicate-type: https://nvidia.com/openshell/attestations/windows-signed-package/v1
          predicate-path: signing-handoff/signed-release/signed-package-predicate.json
          push-to-registry: false
          create-storage-record: false
      - name: Assemble verification artifact
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir verification
          cp signing-handoff/signed-release/OpenShell-Windows-0.1.8-SHA256SUMS verification/
          cp signing-handoff/signed-release/OpenShell-Windows-0.1.8-validation.json verification/
          mise exec uv@0.10.12 python@3.14.5 -- uv run --no-project python - <<'PY'
          import json, os
          from pathlib import Path
          bundles = [Path('candidates/github-attestation.sigstore.json'), Path(os.environ['BUNDLE_PATH'])]
          result = '\n'.join(json.dumps(json.loads(p.read_text()), separators=(',', ':')) for p in bundles)
          Path('verification/OpenShell-Windows-0.1.8-attestations.jsonl').write_text(result + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenShell-Windows-0.1.8-signed-package-verification
          path: verification/
          if-no-files-found: error
          retention-days: 30
