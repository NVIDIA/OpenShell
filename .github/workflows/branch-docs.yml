name: Branch Docs Preview

on:
  pull_request:
    paths:
      - "docs/**"
      - "fern/**"
      - "mise.toml"
      - "tasks/docs.toml"
      - "tasks/scripts/sync_docs_website.py"
      - "tasks/scripts/sync_docs_website_test.py"
      - ".github/workflows/branch-docs.yml"
      - ".github/workflows/release-tag.yml"
      - ".github/workflows/release-dev.yml"
      - ".github/workflows/sync-docs.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout docs website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs-website
          fetch-depth: 0
          path: docs-website

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.13"

      - name: Stage version manifest for preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run tasks/scripts/sync_docs_website.py \
            --operation sync \
            --source-root . \
            --docs-website-root docs-website \
            --channel dev \
            --source-ref "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-version 0.0.0.dev0 \
            --display-name "Dev (PR #${PR_NUMBER})" \
            --availability beta \
            --allow-rollback

      - name: Check Fern preview availability
        id: fern-preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -n "$FERN_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Fern docs preview because FERN_TOKEN is unavailable. This is expected for fork PRs and repos without Fern preview credentials configured."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Fern CLI
        working-directory: ./docs-website
        run: |
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          npm install -g "fern-api@${FERN_VERSION}"

      - name: Validate docs
        working-directory: ./docs-website/fern
        run: fern check

      - name: Generate preview URL
        if: ${{ steps.fern-preview.outputs.enabled == 'true' }}
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        working-directory: ./docs-website/fern
        run: |
          OUTPUT=$(fern generate --docs --preview --id "$PREVIEW_ID" 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          if [ -z "$URL" ]; then
            echo "::error::Failed to generate preview URL. See fern output above."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: ${{ steps.fern-preview.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
        run: |
          BODY=":herb: **Preview your docs:** <${PREVIEW_URL}>"
          MARKER="<!-- preview-docs -->"
          BODY="${BODY}

          ${MARKER}"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
