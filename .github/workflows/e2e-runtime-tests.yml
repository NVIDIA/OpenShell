name: E2E Runtime Tests

on:
  workflow_call:
    outputs:
      docker-result:
        description: Docker runtime result for existing release summaries
        value: ${{ jobs.result.outputs.docker-result }}
      vm-result:
        description: VM runtime result for existing release summaries
        value: ${{ jobs.result.outputs.vm-result }}
    inputs:
      test-family:
        description: conformance or drivers
        required: true
        type: string
      profile:
        description: core, release, gpu, kubernetes-ha, or kubernetes-credentials
        required: true
        type: string
      source-sha:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - id: select
        env:
          TEST_FAMILY: ${{ inputs.test-family }}
          PROFILE: ${{ inputs.profile }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          jobs=$(bash tasks/scripts/select-e2e-runtime-jobs.sh "$TEST_FAMILY" "$PROFILE")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          {
            echo "### E2E selection: $TEST_FAMILY / $PROFILE"
            echo "Source: $SOURCE_SHA"
            jq -r '.[] | "- " + .' <<< "$jobs"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'docker-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-docker-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      runner: linux-arm64-cpu8

      suite-matrix: >-
        ${{ inputs.test-family == 'conformance' && '[{"suite":"conformance","cmd":"mise run --no-deps --skip-deps e2e:rust","apt_packages":"openssh-client","python_proto":false,"mcp":false}]' || '[{"suite":"python","cmd":"mise run --no-deps --skip-deps e2e:python","apt_packages":"","python_proto":true,"mcp":false},{"suite":"oidc-python","cmd":"mise run --no-deps --skip-deps e2e:oidc-python:docker","apt_packages":"","python_proto":true,"mcp":false},{"suite":"oidc-pkce-docker","cmd":"mise run --no-deps --skip-deps e2e:oidc-pkce:docker","apt_packages":"openssh-client","python_proto":false,"mcp":false},{"suite":"rust-docker","cmd":"mise run --no-deps --skip-deps e2e:rust","apt_packages":"openssh-client","python_proto":false,"mcp":false},{"suite":"oci-image","cmd":"mise run --no-deps --skip-deps e2e:oci-image","apt_packages":"openssh-client","python_proto":false,"mcp":false},{"suite":"mcp","cmd":"mise run --no-deps --skip-deps e2e:mcp","apt_packages":"","python_proto":false,"mcp":true}]' }}


  podman-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'podman-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-podman-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      suite-matrix: >-
        [{"suite":"ci","runner":"ubuntu-26.04","podman_major":"5","podman_package_version":"5.7.0+ds2-3build1","conmon_package_version":"2.1.13+ds1-2","cmd":"mise run --no-deps --skip-deps e2e:podman:ci"}]


  vm-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'vm-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}

  docker-external-driver-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'docker-external-driver-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-docker-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      runner: linux-arm64-cpu8
      gateway-artifact: openshell-gateway-plain-aarch64-unknown-linux-gnu
      external-driver-binary: openshell-driver-docker
      suite-matrix: >-
        [{"suite":"external-driver","cmd":"mise run --no-deps --skip-deps e2e:docker:external-driver","apt_packages":"openssh-client","python_proto":false,"mcp":false}]


  podman-external-driver-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'podman-external-driver-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-podman-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      external-driver-binary: openshell-driver-podman
      suite-matrix: >-
        [{"suite":"external-driver","runner":"ubuntu-26.04","podman_major":"5","podman_package_version":"5.7.0+ds2-3build1","conmon_package_version":"2.1.13+ds1-2","cmd":"mise run --no-deps --skip-deps e2e:podman:external-driver"}]


  vm-external-driver-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'vm-external-driver-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      suite-name: external-driver
      e2e-task: e2e:vm:external-driver


  gpu-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'gpu-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-gpu-test.yaml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}


  kubernetes-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-e2e')
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent_sandbox_api: v1beta1
            agent_sandbox_version: v1.0.3
          - agent_sandbox_api: v1alpha1
            agent_sandbox_version: v0.4.6
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes E2E (Rust smoke, Agent Sandbox ${{ matrix.agent_sandbox_api }})
      agent-sandbox-version: ${{ matrix.agent_sandbox_version }}


  kubernetes-workspace-managed-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-workspace-managed-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes E2E (workspace managed mode)
      e2e-task: e2e:kubernetes:workspace-managed


  kubernetes-external-driver-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-external-driver-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes E2E (external compute driver)
      e2e-task: e2e:kubernetes:external-driver
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      external-driver-binary: openshell-driver-kubernetes
      cluster-images: sandbox supervisor


  kubernetes-workspace-operator-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-workspace-operator-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes E2E (workspace operator mode)
      e2e-task: e2e:kubernetes:workspace-operator


  kubernetes-ha-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-ha-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes HA E2E (Rust smoke)
      extra-helm-values: deploy/helm/openshell/ci/values-high-availability.yaml
      external-postgres-secret: openshell-ha-pg
      test-name: kubernetes_ha_rebalancing
      kubernetes-features: e2e,e2e-host-gateway,e2e-kubernetes,e2e-kubernetes-ha
      use-envoy-gateway: true


  kubernetes-credential-drivers-e2e:
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.jobs), 'kubernetes-credential-drivers-e2e')
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: ${{ inputs.test-family }}
      image-tag: ${{ inputs.image-tag }}
      job-name: Kubernetes Credential Drivers E2E
      e2e-task: e2e:kubernetes:credential-drivers


  result:
    name: Runtime family result
    if: always()
    outputs:
      docker-result: ${{ needs.docker-e2e.result }}
      vm-result: ${{ needs.vm-e2e.result }}
    needs:
      - selection
      - docker-e2e
      - podman-e2e
      - vm-e2e
      - docker-external-driver-e2e
      - podman-external-driver-e2e
      - vm-external-driver-e2e
      - gpu-e2e
      - kubernetes-e2e
      - kubernetes-workspace-managed-e2e
      - kubernetes-external-driver-e2e
      - kubernetes-workspace-operator-e2e
      - kubernetes-ha-e2e
      - kubernetes-credential-drivers-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected runtime job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.selection.outputs.jobs }}
        run: |
          set -euo pipefail
          jq -e --argjson selected "$SELECTED_JOBS" '
            . as $results
            | .selection.result == "success"
              and ($selected | length > 0)
              and all($selected[]; $results[.].result == "success")
          ' <<< "$JOB_RESULTS"
