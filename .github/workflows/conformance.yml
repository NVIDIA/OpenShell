name: Conformance

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./.github/actions/pr-gate

  version:
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute versions
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          deb_version="$(python3 tasks/scripts/release.py get-version --deb)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "deb_version=$deb_version"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-cli
      binary: openshell
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-conformance:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-conformance-cli
      binary: openshell-conformance
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-gateway:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-gateway
      binary: openshell-gateway
      triple: x86_64-unknown-linux-gnu
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.glibc-2-28
      cargo-version: ${{ needs.version.outputs.cargo }}
      image-tag: dev
      interpreter: /lib64/ld-linux-x86-64.so.2
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-sandbox:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-sandbox
      binary: openshell-sandbox
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      image-tag: dev
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-vm-driver:
    needs: [version, build-sandbox]
    permissions:
      contents: read
    uses: ./.github/workflows/build-vm-driver-binary.yml
    with:
      arch: x86_64
      triple: x86_64-unknown-linux-gnu
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.glibc-2-28
      interpreter: /lib64/ld-linux-x86-64.so.2
      cargo-version: ${{ needs.version.outputs.cargo }}
      image-tag: dev
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-rpm:
    needs: [version, build-cli, build-gateway]
    permissions:
      contents: read
    uses: ./.github/workflows/build-rpm.yml
    with:
      checkout-ref: ${{ github.sha }}
      arch: x86_64
      runner: linux-amd64-cpu8
      cli-target: x86_64-unknown-linux-musl
      gateway-target: x86_64-unknown-linux-gnu
      cargo-version: ${{ needs.version.outputs.cargo }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}

  build-deb:
    needs: [version, build-cli, build-gateway, build-vm-driver]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deb.yml
    with:
      deb-version: ${{ needs.version.outputs.deb_version }}
      checkout-ref: ${{ github.sha }}
      arch: amd64
      runner: linux-amd64-cpu8
      cli-target: x86_64-unknown-linux-musl
      gnu-target: x86_64-unknown-linux-gnu

  fedora:
    name: Fedora with Rootless Podman
    needs: [build-conformance, build-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-linux-x86_64
          path: rpm-input

      - name: Download conformance CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-conformance-x86_64-unknown-linux-musl
          path: conformance-input

      - name: Run Fedora package conformance
        shell: bash
        env:
          OPENSHELL_TEST_GUEST_DRIVER: podman
        run: |
          set -euo pipefail
          chmod +x conformance-input/openshell-conformance
          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro fedora \
            --with podman-rootless \
            --with selinux \
            --install rpm-input/openshell-[0-9]*.rpm \
            --install rpm-input/openshell-gateway-[0-9]*.rpm \
            --copy conformance-input/openshell-conformance:/tmp/openshell-conformance \
            --provision openshell-package \
            -- /tmp/openshell-conformance run smoke

  ubuntu:
    name: Ubuntu 24.04 with Docker
    needs: [build-conformance, build-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download DEB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb-linux-amd64
          path: deb-input

      - name: Download conformance CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-conformance-x86_64-unknown-linux-musl
          path: conformance-input

      - name: Run Ubuntu package conformance
        shell: bash
        env:
          OPENSHELL_TEST_GUEST_DRIVER: docker
        run: |
          set -euo pipefail
          chmod +x conformance-input/openshell-conformance
          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro ubuntu-24-04 \
            --with docker \
            --install deb-input/*.deb \
            --copy conformance-input/openshell-conformance:/tmp/openshell-conformance \
            --provision openshell-package \
            -- /tmp/openshell-conformance run smoke
