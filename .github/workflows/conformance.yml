name: Conformance

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./.github/actions/pr-gate

  version:
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute versions
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-cli
      binary: openshell
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-conformance:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-conformance-cli
      binary: openshell-conformance
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-gateway:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-gateway
      binary: openshell-gateway
      triple: x86_64-unknown-linux-gnu
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.glibc-2-28
      cargo-version: ${{ needs.version.outputs.cargo }}
      image-tag: dev
      interpreter: /lib64/ld-linux-x86-64.so.2
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-sandbox:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-sandbox
      binary: openshell-sandbox
      triple: x86_64-unknown-linux-musl
      runner: linux-amd64-cpu8
      dev-shell: .#devShells.x86_64-linux.musl
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-snap:
    needs: [build-cli, build-gateway, build-sandbox]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-snap.yml
    with:
      checkout-ref: ${{ github.sha }}
      arch: amd64
      runner: linux-amd64-cpu8
      cli-artifact-name: openshell-x86_64-unknown-linux-musl
      gateway-artifact-name: openshell-gateway-x86_64-unknown-linux-gnu
      supervisor-artifact-name: openshell-sandbox-x86_64-unknown-linux-musl

  build-rpm:
    needs: [version, build-cli, build-gateway]
    permissions:
      contents: read
    uses: ./.github/workflows/build-rpm.yml
    with:
      checkout-ref: ${{ github.sha }}
      arch: x86_64
      runner: linux-amd64-cpu8
      cli-target: x86_64-unknown-linux-musl
      gateway-target: x86_64-unknown-linux-gnu
      cargo-version: ${{ needs.version.outputs.cargo }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}

  fedora:
    name: Fedora with Rootless Podman
    needs: [build-conformance, build-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-linux-x86_64
          path: rpm-input

      - name: Download conformance CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-conformance-x86_64-unknown-linux-musl
          path: conformance-input

      - name: Run RPM gateway continuity conformance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x conformance-input/openshell-conformance
          shopt -s nullglob
          candidate_cli_package=(rpm-input/openshell-[0-9]*.rpm)
          candidate_gateway_package=(rpm-input/openshell-gateway-[0-9]*.rpm)
          if [[ ${#candidate_cli_package[@]} -ne 1 || ${#candidate_gateway_package[@]} -ne 1 ]]; then
            echo "expected one candidate CLI and gateway RPM" >&2
            printf 'RPM artifacts:\n' >&2
            printf '  %s\n' rpm-input/* >&2
            exit 1
          fi

          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro fedora \
            --with podman-rootless \
            --with selinux \
            --copy "${candidate_cli_package[0]}:/var/lib/openshell-conformance/candidate/openshell.rpm" \
            --copy "${candidate_gateway_package[0]}:/var/lib/openshell-conformance/candidate/openshell-gateway.rpm" \
            --copy conformance-input/openshell-conformance:/tmp/openshell-conformance \
            --copy nix/test-guest/conformance-plans/gateway-upgrade-restart.toml:/tmp/conformance-plan.toml \
            --provision openshell-rpm-latest-release \
            --provision gateway-rootless-podman \
            --provision openshell-rpm-gateway-upgrade \
            -- /tmp/openshell-conformance run --plan /tmp/conformance-plan.toml

  ubuntu-snap:
    name: Ubuntu Snap with Docker Snap
    needs: build-snap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download Snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap-linux-amd64
          path: snap-input

      - name: Install Snap and verify gateway status
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          snaps=(snap-input/*.snap)
          if [[ ${#snaps[@]} -ne 1 ]]; then
            echo "expected one Snap artifact" >&2
            printf 'Snap artifacts:\n' >&2
            printf '  %s\n' snap-input/* >&2
            exit 1
          fi

          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro ubuntu-24-04 \
            --with snapd \
            --with docker-snap \
            --copy "${snaps[0]}:/var/lib/openshell-conformance/candidate/openshell.snap" \
            --provision openshell-snap \
            -- true
