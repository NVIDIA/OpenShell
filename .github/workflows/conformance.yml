name: Conformance

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Architecture for package artifacts"
        required: false
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./.github/actions/pr-gate

  target:
    name: Resolve target architecture
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.target.outputs.arch }}
      build_runner: ${{ steps.target.outputs.build_runner }}
      test_runner: ${{ steps.target.outputs.test_runner }}
      rpm_arch: ${{ steps.target.outputs.rpm_arch }}
      musl_triple: ${{ steps.target.outputs.musl_triple }}
      gnu_triple: ${{ steps.target.outputs.gnu_triple }}
      musl_dev_shell: ${{ steps.target.outputs.musl_dev_shell }}
      gnu_dev_shell: ${{ steps.target.outputs.gnu_dev_shell }}
      gateway_interpreter: ${{ steps.target.outputs.gateway_interpreter }}
    steps:
      - id: target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target_arch }}" in
            amd64)
              cat >> "$GITHUB_OUTPUT" <<'EOF'
          arch=amd64
          build_runner=linux-amd64-cpu8
          test_runner=ubuntu-24.04
          rpm_arch=x86_64
          musl_triple=x86_64-unknown-linux-musl
          gnu_triple=x86_64-unknown-linux-gnu
          musl_dev_shell=.#devShells.x86_64-linux.musl
          gnu_dev_shell=.#devShells.x86_64-linux.glibc-2-28
          gateway_interpreter=/lib64/ld-linux-x86-64.so.2
          EOF
              ;;
            arm64)
              cat >> "$GITHUB_OUTPUT" <<'EOF'
          arch=arm64
          build_runner=linux-arm64-cpu8
          test_runner=ubuntu-24.04-arm
          rpm_arch=aarch64
          musl_triple=aarch64-unknown-linux-musl
          gnu_triple=aarch64-unknown-linux-gnu
          musl_dev_shell=.#devShells.aarch64-linux.musl
          gnu_dev_shell=.#devShells.aarch64-linux.glibc-2-28
          gateway_interpreter=/lib/ld-linux-aarch64.so.1
          EOF
              ;;
          esac

  version:
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute versions
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: [version, target]
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-cli
      binary: openshell
      triple: ${{ needs.target.outputs.musl_triple }}
      runner: ${{ needs.target.outputs.build_runner }}
      dev-shell: ${{ needs.target.outputs.musl_dev_shell }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-conformance:
    needs: [version, target]
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-conformance-cli
      binary: openshell-conformance
      triple: ${{ needs.target.outputs.musl_triple }}
      runner: ${{ needs.target.outputs.build_runner }}
      dev-shell: ${{ needs.target.outputs.musl_dev_shell }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-gateway:
    needs: [version, target]
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-gateway
      binary: openshell-gateway
      triple: ${{ needs.target.outputs.gnu_triple }}
      runner: ${{ needs.target.outputs.build_runner }}
      dev-shell: ${{ needs.target.outputs.gnu_dev_shell }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      image-tag: dev
      interpreter: ${{ needs.target.outputs.gateway_interpreter }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-sandbox:
    needs: [version, target]
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: openshell-sandbox
      binary: openshell-sandbox
      triple: ${{ needs.target.outputs.musl_triple }}
      runner: ${{ needs.target.outputs.build_runner }}
      dev-shell: ${{ needs.target.outputs.musl_dev_shell }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-snap:
    needs: [build-cli, build-gateway, build-sandbox, target]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-snap.yml
    with:
      checkout-ref: ${{ github.sha }}
      arch: ${{ needs.target.outputs.arch }}
      runner: ${{ needs.target.outputs.build_runner }}
      cli-artifact-name: openshell-${{ needs.target.outputs.musl_triple }}
      gateway-artifact-name: openshell-gateway-${{ needs.target.outputs.gnu_triple }}
      supervisor-artifact-name: openshell-sandbox-${{ needs.target.outputs.musl_triple }}

  build-rpm:
    needs: [version, build-cli, build-gateway, target]
    permissions:
      contents: read
    uses: ./.github/workflows/build-rpm.yml
    with:
      checkout-ref: ${{ github.sha }}
      arch: ${{ needs.target.outputs.rpm_arch }}
      runner: ${{ needs.target.outputs.build_runner }}
      cli-target: ${{ needs.target.outputs.musl_triple }}
      gateway-target: ${{ needs.target.outputs.gnu_triple }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}

  fedora:
    name: Fedora with Rootless Podman
    needs: [build-conformance, build-rpm, target]
    runs-on: ${{ needs.target.outputs.test_runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-linux-${{ needs.target.outputs.rpm_arch }}
          path: rpm-input

      - name: Download conformance CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-conformance-${{ needs.target.outputs.musl_triple }}
          path: conformance-input

      - name: Run RPM gateway continuity conformance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x conformance-input/openshell-conformance
          shopt -s nullglob
          candidate_cli_package=(rpm-input/openshell-[0-9]*.rpm)
          candidate_gateway_package=(rpm-input/openshell-gateway-[0-9]*.rpm)
          if [[ ${#candidate_cli_package[@]} -ne 1 || ${#candidate_gateway_package[@]} -ne 1 ]]; then
            echo "expected one candidate CLI and gateway RPM" >&2
            printf 'RPM artifacts:\n' >&2
            printf '  %s\n' rpm-input/* >&2
            exit 1
          fi

          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro fedora \
            --with podman-rootless \
            --with selinux \
            --copy "${candidate_cli_package[0]}:/var/lib/openshell-conformance/candidate/openshell.rpm" \
            --copy "${candidate_gateway_package[0]}:/var/lib/openshell-conformance/candidate/openshell-gateway.rpm" \
            --copy conformance-input/openshell-conformance:/tmp/openshell-conformance \
            --copy nix/test-guest/conformance-plans/gateway-upgrade-restart.toml:/tmp/conformance-plan.toml \
            --provision openshell-rpm-latest-release \
            --provision gateway-rootless-podman \
            --provision openshell-rpm-gateway-upgrade \
            -- /tmp/openshell-conformance run --plan /tmp/conformance-plan.toml

  ubuntu-snap:
    name: Ubuntu Snap with Docker Snap (${{ needs.target.outputs.arch }})
    needs: [build-conformance, build-gateway, build-snap, target]
    runs-on: ${{ needs.target.outputs.test_runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Download Snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap-linux-${{ needs.target.outputs.arch }}
          path: snap-input

      - name: Download conformance CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-conformance-${{ needs.target.outputs.musl_triple }}
          path: conformance-input

      - name: Download gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-gateway-${{ needs.target.outputs.gnu_triple }}
          path: gateway-input

      - name: Install Snap and run smoke conformance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x conformance-input/openshell-conformance
          chmod +x gateway-input/openshell-gateway
          shopt -s nullglob
          snaps=(snap-input/*.snap)
          if [[ ${#snaps[@]} -ne 1 ]]; then
            echo "expected one Snap artifact" >&2
            printf 'Snap artifacts:\n' >&2
            printf '  %s\n' snap-input/* >&2
            exit 1
          fi

          OPENSHELL_TEST_GUEST_CACHE_DISABLE=1 nix run .#test-guest -- \
            --distro ubuntu-24-04 \
            --with snapd \
            --with docker-snap \
            --copy "${snaps[0]}:/var/lib/openshell-conformance/candidate/openshell.snap" \
            --copy "conformance-input/openshell-conformance:/var/lib/openshell-conformance/candidate/openshell-conformance" \
            --copy "gateway-input/openshell-gateway:/var/lib/openshell-conformance/workarounds/openshell-gateway" \
            --provision openshell-snap-package-bootstrap-workaround \
            --provision openshell-snap \
            -- bash -ec '
              /var/lib/openshell-conformance/candidate/openshell-conformance \
                run smoke --openshell-bin /snap/bin/openshell
            '
