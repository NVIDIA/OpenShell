name: Conformance

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./.github/actions/pr-gate

  version:
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute versions
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-gateway:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-gateway-binaries.yml
    with:
      cargo-version: ${{ needs.version.outputs.cargo }}
      checkout-ref: ${{ github.sha }}
    secrets: inherit

  build-rpm:
    needs: [version, build-cli, build-gateway]
    permissions:
      contents: read
    uses: ./.github/workflows/rpm-package.yml
    with:
      checkout-ref: ${{ github.sha }}
      cargo-version: ${{ needs.version.outputs.cargo }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}

  fedora:
    name: Fedora clean install
    needs: build-rpm
    runs-on: linux-amd64-cpu8
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e-vm

      - uses: ./.github/actions/setup-nix

      - name: Download RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-linux-x86_64
          path: rpm-input

      - name: Install RPMs and check status
        shell: bash
        run: |
          set -euo pipefail
          nix run .#test-guest -- \
            --distro fedora \
            --with podman \
            --with selinux \
            --install rpm-input/openshell-[0-9]*.rpm \
            --install rpm-input/openshell-gateway-[0-9]*.rpm \
            -- bash -s <<'EOF'
          set -euo pipefail

          on_exit() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              systemctl --user status openshell-gateway --no-pager || true
              journalctl --user -u openshell-gateway --no-pager -n 200 || true
              podman info || true
              podman ps --all || true
              getenforce || true
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          . /etc/os-release
          echo "Testing on $PRETTY_NAME"
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          test "$(podman info --format '{{.Host.CgroupsVersion}}')" = v2
          test "$(getenforce)" = Enforcing
          rpm -q openshell openshell-gateway
          openshell --version
          openshell-gateway --version

          mkdir -p "$HOME/.config/openshell"
          echo 'OPENSHELL_TELEMETRY_ENABLED=false' > "$HOME/.config/openshell/gateway.env"
          systemctl --user enable --now openshell-gateway
          openshell gateway add --local https://127.0.0.1:17670 --name openshell
          openshell status
          EOF
