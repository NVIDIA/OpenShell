name: E2E Suites

on:
  workflow_call:
    inputs:
      source-sha:
        description: Source revision of the prepared candidate artifacts
        required: true
        type: string
      integration-inputs-artifact-id:
        description: Immutable ID of the prepared integration inputs artifact
        required: true
        type: string
      matrix:
        description: >-
          JSON array of {"plan", "runner"} entries, each with an optional
          "environment". A plan is a file stem in tests/plans/ that selects
          the suites and environments to run; "environment" narrows an entry
          to one of them, so environments run as parallel jobs.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

# github.workflow is the caller's name here, so scope the group to this job
# to avoid colliding with (and cancelling) the calling workflow.
concurrency:
  group: ${{ github.workflow }}-e2e-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-suites:
    name: E2E suites (${{ matrix.plan }}, ${{ matrix.environment || matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['source-sha'] }}
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Cache tmachine disks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tmachine
          key: tmachine-${{ runner.os }}-${{ runner.arch }}

      - name: Download integration inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs['integration-inputs-artifact-id'] }}
          path: artifacts

      - name: Run suites
        env:
          PLAN: ${{ matrix.plan }}
          ENVIRONMENT: ${{ matrix.environment || '' }}
        run: |
          # Retry dependency preparation, then run the plan once. The runner
          # builds the suites for the guest, so it needs no prepared archives.
          nix build --no-link .#test-runner || nix build --no-link .#test-runner
          args=(test --plan "tests/plans/${PLAN}.yaml" --results artifacts/test-results)
          if [[ -n "${ENVIRONMENT}" ]]; then
            args+=(--env "${ENVIRONMENT}")
          fi
          nix run .#test-runner -- "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results-${{ matrix.plan }}-${{ matrix.environment || matrix.runner }}
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7
