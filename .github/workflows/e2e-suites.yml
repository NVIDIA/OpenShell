# Runs testkit suites in tmachine environments on CI. Each matrix row names a
# tmachine environment and installer, the family (a workspace under
# tests/suites/) and the package in it, and the runner label for the
# environment's architecture. `openshell-test-runner` builds the tests, boots
# the environment, runs them inside it and checks the results.
#
# Modeled on the E2E Suites workflow in NVIDIA/OpenShell#4629 by Evan Lezar.

name: E2E Suites

on:
  workflow_call:
    inputs:
      source-sha:
        description: Source revision of the prepared candidate artifacts
        required: true
        type: string
      integration-inputs-artifact-id:
        description: Immutable ID of the prepared integration inputs artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

# github.workflow is the caller's name here, so scope the group to this
# workflow to avoid colliding with (and cancelling) the caller's other jobs.
concurrency:
  group: ${{ github.workflow }}-e2e-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: E2E suites (${{ matrix.family }}/${{ matrix.package }}, ${{ matrix.environment }}, ${{ matrix.installer }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only amd64 for now: CI has no arm64 runner with KVM for tmachine,
          # and the caller only builds amd64 inputs.
          - environment: ubuntu-docker-rootful
            installer: deb
            family: conformance
            package: sandbox
            runner: ubuntu-24.04
          - environment: ubuntu-docker-rootful-keycloak
            installer: deb
            family: features
            package: keycloak
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['source-sha'] }}
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Cache tmachine disks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tmachine
          # tmachine keys its disk layers on a hash of the Ansible tree.
          # actions/cache doesn't save after an exact key hit, so a fixed key
          # would rebuild the changed layers on every run. Key on the playbooks
          # and fall back to the newest entry for the same runner.
          key: tmachine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/tmachine/ansible/**', 'tests/tmachine/images.nix', 'scripts/keycloak-realm.json') }}
          restore-keys: |
            tmachine-${{ runner.os }}-${{ runner.arch }}-

      - name: Download integration inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs['integration-inputs-artifact-id'] }}
          path: artifacts

      - name: Run the suites in this environment
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          INSTALLER: ${{ matrix.installer }}
          FAMILY: ${{ matrix.family }}
          PACKAGE: ${{ matrix.package }}
        run: |
          # Retry dependency preparation, then run the suites once. The runner
          # builds the suites for the guest, so it needs no prepared archives.
          nix build --no-link .#openshell-test-runner || nix build --no-link .#openshell-test-runner
          nix run .#openshell-test-runner -- \
            --environment "${ENVIRONMENT}" \
            --installer "${INSTALLER}" \
            --family "${FAMILY}" \
            --package "${PACKAGE}" \
            --results artifacts/test-results

      # The results directory holds the JUnit report (junit.xml), the nextest
      # log, and the guest's diagnostics when the run failed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results-${{ matrix.family }}-${{ matrix.package }}-${{ matrix.environment }}-${{ matrix.installer }}
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: E2E suites result
    needs: [suites]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-results
        with:
          results: ${{ toJSON(needs) }}
