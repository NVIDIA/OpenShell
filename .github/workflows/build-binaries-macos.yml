name: Build macOS Binaries

on:
  workflow_call:
    inputs:
      cargo-version:
        required: true
        type: string
      supervisor-image-tag:
        required: false
        type: string
        default: ""
      checkout-ref:
        required: false
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.binary }} (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: openshell-cli
            binary: openshell
            triple: aarch64-apple-darwin
          - package: openshell-prover-cli
            binary: openshell-prover
            triple: aarch64-apple-darwin
          - package: openshell-gateway
            binary: openshell-gateway
            triple: aarch64-apple-darwin
          - package: openshell-supervisor
            binary: openshell-supervisor
            triple: aarch64-apple-darwin
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/build-rust-binary
        with:
          package: ${{ matrix.package }}
          binary: ${{ matrix.binary }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ inputs.cargo-version }}
          supervisor-image-tag: ${{ inputs.supervisor-image-tag }}
