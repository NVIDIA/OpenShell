name: Build VM Driver

on:
  workflow_call:
    inputs:
      cargo-version:
        required: true
        type: string
      supervisor-image-tag:
        required: false
        type: string
        default: ""
      checkout-ref:
        required: false
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ryno-driver-vm (${{ matrix.triple }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - arch: aarch64
            triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
          - arch: aarch64
            triple: aarch64-apple-darwin
            runner: macos-15-xlarge
            entitlements-file: crates/ryno-driver-vm/entitlements.plist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop -c bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs['checkout-ref'] || github.sha }}

      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download ryno-sandbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ryno-sandbox-${{ matrix.arch }}-unknown-linux-musl
          path: sandbox

      - name: Download ryno-supervisor
        if: endsWith(matrix.triple, '-unknown-linux-gnu')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ryno-supervisor-${{ matrix.arch }}-unknown-linux-gnu
          path: supervisor

      - name: Download native macOS host supervisor
        if: endsWith(matrix.triple, '-apple-darwin')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ryno-supervisor-aarch64-apple-darwin
          path: host-supervisor

      - name: Download VM guest init
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ryno-vm-init-${{ matrix.arch }}-unknown-linux-musl
          path: vm-init

      - name: Build VM runtime
        run: |
          # HTTP 416 is not retried by Nix; restart the build once on failure.
          nix build .#vm-runtime || nix build .#vm-runtime

      - name: Assemble compressed VM runtime
        run: |
          compressed_dir="${RUNNER_TEMP}/vm-runtime-compressed"
          host_supervisor="supervisor/ryno-supervisor"
          if [[ "${{ matrix.triple }}" == *-apple-darwin ]]; then
            host_supervisor="host-supervisor/ryno-supervisor"
          fi
          install -d "$compressed_dir"
          cp result/compressed/*.zst "$compressed_dir/"
          zstd -19 -T1 sandbox/ryno-sandbox -o "$compressed_dir/ryno-sandbox.zst"
          zstd -19 -T1 "$host_supervisor" -o "$compressed_dir/ryno-supervisor.zst"
          zstd -19 -T1 vm-init/ryno-vm-init -o "$compressed_dir/ryno-vm-init.zst"

      - name: Build ryno-driver-vm
        uses: ./.github/actions/build-rust-binary
        env:
          RYNO_VM_RUNTIME_COMPRESSED_DIR: ${{ runner.temp }}/vm-runtime-compressed
        with:
          package: ryno-driver-vm
          binary: ryno-driver-vm
          triple: ${{ matrix.triple }}
          cargo-version: ${{ inputs['cargo-version'] }}
          supervisor-image-tag: ${{ inputs['supervisor-image-tag'] }}
          entitlements-file: ${{ matrix.entitlements-file }}
