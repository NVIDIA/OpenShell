name: Tmachine Tests

on:
  workflow_call:
    inputs:
      artifact-run-id:
        description: Workflow run containing the candidate artifacts
        required: false
        type: string
        default: ""
      test-matrix:
        description: JSON array of scenario and testsuite combinations
        required: false
        type: string
        default: >-
          [
            {"scenario":"ubuntu-docker-rootful","testsuite":"conformance"},
            {"scenario":"fedora-podman-rootful","testsuite":"conformance"},
            {"scenario":"fedora-podman-rootless","testsuite":"conformance"}
          ]
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Workflow run containing the candidate artifacts
        required: false
        type: string
        default: ""
      test-matrix:
        description: JSON array of scenario and testsuite combinations
        required: false
        type: string
        default: >-
          [
            {"scenario":"ubuntu-docker-rootful","testsuite":"conformance"},
            {"scenario":"fedora-podman-rootful","testsuite":"conformance"},
            {"scenario":"fedora-podman-rootless","testsuite":"conformance"}
          ]

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare tmachine inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.artifact-run.outputs.source_sha }}
    steps:
      - name: Resolve artifact run
        id: artifact-run
        env:
          ARTIFACT_RUN_ID: ${{ inputs['artifact-run-id'] || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)
          echo "source_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.artifact-run.outputs.source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-x86_64-unknown-linux-musl
          path: artifacts/binaries/x86_64-unknown-linux-musl
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Download gateway artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-gateway-x86_64-unknown-linux-gnu
          path: artifacts/binaries/x86_64-unknown-linux-gnu
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Export runtime images
        env:
          IMAGE_TAG: ${{ steps.artifact-run.outputs.source_sha }}
        run: |
          mkdir -p artifacts/images

          docker pull "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}" openshell/sandbox:tmachine
          docker save --output artifacts/images/openshell-sandbox-tmachine.tar openshell/sandbox:tmachine

          docker pull "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}" openshell/supervisor:tmachine
          docker save --output artifacts/images/openshell-supervisor-tmachine.tar openshell/supervisor:tmachine

      - name: Build test archives
        run: nix run .#build-artifacts-test-archives

      - name: Upload tmachine inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-tmachine-inputs
          path: artifacts
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

  tmachine:
    name: Tmachine (${{ matrix.scenario }}, ${{ matrix.testsuite }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs['test-matrix']) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::The runner did not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-

      - uses: ./.github/actions/setup-nix

      - name: Cache tmachine disks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tmachine
          key: tmachine-${{ runner.os }}-${{ runner.arch }}

      - name: Download tmachine inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-tmachine-inputs
          path: artifacts

      - name: Run tmachine suite
        env:
          SCENARIO: ${{ matrix.scenario }}
          TESTSUITE: ${{ matrix.testsuite }}
        run: nix run .#tmachine -- test "${SCENARIO}" "${TESTSUITE}"
