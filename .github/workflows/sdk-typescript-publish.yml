name: Publish TypeScript SDK

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-ref:
        description: Commit to build the package from
        required: true
        type: string
      npm-version:
        required: true
        type: string
      make-latest:
        description: Whether this release may update the npm latest dist-tag
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release-tag:
        description: Stable tag to publish, e.g. v0.1.6
        required: true
        type: string
      npm-version:
        description: npm package version, e.g. 0.1.6
        required: true
        type: string
      make-latest:
        description: Update the latest dist-tag if this is still the newest stable release
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish TypeScript SDK
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    defaults:
      run:
        shell: nix shell --inputs-from . nixpkgs#nodejs_24 -c bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || inputs.release-tag }}

      - uses: ./.github/actions/setup-nix

      - name: Install TypeScript dependencies
        working-directory: ./sdk/typescript
        run: npm ci

      - name: Configure npm auth for GitHub Packages
        working-directory: ./sdk/typescript
        run: |
          {
            echo "@nvidia:registry=https://npm.pkg.github.com"
            # Keep the token reference literal for npm to expand at publish time.
            # shellcheck disable=SC2016
            echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          } > .npmrc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.make-latest
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-workflow
          sparse-checkout: .github/actions/check-latest-release

      - name: Check current latest release
        id: latest
        if: inputs.make-latest
        uses: ./release-workflow/.github/actions/check-latest-release
        with:
          release-tag: ${{ inputs.release-tag }}

      - name: Publish
        working-directory: ./sdk/typescript
        env:
          OPENSHELL_NPM_VERSION: ${{ inputs.npm-version }}
          MAKE_LATEST: ${{ steps.latest.outputs.make-latest }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm pkg set version="${OPENSHELL_NPM_VERSION}"
          dist_tag=latest
          if [[ "${MAKE_LATEST}" != "true" ]]; then
            dist_tag="release-${OPENSHELL_NPM_VERSION%.*}"
          fi
          npm publish --tag "${dist_tag}"
