name: Release Tag

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-pre.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.0.4)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

# Resolve the tag once: prefer the workflow_dispatch input, fall back to the
# push-event ref.  Every job references this via env.RELEASE_TAG.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Compute all versions once at the start to avoid git-describe race conditions
  # ---------------------------------------------------------------------------
  compute-versions:
    name: Compute Versions
    runs-on: linux-amd64-cpu8
    timeout-minutes: 5
    container:
      image: ghcr.io/nvidia/openshell/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      python_version: ${{ steps.v.outputs.python }}
      cargo_version: ${{ steps.v.outputs.cargo }}
      npm_version: ${{ steps.v.outputs.npm }}
      deb_version: ${{ steps.v.outputs.deb }}
      rpm_version: ${{ steps.v.outputs.rpm_version }}
      rpm_release: ${{ steps.v.outputs.rpm_release }}
      # Semver without 'v' prefix (e.g. 0.6.0), used for image tags and release body
      semver: ${{ steps.v.outputs.semver }}
      # Commit resolved from RELEASE_TAG, used for image tags and downstream metadata
      source_sha: ${{ steps.v.outputs.source_sha }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute all versions
        id: v
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre\.[1-9][0-9]*$ ]]; then
            is_prerelease=true
          elif [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_prerelease=false
          else
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "is_prerelease=${is_prerelease}"
            echo "python=$(uv run python tasks/scripts/release.py get-version --python)"
            echo "cargo=$(uv run python tasks/scripts/release.py get-version --cargo)"
            echo "npm=$(uv run python tasks/scripts/release.py get-version --npm)"
            echo "deb=$(uv run python tasks/scripts/release.py get-version --deb)"
            echo "rpm_version=$(uv run python tasks/scripts/release.py get-version --rpm-version)"
            echo "rpm_release=$(uv run python tasks/scripts/release.py get-version --rpm-release)"
            echo "semver=${RELEASE_TAG#v}"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: compute-versions
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      cargo-version: ${{ needs.compute-versions.outputs.cargo_version }}
      supervisor-image-tag: ${{ needs.compute-versions.outputs.semver }}
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-vm-driver:
    needs: [compute-versions, build-binaries]
    permissions:
      contents: read
    uses: ./.github/workflows/build-vm-driver.yml
    with:
      cargo-version: ${{ needs.compute-versions.outputs.cargo_version }}
      supervisor-image-tag: ${{ needs.compute-versions.outputs.semver }}
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  package-binaries:
    needs: [compute-versions, build-binaries, build-vm-driver]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/package-release-binaries.yml
    with:
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}

  build-images:
    needs: [compute-versions, build-binaries]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      image-tag: ${{ needs.compute-versions.outputs.source_sha }}
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}

  security:
    name: Security Scan
    needs: [compute-versions, build-images]
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml
    with:
      candidate_ref: ${{ inputs.tag || github.ref_name }}
      fail-on-codex-findings: true
      fail-on-static-findings: false
      images: |
        ghcr.io/nvidia/openshell/gateway:${{ needs.compute-versions.outputs.source_sha }}
        ghcr.io/nvidia/openshell/sandbox:${{ needs.compute-versions.outputs.source_sha }}
        ghcr.io/nvidia/openshell/supervisor:${{ needs.compute-versions.outputs.source_sha }}
    secrets:
      CODEX_SECURITY_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  prepare-integration:
    needs: [compute-versions, build-binaries, build-deb, build-images]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/prepare-integration-inputs.yml
    with:
      deb-artifact-name: deb-linux-amd64

  conformance-integration:
    needs: prepare-integration
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: conformance
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}

  feature-specific-integration:
    needs: prepare-integration
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: feature-specific
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}
      test-matrix: >-
        [
          {"environment":"fedora-podman-rootful","installer":"binaries","testsuite":"provider-refresh"},
          {"environment":"fedora-podman-rootless","installer":"binaries","testsuite":"provider-refresh"}
        ]

  docker-e2e:
    needs: [compute-versions, build-binaries, build-images]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-docker-test.yml
    with:
      image-tag: ${{ needs.compute-versions.outputs.source_sha }}
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
      runner: linux-arm64-cpu8
      conformance-artifact-prefix: openshell-conformance

  vm-e2e:
    needs: [compute-versions, build-binaries, build-vm-driver]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
      conformance-artifact-prefix: openshell-conformance

  qualification-result:
    name: Release Qualification
    if: always()
    needs:
      - compute-versions
      - security
      - conformance-integration
      - feature-specific-integration
      - docker-e2e
      - vm-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.summary.outputs.artifact-name }}
      current-profile-passed: ${{ steps.summary.outputs.current-profile-passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.compute-versions.outputs.source_sha || github.sha }}

      - name: Record qualification result
        id: summary
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance-integration.result }}
          DOCKER_E2E_RESULT: ${{ needs.docker-e2e.result }}
          FEATURE_INTEGRATION_RESULT: ${{ needs.feature-specific-integration.result }}
          IS_PRERELEASE: ${{ needs.compute-versions.outputs.is_prerelease }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SOURCE_SHA: ${{ needs.compute-versions.outputs.source_sha }}
          VM_E2E_RESULT: ${{ needs.vm-e2e.result }}
        run: |
          set -euo pipefail
          current_profile_passed=$(tasks/scripts/generate-qualification-summary.sh qualification-summary.json)
          artifact_name="qualification-${RELEASE_TAG}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          run_url=$(jq -r '.run.url' qualification-summary.json)

          {
            echo "artifact-name=${artifact_name}"
            echo "current-profile-passed=${current_profile_passed}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Release qualification"
            echo
            echo "- Candidate: \`${RELEASE_TAG}\` (\`${SOURCE_SHA}\`)"
            echo "- Current qualification profile passed: **${current_profile_passed}**"
            echo "- RFC-0014 qualification coverage complete: **false**"
            echo "- Run: [${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${run_url})"
            echo
            echo "| Suite | Result |"
            echo "| --- | --- |"
            echo "| Security | ${SECURITY_RESULT} |"
            echo "| Conformance integration | ${CONFORMANCE_RESULT} |"
            echo "| Feature integration | ${FEATURE_INTEGRATION_RESULT} |"
            echo "| Docker E2E | ${DOCKER_E2E_RESULT} |"
            echo "| VM E2E | ${VM_E2E_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload qualification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.summary.outputs.artifact-name }}
          path: qualification-summary.json
          retention-days: 90
          if-no-files-found: error

      - name: Require current qualification profile for stable releases
        if: needs.compute-versions.outputs.is_prerelease != 'true' && steps.summary.outputs.current-profile-passed != 'true'
        run: |
          echo "Stable release ${RELEASE_TAG} did not pass the current release-tag-v1 qualification profile." >&2
          exit 1

  build-python-wheel:
    name: Build Python Wheel
    needs: [compute-versions]
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    container:
      image: ghcr.io/nvidia/openshell/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OPENSHELL: ${{ needs.compute-versions.outputs.python_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.compute-versions.outputs.source_sha }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync Python dependencies
        run: uv sync

      - name: Build Python wheel
        run: |
          set -euo pipefail
          mise run python:build
          ls -la target/wheels/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheel
          path: target/wheels/*.whl
          retention-days: 5

  build-deb:
    name: Build Debian Packages
    needs: [compute-versions, build-binaries, build-vm-driver]
    uses: ./.github/workflows/deb-package.yml
    with:
      deb-version: ${{ needs.compute-versions.outputs.deb_version }}
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}

  build-snap:
    name: Build Snap
    needs: [compute-versions, build-binaries]
    uses: ./.github/workflows/snap-package.yml
    with:
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
      upload-channel: ${{ needs.compute-versions.outputs.is_prerelease == 'true' && 'latest/edge' || 'latest/stable' }}
      github-environment: ${{ needs.compute-versions.outputs.is_prerelease == 'true' && 'latest/edge' || 'latest/stable' }}
      publish: ${{ needs.compute-versions.outputs.is_prerelease != 'true' }}
    secrets:
      publish-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  build-rpm:
    name: Build RPM Packages
    needs: [compute-versions, build-binaries]
    uses: ./.github/workflows/rpm-package.yml
    with:
      checkout-ref: ${{ needs.compute-versions.outputs.source_sha }}
      rpm-version: ${{ needs.compute-versions.outputs.rpm_version }}
      rpm-release: ${{ needs.compute-versions.outputs.rpm_release }}
      cargo-version: ${{ needs.compute-versions.outputs.cargo_version }}

  # ---------------------------------------------------------------------------
  # Assemble release artifacts. Stable publication remains qualification-gated.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs:
      - compute-versions
      - package-binaries
      - build-python-wheel
      - qualification-result
      - build-deb
      - build-rpm
      - build-snap
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      wheel_filenames: ${{ steps.wheel_filenames.outputs.wheel_filenames }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.compute-versions.outputs.source_sha }}

      - name: Download all CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release/
          merge-multiple: true

      - name: Download gateway binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-binary-*
          path: release/
          merge-multiple: true

      - name: Download supervisor binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: supervisor-binary-*
          path: release/
          merge-multiple: true

      - name: Download sandbox binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sandbox-binary-*
          path: release/
          merge-multiple: true

      - name: Download VM driver artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: driver-vm-*
          path: release/
          merge-multiple: true

      - name: Download prover binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prover-binary-*
          path: release/
          merge-multiple: true

      - name: Download prover checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prover-checksums
          path: release/

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel
          path: release/

      - name: Download Debian package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-linux-*
          path: release/
          merge-multiple: true

      - name: Download RPM package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rpm-linux-*
          path: release/
          merge-multiple: true

      - name: Download snap artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snap-linux-*
          path: release/
          merge-multiple: true

      - name: Capture wheel filenames
        id: wheel_filenames
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Python wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel_filename=$(basename "${wheels[0]}")
          echo "wheel_filenames=${wheel_filename}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -- \
            openshell-x86_64-unknown-linux-musl.tar.gz \
            openshell-aarch64-unknown-linux-musl.tar.gz \
            openshell-aarch64-apple-darwin.tar.gz \
            openshell-driver-vm-x86_64-unknown-linux-gnu.tar.gz \
            openshell-driver-vm-aarch64-unknown-linux-gnu.tar.gz \
            openshell-driver-vm-aarch64-apple-darwin.tar.gz \
            openshell_*.deb \
            openshell-*.rpm \
            *.whl > openshell-checksums-sha256.txt
          cat openshell-checksums-sha256.txt
          sha256sum -- \
            openshell-gateway-x86_64-unknown-linux-gnu.tar.gz \
            openshell-gateway-aarch64-unknown-linux-gnu.tar.gz \
            openshell-gateway-aarch64-apple-darwin.tar.gz > openshell-gateway-checksums-sha256.txt
          cat openshell-gateway-checksums-sha256.txt
          sha256sum -- \
            openshell-sandbox-x86_64-unknown-linux-musl.tar.gz \
            openshell-sandbox-aarch64-unknown-linux-musl.tar.gz > openshell-sandbox-checksums-sha256.txt
          cat openshell-sandbox-checksums-sha256.txt
          sha256sum -- \
            openshell-supervisor-x86_64-unknown-linux-gnu.tar.gz \
            openshell-supervisor-aarch64-unknown-linux-gnu.tar.gz > openshell-supervisor-checksums-sha256.txt
          cat openshell-supervisor-checksums-sha256.txt

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          python3 tasks/scripts/release.py generate-homebrew-formula \
            --release-tag "${RELEASE_TAG}" \
            --release-dir release \
            --output release/openshell.rb
          cat release/openshell.rb

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.whl

      - name: Prune removed VM checksum asset
        if: needs.compute-versions.outputs.is_prerelease != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG });
            } catch (err) {
              if (err.status === 404) {
                core.info(`No existing ${process.env.RELEASE_TAG} release; skipping VM checksum pruning.`);
                return;
              }
              throw err;
            }
            for (const asset of release.data.assets) {
              if (asset.name === 'openshell-driver-vm-checksums-sha256.txt') {
                core.info(`Deleting removed VM checksum asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

      - name: Create GitHub Release
        if: needs.compute-versions.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: OpenShell ${{ env.RELEASE_TAG }}
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## OpenShell ${{ env.RELEASE_TAG }}

            ### Quick install

            ```bash
            curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | OPENSHELL_VERSION=${{ env.RELEASE_TAG }} sh
            ```

          files: |
            release/openshell-x86_64-unknown-linux-musl.tar.gz
            release/openshell-aarch64-unknown-linux-musl.tar.gz
            release/openshell-aarch64-apple-darwin.tar.gz
            release/openshell_*.deb
            release/openshell-*.rpm
            release/*.snap
            release/openshell-gateway-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-gateway-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-gateway-aarch64-apple-darwin.tar.gz
            release/openshell-sandbox-x86_64-unknown-linux-musl.tar.gz
            release/openshell-sandbox-aarch64-unknown-linux-musl.tar.gz
            release/openshell-supervisor-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-supervisor-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-aarch64-apple-darwin.tar.gz
            release/openshell-prover-x86_64-unknown-linux-musl.tar.gz
            release/openshell-prover-aarch64-unknown-linux-musl.tar.gz
            release/openshell-prover-aarch64-apple-darwin.tar.gz
            release/*.whl
            release/openshell.rb
            release/openshell-checksums-sha256.txt
            release/openshell-gateway-checksums-sha256.txt
            release/openshell-sandbox-checksums-sha256.txt
            release/openshell-supervisor-checksums-sha256.txt
            release/openshell-prover-checksums-sha256.txt

      - name: Upload amd64 Debian prerelease package
        if: needs.compute-versions.outputs.is_prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-amd64-deb
          path: |
            release/openshell_*_amd64.deb
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload arm64 Debian prerelease package
        if: needs.compute-versions.outputs.is_prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-arm64-deb
          path: |
            release/openshell_*_arm64.deb
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload x86_64 RPM prerelease packages
        if: needs.compute-versions.outputs.is_prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-x86_64-rpm
          path: |
            release/openshell-*.x86_64.rpm
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload aarch64 RPM prerelease packages
        if: needs.compute-versions.outputs.is_prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-aarch64-rpm
          path: |
            release/openshell-*.aarch64.rpm
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload macOS prerelease packages
        if: needs.compute-versions.outputs.is_prerelease == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-macos-arm64
          path: |
            release/openshell-aarch64-apple-darwin.tar.gz
            release/openshell-gateway-aarch64-apple-darwin.tar.gz
            release/openshell-driver-vm-aarch64-apple-darwin.tar.gz
            release/openshell-prover-aarch64-apple-darwin.tar.gz
            release/openshell.rb
            release/openshell-checksums-sha256.txt
            release/openshell-gateway-checksums-sha256.txt
            release/openshell-prover-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish OCI artifacts. build-images creates the commit-addressed candidate
  # images; these jobs add versioned image tags and charts, and publish the
  # qualification summary independently from the release artifacts.
  # ---------------------------------------------------------------------------
  tag-ghcr-release:
    name: Tag GHCR Images
    needs: [compute-versions, build-images, release]
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag images with release version
        env:
          IS_PRERELEASE: ${{ needs.compute-versions.outputs.is_prerelease }}
          SOURCE_TAG: ${{ needs.compute-versions.outputs.source_sha }}
          VERSION: ${{ needs.compute-versions.outputs.semver }}
        run: |
          set -euo pipefail
          REGISTRY="ghcr.io/nvidia/openshell"
          for component in gateway sandbox supervisor; do
            echo "Tagging ${REGISTRY}/${component}:${SOURCE_TAG} as ${VERSION}..."
            docker buildx imagetools create \
              --prefer-index=false \
              -t "${REGISTRY}/${component}:${VERSION}" \
              "${REGISTRY}/${component}:${SOURCE_TAG}"
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              echo "Tagging ${REGISTRY}/${component}:${SOURCE_TAG} as latest..."
              docker buildx imagetools create \
                --prefer-index=false \
                -t "${REGISTRY}/${component}:latest" \
                "${REGISTRY}/${component}:${SOURCE_TAG}"
            fi
          done

  release-helm:
    name: Release Helm Chart (OCI)
    needs: [compute-versions, release, tag-ghcr-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.compute-versions.outputs.source_sha }}

      - uses: ./.github/actions/release-helm-oci
        with:
          chart-version: ${{ needs.compute-versions.outputs.semver }}
          app-version: ${{ needs.compute-versions.outputs.semver }}
          release-kind: public

  publish-qualification:
    name: Publish Qualification Summary (OCI)
    if: >-
      always()
      && needs.release.result == 'success'
      && needs.qualification-result.result == 'success'
    needs: [compute-versions, qualification-result, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download qualification result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualification-result.outputs.artifact-name }}

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish qualification summary
        env:
          SOURCE_SHA: ${{ needs.compute-versions.outputs.source_sha }}
          VERSION: ${{ needs.compute-versions.outputs.semver }}
        run: |
          set -euo pipefail
          ref="ghcr.io/nvidia/openshell/qualification:${VERSION}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          oras push "${ref}" \
            --artifact-type application/vnd.nvidia.openshell.qualification.v1 \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            qualification-summary.json:application/vnd.nvidia.openshell.qualification.summary.v1+json

          echo "Published qualification summary to \`${ref}\`." >> "${GITHUB_STEP_SUMMARY}"

  publish-fern-docs:
    name: Sync and Publish Fern Docs
    needs: [compute-versions, release, publish-sdk-typescript, release-helm, trigger-wheel-publish]
    if: needs.compute-versions.outputs.is_prerelease != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/sync-docs.yml
    with:
      operation: sync
      channel: latest
      source_ref: ${{ needs.compute-versions.outputs.source_sha }}
      release_version: ${{ needs.compute-versions.outputs.semver }}
      display_name: Latest (v${{ needs.compute-versions.outputs.semver }})
      publish: true
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  publish-sdk-typescript:
    name: Publish TypeScript SDK
    needs: [compute-versions, release]
    if: needs.compute-versions.outputs.is_prerelease != 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/nvidia/openshell/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.compute-versions.outputs.source_sha }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install tools
        run: mise install --locked

      - name: Configure npm auth for GitHub Packages
        working-directory: ./sdk/typescript
        run: |
          {
            echo "@nvidia:registry=https://npm.pkg.github.com"
            # Keep the token reference literal for npm to expand at publish time.
            # shellcheck disable=SC2016
            echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          } > .npmrc

      - name: Publish
        env:
          OPENSHELL_NPM_VERSION: ${{ needs.compute-versions.outputs.npm_version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sdk:ts:publish

  trigger-wheel-publish:
    name: Trigger Wheel Publish
    needs: [compute-versions, release]
    if: needs.compute-versions.outputs.is_prerelease != 'true'
    runs-on: [self-hosted, nv]
    timeout-minutes: 10
    steps:
      - name: Trigger GitLab CI
        env:
          GITLAB_CI_TRIGGER_TOKEN: ${{ secrets.GITLAB_CI_TRIGGER_TOKEN }}
          GITLAB_CI_TRIGGER_URL: ${{ secrets.GITLAB_CI_TRIGGER_URL }}
          COMMIT_SHA: ${{ needs.compute-versions.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.compute-versions.outputs.python_version }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          WHEEL_FILENAMES: ${{ needs.release.outputs.wheel_filenames }}
        run: |
          set -euo pipefail
          if [ -z "${WHEEL_FILENAMES}" ]; then
            echo "No wheel filenames provided by build job" >&2
            exit 1
          fi

          response=$(curl -X POST \
            --fail \
            --silent \
            --show-error \
            -F "token=${GITLAB_CI_TRIGGER_TOKEN}" \
            -F "ref=main" \
            -F "variables[PIPELINE_ACTION]=publish_wheels" \
            -F "variables[GITHUB_REPOSITORY]=${GITHUB_REPOSITORY}" \
            -F "variables[COMMIT_SHA]=${COMMIT_SHA}" \
            -F "variables[RELEASE_TAG]=${RELEASE_TAG}" \
            -F "variables[RELEASE_VERSION]=${RELEASE_VERSION}" \
            -F "variables[RELEASE_KIND]=stable" \
            -F "variables[WHEEL_FILENAMES]=${WHEEL_FILENAMES}" \
            "${GITLAB_CI_TRIGGER_URL}")
          pipeline_id=$(printf '%s' "$response" | sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p')
          pipeline_status=$(printf '%s' "$response" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "Triggered GitLab pipeline ${pipeline_id:-unknown} with status=${pipeline_status:-unknown}"
