name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-pre.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to release (e.g. v0.0.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/release-build.yml
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}
      is-prerelease: false
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  qualify:
    name: Qualify
    needs: build
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/release-qualification.yml
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}
      source-sha: ${{ needs.build.outputs.source_sha }}
      is-prerelease: false
    secrets:
      CODEX_SECURITY_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish
    needs: [build, qualify]
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-publish.yml
    with:
      release-tag: ${{ inputs.tag || github.ref_name }}
      source-sha: ${{ needs.build.outputs.source_sha }}
      semver: ${{ needs.build.outputs.semver }}
      python-version: ${{ needs.build.outputs.python_version }}
      npm-version: ${{ needs.build.outputs.npm_version }}
      is-prerelease: false
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      GITLAB_CI_TRIGGER_TOKEN: ${{ secrets.GITLAB_CI_TRIGGER_TOKEN }}
      GITLAB_CI_TRIGGER_URL: ${{ secrets.GITLAB_CI_TRIGGER_URL }}
