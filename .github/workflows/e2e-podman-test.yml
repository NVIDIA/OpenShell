name: Podman E2E Test

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      gateway-artifact:
        required: false
        type: string
        default: ""
      test-name:
        required: false
        type: string
        default: rust-podman-rootless, Ubuntu 26.04 Nix VM
      distro:
        required: false
        type: string
        default: ubuntu-26-04
      configuration:
        required: false
        type: string
        default: podman-rootless
      guest-gateway-user:
        required: false
        type: string
        default: openshell
      gateway-config:
        required: false
        type: string
        default: e2e/configs/gateway/podman.toml
      tests-in-vm:
        required: false
        type: boolean
        default: true
      suite:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  e2e:
    name: E2E (${{ inputs.test-name }})
    runs-on: ubuntu-26.04
    # Run Podman inside a Nix-managed guest so runtime setup is provisioned by
    # versioned repository tooling rather than mutable hosted-runner packages.
    timeout-minutes: 60
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-e2e-cli

      - uses: ./.github/actions/setup-e2e-gateway
        with:
          artifact-name: ${{ inputs.gateway-artifact }}

      - uses: ./.github/actions/setup-e2e-sandbox

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: openshell

      - name: Install mise
        run: |
          curl https://mise.run | MISE_VERSION=v2026.4.25 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install tools
        run: mise install --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            libz3-dev \
            openssh-client \
            pkg-config

      - name: Run tests
        env:
          TEST_GUEST_DISTRO: ${{ inputs.distro }}
          TEST_GUEST_CONFIGURATION: ${{ inputs.configuration }}
          TESTS_IN_VM: ${{ inputs.tests-in-vm }}
          GUEST_GATEWAY_USER: ${{ inputs.guest-gateway-user }}
          GATEWAY_CONFIG: ${{ inputs.gateway-config }}
          E2E_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail

          args=(
            mise x -- e2e/run.sh
            --vm "$TEST_GUEST_DISTRO"
            --with "$TEST_GUEST_CONFIGURATION"
            --cli-bin "$OPENSHELL_BIN"
            --gateway-bin "$OPENSHELL_GATEWAY_BIN"
            --sandbox-bin "$OPENSHELL_SANDBOX_BIN"
            --gateway-config "$GATEWAY_CONFIG"
            --features e2e-podman
          )
          if [ "$TESTS_IN_VM" = true ]; then
            args+=(--tests-in-vm)
          fi
          if [ "$GUEST_GATEWAY_USER" != openshell ]; then
            args+=(--guest-gateway-user "$GUEST_GATEWAY_USER")
          fi
          if [ -n "$E2E_SUITE" ]; then
            args+=(--suite "$E2E_SUITE")
          fi
          "${args[@]}"
