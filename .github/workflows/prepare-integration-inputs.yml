name: Prepare Integration Inputs

on:
  workflow_call:
    inputs:
      artifact-run-id:
        description: Workflow run containing the candidate artifacts
        required: false
        type: string
        default: ""
      deb-artifact-name:
        description: Debian package artifact to include in the tmachine inputs
        required: false
        type: string
        default: ""
      rpm-artifact-name:
        description: RPM package artifact to include in the tmachine inputs
        required: false
        type: string
        default: ""
      include-deb-upgrade-source:
        description: Include the latest retained prerelease DEB and runtime images as upgrade inputs
        required: false
        type: boolean
        default: false
      include-rpm-upgrade-source:
        description: Include the latest retained prerelease RPMs and runtime images as upgrade inputs
        required: false
        type: boolean
        default: false
    outputs:
      source_sha:
        description: Source revision of the candidate artifacts
        value: ${{ jobs.prepare.outputs.source_sha }}
      integration_inputs_artifact_id:
        description: Immutable ID of the prepared integration inputs artifact
        value: ${{ jobs.prepare.outputs.integration_inputs_artifact_id }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare tmachine inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.artifact-run.outputs.source_sha }}
      integration_inputs_artifact_id: ${{ steps.upload-integration-inputs.outputs.artifact-id }}
    steps:
      - name: Resolve artifact run
        id: artifact-run
        env:
          ARTIFACT_RUN_ID: ${{ inputs['artifact-run-id'] || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)
          echo "source_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.artifact-run.outputs.source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-x86_64-unknown-linux-musl
          path: artifacts/binaries/x86_64-unknown-linux-musl
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Download gateway artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-gateway-x86_64-unknown-linux-gnu
          path: artifacts/binaries/x86_64-unknown-linux-gnu
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Download Debian package artifact
        if: inputs['deb-artifact-name'] != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['deb-artifact-name'] }}
          path: artifacts/packages/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Stage Debian package input
        if: inputs['deb-artifact-name'] != ''
        run: |
          set -euo pipefail
          mv artifacts/packages/download/*.deb artifacts/packages/openshell.deb
          rmdir artifacts/packages/download

      - name: Download RPM package artifact
        if: inputs['rpm-artifact-name'] != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['rpm-artifact-name'] }}
          path: artifacts/packages/rpm/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Stage RPM package inputs
        if: inputs['rpm-artifact-name'] != ''
        run: |
          set -euo pipefail
          download_dir=artifacts/packages/rpm/download
          cli_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-[0-9]*.x86_64.rpm' -print -quit)
          gateway_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-gateway-[0-9]*.x86_64.rpm' -print -quit)
          if [[ -z "$cli_rpm" || -z "$gateway_rpm" ]]; then
            echo "candidate artifact did not contain the expected x86_64 CLI and gateway RPMs" >&2
            exit 1
          fi
          mv "$cli_rpm" artifacts/packages/rpm/openshell.rpm
          mv "$gateway_rpm" artifacts/packages/rpm/openshell-gateway.rpm
          rm -rf "$download_dir"

      - name: Resolve prerelease upgrade source
        if: inputs['include-deb-upgrade-source'] || inputs['include-rpm-upgrade-source']
        id: upgrade-source
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_DEB: ${{ inputs['include-deb-upgrade-source'] }}
          INCLUDE_RPM: ${{ inputs['include-rpm-upgrade-source'] }}
        run: |
          set -euo pipefail
          successful_run_ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-tag.yml/runs?status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id')
          artifact_records=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.workflow_run.id, .name] | @tsv')
          source_record=$(printf '%s\n--ARTIFACTS--\n%s\n' "$successful_run_ids" "$artifact_records" | awk -F '\t' \
            -v require_deb="$INCLUDE_DEB" -v require_rpm="$INCLUDE_RPM" '
            $0 == "--ARTIFACTS--" {
              reading_artifacts = 1
              next
            }
            !reading_artifacts {
              if ($1 ~ /^[0-9]+$/) successful_runs[$1] = 1
              next
            }
            $1 in successful_runs {
              run_id = $1
              artifact = $2
              tag = ""
              if (artifact ~ /^openshell-v[0-9]+\.[0-9]+\.[0-9]+-pre\.[1-9][0-9]*-linux-amd64-deb$/) {
                tag = artifact
                sub(/^openshell-/, "", tag)
                sub(/-linux-amd64-deb$/, "", tag)
                deb[run_id SUBSEP tag] = artifact
              } else if (artifact ~ /^openshell-v[0-9]+\.[0-9]+\.[0-9]+-pre\.[1-9][0-9]*-linux-x86_64-rpm$/) {
                tag = artifact
                sub(/^openshell-/, "", tag)
                sub(/-linux-x86_64-rpm$/, "", tag)
                rpm[run_id SUBSEP tag] = artifact
              }
              if (tag != "") {
                candidates[run_id SUBSEP tag] = tag
                runs[run_id SUBSEP tag] = run_id
              }
            }
            END {
              for (key in candidates) {
                if (require_deb == "true" && !(key in deb)) continue
                if (require_rpm == "true" && !(key in rpm)) continue
                tag = candidates[key]
                run_id = runs[key]
                deb_artifact = (key in deb) ? deb[key] : "-"
                rpm_artifact = (key in rpm) ? rpm[key] : "-"
                version = tag
                sub(/^v/, "", version)
                split(version, parts, "-pre\\.")
                split(parts[1], core, "\\.")
                sequence = parts[2] + 0
                if (!found || core[1] + 0 > major ||
                    (core[1] + 0 == major && core[2] + 0 > minor) ||
                    (core[1] + 0 == major && core[2] + 0 == minor && core[3] + 0 > patch) ||
                    (core[1] + 0 == major && core[2] + 0 == minor && core[3] + 0 == patch && sequence > prerelease)) {
                  selected = tag
                  selected_run = run_id
                  selected_deb = deb_artifact
                  selected_rpm = rpm_artifact
                  major = core[1] + 0
                  minor = core[2] + 0
                  patch = core[3] + 0
                  prerelease = sequence
                  found = 1
                }
              }
              if (found) {
                printf "%s\t%s\t%s\t%s\n", selected, selected_run, selected_deb, selected_rpm
              }
            }')
          if [[ -z "$source_record" ]]; then
            echo "no successful retained prerelease contains all requested package artifacts" >&2
            exit 1
          fi
          IFS=$'\t' read -r source_tag source_run_id deb_artifact rpm_artifact <<< "$source_record"
          {
            echo "tag=${source_tag}"
            echo "run-id=${source_run_id}"
            if [[ "$deb_artifact" != "-" ]]; then echo "deb-artifact=${deb_artifact}"; fi
            if [[ "$rpm_artifact" != "-" ]]; then echo "rpm-artifact=${rpm_artifact}"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Download prerelease Debian upgrade source
        if: inputs['include-deb-upgrade-source']
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.upgrade-source.outputs['deb-artifact'] }}
          path: artifacts/upgrade/deb/source/download
          github-token: ${{ github.token }}
          run-id: ${{ steps.upgrade-source.outputs['run-id'] }}

      - name: Stage prerelease Debian upgrade source
        if: inputs['include-deb-upgrade-source']
        run: |
          set -euo pipefail
          source_dir=artifacts/upgrade/deb/source
          download_dir="${source_dir}/download"
          deb_path=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell_*_amd64.deb' -print -quit)
          if [[ -z "$deb_path" || ! -f "${download_dir}/openshell-checksums-sha256.txt" ]]; then
            echo "prerelease source artifact did not contain the expected Debian package and checksums" >&2
            exit 1
          fi
          (
            cd "$download_dir"
            grep -F " $(basename "$deb_path")" openshell-checksums-sha256.txt | sha256sum --check --status
          )
          mv "$deb_path" "${source_dir}/openshell.deb"
          mv "${download_dir}/openshell-checksums-sha256.txt" "${source_dir}/openshell-checksums-sha256.txt"
          rmdir "$download_dir"
          dpkg-deb --field "${source_dir}/openshell.deb" Version > "${source_dir}/version"

      # Packages do not embed OCI image payloads. Their gateway binaries pin
      # this release tag, while tmachine consumes tarballs to keep guest setup
      # independent of registry access.
      - name: Export prerelease runtime images for upgrade sources
        if: inputs['include-deb-upgrade-source'] || inputs['include-rpm-upgrade-source']
        env:
          IMAGE_TAG: ${{ steps.upgrade-source.outputs.tag }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAG#v}"
          mkdir -p artifacts/upgrade/source-images

          docker pull "ghcr.io/nvidia/openshell/sandbox:${image_tag}"
          docker tag "ghcr.io/nvidia/openshell/sandbox:${image_tag}" openshell/sandbox:tmachine
          docker save --output artifacts/upgrade/source-images/openshell-sandbox-tmachine.tar openshell/sandbox:tmachine

          docker pull "ghcr.io/nvidia/openshell/supervisor:${image_tag}"
          docker tag "ghcr.io/nvidia/openshell/supervisor:${image_tag}" openshell/supervisor:tmachine
          docker save --output artifacts/upgrade/source-images/openshell-supervisor-tmachine.tar openshell/supervisor:tmachine

      - name: Download prerelease RPM upgrade source
        if: inputs['include-rpm-upgrade-source']
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.upgrade-source.outputs['rpm-artifact'] }}
          path: artifacts/upgrade/rpm/source/download
          github-token: ${{ github.token }}
          run-id: ${{ steps.upgrade-source.outputs['run-id'] }}

      - name: Stage prerelease RPM upgrade source
        if: inputs['include-rpm-upgrade-source']
        run: |
          set -euo pipefail
          source_dir=artifacts/upgrade/rpm/source
          download_dir="${source_dir}/download"
          cli_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-[0-9]*.x86_64.rpm' -print -quit)
          gateway_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-gateway-[0-9]*.x86_64.rpm' -print -quit)
          if [[ -z "$cli_rpm" || -z "$gateway_rpm" || ! -f "${download_dir}/openshell-checksums-sha256.txt" ]]; then
            echo "prerelease source artifact did not contain the expected RPMs and checksums" >&2
            exit 1
          fi
          (
            cd "$download_dir"
            grep -F " $(basename "$cli_rpm")" openshell-checksums-sha256.txt | sha256sum --check --status
            grep -F " $(basename "$gateway_rpm")" openshell-checksums-sha256.txt | sha256sum --check --status
          )
          mv "$cli_rpm" "${source_dir}/openshell.rpm"
          mv "$gateway_rpm" "${source_dir}/openshell-gateway.rpm"
          mv "${download_dir}/openshell-checksums-sha256.txt" "${source_dir}/openshell-checksums-sha256.txt"
          rm -rf "$download_dir"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Export runtime images
        env:
          IMAGE_TAG: ${{ steps.artifact-run.outputs.source_sha }}
        run: |
          mkdir -p artifacts/images

          docker pull "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}" openshell/sandbox:tmachine
          docker save --output artifacts/images/openshell-sandbox-tmachine.tar openshell/sandbox:tmachine

          docker pull "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}" openshell/supervisor:tmachine
          docker save --output artifacts/images/openshell-supervisor-tmachine.tar openshell/supervisor:tmachine

      - name: Build test archives
        run: nix run .#build-artifacts-test-archives

      - name: Upload integration inputs
        id: upload-integration-inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-tmachine-inputs
          path: artifacts
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
