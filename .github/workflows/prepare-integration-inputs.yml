name: Prepare Integration Inputs

on:
  workflow_call:
    inputs:
      artifact-run-id:
        description: Workflow run containing the candidate artifacts
        required: false
        type: string
        default: ""
      source-sha:
        description: Candidate source revision; defaults to the artifact run head SHA
        required: false
        type: string
        default: ""
      deb-artifact-name:
        description: Debian package artifact to include in the tmachine inputs
        required: false
        type: string
        default: ""
      rpm-artifact-name:
        description: RPM package artifact to include in the tmachine inputs
        required: false
        type: string
        default: ""
      include-deb-upgrade-source:
        description: Include the latest published release DEB and runtime images as upgrade inputs
        required: false
        type: boolean
        default: false
      include-rpm-upgrade-source:
        description: Include the latest published release RPMs and runtime images as upgrade inputs
        required: false
        type: boolean
        default: false
    outputs:
      source_sha:
        description: Source revision of the candidate artifacts
        value: ${{ jobs.prepare.outputs.source_sha }}
      integration_inputs_artifact_id:
        description: Immutable ID of the prepared integration inputs artifact
        value: ${{ jobs.prepare.outputs.integration_inputs_artifact_id }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare tmachine inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.artifact-run.outputs.source_sha }}
      integration_inputs_artifact_id: ${{ steps.upload-integration-inputs.outputs.artifact-id }}
    steps:
      - name: Resolve artifact run
        id: artifact-run
        env:
          ARTIFACT_RUN_ID: ${{ inputs['artifact-run-id'] || github.run_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
        run: |
          if [ -z "${SOURCE_SHA}" ]; then
            SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.artifact-run.outputs.source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-x86_64-unknown-linux-musl
          path: artifacts/binaries/x86_64-unknown-linux-musl
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Download gateway artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-gateway-x86_64-unknown-linux-gnu
          path: artifacts/binaries/x86_64-unknown-linux-gnu
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Download Debian package artifact
        if: inputs['deb-artifact-name'] != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['deb-artifact-name'] }}
          path: artifacts/packages/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Stage Debian package input
        if: inputs['deb-artifact-name'] != ''
        run: |
          set -euo pipefail
          mv artifacts/packages/download/*.deb artifacts/packages/openshell.deb
          rmdir artifacts/packages/download

      - name: Download RPM package artifact
        if: inputs['rpm-artifact-name'] != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['rpm-artifact-name'] }}
          path: artifacts/packages/rpm/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs['artifact-run-id'] || github.run_id }}

      - name: Stage RPM package inputs
        if: inputs['rpm-artifact-name'] != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          download_dir=artifacts/packages/rpm/download
          cli_rpms=("$download_dir"/openshell-[0-9]*.rpm)
          gateway_rpms=("$download_dir"/openshell-gateway-[0-9]*.rpm)
          if [[ ${#cli_rpms[@]} -ne 1 || ${#gateway_rpms[@]} -ne 1 ]]; then
            echo "candidate artifact must contain exactly one CLI and one gateway RPM" >&2
            exit 1
          fi
          cli_identity=${cli_rpms[0]%.rpm}
          gateway_identity=${gateway_rpms[0]%.rpm}
          if [[ ${cli_identity##*.} != "${gateway_identity##*.}" ]]; then
            echo "candidate CLI and gateway RPM architectures must match" >&2
            exit 1
          fi
          mv "${cli_rpms[0]}" artifacts/packages/rpm/openshell.rpm
          mv "${gateway_rpms[0]}" artifacts/packages/rpm/openshell-gateway.rpm
          rm -rf "$download_dir"

      - name: Resolve released upgrade source
        if: inputs['include-deb-upgrade-source'] || inputs['include-rpm-upgrade-source']
        id: upgrade-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          echo "tag=${source_tag}" >> "$GITHUB_OUTPUT"

      - name: Download released Debian upgrade source
        if: inputs['include-deb-upgrade-source']
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.upgrade-source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'openshell_*_amd64.deb' \
            --pattern openshell-checksums-sha256.txt \
            --dir artifacts/upgrade/deb/source/download

      - name: Stage released Debian upgrade source
        if: inputs['include-deb-upgrade-source']
        run: |
          set -euo pipefail
          source_dir=artifacts/upgrade/deb/source
          download_dir="${source_dir}/download"
          deb_path=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell_*_amd64.deb' -print -quit)
          if [[ -z "$deb_path" || ! -f "${download_dir}/openshell-checksums-sha256.txt" ]]; then
            echo "released source artifact did not contain the expected Debian package and checksums" >&2
            exit 1
          fi
          (
            cd "$download_dir"
            grep -F " $(basename "$deb_path")" openshell-checksums-sha256.txt | sha256sum --check --status
          )
          mv "$deb_path" "${source_dir}/openshell.deb"
          mv "${download_dir}/openshell-checksums-sha256.txt" "${source_dir}/openshell-checksums-sha256.txt"
          rmdir "$download_dir"
          dpkg-deb --field "${source_dir}/openshell.deb" Version > "${source_dir}/version"

      # Packages do not embed OCI image payloads. Their gateway binaries pin
      # this release tag, while tmachine consumes tarballs to keep guest setup
      # independent of registry access.
      - name: Export released runtime images for upgrade sources
        if: inputs['include-deb-upgrade-source'] || inputs['include-rpm-upgrade-source']
        env:
          IMAGE_TAG: ${{ steps.upgrade-source.outputs.tag }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAG#v}"
          mkdir -p artifacts/upgrade/source-images

          docker pull "ghcr.io/nvidia/openshell/sandbox:${image_tag}"
          docker save --output artifacts/upgrade/source-images/openshell-sandbox-tmachine.tar "ghcr.io/nvidia/openshell/sandbox:${image_tag}"

          docker pull "ghcr.io/nvidia/openshell/supervisor:${image_tag}"
          docker save --output artifacts/upgrade/source-images/openshell-supervisor-tmachine.tar "ghcr.io/nvidia/openshell/supervisor:${image_tag}"

      - name: Download released RPM upgrade source
        if: inputs['include-rpm-upgrade-source']
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.upgrade-source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'openshell-[0-9]*.x86_64.rpm' \
            --pattern 'openshell-gateway-[0-9]*.x86_64.rpm' \
            --pattern openshell-checksums-sha256.txt \
            --dir artifacts/upgrade/rpm/source/download

      - name: Stage released RPM upgrade source
        if: inputs['include-rpm-upgrade-source']
        run: |
          set -euo pipefail
          source_dir=artifacts/upgrade/rpm/source
          download_dir="${source_dir}/download"
          cli_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-[0-9]*.x86_64.rpm' -print -quit)
          gateway_rpm=$(find "$download_dir" -maxdepth 1 -type f -name 'openshell-gateway-[0-9]*.x86_64.rpm' -print -quit)
          if [[ -z "$cli_rpm" || -z "$gateway_rpm" || ! -f "${download_dir}/openshell-checksums-sha256.txt" ]]; then
            echo "released source artifact did not contain the expected RPMs and checksums" >&2
            exit 1
          fi
          (
            cd "$download_dir"
            grep -F " $(basename "$cli_rpm")" openshell-checksums-sha256.txt | sha256sum --check --status
            grep -F " $(basename "$gateway_rpm")" openshell-checksums-sha256.txt | sha256sum --check --status
          )
          mv "$cli_rpm" "${source_dir}/openshell.rpm"
          mv "$gateway_rpm" "${source_dir}/openshell-gateway.rpm"
          mv "${download_dir}/openshell-checksums-sha256.txt" "${source_dir}/openshell-checksums-sha256.txt"
          rm -rf "$download_dir"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Export OpenShell images
        env:
          IMAGE_TAG: ${{ steps.artifact-run.outputs.source_sha }}
        run: |
          mkdir -p artifacts/images

          docker pull "ghcr.io/nvidia/openshell/gateway:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/gateway:${IMAGE_TAG}" openshell/gateway:tmachine
          docker save --output artifacts/images/openshell-gateway-tmachine.tar openshell/gateway:tmachine

          docker pull "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/sandbox:${IMAGE_TAG}" openshell/sandbox:tmachine
          docker save --output artifacts/images/openshell-sandbox-tmachine.tar openshell/sandbox:tmachine

          docker pull "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}"
          docker tag "ghcr.io/nvidia/openshell/supervisor:${IMAGE_TAG}" openshell/supervisor:tmachine
          docker save --output artifacts/images/openshell-supervisor-tmachine.tar openshell/supervisor:tmachine

      - name: Build test archives
        run: |
          # Retry dependency preparation, then generate artifacts once.
          nix build --no-link .#build-artifacts-test-archives || nix build --no-link .#build-artifacts-test-archives
          nix run .#build-artifacts-test-archives

      - name: Build test workload images
        run: |
          # Retry dependency preparation, then generate artifacts once.
          nix build --no-link .#build-artifacts-test-images || nix build --no-link .#build-artifacts-test-images
          nix run .#build-artifacts-test-images

      - name: Package Helm chart
        run: |
          # Retry dependency preparation, then generate artifacts once.
          nix build --no-link .#build-artifacts-helm || nix build --no-link .#build-artifacts-helm
          nix run .#build-artifacts-helm

      - name: Upload integration inputs
        id: upload-integration-inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-tmachine-inputs
          path: artifacts
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
