name: Build Linux VM Driver

on:
  workflow_call:
    inputs:
      cargo-version:
        required: true
        type: string
      supervisor-image-tag:
        required: false
        type: string
        default: ""
      checkout-ref:
        required: false
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: openshell-driver-vm (${{ matrix.triple }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - arch: aarch64
            triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs['checkout-ref'] || github.sha }}

      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: ./.github/actions/build-vm-driver
        with:
          arch: ${{ matrix.arch }}
          triple: ${{ matrix.triple }}
          supervisor-artifact: openshell-supervisor-${{ matrix.arch }}-unknown-linux-gnu
          cargo-version: ${{ inputs['cargo-version'] }}
          supervisor-image-tag: ${{ inputs['supervisor-image-tag'] }}
