name: Build Binaries

on:
  workflow_call:
    inputs:
      cargo-version:
        required: true
        type: string
      supervisor-image-tag:
        required: false
        type: string
        default: ""
      checkout-ref:
        required: false
        type: string
        default: ""
      linux:
        description: Build the Linux binaries.
        required: false
        type: boolean
        default: true
      macos:
        description: Build the macOS binaries.
        required: false
        type: boolean
        default: true
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

permissions:
  contents: read

env:
  EXTRA_CARGO_FLAGS: ""

jobs:
  cli:
    name: openshell (${{ matrix.triple }})
    if: inputs.linux
    env:
      PACKAGE: openshell-cli
      BINARY: openshell
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-musl
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps: &build_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/build-rust-binary
        with:
          package: ${{ env.PACKAGE }}
          binary: ${{ env.BINARY }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ inputs.cargo-version }}
          supervisor-image-tag: ${{ inputs.supervisor-image-tag }}
          extra-cargo-flags: ${{ env.EXTRA_CARGO_FLAGS }}

  prover:
    name: openshell-prover (${{ matrix.triple }})
    if: inputs.linux
    env:
      PACKAGE: openshell-prover-cli
      BINARY: openshell-prover
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-musl
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps: *build_steps

  gateway:
    name: openshell-gateway (${{ matrix.triple }})
    if: inputs.linux
    env:
      PACKAGE: openshell-gateway
      BINARY: openshell-gateway
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps: *build_steps

  runtimes:
    name: ${{ matrix.binary }} (${{ matrix.triple }})
    if: inputs.linux
    env:
      PACKAGE: ${{ matrix.package }}
      BINARY: ${{ matrix.binary }}
    strategy:
      matrix:
        include:
          - package: openshell-sandbox
            binary: openshell-sandbox
            triple: x86_64-unknown-linux-musl
            runner: linux-amd64-cpu8
          - package: openshell-sandbox
            binary: openshell-sandbox
            triple: aarch64-unknown-linux-musl
            runner: linux-arm64-cpu8
          - package: openshell-supervisor
            binary: openshell-supervisor
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - package: openshell-supervisor
            binary: openshell-supervisor
            triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps: *build_steps

  vm-init:
    name: openshell-vm-init (${{ matrix.triple }})
    if: inputs.linux
    env:
      PACKAGE: openshell-driver-vm
      BINARY: openshell-vm-init
      EXTRA_CARGO_FLAGS: --no-default-features
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-musl
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps: *build_steps

  macos:
    name: ${{ matrix.binary }} (${{ matrix.triple }})
    if: inputs.macos
    env:
      PACKAGE: ${{ matrix.package }}
      BINARY: ${{ matrix.binary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: openshell-cli
            binary: openshell
            triple: aarch64-apple-darwin
          - package: openshell-prover-cli
            binary: openshell-prover
            triple: aarch64-apple-darwin
          - package: openshell-gateway
            binary: openshell-gateway
            triple: aarch64-apple-darwin
          - package: openshell-supervisor
            binary: openshell-supervisor
            triple: aarch64-apple-darwin
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    steps: *build_steps
