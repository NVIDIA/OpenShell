name: E2E Label Help

# This trusted workflow only explains the exact-SHA approval step. The PR CI
# dispatcher validates that approval and starts the selected workflow from the
# default branch. No pull request code is checked out or executed here.

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  hint:
    name: Post next-step hint for E2E label
    if: github.event.label.name == 'test:e2e' || github.event.label.name == 'test:e2e-gpu' || github.event.label.name == 'test:e2e-kubernetes'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_NAME: ${{ github.event.label.name }}
        shell: bash
        run: |
          set -euo pipefail

          case "$LABEL_NAME" in
            test:e2e)
              suite_summary="the standard E2E suite"
              status_summary="Its required E2E status will follow that exact run."
              ;;
            test:e2e-gpu)
              suite_summary="the GPU E2E suite"
              status_summary="Its required GPU E2E status will follow that exact run."
              ;;
            test:e2e-kubernetes)
              suite_summary="the optional Kubernetes E2E suites"
              status_summary="These suites do not publish a required status."
              ;;
            *)
              echo "Unrecognized label $LABEL_NAME" >&2
              exit 1
              ;;
          esac

          short_sha=${PR_HEAD_SHA:0:7}
          workflow_url="https://github.com/$GH_REPO/actions/workflows/branch-e2e.yml"
          body="Label \`$LABEL_NAME\` selected $suite_summary for \`$short_sha\`. If a current Write+ approval already exists, the trusted dispatcher will start [Branch E2E Checks]($workflow_url) automatically. Otherwise, a maintainer must comment \`/ok to test $PR_HEAD_SHA\`. $status_summary"

          gh pr comment "$PR_NUMBER" --body "$body"
