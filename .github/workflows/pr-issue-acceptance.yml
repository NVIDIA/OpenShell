name: PR Issue Acceptance

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-issue-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-acceptance:
    name: OpenShell / PR Issue Acceptance
    timeout-minutes: 5
    if: github.repository_owner == 'NVIDIA'
    runs-on: ubuntu-latest
    steps:
      # pull_request_target supplies the trusted default-branch SHA. Load
      # only that helper; PR metadata is data, never executable code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tasks/scripts/check_review_readiness.py
          sparse-checkout-cone-mode: false

      - name: Check PR acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tasks/scripts/check_review_readiness.py \
            --repo "$GH_REPO" --pr "$PR_NUMBER" --acceptance-only \
            --event-path "$GITHUB_EVENT_PATH"
