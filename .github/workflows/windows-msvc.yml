name: Windows MSVC (build-only)
on:
  workflow_dispatch:
jobs:
  x64:
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-x64-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep registry downloads, but let sccache measure compiler reuse
          # without a restored target directory masking its effect.
          shared-key: windows-msvc-x64-sccache-v1
          cache-targets: "false"
          cache-on-failure: "true"
          cache-bin: "false"
      - run: mise run --skip-tools windows:check:x64
      - run: mise run --skip-tools windows:build:x64
      - run: mise run --skip-tools windows:test:x64
      - run: mise run --skip-tools windows:test:unsupported:x64
      - name: sccache stats
        if: always()
        run: sccache --show-stats
  arm64:
    # TODO: provision a windows-arm64 self-hosted runner
    runs-on: [self-hosted, windows-arm64]
    if: false # flip to true once the runner is online
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-arm64-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-msvc-arm64-sccache-v1
          cache-targets: "false"
          cache-on-failure: "true"
          cache-bin: "false"
      - run: mise run --skip-tools windows:check:arm64
      - run: mise run --skip-tools windows:build:arm64
      - name: sccache stats
        if: always()
        run: sccache --show-stats
