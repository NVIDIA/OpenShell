name: Windows MSVC (build-only)

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ github.ref == 'refs/heads/main' || steps.gate.outputs.should_run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: gate
        if: github.ref != 'refs/heads/main'
        uses: ./.github/actions/pr-gate

  pr-check-x64:
    name: PR lint and test (x64)
    needs: pr_metadata
    if: >-
      needs.pr_metadata.outputs.should_run == 'true' &&
      github.ref != 'refs/heads/main' &&
      github.event_name != 'workflow_dispatch'
    runs-on: windows-2025
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-x64-prebuilt-z3-v2
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Keep rust-cache's cargo metadata calls independent of the compiler
          # wrapper; build steps still inherit sccache from the job.
          RUSTC_WRAPPER: ""
        with:
          # Keep the prebuilt-Z3 experiment isolated from earlier target caches.
          shared-key: windows-msvc-x64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Lint
        run: mise run --skip-tools rust:lint
      - name: Test
        run: mise run --skip-tools test:rust
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  cache-seed-x64:
    name: Seed cache (x64)
    needs: pr_metadata
    if: >-
      needs.pr_metadata.outputs.should_run == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-x64-prebuilt-z3-v2
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc-x64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Lint
        run: mise run --skip-tools rust:lint
      - name: Test
        run: mise run --skip-tools test:rust
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build-x64:
    name: Build binaries (x64)
    needs: cache-seed-x64
    runs-on: windows-2025
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-x64-prebuilt-z3-v2
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc-x64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Build release binaries
        run: mise run --skip-tools windows:build:x64
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  arm64:
    # Keep native ARM64 validation opt-in until its runtime and cost are measured.
    needs: pr_metadata
    runs-on: windows-11-arm
    if: vars.ENABLE_WINDOWS_ARM64 == 'true'
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc-arm64-prebuilt-z3-v2
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Keep rust-cache's cargo metadata calls independent of the compiler
          # wrapper; build steps still inherit sccache from the job.
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc-arm64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Check
        run: mise run --skip-tools windows:check:arm64
      - name: Build release binaries
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: mise run --skip-tools windows:build:arm64
      - name: sccache stats
        if: always()
        run: sccache --show-stats
