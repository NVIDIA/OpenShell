name: Windows MSVC (build-only)
on:
  workflow_dispatch:
jobs:
  x64:
    runs-on: windows-2025
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        env:
          # mise exports RUSTC_WRAPPER=sccache, but this workflow intentionally
          # does not install sccache. Keep rust-cache's cargo metadata calls
          # independent of that unavailable wrapper so target artifacts save.
          RUSTC_WRAPPER: ""
        with:
          # Keep the prebuilt-Z3 experiment isolated from earlier target caches.
          shared-key: windows-msvc-x64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - run: mise run --skip-tools windows:check:x64
      - run: mise run --skip-tools windows:build:x64
      - run: mise run --skip-tools windows:test:x64
      - run: mise run --skip-tools windows:test:unsupported:x64
  arm64:
    # TODO: provision a windows-arm64 self-hosted runner
    runs-on: [self-hosted, windows-arm64]
    if: false # flip to true once the runner is online
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-pc-windows-msvc
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        env:
          # Keep rust-cache's cargo metadata calls independent of the
          # unavailable sccache wrapper exported by mise.
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc-arm64-prebuilt-z3-v1
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - run: mise run --skip-tools windows:check:arm64
      - run: mise run --skip-tools windows:build:arm64
