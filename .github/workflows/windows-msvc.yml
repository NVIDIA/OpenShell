name: Windows MSVC

on:
  push:
    branches:
      - windows
      - "pull-request/[0-9]+"
  workflow_dispatch:
    inputs:
      static_runtime:
        description: Build and test static CRT/Z3 packages (may build Z3 from source)
        type: boolean
        default: false
      publish_z3:
        description: Build and publish pinned static Z3 dependency packages only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # sccache cannot cache incremental Rust compilations, and rust-cache removes
  # incremental artifacts before saving the target directory.
  CARGO_INCREMENTAL: "0"
  OPENSHELL_WINDOWS_STATIC_RUNTIME: ${{ inputs.static_runtime && '1' || '0' }}

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ !inputs.publish_z3 && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/windows' || steps.gate.outputs.should_run == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: gate
        if: github.ref != 'refs/heads/windows' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/pr-gate
        with:
          required_label: test:windows

  pr-check:
    name: PR lint and test (${{ matrix.arch }})
    needs: pr_metadata
    if: >-
      needs.pr_metadata.outputs.should_run == 'true' &&
      github.ref != 'refs/heads/windows' &&
      github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc${{ inputs.static_runtime && '-static-v1' || '' }}-${{ matrix.arch }}
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Isolate Rust toolchains
        # rust-cache hashes every installed toolchain, including unused runner defaults.
        run: '"RUSTUP_HOME=$env:RUNNER_TEMP/openshell-rustup" >> $env:GITHUB_ENV'
      - name: Install Rust toolchain
        # GitHub-hosted runners include rustup. With no toolchain argument,
        # rustup installs the checked-in rust-toolchain.toml configuration:
        # https://github.com/dtolnay/rust-toolchain/issues/133#issuecomment-2610825530
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup component add clippy
          rustup target add ${{ matrix.rust_target }}
      - name: Install cargo-nextest
        run: mise install --locked github:nextest-rs/nextest
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          # Keep rust-cache's cargo metadata calls independent of the compiler
          # wrapper; build steps still inherit sccache from the job.
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc${{ inputs.static_runtime && '-static-v3' || '' }}-${{ matrix.arch }}
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Lint Windows-supported crates
        run: mise run --skip-tools windows:lint:${{ matrix.arch }}
      - name: Test
        run: mise run --skip-tools windows:test:${{ matrix.arch }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  z3-package:
    name: Package pinned Z3 (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.publish_z3
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate static Z3 package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/z3
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tasks/scripts/windows-msvc.ps1 package-z3 ${{ matrix.rust_target }}
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-z3-${{ matrix.arch }}
          path: ${{ runner.temp }}/z3/windows-z3-packages/*
          compression-level: 0
      - name: Upload dependency build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-z3-build-log-${{ matrix.arch }}
          path: package-z3-${{ matrix.rust_target }}.log

  publish-z3:
    name: Publish pinned Z3 to GHCR
    needs: z3-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-z3-*
          merge-multiple: true
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.0
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish versioned packages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(jq -r .version tasks/windows-z3.json)"
          revision="$(jq -r .packageRevision tasks/windows-z3.json)"
          repository="$(jq -r .repository tasks/windows-z3.json)"
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            archive="z3-${version}-${target}-mt-v${revision}.zip"
            sha256sum --check "${archive}.sha256"
            ref="${repository}:${version}-${target}-mt-v${revision}"
            if oras resolve "$ref" >existing.txt 2>resolve-error.txt; then
              echo "Refusing to replace existing dependency tag: $ref" >&2
              exit 1
            elif ! grep -Eqi 'NAME_UNKNOWN|MANIFEST_UNKNOWN|not found' resolve-error.txt; then
              cat resolve-error.txt >&2
              exit 1
            fi
            oras push "$ref" \
              --artifact-type application/vnd.nvidia.openshell.z3.v1 \
              --annotation org.opencontainers.image.source=https://github.com/NVIDIA/OpenShell \
              --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "org.opencontainers.image.version=${version}" \
              --annotation org.opencontainers.image.licenses=MIT \
              "${archive}:application/zip"
            digest="$(oras resolve "$ref")"
            printf '%s@%s\n' "$ref" "$digest" | tee -a published-z3.txt
            printf '%s  %s\n' "$digest" "$ref" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-z3-pins
          path: |
            published-z3.txt
            *.sha256

  cache-seed:
    name: Seed cache (${{ matrix.arch }})
    # Keep release-branch Windows validation advisory while the lane matures.
    continue-on-error: true
    needs: pr_metadata
    if: >-
      needs.pr_metadata.outputs.should_run == 'true' &&
      (github.ref == 'refs/heads/windows' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc${{ inputs.static_runtime && '-static-v1' || '' }}-${{ matrix.arch }}
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Isolate Rust toolchains
        run: '"RUSTUP_HOME=$env:RUNNER_TEMP/openshell-rustup" >> $env:GITHUB_ENV'
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup component add clippy
          rustup target add ${{ matrix.rust_target }}
      - name: Install cargo-nextest
        run: mise install --locked github:nextest-rs/nextest
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc${{ inputs.static_runtime && '-static-v3' || '' }}-${{ matrix.arch }}
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Lint Windows-supported crates
        # Keep the seed workload identical to the pull-request workload so the
        # windows-branch cache reflects the same lint and test commands.
        run: mise run --skip-tools windows:lint:${{ matrix.arch }}
      - name: Test
        run: mise run --skip-tools windows:test:${{ matrix.arch }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build:
    name: Build binaries (${{ matrix.arch }})
    continue-on-error: true
    needs: cache-seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows-msvc${{ inputs.static_runtime && '-static-v1' || '' }}-${{ matrix.arch }}
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true
      - name: Configure GHA sccache backend
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Isolate Rust toolchains
        run: '"RUSTUP_HOME=$env:RUNNER_TEMP/openshell-rustup" >> $env:GITHUB_ENV'
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add ${{ matrix.rust_target }}
      - name: Cache Rust target and registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTC_WRAPPER: ""
        with:
          shared-key: windows-msvc${{ inputs.static_runtime && '-static-v3' || '' }}-${{ matrix.arch }}
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"
      - name: Build release binaries
        run: mise run --skip-tools windows:build:${{ matrix.arch }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats
