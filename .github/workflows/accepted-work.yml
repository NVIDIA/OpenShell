name: Accepted Work

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issues:
    types: [labeled, unlabeled, assigned, unassigned, deleted, transferred]
  push:
    branches: [main]
    paths:
      - MAINTAINERS.md
      - tasks/scripts/label_accepted_work.py
      - tasks/scripts/check_maintainer_approval.py
      - .github/workflows/accepted-work.yml
  schedule:
    # Refresh permissions and closing links that have no dedicated webhook.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Issue changes and periodic refreshes reconcile all open PRs. Serialize them
# with individual PR events to avoid older decisions overwriting newer ones.
concurrency:
  group: accepted-work
  cancel-in-progress: false

jobs:
  label:
    name: OpenShell / Accepted Work
    if: >-
      github.repository_owner == 'NVIDIA' &&
      (github.event_name != 'issues' ||
       github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'state:accepted')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # All event types use trusted default-branch code and membership.
      - name: Check out accepted-work helper and maintainer list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            MAINTAINERS.md
            tasks/scripts/label_accepted_work.py
            tasks/scripts/check_maintainer_approval.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reconcile accepted-work labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            python3 tasks/scripts/label_accepted_work.py \
              --repo "$GH_REPO" --pr "$PR_NUMBER" --apply
          else
            python3 tasks/scripts/label_accepted_work.py \
              --repo "$GH_REPO" --all-open --apply
          fi
