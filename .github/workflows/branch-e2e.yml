name: Branch E2E Checks

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      run_integration: ${{ steps.labels.outputs.run_core_e2e }}
      run_core_e2e: ${{ steps.labels.outputs.run_core_e2e }}
      run_gpu_e2e: ${{ steps.labels.outputs.run_gpu_e2e }}
      run_kubernetes_ha_e2e: ${{ steps.labels.outputs.run_kubernetes_ha_e2e }}
      run_kubernetes_credential_drivers_e2e: ${{ steps.labels.outputs.run_kubernetes_credential_drivers_e2e }}
      run_any_e2e: ${{ steps.labels.outputs.run_any_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/pr-gate
      - id: labels
        if: steps.gate.outputs.should_run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ steps.gate.outputs.labels_json }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              run_core_e2e="$(jq -r 'index("test:e2e") != null' <<< "$LABELS_JSON")"
              run_gpu_e2e="$(jq -r 'index("test:e2e-gpu") != null' <<< "$LABELS_JSON")"
              run_kubernetes_ha_e2e="$(jq -r 'index("test:e2e-kubernetes") != null' <<< "$LABELS_JSON")"
              run_kubernetes_credential_drivers_e2e="$(jq -r 'index("test:e2e-kubernetes") != null' <<< "$LABELS_JSON")"
              ;;
            *)
              run_core_e2e=true
              run_gpu_e2e=true
              run_kubernetes_ha_e2e=false
              run_kubernetes_credential_drivers_e2e=false
              ;;
          esac
          if [ "$run_core_e2e" = "true" ] || [ "$run_gpu_e2e" = "true" ] || [ "$run_kubernetes_ha_e2e" = "true" ] || [ "$run_kubernetes_credential_drivers_e2e" = "true" ]; then
            run_any_e2e=true
          else
            run_any_e2e=false
          fi

          {
            echo "run_core_e2e=$run_core_e2e"
            echo "run_gpu_e2e=$run_gpu_e2e"
            echo "run_kubernetes_ha_e2e=$run_kubernetes_ha_e2e"
            echo "run_kubernetes_credential_drivers_e2e=$run_kubernetes_credential_drivers_e2e"
            echo "run_any_e2e=$run_any_e2e"
          } >> "$GITHUB_OUTPUT"

  version:
    needs: [pr_metadata]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_any_e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          deb_version="$(python3 tasks/scripts/release.py get-version --dev --deb)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --dev --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --dev --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "deb_version=$deb_version"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      cargo-version: ${{ needs.version.outputs.cargo }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-gateway-plain:
    name: openshell-gateway driver-free (${{ matrix.triple }})
    needs: [pr_metadata, version]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/build-rust-binary
        with:
          package: openshell-gateway
          binary: openshell-gateway
          artifact-name: openshell-gateway-plain-${{ matrix.triple }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ needs.version.outputs.cargo }}
          extra-cargo-flags: --no-default-features

  build-external-drivers:
    name: ${{ matrix.binary }} (${{ matrix.triple }})
    needs: [pr_metadata, version]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - package: openshell-driver-docker
            binary: openshell-driver-docker
            triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
          - package: openshell-driver-podman
            binary: openshell-driver-podman
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - package: openshell-driver-kubernetes
            binary: openshell-driver-kubernetes
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/build-rust-binary
        with:
          package: ${{ matrix.package }}
          binary: ${{ matrix.binary }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ needs.version.outputs.cargo }}

  build-vm-driver:
    needs: [pr_metadata, version, build-binaries]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-vm-driver.yml
    with:
      cargo-version: ${{ needs.version.outputs.cargo }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-images:
    needs: [pr_metadata, build-binaries]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_any_e2e == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml

  build-deb:
    name: Build Debian packages
    needs: [pr_metadata, version, build-binaries, build-vm-driver]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deb-package.yml
    with:
      checkout-ref: ${{ github.sha }}
      deb-version: ${{ needs.version.outputs.deb_version }}

  build-rpm:
    name: Build RPM packages
    needs: [pr_metadata, version, build-binaries]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/rpm-package.yml
    with:
      checkout-ref: ${{ github.sha }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}
      cargo-version: ${{ needs.version.outputs.cargo }}

  prepare-integration:
    needs: [pr_metadata, build-binaries, build-images, build-deb, build-rpm]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/prepare-integration-inputs.yml
    with:
      deb-artifact-name: deb-linux-amd64
      rpm-artifact-name: rpm-linux-x86_64

  conformance:
    needs: [pr_metadata, prepare-integration, build-gateway-plain, build-external-drivers, build-vm-driver]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-conformance.yml
    with:
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      image-tag: ${{ github.sha }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}

  features:
    needs: [pr_metadata, prepare-integration]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-features.yml
    with:
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      image-tag: ${{ github.sha }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}

  drivers:
    needs: [pr_metadata, prepare-integration, build-gateway-plain, build-external-drivers, build-vm-driver]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-drivers.yml
    with:
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      image-tag: ${{ github.sha }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}

  gpu-conformance:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_gpu_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-conformance.yml
    with:
      profile: gpu
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  gpu-drivers:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_gpu_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-drivers.yml
    with:
      profile: gpu
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  kubernetes-ha-conformance:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_kubernetes_ha_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-conformance.yml
    with:
      profile: kubernetes-ha
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  kubernetes-ha-drivers:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_kubernetes_ha_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-drivers.yml
    with:
      profile: kubernetes-ha
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  kubernetes-credentials-conformance:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_kubernetes_credential_drivers_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-conformance.yml
    with:
      profile: kubernetes-credentials
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  kubernetes-credentials-drivers:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.run_kubernetes_credential_drivers_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-drivers.yml
    with:
      profile: kubernetes-credentials
      source-sha: ${{ github.sha }}
      image-tag: ${{ github.sha }}

  core-e2e-result:
    name: Core E2E result
    needs: [pr_metadata, conformance, features, drivers]
    if: always() && needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-results
        with:
          results: ${{ toJSON(needs) }}

  gpu-e2e-result:
    name: GPU E2E result
    needs: [pr_metadata, gpu-conformance, gpu-drivers]
    if: always() && needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_gpu_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-results
        with:
          results: ${{ toJSON(needs) }}

  kubernetes-ha-e2e-result:
    name: Kubernetes HA E2E result
    needs: [pr_metadata, kubernetes-ha-conformance, kubernetes-ha-drivers]
    if: always() && needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_kubernetes_ha_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-results
        with:
          results: ${{ toJSON(needs) }}

  kubernetes-credential-drivers-e2e-result:
    name: Kubernetes Credential Drivers E2E result
    needs: [pr_metadata, kubernetes-credentials-conformance, kubernetes-credentials-drivers]
    if: always() && needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_kubernetes_credential_drivers_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-results
        with:
          results: ${{ toJSON(needs) }}
