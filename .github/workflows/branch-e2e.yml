name: Branch E2E Checks

run-name: >-
  ${{ inputs.pr_number != ''
      && format('Branch E2E Checks / PR #{0} / {1} / approval {2} / core {3} / gpu {4} / kubernetes {5}', inputs.pr_number, inputs.head_sha, inputs.approval_comment_id, inputs.run_core_e2e, inputs.run_gpu_e2e, inputs.run_kubernetes_e2e)
      || 'Branch E2E Checks' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number supplied by the trusted PR dispatcher
        required: false
        type: string
        default: ""
      head_sha:
        description: Exact approved pull request head SHA
        required: false
        type: string
        default: ""
      approval_comment_id:
        description: Exact-SHA maintainer approval comment
        required: false
        type: string
        default: ""
      run_core_e2e:
        description: Run the core and integration E2E suites
        required: false
        type: boolean
        default: true
      run_gpu_e2e:
        description: Run the GPU E2E suite
        required: false
        type: boolean
        default: true
      run_kubernetes_e2e:
        description: Run the optional Kubernetes E2E suites
        required: false
        type: boolean
        default: false

permissions: {}

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Authorize PR revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.authorize.outcome == 'success' && steps.context.outcome == 'success' }}
      run_integration: ${{ steps.context.outputs.run_core_e2e }}
      run_core_e2e: ${{ steps.context.outputs.run_core_e2e }}
      run_gpu_e2e: ${{ steps.context.outputs.run_gpu_e2e }}
      run_kubernetes_ha_e2e: ${{ steps.context.outputs.run_kubernetes_e2e }}
      run_kubernetes_credential_drivers_e2e: ${{ steps.context.outputs.run_kubernetes_e2e }}
      run_any_e2e: ${{ steps.context.outputs.run_any_e2e }}
      base_sha: ${{ steps.authorize.outputs.base-sha }}
      checkout_repository: ${{ steps.authorize.outputs.checkout-repository }}
      head_sha: ${{ steps.authorize.outputs.head-sha }}
      checkout_ref: ${{ steps.authorize.outputs.head-sha }}
    steps:
      - id: authorize
        uses: $/.github/actions/authorize-pr-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          approval-comment-id: ${{ inputs.approval_comment_id }}

      - id: context
        env:
          RUN_CORE_E2E: ${{ inputs.run_core_e2e }}
          RUN_GPU_E2E: ${{ inputs.run_gpu_e2e }}
          RUN_KUBERNETES_E2E: ${{ inputs.run_kubernetes_e2e }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$RUN_CORE_E2E" "$RUN_GPU_E2E" "$RUN_KUBERNETES_E2E"; do
            [ "$value" = true ] || [ "$value" = false ] || {
              echo "Invalid E2E selection" >&2
              exit 1
            }
          done
          if [ "$RUN_CORE_E2E" = true ] || [ "$RUN_GPU_E2E" = true ] || [ "$RUN_KUBERNETES_E2E" = true ]; then
            run_any_e2e=true
          else
            run_any_e2e=false
          fi
          {
            echo "run_core_e2e=$RUN_CORE_E2E"
            echo "run_gpu_e2e=$RUN_GPU_E2E"
            echo "run_kubernetes_e2e=$RUN_KUBERNETES_E2E"
            echo "run_any_e2e=$run_any_e2e"
          } >> "$GITHUB_OUTPUT"

  version:
    needs: [pr_metadata]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_any_e2e == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cargo: ${{ steps.version.outputs.cargo }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.checkout_ref }}

      - name: Fetch version tags from the target repository
        env:
          BASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git for-each-ref --format='delete %(refname)' refs/tags | git update-ref --stdin
          git fetch --force --no-recurse-submodules "$BASE_REPOSITORY_URL" \
            '+refs/tags/*:refs/tags/*'

      - name: Compute version
        id: version
        run: |
          cargo="$(python3 tasks/scripts/release.py get-version --cargo)"
          deb_version="$(python3 tasks/scripts/release.py get-version --dev --deb)"
          rpm_version="$(python3 tasks/scripts/release.py get-version --dev --rpm-version)"
          rpm_release="$(python3 tasks/scripts/release.py get-version --dev --rpm-release)"
          {
            echo "cargo=$cargo"
            echo "deb_version=$deb_version"
            echo "rpm_version=$rpm_version"
            echo "rpm_release=$rpm_release"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: [pr_metadata, version]
    permissions:
      contents: read
    uses: $/.github/workflows/build-binaries.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      cargo-version: ${{ needs.version.outputs.cargo }}

  build-gateway-plain:
    name: openshell-gateway driver-free (${{ matrix.triple }})
    needs: [pr_metadata, version]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"
      - uses: $/.github/actions/build-rust-binary
        with:
          package: openshell-gateway
          binary: openshell-gateway
          artifact-name: openshell-gateway-plain-${{ matrix.triple }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ needs.version.outputs.cargo }}
          extra-cargo-flags: --no-default-features

  build-external-drivers:
    name: ${{ matrix.binary }} (${{ matrix.triple }})
    needs: [pr_metadata, version]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - package: openshell-driver-docker
            binary: openshell-driver-docker
            triple: aarch64-unknown-linux-gnu
            runner: linux-arm64-cpu8
          - package: openshell-driver-podman
            binary: openshell-driver-podman
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
          - package: openshell-driver-kubernetes
            binary: openshell-driver-kubernetes
            triple: x86_64-unknown-linux-gnu
            runner: linux-amd64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"
      - uses: $/.github/actions/build-rust-binary
        with:
          package: ${{ matrix.package }}
          binary: ${{ matrix.binary }}
          triple: ${{ matrix.triple }}
          cargo-version: ${{ needs.version.outputs.cargo }}

  build-vm-driver:
    needs: [pr_metadata, version, build-binaries]
    if: needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/build-vm-driver.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      cargo-version: ${{ needs.version.outputs.cargo }}

  build-images:
    needs: [pr_metadata, build-binaries]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_any_e2e == 'true'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/build-images.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      push-images: false

  build-deb:
    name: Build Debian packages
    needs: [pr_metadata, version, build-binaries, build-vm-driver]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/deb-package.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      deb-version: ${{ needs.version.outputs.deb_version }}

  build-rpm:
    name: Build RPM packages
    needs: [pr_metadata, version, build-binaries]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      actions: read
      contents: read
    uses: $/.github/workflows/rpm-package.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      rpm-version: ${{ needs.version.outputs.rpm_version }}
      rpm-release: ${{ needs.version.outputs.rpm_release }}
      cargo-version: ${{ needs.version.outputs.cargo }}

  prepare-integration:
    needs: [pr_metadata, build-binaries, build-images, build-deb, build-rpm]
    if: needs.pr_metadata.outputs.run_integration == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/prepare-integration-inputs.yml
    with:
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      source-sha: ${{ needs.pr_metadata.outputs.head_sha }}
      use-image-artifacts: true
      deb-artifact-name: deb-linux-amd64
      rpm-artifact-name: rpm-linux-x86_64

  # Run driver-independent conformance tests.
  conformance-integration:
    needs: [pr_metadata, prepare-integration]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/integration-runner.yml
    with:
      category: conformance
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}
      test-matrix: >-
        [
          {"environment":"ubuntu-docker-rootful","installer":"deb","testsuite":"conformance"},
          {"environment":"ubuntu-k3s","installer":"k3s","testsuite":"conformance"},
          {"environment":"ubuntu-k3s","installer":"k3s-ha","testsuite":"conformance"},
          {"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"conformance"},
          {"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"conformance"}
        ]

  # Run feature-specific integration tests:
  feature-specific-integration:
    needs: [pr_metadata, prepare-integration]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/integration-runner.yml
    with:
      category: feature-specific
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}
      test-matrix: >-
        [
          {"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"provider-refresh"},
          {"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"provider-refresh"},
          {"environment":"ubuntu-docker-rootful","installer":"deb","testsuite":"oci-image"},
          {"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"oci-image"},
          {"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"oci-image"}
        ]

  # Run driver-specific integration tests:
  # These suites require the binary installer's CLI path, local HTTP gateway,
  # and system service configuration for their Podman user-namespace fixtures.
  driver-specific-integration:
    needs: [pr_metadata, prepare-integration]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/integration-runner.yml
    with:
      category: driver-specific
      source-sha: ${{ needs.prepare-integration.outputs.source_sha }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      integration-inputs-artifact-id: ${{ needs.prepare-integration.outputs.integration_inputs_artifact_id }}
      test-matrix: >-
        [
          {"environment":"fedora-podman-rootful","installer":"binaries","testsuite":"driver-podman"},
          {"environment":"fedora-podman-rootless","installer":"binaries","testsuite":"e2e-podman"},
          {"environment":"fedora-podman-rootless","installer":"binaries","testsuite":"driver-podman"}
        ]

  docker-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-docker-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      runner: linux-arm64-cpu8

  podman-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-podman-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      suite-matrix: >-
        [{"suite":"ci","runner":"ubuntu-26.04","podman_major":"5","podman_package_version":"5.7.0+ds2-3build1","conmon_package_version":"2.1.13+ds1-2","cmd":"mise run --no-deps --skip-deps e2e:podman:ci"}]

  vm-e2e:
    needs: [pr_metadata, build-binaries, build-vm-driver]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}

  docker-external-driver-e2e:
    needs: [pr_metadata, build-binaries, build-gateway-plain, build-external-drivers, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-docker-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      runner: linux-arm64-cpu8
      gateway-artifact: openshell-gateway-plain-aarch64-unknown-linux-gnu
      external-driver-binary: openshell-driver-docker
      suite-matrix: >-
        [{"suite":"external-driver","cmd":"mise run --no-deps --skip-deps e2e:docker:external-driver","apt_packages":"openssh-client","python_proto":false,"mcp":false}]

  podman-external-driver-e2e:
    needs: [pr_metadata, build-binaries, build-gateway-plain, build-external-drivers, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-podman-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      external-driver-binary: openshell-driver-podman
      suite-matrix: >-
        [{"suite":"external-driver","runner":"ubuntu-26.04","podman_major":"5","podman_package_version":"5.7.0+ds2-3build1","conmon_package_version":"2.1.13+ds1-2","cmd":"mise run --no-deps --skip-deps e2e:podman:external-driver"}]

  vm-external-driver-e2e:
    needs: [pr_metadata, build-binaries, build-gateway-plain, build-vm-driver]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      suite-name: external-driver
      e2e-task: e2e:vm:external-driver

  gpu-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_gpu_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-gpu-test.yaml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true

  kubernetes-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent_sandbox_api: v1beta1
            agent_sandbox_version: v1.0.3
          - agent_sandbox_api: v1alpha1
            agent_sandbox_version: v0.4.6
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes E2E (Rust smoke, Agent Sandbox ${{ matrix.agent_sandbox_api }})
      agent-sandbox-version: ${{ matrix.agent_sandbox_version }}

  kubernetes-workspace-managed-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes E2E (workspace managed mode)
      e2e-task: e2e:kubernetes:workspace-managed

  kubernetes-external-driver-e2e:
    needs: [pr_metadata, build-binaries, build-gateway-plain, build-external-drivers, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes E2E (external compute driver)
      e2e-task: e2e:kubernetes:external-driver
      gateway-artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
      external-driver-binary: openshell-driver-kubernetes
      cluster-images: sandbox supervisor

  kubernetes-workspace-operator-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_core_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes E2E (workspace operator mode)
      e2e-task: e2e:kubernetes:workspace-operator

  kubernetes-ha-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_kubernetes_ha_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes HA E2E (Rust smoke)
      extra-helm-values: deploy/helm/openshell/ci/values-high-availability.yaml
      external-postgres-secret: openshell-ha-pg
      test-name: kubernetes_ha_rebalancing
      kubernetes-features: e2e,e2e-host-gateway,e2e-kubernetes,e2e-kubernetes-ha
      use-envoy-gateway: true

  kubernetes-credential-drivers-e2e:
    needs: [pr_metadata, build-binaries, build-images]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.pr_metadata.outputs.run_kubernetes_credential_drivers_e2e == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/e2e-kubernetes-test.yml
    with:
      image-tag: ${{ needs.pr_metadata.outputs.head_sha }}
      checkout-ref: ${{ needs.pr_metadata.outputs.checkout_ref }}
      checkout-repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      use-image-artifacts: true
      job-name: Kubernetes Credential Drivers E2E
      e2e-task: e2e:kubernetes:credential-drivers

  core-e2e-result:
    name: Core E2E result
    needs:
      - pr_metadata
      - conformance-integration
      - feature-specific-integration
      - driver-specific-integration
      - docker-e2e
      - podman-e2e
      - vm-e2e
      - docker-external-driver-e2e
      - podman-external-driver-e2e
      - vm-external-driver-e2e
      - kubernetes-e2e
