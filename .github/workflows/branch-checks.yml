name: Branch Checks

run-name: >-
  ${{ inputs.merge_group_sha != ''
      && format('Branch Checks / merge group / PR #{0} / {1} / head {2} / approval {3}', inputs.pr_number, inputs.merge_group_sha, inputs.head_sha, inputs.approval_comment_id)
      || inputs.pr_number != ''
      && format('Branch Checks / PR #{0} / {1} / approval {2}', inputs.pr_number, inputs.head_sha, inputs.approval_comment_id)
      || 'Branch Checks' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number supplied by the trusted PR dispatcher
        required: false
        type: string
        default: ""
      head_sha:
        description: Exact approved pull request head SHA
        required: false
        type: string
        default: ""
      approval_comment_id:
        description: Exact-SHA maintainer approval comment
        required: false
        type: string
        default: ""
      merge_group_sha:
        description: Exact synthetic merge queue SHA from the trusted dispatcher
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.merge_group_sha || inputs.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Authorize PR revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.authorize.outcome == 'success' }}
      base_sha: ${{ steps.authorize.outputs.base-sha }}
      checkout_repository: ${{ steps.authorize.outputs.checkout-repository }}
      head_sha: ${{ steps.authorize.outputs.head-sha }}
      pr_number: ${{ steps.authorize.outputs.pr-number }}
    steps:
      - id: authorize
        uses: $/.github/actions/authorize-pr-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          approval-comment-id: ${{ inputs.approval_comment_id }}
          merge-group-sha: ${{ inputs.merge_group_sha }}

  compatibility-review:
    name: Compatibility Review (advisory)
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/codex-compatibility.yml
    with:
      candidate_ref: ${{ needs.pr_metadata.outputs.head_sha }}
      source_sha: ${{ needs.pr_metadata.outputs.head_sha }}
      candidate_repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
      base_ref: >-
        ${{ needs.pr_metadata.outputs.base_sha
            || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
      pr_number: ${{ fromJSON(needs.pr_metadata.outputs.pr_number) }}
    secrets:
      CODEX_SECURITY_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}

  compatibility-comment:
    name: Comment on detected breaking changes
    needs: [pr_metadata, compatibility-review]
    if: >-
      ${{ !cancelled() && needs.pr_metadata.outputs.pr_number != '0'
          && needs.compatibility-review.outputs.has_findings == 'true'
          && needs.compatibility-review.outputs.report_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download compatibility report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.compatibility-review.outputs.report_artifact }}
          path: compatibility-report

      - name: Post new or materially updated findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.pr_metadata.outputs.pr_number }}
          SOURCE_SHA: ${{ needs.pr_metadata.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('compatibility-report/report.json', 'utf8'));
            if (!report.review?.findings?.some(finding => !finding.previous_report_url)) return;
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) {
              core.notice('Skipping a comment for a closed PR or an outdated head.');
              return;
            }
            const markdown = fs.readFileSync('compatibility-report/comment.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: `${markdown}\n[Branch check run](${runUrl})`,
            });

  protobuf-compatibility:
    name: Protobuf Compatibility
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Fetch target history and canonical tags
        env:
          BASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BASE_SHA: ${{ needs.pr_metadata.outputs.base_sha }}
        run: |
          set -euo pipefail
          git for-each-ref --format='delete %(refname)' refs/tags | git update-ref --stdin
          git -c core.hooksPath=/dev/null fetch --force --no-recurse-submodules \
            "$BASE_REPOSITORY_URL" "$BASE_SHA" '+refs/tags/*:refs/tags/*'

      - uses: $/.github/actions/check-protobuf-compatibility
        with:
          ref: ${{ needs.pr_metadata.outputs.base_sha }}

  mise-lockfile:
    name: mise Lockfile
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify mise.lock is in sync with mise.toml
        run: |
          mise lock
          if ! git diff --exit-code mise.lock; then
            echo "::error::mise.lock is out of sync with mise.toml. Run 'mise lock' locally and commit the result." >&2
            exit 1
          fi

  license-headers:
    name: License Headers
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Install tools
        run: mise install --locked

      - name: Check license headers
        run: mise run license:check

  cargo-deny:
    name: Cargo Deny
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#devShells.x86_64-linux.default -c bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"
          shell-installable: .#devShells.x86_64-linux.default

      - name: Check dependencies
        run: cargo deny check licenses bans sources

  rust-format:
    name: Rust format
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - name: Format
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path e2e/rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path examples/governance-interceptor/Cargo.toml --all -- --check
          cargo fmt --manifest-path examples/supervisor-middleware-content-guard/Cargo.toml --all -- --check
          cargo fmt --manifest-path examples/isolation-backend-v8/Cargo.toml --all -- --check

  cargo-lockfiles:
    name: Cargo lockfiles
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - name: Verify Cargo lockfiles
        shell: nix develop -c bash -euo pipefail {0}
        run: tasks/scripts/check-cargo-lockfiles.sh

  rust-lint:
    name: Rust lint (${{ matrix.system }})
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-amd64-cpu8
            system: x86_64-linux
          - runner: linux-arm64-cpu8
            system: aarch64-linux
          - runner: macos-15-xlarge
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Lint
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path e2e/rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path examples/governance-interceptor/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path examples/supervisor-middleware-content-guard/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path examples/isolation-backend-v8/Cargo.toml --all-targets -- -D warnings

  rust-test:
    name: Rust test (${{ matrix.system }})
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-amd64-cpu8
            system: x86_64-linux
          - runner: linux-arm64-cpu8
            system: aarch64-linux
          - runner: macos-15-xlarge
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "true"

      - name: Test
        shell: nix develop -c bash -euo pipefail {0}
        env:
          OPENSHELL_TELEMETRY_ENABLED: "false"
        run: |
          cargo nextest run --locked --profile ci --workspace --features openshell-server/test-support
          cargo nextest run --locked --config-file .config/nextest.toml --profile ci --manifest-path examples/supervisor-middleware-content-guard/Cargo.toml

  rust-postgres-test:
    name: Rust PostgreSQL tests
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    # Bare runner: the test script starts a disposable PostgreSQL container
    # with the host's Docker.
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Test
        shell: nix develop -c bash -euo pipefail {0}
        env:
          CONTAINER_ENGINE: docker
          OPENSHELL_TELEMETRY_ENABLED: "false"
        run: tasks/scripts/run-postgres-tests.sh --locked --profile ci

  rust-build-modes:
    name: Rust build modes (${{ matrix.system }})
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-amd64-cpu8
            system: x86_64-linux
          - runner: linux-arm64-cpu8
            system: aarch64-linux
          - runner: macos-15-xlarge
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Verify build modes
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo build --locked -p openshell-gateway --bin openshell-gateway
          tasks/scripts/verify-telemetry-compiled-out.sh present target/debug/openshell-gateway
          cargo build --locked -p openshell-gateway --bin openshell-gateway --no-default-features --features defaults-without-telemetry
          tasks/scripts/verify-telemetry-compiled-out.sh absent target/debug/openshell-gateway
          cargo build --locked -p openshell-supervisor --bin openshell-supervisor --no-default-features --features defaults-without-telemetry
          tasks/scripts/verify-telemetry-compiled-out.sh absent target/debug/openshell-supervisor
          cargo check --locked -p openshell-supervisor --all-targets --no-default-features --features system-ca-roots

      - name: Verify system CA roots dependency boundary
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo tree --locked -p openshell-supervisor --prefix none --no-default-features --features system-ca-roots > /tmp/openshell-supervisor-dependencies.txt
          if grep -Eq '^(webpki-roots|webpki-root-certs) v' /tmp/openshell-supervisor-dependencies.txt; then
            echo "ERROR: bundled Mozilla roots found in system CA roots build" >&2
            cat /tmp/openshell-supervisor-dependencies.txt >&2
            exit 1
          fi

      - name: Verify standalone prover dependency boundary
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo tree --locked -p openshell-prover-cli --edges normal --prefix none > /tmp/openshell-prover-dependencies.txt
          if grep -Eq '^(openshell-(cli|server|sdk|bootstrap|tui|providers|core|policy)) v' /tmp/openshell-prover-dependencies.txt; then
            echo "ERROR: standalone prover includes an OpenShell control-plane dependency" >&2
            cat /tmp/openshell-prover-dependencies.txt >&2
            exit 1
          fi

  rust-feature-alias:
    name: Rust feature alias
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Verify defaults-without-telemetry feature alias
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          tasks/scripts/verify-defaults-without-telemetry.sh
          git diff --exit-code HEAD -- ':(glob)**/Cargo.lock'

  rust-gateway-core-features:
    name: Rust gateway core features
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Verify core gateway compute-driver feature sets
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-docker
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-kubernetes
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-podman

  rust-gateway-extended-features:
    name: Rust gateway extended features
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - uses: $/.github/actions/setup-nix
        with:
          prepare-shell: "true"

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "false"

      - name: Verify extended gateway compute-driver feature sets
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-vm
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-mxc
          cargo nextest run --locked --profile ci -p openshell-gateway --all-targets --no-default-features --features compute-driver-docker,compute-driver-vm

  python:
    name: Python (${{ matrix.runner }})
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [linux-amd64-cpu8, linux-arm64-cpu8]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Install tools
        run: mise install --locked

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format
        run: mise run python:format:check

      - name: Lint
        run: mise run python:lint

      - name: Typecheck
        run: mise run python:typecheck

      - name: Test
        run: mise run test:python

      - name: Test local gateway configuration helpers
        run: |
          bash tasks/scripts/test-gateway-pull-policy.sh
          bash tasks/scripts/test-gateway-config.sh

      - name: Test release qualification summary
        run: mise run test:qualification-summary
  go:
    name: Go SDK
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Install tools
        run: mise install --locked

      - name: Lint, build, test, proto-check
        run: mise run go:ci

  markdown:
    name: Markdown
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
