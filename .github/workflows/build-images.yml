name: Build Images

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      checkout-repository:
        description: Repository containing the candidate revision
        required: false
        type: string
        default: ""
      image-tag:
        required: false
        type: string
        default: ""
      push-images:
        description: "Push images to GHCR instead of exporting artifacts only"
        required: false
        type: boolean
        default: false

jobs:
  gateway:
    env:
      COMPONENT: gateway
      BINARY: openshell-gateway
      TARGET_SUFFIX: unknown-linux-gnu
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: &build_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout-repository || github.repository }}
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: $/.github/actions/build-docker-image
        with:
          component: ${{ env.COMPONENT }}
          binary: ${{ env.BINARY }}
          target-suffix: ${{ env.TARGET_SUFFIX }}
          image-tag: ${{ inputs.image-tag || github.sha }}
          github-token: ${{ inputs.push-images && secrets.GITHUB_TOKEN || '' }}
          push-image: ${{ inputs.push-images }}

  sandbox:
    env:
      COMPONENT: sandbox
      BINARY: openshell-sandbox
      TARGET_SUFFIX: unknown-linux-musl
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: *build_steps

  supervisor:
    env:
      COMPONENT: supervisor
      BINARY: openshell-supervisor
      TARGET_SUFFIX: unknown-linux-gnu
    runs-on: linux-amd64-cpu8
    timeout-minutes: 20
    steps: *build_steps
