name: E2E Conformance Tests

on:
  workflow_call:
    inputs:
      profile:
        description: core, release, gpu, kubernetes-ha, or kubernetes-credentials
        required: false
        type: string
        default: core
      source-sha:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      integration-inputs-artifact-id:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  conformance-integration:
    if: inputs.profile == 'core' || inputs.profile == 'release'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: conformance
      source-sha: ${{ inputs.source-sha }}
      integration-inputs-artifact-id: ${{ inputs.integration-inputs-artifact-id }}
      test-matrix: >-
        [
          {"environment":"ubuntu-docker-rootful","installer":"deb","testsuite":"conformance"},
          {"environment":"ubuntu-k3s","installer":"k3s","testsuite":"conformance"},
          {"environment":"ubuntu-k3s","installer":"k3s-ha","testsuite":"conformance"},
          {"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"conformance"},
          {"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"conformance"}
        ]

  docker:
    name: Docker (${{ matrix.variant }})
    if: inputs.profile == 'core' || inputs.profile == 'release'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.profile == 'core' && '[
            {"variant":"regular","gateway_artifact":"","external_driver_binary":"","suites":[{"suite":"conformance","cmd":"mise run --no-deps --skip-deps e2e:rust","apt_packages":"openssh-client","python_proto":false,"mcp":false}]},
            {"variant":"external","gateway_artifact":"openshell-gateway-plain-aarch64-unknown-linux-gnu","external_driver_binary":"openshell-driver-docker","suites":[{"suite":"external-driver","cmd":"mise run --no-deps --skip-deps e2e:docker:external-driver","apt_packages":"openssh-client","python_proto":false,"mcp":false}]}
          ]' ||
          '[
            {"variant":"regular","gateway_artifact":"","external_driver_binary":"","suites":[{"suite":"conformance","cmd":"mise run --no-deps --skip-deps e2e:rust","apt_packages":"openssh-client","python_proto":false,"mcp":false}]}
          ]') }}
    uses: ./.github/workflows/e2e-docker-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: conformance
      image-tag: ${{ inputs.image-tag }}
      runner: linux-arm64-cpu8
      gateway-artifact: ${{ matrix.gateway_artifact }}
      external-driver-binary: ${{ matrix.external_driver_binary }}
      suite-matrix: ${{ toJSON(matrix.suites) }}

  podman:
    name: Podman (${{ matrix.variant }})
    if: inputs.profile == 'core'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            gateway_artifact: ''
            external_driver_binary: ''
            suites:
              - suite: ci
                runner: ubuntu-26.04
                podman_major: '5'
                podman_package_version: 5.7.0+ds2-3build1
                conmon_package_version: 2.1.13+ds1-2
                cmd: mise run --no-deps --skip-deps e2e:podman:ci
          - variant: external
            gateway_artifact: openshell-gateway-plain-x86_64-unknown-linux-gnu
            external_driver_binary: openshell-driver-podman
            suites:
              - suite: external-driver
                runner: ubuntu-26.04
                podman_major: '5'
                podman_package_version: 5.7.0+ds2-3build1
                conmon_package_version: 2.1.13+ds1-2
                cmd: mise run --no-deps --skip-deps e2e:podman:external-driver
    uses: ./.github/workflows/e2e-podman-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: conformance
      image-tag: ${{ inputs.image-tag }}
      gateway-artifact: ${{ matrix.gateway_artifact }}
      external-driver-binary: ${{ matrix.external_driver_binary }}
      suite-matrix: ${{ toJSON(matrix.suites) }}

  vm:
    name: VM (${{ matrix.variant }})
    if: inputs.profile == 'core' || inputs.profile == 'release'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.profile == 'core' && '[
            {"variant":"regular","gateway_artifact":"","suite_name":"managed","e2e_task":"e2e:vm"},
            {"variant":"external","gateway_artifact":"openshell-gateway-plain-x86_64-unknown-linux-gnu","suite_name":"external-driver","e2e_task":"e2e:vm:external-driver"}
          ]' ||
          '[
            {"variant":"regular","gateway_artifact":"","suite_name":"managed","e2e_task":"e2e:vm"}
          ]') }}
    uses: ./.github/workflows/e2e-vm-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: conformance
      gateway-artifact: ${{ matrix.gateway_artifact }}
      suite-name: ${{ matrix.suite_name }}
      e2e-task: ${{ matrix.e2e_task }}

  kubernetes:
    name: ${{ matrix.job-name }}
    if: inputs.profile == 'core' || inputs.profile == 'kubernetes-ha' || inputs.profile == 'kubernetes-credentials'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.profile == 'core' && '[
            {"job-name":"Kubernetes E2E (Rust smoke, Agent Sandbox v1beta1)","agent-sandbox-version":"v1.0.3","e2e-task":"e2e:kubernetes","gateway-artifact":"","external-driver-binary":"","cluster-images":"gateway sandbox supervisor","extra-helm-values":"","external-postgres-secret":"","test-name":"","kubernetes-features":"","use-envoy-gateway":false},
            {"job-name":"Kubernetes E2E (Rust smoke, Agent Sandbox v1alpha1)","agent-sandbox-version":"v0.4.6","e2e-task":"e2e:kubernetes","gateway-artifact":"","external-driver-binary":"","cluster-images":"gateway sandbox supervisor","extra-helm-values":"","external-postgres-secret":"","test-name":"","kubernetes-features":"","use-envoy-gateway":false},
            {"job-name":"Kubernetes E2E (workspace managed mode)","e2e-task":"e2e:kubernetes:workspace-managed","agent-sandbox-version":"v1.0.3","gateway-artifact":"","external-driver-binary":"","cluster-images":"gateway sandbox supervisor","extra-helm-values":"","external-postgres-secret":"","test-name":"","kubernetes-features":"","use-envoy-gateway":false},
            {"job-name":"Kubernetes E2E (external compute driver)","e2e-task":"e2e:kubernetes:external-driver","gateway-artifact":"openshell-gateway-plain-x86_64-unknown-linux-gnu","external-driver-binary":"openshell-driver-kubernetes","cluster-images":"sandbox supervisor","agent-sandbox-version":"v1.0.3","extra-helm-values":"","external-postgres-secret":"","test-name":"","kubernetes-features":"","use-envoy-gateway":false}
          ]' ||
          inputs.profile == 'kubernetes-ha' && '[
            {"job-name":"Kubernetes HA E2E (Rust smoke)","extra-helm-values":"deploy/helm/openshell/ci/values-high-availability.yaml","external-postgres-secret":"openshell-ha-pg","test-name":"kubernetes_ha_rebalancing","kubernetes-features":"e2e,e2e-host-gateway,e2e-kubernetes,e2e-kubernetes-ha","use-envoy-gateway":true,"agent-sandbox-version":"v1.0.3","e2e-task":"e2e:kubernetes","gateway-artifact":"","external-driver-binary":"","cluster-images":"gateway sandbox supervisor"}
          ]' ||
          '[
            {"job-name":"Kubernetes Credential Drivers E2E","e2e-task":"e2e:kubernetes:credential-drivers","agent-sandbox-version":"v1.0.3","gateway-artifact":"","external-driver-binary":"","cluster-images":"gateway sandbox supervisor","extra-helm-values":"","external-postgres-secret":"","test-name":"","kubernetes-features":"","use-envoy-gateway":false}
          ]') }}
    uses: ./.github/workflows/e2e-kubernetes-test.yml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: conformance
      image-tag: ${{ inputs.image-tag }}
      job-name: ${{ matrix.job-name }}
      agent-sandbox-version: ${{ matrix.agent-sandbox-version }}
      e2e-task: ${{ matrix.e2e-task }}
      gateway-artifact: ${{ matrix.gateway-artifact }}
      external-driver-binary: ${{ matrix.external-driver-binary }}
      cluster-images: ${{ matrix.cluster-images }}
      extra-helm-values: ${{ matrix.extra-helm-values }}
      external-postgres-secret: ${{ matrix.external-postgres-secret }}
      test-name: ${{ matrix.test-name }}
      kubernetes-features: ${{ matrix.kubernetes-features }}
      use-envoy-gateway: ${{ matrix.use-envoy-gateway }}

  gpu:
    name: GPU
    if: inputs.profile == 'gpu'
    uses: ./.github/workflows/e2e-gpu-test.yaml
    with:
      checkout-ref: ${{ inputs.source-sha }}
      test-family: conformance
      image-tag: ${{ inputs.image-tag }}

  result:
    name: Family result
    if: always()
    needs: [conformance-integration, docker, podman, vm, kubernetes, gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected driver and integration job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            core) expected='["conformance-integration","docker","podman","vm","kubernetes"]' ;;
            release) expected='["docker","vm","conformance-integration"]' ;;
            gpu) expected='["gpu"]' ;;
            kubernetes-ha) expected='["kubernetes"]' ;;
            kubernetes-credentials) expected='["kubernetes"]' ;;
            *) echo "::error::Unknown E2E profile: $PROFILE"; exit 2 ;;
          esac
          jq -e --argjson expected "$expected" '
            . as $results
            | all($expected[]; $results[.].result == "success")
          ' <<< "$JOB_RESULTS"
