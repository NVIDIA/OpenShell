name: Rust Cache

# Branch Checks and Branch E2E never run on main, so this saves the Rust
# caches that PR mirrors and merge groups restore. Keep each job's env and
# build commands aligned with the job that restores its cache, so the cache
# keys and contents match.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let runs finish so frequent merges cannot keep cancelling the save.
  cancel-in-progress: false

jobs:
  rust-checks:
    name: Rust checks cache (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-amd64-cpu8
            system: x86_64-linux
          - runner: linux-arm64-cpu8
            system: aarch64-linux
          - runner: macos-15-xlarge
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-checks-v2
          save-cache: "true"

      - name: Build tests
        if: steps.rust.outputs.cache-hit != 'true'
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          cargo test --locked -p openshell-crypto --no-default-features --test independent_backend --no-run
          cargo nextest run --locked --profile ci --workspace --features openshell-server/test-support --no-run
          cargo nextest run --locked --config-file .config/nextest.toml --profile ci --manifest-path examples/supervisor-middleware-content-guard/Cargo.toml --no-run
          cargo nextest run --locked --config-file .config/nextest.toml --profile ci --manifest-path tests/testkit/Cargo.toml --no-run

  # Restored by build-e2e-bundles in branch-e2e.yml.
  e2e-bundles:
    name: E2E suite bundles cache (x86_64-unknown-linux-musl)
    runs-on: linux-amd64-cpu8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-bundles-v1-x86_64-unknown-linux-musl
          save-cache: "true"

      - name: Build the bundles
        if: steps.rust.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          nix build --no-link .#openshell-test-runner || nix build --no-link .#openshell-test-runner
          for family in features drivers/podman; do
            nix run .#openshell-test-runner -- build \
              --family "$family" --out "$RUNNER_TEMP/e2e-bundles/${family//\//-}"
          done
