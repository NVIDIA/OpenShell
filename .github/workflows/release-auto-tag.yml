name: Release Auto-Tag

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Zurich"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-auto-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-prerelease-tags
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
          python-version: "3.13"
          enable-cache: false

      - name: Determine next pre-release version
        id: version
        run: |
          set -euo pipefail
          next=$(uv run --no-project python tasks/scripts/next-prerelease-tag.py --scheduled)
          if [[ -z "${next}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next tag: $next"

      - name: Create tag
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.next }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${NEXT_TAG}" -f "sha=$(git rev-parse HEAD)"

      - name: Trigger Pre-release workflow
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.next }}
        run: |
          gh workflow run release-prerelease.yml \
            --ref main \
            -f tag="$NEXT_TAG"
