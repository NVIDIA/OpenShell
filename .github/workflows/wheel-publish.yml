name: Publish Wheel

# PyPI Trusted Publishing matches the `job_workflow_ref` claim, which names this
# file for both calls and dispatches. The `openshell` PyPI project trusts
# workflow `wheel-publish.yml` with environment `pypi`.
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      python-version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: Stable tag whose GitHub Release holds the wheel, e.g. v0.1.7
        required: true
        type: string
      source-sha:
        description: Commit the tag points to
        required: true
        type: string
      python-version:
        description: Python package version, e.g. 0.1.7
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Python Wheel to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/openshell/
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish the wheel attached to the GitHub Release rather than a run's
      # build artifact, so a retry or dispatch publishes the same bytes.
      - name: Download and verify the released wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "${RELEASE_TAG} points to ${tag_sha}, not ${SOURCE_SHA}" >&2
            exit 1
          fi
          gh release download "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --pattern '*.whl' --pattern openshell-checksums-sha256.txt --dir release
          shopt -s nullglob
          wheels=(release/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one Python wheel on ${RELEASE_TAG}, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel=$(basename "${wheels[0]}")
          if [[ "${wheel}" != openshell-"${PYTHON_VERSION}"-*.whl ]]; then
            echo "${wheel} is not an openshell ${PYTHON_VERSION} wheel" >&2
            exit 1
          fi
          checksum=$(awk -v wheel="${wheel}" '$2 == wheel { print $1 "  " $2 }' release/openshell-checksums-sha256.txt)
          if [[ -z "${checksum}" ]]; then
            echo "${wheel} is missing from the release checksums" >&2
            exit 1
          fi
          (cd release && sha256sum -c - <<<"${checksum}")
          mkdir dist
          mv "release/${wheel}" dist/

      - name: Publish wheel to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
