name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Workflow run containing the candidate artifacts
        required: false
        type: string
        default: ""
      source-sha:
        description: Candidate source revision; defaults to the artifact run head SHA
        required: false
        type: string
        default: ""
      category:
        description: Integration-test category, used for the job name and concurrency key
        required: true
        type: string
        default: feature-specific
      test-matrix:
        description: JSON array of environment, installer, and testsuite combinations
        required: true
        type: string
        default: >-
          [
            {"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"provider-refresh"},
            {"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"provider-refresh"}
          ]

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    uses: ./.github/workflows/prepare-integration-inputs.yml
    with:
      artifact-run-id: ${{ inputs['artifact-run-id'] }}
      source-sha: ${{ inputs['source-sha'] }}
      deb-artifact-name: ${{ contains(inputs.test-matrix, '"deb"') && 'deb-linux-amd64' || '' }}
      rpm-artifact-name: ${{ contains(inputs.test-matrix, '"rpm"') && 'rpm-linux-x86_64' || '' }}

  integration:
    needs: prepare
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: ${{ inputs.category }}
      source-sha: ${{ needs.prepare.outputs.source_sha }}
      integration-inputs-artifact-id: ${{ needs.prepare.outputs.integration_inputs_artifact_id }}
      test-matrix: ${{ inputs.test-matrix }}
