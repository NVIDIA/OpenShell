name: Issue Intake Labels

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label-new-issue:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NVIDIA'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply intake labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_intake.py
