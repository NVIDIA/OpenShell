name: Snap Package

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      upload-channel:
        required: true
        type: string
        description: "Snap Store channel to upload to (e.g., latest/edge, latest/candidate, latest/stable)"
      github-environment:
        required: true
        type: string
        description: "GitHub deployment environment for approval gates (e.g., latest/edge, latest/stable)"
    secrets:
      publish-credentials:
        required: true
        description: "Snap Store credentials (SNAPCRAFT_STORE_CREDENTIALS)"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-snap:
    name: Build Snap
    uses: ./.github/workflows/snap-build.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  publish-snap:
    name: Publish Snap (Linux ${{ matrix.arch }})
    needs: [build-snap]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: linux-amd64-cpu8
          - arch: arm64
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Install snapd
        run: |
          set -euo pipefail
          if ! command -v snapd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y snapd
          fi
          sudo systemctl enable --now snapd.socket
          sudo systemctl start snapd
          sudo snap wait system seed.loaded

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Download snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap-linux-${{ matrix.arch }}
          path: release/

      - name: Upload snap to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.publish-credentials }}
        run: |
          set -euo pipefail
          snap_file=$(find release -maxdepth 1 -name '*.snap' -print -quit)
          test -n "$snap_file"
          snap_name="${snap_file##*/}"
          snap_name="${snap_name%.snap}"
          snap_name="${snap_name%%_*}"

          component_args=()
          shopt -s nullglob
          for component in release/"${snap_name}"+*.comp; do
            component_args+=(--component "$component")
          done

          snapcraft upload --release "${{ inputs.upload-channel }}" "$snap_file" "${component_args[@]}"
