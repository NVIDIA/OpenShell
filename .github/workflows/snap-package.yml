name: Snap Package

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      upload-channel:
        required: false
        type: string
        default: ""
        description: "Snap Store channel to upload to (e.g., latest/edge, latest/candidate, latest/stable)"

    secrets:
      publish-credentials:
        required: false
        description: "Snap Store credentials (SNAPCRAFT_STORE_CREDENTIALS)"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-snap:
    name: Build Snap (Linux ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            rust_arch: x86_64
            runner: linux-amd64-cpu8
          - arch: arm64
            rust_arch: aarch64
            runner: linux-arm64-cpu8
    uses: ./.github/workflows/build-snap.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      cli-artifact-name: openshell-${{ matrix.rust_arch }}-unknown-linux-musl
      gateway-artifact-name: openshell-gateway-${{ matrix.rust_arch }}-unknown-linux-gnu
      supervisor-artifact-name: openshell-sandbox-${{ matrix.rust_arch }}-unknown-linux-musl
      upload-channel: ${{ inputs.upload-channel }}
    secrets:
      publish-credentials: ${{ secrets.publish-credentials }}
