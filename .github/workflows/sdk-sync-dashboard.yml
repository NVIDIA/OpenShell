name: SDK Sync Dashboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: sdk-proto-sync
  cancel-in-progress: true

jobs:
  load_config:
    name: Load SDK configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: config
        run: |
          MATRIX=$(jq -e -c '
            if (.include | type == "array" and length > 0 and all(.[];
              type == "object" and
              (.name | type == "string") and
              (.display_name | type == "string") and
              (.bindings_committed | type == "boolean") and
              (.no_file_tracking_hint == null or (.no_file_tracking_hint | type == "string")) and
              (.generated_bindings_status | type == "string") and
              (.label | type == "string") and
              (.drift_task | type == "string") and
              (.build_check_task | type == "string") and
              (.proto_task | type == "string") and
              (.build_task | type == "string") and
              (.test_task | type == "string") and
              (.source_dirs | type == "array" and all(.[]; type == "string"))
            )) then .include else error("invalid SDK sync configuration") end
          ' tasks/sdk-sync-config.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sdk_sync_check:
    name: Sync Check (${{ matrix.sdk.name }})
    needs: load_config
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    container:
      # Keep this workflow reproducible; update the digest deliberately when the CI image changes.
      image: ghcr.io/nvidia/openshell/ci:5b9daab9351b1e053f9a5e0ce4c899f5d3f674b0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.load_config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: mise install --locked
      - name: Check proto drift and build
        env:
          SDK_NAME: ${{ matrix.sdk.name }}
          DRIFT_TASK: ${{ matrix.sdk.drift_task }}
          BUILD_CHECK_TASK: ${{ matrix.sdk.build_check_task }}
        run: |
          mkdir -p report
          DRIFT_STATUS=0
          mise run "$DRIFT_TASK" > report/drift.json 2> report/drift.stderr || DRIFT_STATUS=$?
          if ! jq -e 'type == "object" and has("synced") and (.synced | type == "boolean") and (has("error") | not)' report/drift.json >/dev/null 2>&1; then
            jq -n --arg sdk "$SDK_NAME" '{sdk:$sdk, has_drift:"error", build_failed:"false"}' > report/status.json
            exit 0
          fi
          SYNCED=$(jq -r '.synced' report/drift.json)
          if { [ "$DRIFT_STATUS" -eq 0 ] && [ "$SYNCED" = "true" ]; } || \
             { [ "$DRIFT_STATUS" -eq 1 ] && [ "$SYNCED" = "false" ]; }; then
            :
          else
            jq -n --arg sdk "$SDK_NAME" '{sdk:$sdk, has_drift:"error", build_failed:"false"}' > report/status.json
            exit 0
          fi
          if [ "$SYNCED" = "true" ]; then
            jq -n --arg sdk "$SDK_NAME" '{sdk:$sdk, has_drift:"false", build_failed:"false"}' > report/status.json
            exit 0
          fi
          if mise run "$BUILD_CHECK_TASK" > report/build.json 2> report/build.stderr; then
            BUILD_FAILED=false
          else
            BUILD_FAILED=true
          fi
          jq -n --arg sdk "$SDK_NAME" --arg build_failed "$BUILD_FAILED" \
            '{sdk:$sdk, has_drift:"true", build_failed:$build_failed}' > report/status.json
      - name: Upload SDK report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-sync-${{ matrix.sdk.name }}
          path: report/
          if-no-files-found: error
          retention-days: 1

  issue_management:
    name: Manage Drift Issue (${{ matrix.sdk.name }})
    needs: [load_config, sdk_sync_check]
    if: always() && needs.load_config.result == 'success'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      packages: read
    container:
      # Keep this workflow reproducible; update the digest deliberately when the CI image changes.
      image: ghcr.io/nvidia/openshell/ci:5b9daab9351b1e053f9a5e0ce4c899f5d3f674b0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.load_config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-sync-${{ matrix.sdk.name }}
          path: report
      - name: Read SDK status
        id: status
        run: |
          echo "has_drift=$(jq -r '.has_drift' report/status.json)" >> "$GITHUB_OUTPUT"
          echo "build_failed=$(jq -r '.build_failed' report/status.json)" >> "$GITHUB_OUTPUT"
      - name: Warn on drift detection error
        if: steps.status.outputs.has_drift == 'error'
        env:
          SDK_NAME: ${{ matrix.sdk.name }}
        run: |
          echo "::error::Drift detection failed for $SDK_NAME SDK"
          cat report/drift.stderr
          exit 1
      - name: Install tools
        if: steps.status.outputs.has_drift == 'true'
        run: mise install --locked
      - name: Create or update drift issue
        if: steps.status.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_NAME: ${{ matrix.sdk.name }}
          SDK_LABEL: ${{ matrix.sdk.label }}
        run: |
          set +e
          RESULT=$(uv run python tasks/scripts/sdk_sync.py manage-issue \
            --drift-report "$(cat report/drift.json)" \
            --build-report "$(cat report/build.json)" \
            --sdk "$SDK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --label "$SDK_LABEL")
          STATUS=$?
          set -e
          if ! printf '%s\n' "$RESULT" | jq .; then
            printf '%s\n' "$RESULT"
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Issue management command failed with exit code $STATUS"
            exit "$STATUS"
          fi
          if ! ACTION=$(printf '%s\n' "$RESULT" | jq -er '.action // "unknown"'); then
            ACTION=unknown
          fi
          if [ "$ACTION" != "created" ] && [ "$ACTION" != "updated" ]; then
            echo "::error::Issue management for $SDK_NAME failed: $ACTION"
            exit 1
          fi
      - name: Close resolved drift issue
        if: steps.status.outputs.has_drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_LABEL: ${{ matrix.sdk.label }}
        run: |
          ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$SDK_LABEL" --state open --limit 101 --json number --jq '.[].number')
          ISSUE_COUNT=$(printf '%s\n' "$ISSUES" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$ISSUE_COUNT" -ge 101 ]; then
            echo "::error::Issue list for $SDK_LABEL reached the 101-result limit; refusing to close issues"
            exit 1
          fi
          while IFS= read -r ISSUE; do
            [ -z "$ISSUE" ] && continue
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "The SDK proto drift check passed. Closing automatically."
            echo "Closed issue #$ISSUE"
          done <<< "$ISSUES"
