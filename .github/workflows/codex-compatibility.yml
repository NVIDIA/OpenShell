name: Codex Compatibility Review

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Candidate or stable 0.x release tag, or branch source SHA
        required: true
        type: string
      source_sha:
        description: Expected candidate commit from branch checks or release qualification
        required: true
        type: string
      base_ref:
        description: Target branch ref or SHA; empty for tagged release qualification
        required: false
        default: ""
        type: string
      pr_number:
        description: Mirrored PR whose discussion to review; zero for other events
        required: false
        default: 0
        type: number
    outputs:
      has_findings:
        description: Whether the reviewer reported new or materially updated breaking changes
        value: ${{ jobs.review.outputs.has_findings }}
      report_artifact:
        description: Uploaded report artifact ID, or empty if unavailable
        value: ${{ jobs.review.outputs.report_artifact }}
    secrets:
      CODEX_SECURITY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate or stable 0.x release tag to review (no publication)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-release-review
  cancel-in-progress: false
  queue: max

jobs:
  review:
    name: Compatibility review (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    outputs:
      has_findings: ${{ steps.review.outputs.has_findings }}
      report_artifact: ${{ steps.report.outputs.artifact-id }}
    steps:
      - name: Check out review tooling and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the tooling and workflow argument interface at the same revision.
          ref: ${{ github.workflow_sha }}
          path: review-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch branch source commit
        if: inputs.base_ref != ''
        working-directory: review-tools
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: git -c core.hooksPath=/dev/null fetch --no-tags origin "$SOURCE_SHA"

      - name: Set up Nix
        uses: ./review-tools/.github/actions/setup-nix
        with:
          prepare-shell: "true"
          shell-installable: ./review-tools

      # Ubuntu's AppArmor restriction otherwise prevents the Codex Linux sandbox
      # from creating its network namespace. The read-only sandbox stays enabled.
      - name: Allow sandbox user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Review compatibility
        id: review
        working-directory: review-tools
        shell: nix develop --no-write-lock-file -c bash -euo pipefail {0}
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOURCE_SHA: ${{ inputs.source_sha || '' }}
          BASE_REF: ${{ inputs.base_ref || '' }}
          PR_NUMBER: ${{ inputs.pr_number || 0 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
        run: |
          uv run --no-project --with openai-codex==0.160.0 \
            python tasks/scripts/codex_compatibility.py "$CANDIDATE_REF" \
            --source-sha "$SOURCE_SHA" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --output-dir "$RUNNER_TEMP/compatibility-report"

      - name: Summarize advisory review
        if: ${{ !cancelled() }}
        env:
          REVIEW_STATUS: ${{ steps.review.outputs.status || 'error' }}
        run: |
          report="$RUNNER_TEMP/compatibility-report/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Compatibility review (advisory)' >> "$GITHUB_STEP_SUMMARY"
            echo 'Review could not run. No compatibility assessment is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$REVIEW_STATUS" != complete ]; then
            echo '::warning::Compatibility review is incomplete or unavailable; publication gates are unchanged.'
          fi

      - name: Retain compatibility report
        if: ${{ !cancelled() }}
        id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-review-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compatibility-report/report.json
            ${{ runner.temp }}/compatibility-report/report.md
            ${{ runner.temp }}/compatibility-report/comment.md
          retention-days: 90
          if-no-files-found: warn

      - name: Link retained report
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: echo "[Download compatibility report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
