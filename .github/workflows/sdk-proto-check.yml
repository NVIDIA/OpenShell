name: SDK Proto Check

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: gate
        uses: ./.github/actions/pr-gate

      - id: config
        name: Load SDK configuration
        run: |
          MATRIX=$(jq -e -c '
            if (.include | type == "array" and length > 0 and all(.[];
              type == "object" and
              (.name | type == "string") and
              (.display_name | type == "string") and
              (.bindings_committed | type == "boolean") and
              (.no_file_tracking_hint == null or (.no_file_tracking_hint | type == "string")) and
              (.generated_bindings_status | type == "string") and
              (.label | type == "string") and
              (.drift_task | type == "string") and
              (.build_check_task | type == "string") and
              (.proto_task | type == "string") and
              (.build_task | type == "string") and
              (.test_task | type == "string") and
              (.source_dirs | type == "array" and all(.[]; type == "string"))
            )) then .include else error("invalid SDK sync configuration") end
          ' tasks/sdk-sync-config.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sdk_proto_drift:
    name: Proto Drift (${{ matrix.sdk.name }})
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    container:
      # Keep this workflow reproducible; update the digest deliberately when the CI image changes.
      image: ghcr.io/nvidia/openshell/ci:5b9daab9351b1e053f9a5e0ce4c899f5d3f674b0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.pr_metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: mise install --locked

      - name: Check proto drift
        id: drift
        env:
          DRIFT_TASK: ${{ matrix.sdk.drift_task }}
        run: |
          DRIFT_STATUS=0
          REPORT=$(mise run "$DRIFT_TASK" 2>"$RUNNER_TEMP/drift_stderr.log") || DRIFT_STATUS=$?

          if echo "$REPORT" | jq -e 'type == "object" and has("synced") and (.synced | type == "boolean") and (has("error") | not)' >/dev/null 2>&1; then
            SYNCED=$(echo "$REPORT" | jq -r '.synced')
            if { [ "$DRIFT_STATUS" -eq 0 ] && [ "$SYNCED" = "true" ]; } || \
               { [ "$DRIFT_STATUS" -eq 1 ] && [ "$SYNCED" = "false" ]; }; then
              DELIMITER="REPORT_EOF_$(openssl rand -hex 16)"
              {
                echo "report<<$DELIMITER"
                echo "$REPORT"
                echo "$DELIMITER"
              } >> "$GITHUB_OUTPUT"
              echo "synced=$SYNCED" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Proto drift check failed: exit status $DRIFT_STATUS disagrees with report"
              echo "stderr: $(cat "$RUNNER_TEMP/drift_stderr.log")"
              echo "synced=error" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::warning::Proto drift check failed: unable to parse report"
            echo "stderr: $(cat "$RUNNER_TEMP/drift_stderr.log")"
            echo "synced=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Annotate drift warning
        if: steps.drift.outputs.synced == 'false'
        env:
          DRIFT_REPORT: ${{ steps.drift.outputs.report }}
          SDK_NAME: ${{ matrix.sdk.name }}
        run: |
          SUMMARY=$(echo "$DRIFT_REPORT" | jq -r '.summary')
          FILES=$(echo "$DRIFT_REPORT" | jq -r '.files[] | select(.status != "synced") | "  - \(.name) (\(.status), \(.diff_lines) lines changed)"' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning::SDK proto drift detected for ${SDK_NAME}: ${SUMMARY}%0A${FILES}"
