name: Publish Release

on:
  workflow_call:
    inputs:
      release-tag:
        description: Git tag to build and publish
        required: true
        type: string
      is-prerelease:
        description: Whether the caller is publishing a pre-release
        required: true
        type: boolean
      make-latest:
        description: Whether this stable release should update shared latest channels
        required: false
        default: false
        type: boolean
      release-notes-reused:
        description: Whether the calling run already uploaded release-notes from the promoted prerelease's preview
        required: false
        default: false
        type: boolean
      source-sha:
        description: Source commit of the built artifacts in the calling run
        required: true
        type: string
      semver:
        description: Release version without the v prefix
        required: true
        type: string
      python-version:
        description: Python package version
        required: true
        type: string
      npm-version:
        description: TypeScript package version
        required: true
        type: string
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
      FERN_TOKEN:
        required: false
      GITLAB_CI_TRIGGER_TOKEN:
        required: false
      GITLAB_CI_TRIGGER_URL:
        required: false
      LLM_INFERENCE_API_KEY:
        description: NVIDIA Inference Hub API key for stable release notes
        required: false

permissions:
  contents: read
  packages: read

env:
  RELEASE_TAG: ${{ inputs.release-tag }}

defaults:
  run:
    shell: bash

jobs:
  assemble:
    name: Assemble Release Assets
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      wheel_filenames: ${{ steps.wheel_filenames.outputs.wheel_filenames }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}

      - name: Download all CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release/
          merge-multiple: true

      - name: Download gateway binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-binary-*
          path: release/
          merge-multiple: true

      - name: Download supervisor binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: supervisor-binary-*
          path: release/
          merge-multiple: true

      - name: Download sandbox binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sandbox-binary-*
          path: release/
          merge-multiple: true

      - name: Download VM driver artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: driver-vm-*
          path: release/
          merge-multiple: true

      - name: Download prover binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prover-binary-*
          path: release/
          merge-multiple: true

      - name: Download prover checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prover-checksums
          path: release/

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel
          path: release/

      - name: Download Debian package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-linux-*
          path: release/
          merge-multiple: true

      - name: Download RPM package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rpm-linux-*
          path: release/
          merge-multiple: true

      - name: Download snap artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snap-linux-*
          path: release/
          merge-multiple: true

      - name: Capture wheel filenames
        id: wheel_filenames
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Python wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel_filename=$(basename "${wheels[0]}")
          echo "wheel_filenames=${wheel_filename}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -- \
            openshell-x86_64-unknown-linux-musl.tar.gz \
            openshell-aarch64-unknown-linux-musl.tar.gz \
            openshell-aarch64-apple-darwin.tar.gz \
            openshell-driver-vm-x86_64-unknown-linux-gnu.tar.gz \
            openshell-driver-vm-aarch64-unknown-linux-gnu.tar.gz \
            openshell-driver-vm-aarch64-apple-darwin.tar.gz \
            openshell_*.deb \
            openshell-*.rpm \
            *.whl > openshell-checksums-sha256.txt
          cat openshell-checksums-sha256.txt
          sha256sum -- \
            openshell-gateway-x86_64-unknown-linux-gnu.tar.gz \
            openshell-gateway-aarch64-unknown-linux-gnu.tar.gz \
            openshell-gateway-aarch64-apple-darwin.tar.gz > openshell-gateway-checksums-sha256.txt
          cat openshell-gateway-checksums-sha256.txt
          sha256sum -- \
            openshell-sandbox-x86_64-unknown-linux-musl.tar.gz \
            openshell-sandbox-aarch64-unknown-linux-musl.tar.gz > openshell-sandbox-checksums-sha256.txt
          cat openshell-sandbox-checksums-sha256.txt
          sha256sum -- \
            openshell-supervisor-x86_64-unknown-linux-gnu.tar.gz \
            openshell-supervisor-aarch64-unknown-linux-gnu.tar.gz > openshell-supervisor-checksums-sha256.txt
          cat openshell-supervisor-checksums-sha256.txt

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          python3 tasks/scripts/release.py generate-homebrew-formula \
            --release-tag "${RELEASE_TAG}" \
            --release-dir release \
            --output release/openshell.rb
          cat release/openshell.rb

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.whl

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release/
          retention-days: 5
          if-no-files-found: error

  tag-ghcr-release:
    name: Publish GHCR Images
    needs: assemble
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.is-prerelease }}
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}

      - uses: ./.github/actions/setup-nix
        if: ${{ !inputs.is-prerelease }}

      - name: Download stable image archives
        if: ${{ !inputs.is-prerelease }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: artifacts/
          merge-multiple: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish stable image archives
        if: ${{ !inputs.is-prerelease }}
        env:
          VERSION: ${{ inputs.semver }}
        run: |
          set -euo pipefail
          for component in gateway sandbox supervisor; do
            image="ghcr.io/nvidia/openshell/${component}:${VERSION}"
            # Archives are build artifacts from this run, not externally signed images.
            nix shell --inputs-from . nixpkgs#skopeo -c \
              skopeo --insecure-policy copy --all --preserve-digests \
              --authfile "${HOME}/.docker/config.json" \
              "oci-archive:artifacts/images/${component}.tar" "docker://${image}"
            tasks/scripts/verify-image-sbom.sh "${image}" --require-cargo
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.is-prerelease && inputs.make-latest }}
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-workflow
          sparse-checkout: .github/actions/check-latest-release

      - name: Check current latest release
        id: latest
        if: ${{ !inputs.is-prerelease && inputs.make-latest }}
        uses: ./release-workflow/.github/actions/check-latest-release
        with:
          release-tag: ${{ inputs.release-tag }}

      - name: Tag images with release version
        env:
          MAKE_LATEST: ${{ steps.latest.outputs.make-latest }}
          IS_PRERELEASE: ${{ inputs.is-prerelease }}
          SOURCE_TAG: ${{ inputs.is-prerelease && inputs.source-sha || inputs.semver }}
          VERSION: ${{ inputs.semver }}
        run: |
          set -euo pipefail
          REGISTRY="ghcr.io/nvidia/openshell"
          for component in gateway sandbox supervisor; do
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              echo "Tagging ${REGISTRY}/${component}:${SOURCE_TAG} as ${VERSION}..."
              docker buildx imagetools create \
                --prefer-index=false \
                -t "${REGISTRY}/${component}:${VERSION}" \
                "${REGISTRY}/${component}:${SOURCE_TAG}"
            fi
            if [[ "${MAKE_LATEST}" == "true" ]]; then
              echo "Tagging ${REGISTRY}/${component}:${SOURCE_TAG} as latest..."
              docker buildx imagetools create \
                --prefer-index=false \
                -t "${REGISTRY}/${component}:latest" \
                "${REGISTRY}/${component}:${SOURCE_TAG}"
            fi
          done

  release-helm:
    name: Release Helm Chart (OCI)
    needs: tag-ghcr-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}

      - uses: ./.github/actions/release-helm-oci
        with:
          chart-version: ${{ inputs.semver }}
          app-version: ${{ inputs.semver }}
          release-kind: public

  release-notes:
    name: Write Release Notes
    if: ${{ !inputs.is-prerelease && !inputs.release-notes-reused }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes.yml
    with:
      release-tag: ${{ inputs.release-tag }}
    secrets:
      LLM_INFERENCE_API_KEY: ${{ secrets.LLM_INFERENCE_API_KEY }}

  release:
    name: Publish Release Assets
    needs: [assemble, release-helm, release-notes]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.release-helm.result == 'success' && (inputs.is-prerelease || inputs.release-notes-reused || needs.release-notes.result == 'success') }}
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      wheel_filenames: ${{ needs.assemble.outputs.wheel_filenames }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.is-prerelease && inputs.make-latest }}
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-workflow
          sparse-checkout: .github/actions/check-latest-release

      - name: Download assembled release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release/

      # Installer-visible packages are uploaded only after images and the chart.
      - name: Prune removed VM checksum asset
        if: ${{ !inputs.is-prerelease }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG });
            } catch (err) {
              if (err.status === 404) {
                core.info(`No existing ${process.env.RELEASE_TAG} release; skipping VM checksum pruning.`);
                return;
              }
              throw err;
            }
            for (const asset of release.data.assets) {
              if (asset.name === 'openshell-driver-vm-checksums-sha256.txt') {
                core.info(`Deleting removed VM checksum asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

      - name: Download release notes
        if: ${{ !inputs.is-prerelease }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release/

      - name: Check current latest release
        id: latest
        if: ${{ !inputs.is-prerelease && inputs.make-latest }}
        uses: ./release-workflow/.github/actions/check-latest-release
        with:
          release-tag: ${{ inputs.release-tag }}

      - name: Create GitHub Release
        if: ${{ !inputs.is-prerelease }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: OpenShell ${{ env.RELEASE_TAG }}
          prerelease: false
          make_latest: ${{ steps.latest.outputs.make-latest == 'true' && 'true' || 'false' }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/release-notes.md
          files: |
            release/openshell-x86_64-unknown-linux-musl.tar.gz
            release/openshell-aarch64-unknown-linux-musl.tar.gz
            release/openshell-aarch64-apple-darwin.tar.gz
            release/openshell_*.deb
            release/openshell-*.rpm
            release/*.snap
            release/openshell-gateway-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-gateway-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-gateway-aarch64-apple-darwin.tar.gz
            release/openshell-sandbox-x86_64-unknown-linux-musl.tar.gz
            release/openshell-sandbox-aarch64-unknown-linux-musl.tar.gz
            release/openshell-supervisor-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-supervisor-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-x86_64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-aarch64-unknown-linux-gnu.tar.gz
            release/openshell-driver-vm-aarch64-apple-darwin.tar.gz
            release/openshell-prover-x86_64-unknown-linux-musl.tar.gz
            release/openshell-prover-aarch64-unknown-linux-musl.tar.gz
            release/openshell-prover-aarch64-apple-darwin.tar.gz
            release/*.whl
            release/openshell.rb
            release/openshell-checksums-sha256.txt
            release/openshell-gateway-checksums-sha256.txt
            release/openshell-sandbox-checksums-sha256.txt
            release/openshell-supervisor-checksums-sha256.txt
            release/openshell-prover-checksums-sha256.txt

      - name: Upload amd64 Debian prerelease package
        if: inputs.is-prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-amd64-deb
          path: |
            release/openshell_*_amd64.deb
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload arm64 Debian prerelease package
        if: inputs.is-prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-arm64-deb
          path: |
            release/openshell_*_arm64.deb
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload x86_64 RPM prerelease packages
        if: inputs.is-prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-x86_64-rpm
          path: |
            release/openshell-*.x86_64.rpm
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload aarch64 RPM prerelease packages
        if: inputs.is-prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-linux-aarch64-rpm
          path: |
            release/openshell-*.aarch64.rpm
            release/openshell-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload macOS prerelease packages
        if: inputs.is-prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshell-${{ env.RELEASE_TAG }}-macos-arm64
          path: |
            release/openshell-aarch64-apple-darwin.tar.gz
            release/openshell-gateway-aarch64-apple-darwin.tar.gz
            release/openshell-driver-vm-aarch64-apple-darwin.tar.gz
            release/openshell-prover-aarch64-apple-darwin.tar.gz
            release/openshell.rb
            release/openshell-checksums-sha256.txt
            release/openshell-gateway-checksums-sha256.txt
            release/openshell-prover-checksums-sha256.txt
          retention-days: 90
          if-no-files-found: error

  publish-snap:
    name: Publish Snap
    needs: release
    if: ${{ !inputs.is-prerelease && inputs.make-latest }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/snap-publish.yml
    with:
      upload-channel: latest/stable
      github-environment: latest/stable
      release-tag: ${{ inputs.release-tag }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-prerelease-snap:
    name: Publish Prerelease Snap
    needs: release
    if: inputs.is-prerelease
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/snap-publish.yml
    with:
      upload-channel: latest/beta
      release-tag: ${{ inputs.release-tag }}
      github-environment: latest/beta
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-sdk-typescript:
    name: Publish TypeScript SDK
    needs: release
    if: ${{ !inputs.is-prerelease }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sdk-typescript-publish.yml
    with:
      release-tag: ${{ inputs.release-tag }}
      source-ref: ${{ inputs.source-sha }}
      npm-version: ${{ inputs.npm-version }}
      make-latest: ${{ inputs.make-latest }}

  tag-sdk-go:
    name: Tag Go SDK
    needs: release
    if: ${{ !inputs.is-prerelease }}
    permissions:
      contents: write
    uses: ./.github/workflows/sdk-go-tag.yml
    with:
      version: ${{ inputs.semver }}
      source-sha: ${{ inputs.source-sha }}

  trigger-wheel-publish:
    name: Trigger Wheel Publish
    needs: release
    if: ${{ !inputs.is-prerelease }}
    uses: ./.github/workflows/wheel-publish.yml
    with:
      release-tag: ${{ inputs.release-tag }}
      source-sha: ${{ inputs.source-sha }}
      python-version: ${{ inputs.python-version }}
      wheel-filenames: ${{ needs.release.outputs.wheel_filenames }}
    secrets:
      GITLAB_CI_TRIGGER_TOKEN: ${{ secrets.GITLAB_CI_TRIGGER_TOKEN }}
      GITLAB_CI_TRIGGER_URL: ${{ secrets.GITLAB_CI_TRIGGER_URL }}

  publish-fern-docs:
    name: Sync and Publish Fern Docs
    needs: [release, publish-sdk-typescript, trigger-wheel-publish]
    if: ${{ !inputs.is-prerelease }}
    permissions:
      contents: write
    uses: ./.github/workflows/sync-docs.yml
    with:
      operation: sync
      channel: stable
      source_ref: ${{ inputs.source-sha }}
      release_version: ${{ inputs.semver }}
      version_slug: v${{ inputs.semver }}
      display_name: Latest (v${{ inputs.semver }})
      publish: true
    secrets:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
