name: Trivy Scan

# Manual or reusable scan of deployment configuration and supplied OCI
# artifacts. Findings are informational by default; scanner errors remain fatal.

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Optional release tag to scan instead of the triggering revision
        default: ""
        type: string
      release-lane:
        description: Stable image alert lane (latest; support reserved for future use)
        default: ""
        type: string
      images:
        description: Newline-separated image references to scan
        type: string
        default: ""
      charts:
        description: Newline-separated packaged Helm chart OCI references
        type: string
        default: ""
      severity:
        description: Severities that fail the workflow
        type: string
        default: HIGH,CRITICAL
      ignore-unfixed:
        description: Ignore image vulnerabilities with no upstream fix
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the run on findings instead of warning
        type: boolean
        default: false
      upload-sarif:
        description: Upload results to GitHub Code Scanning
        type: boolean
        default: true
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Token used to write Nix build outputs to Cachix

  workflow_dispatch:
    inputs:
      images:
        description: Newline-separated image references to scan
        type: string
        default: ""
      charts:
        description: Newline-separated packaged Helm chart OCI references to scan
        type: string
        default: ""
      severity:
        description: Severities that fail the workflow
        type: string
        default: HIGH,CRITICAL
      ignore-unfixed:
        description: Ignore image vulnerabilities with no upstream fix
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the run on findings instead of warning
        type: boolean
        default: false
      upload-sarif:
        description: Upload results to GitHub Code Scanning
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

env:
  TRIVY_SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
  TRIVY_REPORT_DIR: reports/trivy

jobs:
  scan:
    name: ${{ inputs.fail-on-findings && 'OpenShell / Trivy' || 'OpenShell / Trivy (informational)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sarif-batches: ${{ steps.sarif.outputs.batches }}
      artifact-id: ${{ steps.reports.outputs.artifact-id }}
      source-sha: ${{ steps.source.outputs.commit }}
    env:
      TRIVY_SOURCE_ROOT: ${{ github.workspace }}
      TRIVY_IGNORE_FILE: ${{ github.workspace }}/.trivyignore.yaml
      TRIVY_REPORT_DIR: ${{ github.workspace }}/reports/trivy
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require a stable tag for image alert lanes
        shell: bash
        env:
          RELEASE_LANE: ${{ inputs.release-lane }}
          RELEASE_TAG: ${{ inputs.candidate_ref }}
        run: |
          if [[ -n "$RELEASE_LANE" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Image alert lanes require a stable release tag."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ inputs.candidate_ref && format('refs/tags/{0}', inputs.candidate_ref) || '' }}
          persist-credentials: false

      # Old release commits may predate support for stable alert identities.
      - name: Check out scanner from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: scan-workflow
          sparse-checkout: |
            tasks/scripts
            deploy/helm
            .trivyignore.yaml

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          prepare-shell: "true"
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Test scan reporting
        env:
          TRIVY_SOURCE_ROOT: ""
          TRIVY_IGNORE_FILE: ""
        run: scan-workflow/tasks/scripts/trivy-scan-test.sh

      - name: Scan configuration
        id: config
        env:
          CHARTS: ${{ inputs.charts }}
        run: |
          args=()
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            args+=(--chart-ref "$ref")
          done <<<"$CHARTS"
          scan-workflow/tasks/scripts/trivy-scan.sh config "${args[@]}"

      - name: Scan images
        id: images
        if: ${{ !cancelled() }}
        env:
          IMAGES: ${{ inputs.images }}
          TRIVY_IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        run: |
          refs=()
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            refs+=("$ref")
          done <<<"$IMAGES"
          if [ "${#refs[@]}" -gt 0 ]; then
            scan-workflow/tasks/scripts/trivy-scan.sh images "${refs[@]}"
          fi

      - name: Prepare consolidated SARIF uploads
        id: sarif
        if: >-
          ${{
            !cancelled()
            && steps.config.conclusion == 'success'
            && steps.images.conclusion == 'success'
            && inputs.upload-sarif
          }}
        env:
          TRIVY_RELEASE_LANE: ${{ inputs.release-lane }}
          TRIVY_SARIF_IMAGES: ${{ inputs.release-lane != '' }}
        run: scan-workflow/tasks/scripts/trivy-scan.sh prepare-sarif

      - name: Upload reports
        id: reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ github.run_id }}
          path: reports/trivy
          if-no-files-found: ignore
          retention-days: 14

      - name: Report findings
        if: >-
          ${{
            !cancelled()
            && steps.config.conclusion == 'success'
            && steps.images.conclusion == 'success'
          }}
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set +e
          scan-workflow/tasks/scripts/trivy-scan.sh gate
          status=$?
          set -e
          case "$status" in
            0) echo "No findings at ${TRIVY_SEVERITY}." ;;
            10)
              if [ "$FAIL_ON_FINDINGS" = "true" ]; then
                echo "::error::Trivy findings at ${TRIVY_SEVERITY}."
                exit 1
              fi
              echo "::warning::Trivy findings at ${TRIVY_SEVERITY}; this check is informational."
              ;;
            *) echo "::error::Trivy could not evaluate the reports (exit $status)."; exit "$status" ;;
          esac

  upload-sarif:
    name: Publish Trivy SARIF (${{ matrix.batch }})
    needs: scan
    # Findings may fail the scan job after reports are prepared. Publish those
    # complete results too, but never publish an incomplete/failed scan.
    if: >-
      ${{
        !cancelled()
        && inputs.upload-sarif
        && needs.scan.outputs.sarif-batches != ''
        && needs.scan.outputs.artifact-id != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.scan.outputs.sarif-batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref && format('refs/tags/{0}', inputs.candidate_ref) || '' }}
          persist-credentials: false

      - name: Check out latest-release guard from the workflow revision
        if: ${{ inputs.release-lane == 'latest' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: scan-workflow
          sparse-checkout: .github/actions/check-latest-release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          merge-multiple: true
          path: reports/trivy

      - name: Preserve latest results when rerunning an older release
        id: latest
        if: ${{ inputs.release-lane == 'latest' }}
        uses: ./scan-workflow/.github/actions/check-latest-release
        with:
          release-tag: ${{ inputs.candidate_ref }}

      # One configuration run, plus one run per image/platform or packaged
      # chart. Each batch holds at most GitHub's limit of 20 SARIF runs.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ inputs.release-lane != 'latest' || steps.latest.outputs.make-latest == 'true' }}
        with:
          sarif_file: reports/trivy/code-scanning/uploads/${{ matrix.batch }}
          ref: ${{ inputs.release-lane != '' && 'refs/heads/main' || (inputs.candidate_ref && format('refs/tags/{0}', inputs.candidate_ref) || '') }}
          sha: ${{ inputs.candidate_ref && needs.scan.outputs.source-sha || '' }}
