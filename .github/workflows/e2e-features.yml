name: E2E Features Tests

on:
  workflow_call:
    inputs:
      profile:
        description: Existing core/release feature coverage (identical matrices)
        required: false
        type: string
        default: core
      source-sha:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      integration-inputs-artifact-id:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  provider-refresh:
    name: provider-refresh
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: feature-specific-provider-refresh
      source-sha: ${{ inputs.source-sha }}
      integration-inputs-artifact-id: ${{ inputs.integration-inputs-artifact-id }}
      test-matrix: >-
        [{"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"provider-refresh"},{"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"provider-refresh"}]

  oci-image:
    name: oci-image
    uses: ./.github/workflows/integration-runner.yml
    with:
      category: feature-specific-oci-image
      source-sha: ${{ inputs.source-sha }}
      integration-inputs-artifact-id: ${{ inputs.integration-inputs-artifact-id }}
      test-matrix: >-
        [{"environment":"ubuntu-docker-rootful","installer":"deb","testsuite":"oci-image"},{"environment":"fedora-podman-rootful","installer":"rpm","testsuite":"oci-image"},{"environment":"fedora-podman-rootless","installer":"rpm","testsuite":"oci-image"}]
