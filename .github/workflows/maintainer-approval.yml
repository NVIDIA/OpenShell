name: Maintainer Approval

# This workflow only signals that the gate needs re-evaluating. The decision
# runs in maintainer-approval-status.yml, which posts the required
# `OpenShell / Maintainer Approval` commit status. Keeping the decision out of
# this job's result means a missing approval never fails a run here, so
# reviewers are not emailed a failure for every comment.
#
# maintainer-approval-status.yml parses the PR number from this run name.
run-name: >-
  ${{ github.event.pull_request.number
  && format('Maintainer Approval for PR #{0}', github.event.pull_request.number)
  || 'Maintainer Approval for merge queue' }}

on:
  merge_group:
    types: [checks_requested]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    # Not the required context. Skipping or passing this job never satisfies
    # the gate; only the commit status does.
    name: Maintainer Approval Trigger
    # Comment reviews, including thread replies, cannot change the outcome.
    if: >-
      github.repository_owner == 'NVIDIA' &&
      github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Requesting maintainer approval evaluation"
