name: Helm Lint

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_dispatch:

env:
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm_changes:
    name: Detect Helm changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.default.outputs.should_run || steps.changes.outputs.any_changed }}
    steps:
      - id: default
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      # On pull_request, changed-files reads the PR file list from the API.
      - id: changes
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@aa08304bd477b800d468db44fe10f6c61f7f7b11 # v42.1.0
        with:
          files: |
            deploy/helm/**
            mise.toml
            mise.lock
            tasks/helm.toml
            .github/workflows/helm-lint.yml

  helm-lint:
    name: Helm Lint
    needs: helm_changes
    if: needs.helm_changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ai-openshell/openshell/ci:82e753ba3ffdfb40c118e7cb416ced7f350381d5@sha256:d816f3b4b2de675928e2ecfd26ec6b937be35fe9986542c87d440bc3de5a29de
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: mise install --locked

      - name: Lint Helm chart
        run: mise run helm:lint

      - name: Check Helm chart README
        run: mise run helm:docs:check

      - name: Run Helm chart unit tests
        run: mise run helm:test
