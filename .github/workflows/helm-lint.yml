name: Helm Lint

run-name: >-
  ${{ inputs.merge_group_sha != ''
      && format('Helm Lint / merge group / PR #{0} / {1} / head {2} / approval {3}', inputs.pr_number, inputs.merge_group_sha, inputs.head_sha, inputs.approval_comment_id)
      || inputs.pr_number != ''
      && format('Helm Lint / PR #{0} / {1} / approval {2}', inputs.pr_number, inputs.head_sha, inputs.approval_comment_id)
      || 'Helm Lint' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number supplied by the trusted PR dispatcher
        required: false
        type: string
        default: ""
      head_sha:
        description: Exact approved pull request head SHA
        required: false
        type: string
        default: ""
      approval_comment_id:
        description: Exact-SHA maintainer approval comment
        required: false
        type: string
        default: ""
      merge_group_sha:
        description: Exact synthetic merge queue SHA from the trusted dispatcher
        required: false
        type: string
        default: ""

env:
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.merge_group_sha || inputs.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  pr_metadata:
    name: Authorize PR revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.authorize.outcome == 'success' }}
      base_sha: ${{ steps.authorize.outputs.base-sha }}
      merge_base_sha: ${{ steps.authorize.outputs.merge-base-sha }}
      checkout_repository: ${{ steps.authorize.outputs.checkout-repository }}
      head_sha: ${{ steps.authorize.outputs.head-sha }}
    steps:
      - id: authorize
        uses: $/.github/actions/authorize-pr-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          approval-comment-id: ${{ inputs.approval_comment_id }}
          merge-group-sha: ${{ inputs.merge_group_sha }}

  helm_changes:
    name: Detect Helm changes
    needs: pr_metadata
    if: needs.pr_metadata.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.default.outputs.should_run || steps.changes.outputs.any_changed }}
    steps:
      - id: default
        if: inputs.pr_number == ''
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.pr_number != ''
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Fetch merge base
        if: inputs.pr_number != ''
        env:
          BASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BASE_SHA: ${{ needs.pr_metadata.outputs.merge_base_sha }}
        run: git fetch --no-tags --depth=1 "$BASE_REPOSITORY_URL" "$BASE_SHA"

      - id: changes
        if: inputs.pr_number != ''
        uses: tj-actions/changed-files@aa08304bd477b800d468db44fe10f6c61f7f7b11 # v42.1.0
        with:
          base_sha: ${{ needs.pr_metadata.outputs.merge_base_sha }}
          sha: ${{ needs.pr_metadata.outputs.head_sha }}
          skip_initial_fetch: true
          files: |
            deploy/helm/**
            mise.toml
            mise.lock
            tasks/helm.toml
            .github/workflows/helm-lint.yml

  helm-lint:
    name: Helm Lint
    needs: [pr_metadata, helm_changes]
    if: needs.pr_metadata.outputs.should_run == 'true' && needs.helm_changes.outputs.should_run == 'true'
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/openshell/ci:9cb72baa2e61a1b5f12407e6e82da7fdba0aa722@sha256:67a9a0c32cb99825e6d3e9d9eec45d67149ea1ff7c11a1b1e1b3480d2d3df684
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ needs.pr_metadata.outputs.checkout_repository }}
          ref: ${{ needs.pr_metadata.outputs.head_sha }}

      - name: Install tools
        run: mise install --locked

      - name: Lint Helm chart
        run: mise run helm:lint

      - name: Check Helm chart README
        run: mise run helm:docs:check

      - name: Run Helm chart unit tests
        run: mise run helm:test
