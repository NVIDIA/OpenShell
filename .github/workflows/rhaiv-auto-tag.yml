# RHAIV auto-tag workflow for the OpenShell midstream fork.
# Creates +rhaiv.N tags based on the latest upstream version tag.
#
# Logic:
#   1. Find the latest upstream-style tag (vX.Y.Z, no +rhaiv suffix)
#   2. If no vX.Y.Z+rhaiv.0 exists, create it
#   3. If vX.Y.Z+rhaiv.N exists, create vX.Y.Z+rhaiv.(N+1)
#   4. Skip if no new commits since the last +rhaiv.N tag
#
# When upstream syncs a new vX.Y.Z, the next run creates +rhaiv.0 for it.

name: RHAIV Auto-Tag

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 14 * * 1-5"  # 7:30 AM PDT, weekdays

permissions: {}

concurrency:
  group: rhaiv-auto-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next rhaiv tag
        id: version
        run: |
          # Find the latest upstream tag (vX.Y.Z without +rhaiv suffix)
          latest_upstream=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v '+rhaiv' | head -1)
          if [ -z "$latest_upstream" ]; then
            echo "::error::No upstream v*.*.* tags found"
            exit 1
          fi

          # Validate tag is strict semver (vN.N.N, digits only)
          if ! echo "$latest_upstream" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest tag '$latest_upstream' is not valid semver"
            exit 1
          fi
          echo "Latest upstream tag: $latest_upstream"

          # Find the latest rhaiv tag for this upstream version
          latest_rhaiv=$(git tag -l "${latest_upstream}+rhaiv.*" --sort=-v:refname | head -1)

          if [ -z "$latest_rhaiv" ]; then
            next="${latest_upstream}+rhaiv.0"
            compare_ref="$latest_upstream"
            echo "No existing rhaiv tags for $latest_upstream"
          else
            current_n=$(echo "$latest_rhaiv" | grep -oP '\+rhaiv\.\K[0-9]+')
            next_n=$((current_n + 1))
            next="${latest_upstream}+rhaiv.${next_n}"
            compare_ref="$latest_rhaiv"
            echo "Latest rhaiv tag: $latest_rhaiv (N=$current_n)"
          fi

          # Validate generated tag format
          if ! echo "$next" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\+rhaiv\.[0-9]+$'; then
            echo "::error::Generated tag '$next' has unexpected format"
            exit 1
          fi

          # Skip if no new commits since the last tag
          commit_count=$(git rev-list "${compare_ref}..HEAD" --count)
          echo "Commits since $compare_ref: $commit_count"
          if [ "$commit_count" -eq 0 ]; then
            echo "No new commits since $compare_ref -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$next" | grep -q .; then
            echo "::error::Tag $next already exists"
            exit 1
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next tag: $next"

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT_TAG"
          git push origin "$NEXT_TAG"
