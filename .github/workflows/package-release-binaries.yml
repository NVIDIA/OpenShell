name: Package Release Binaries

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  package:
    name: Package ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: ryno-x86_64-unknown-linux-musl
            binary: ryno
            package: cli-linux-amd64
          - artifact: ryno-aarch64-unknown-linux-musl
            binary: ryno
            package: cli-linux-arm64
          - artifact: ryno-aarch64-apple-darwin
            binary: ryno
            package: cli-macos
          - artifact: ryno-gateway-x86_64-unknown-linux-gnu
            binary: ryno-gateway
            package: gateway-binary-linux-amd64
          - artifact: ryno-gateway-aarch64-unknown-linux-gnu
            binary: ryno-gateway
            package: gateway-binary-linux-arm64
          - artifact: ryno-gateway-aarch64-apple-darwin
            binary: ryno-gateway
            package: gateway-binary-macos
          - artifact: ryno-sandbox-x86_64-unknown-linux-musl
            binary: ryno-sandbox
            package: sandbox-binary-linux-amd64
          - artifact: ryno-sandbox-aarch64-unknown-linux-musl
            binary: ryno-sandbox
            package: sandbox-binary-linux-arm64
          - artifact: ryno-supervisor-x86_64-unknown-linux-gnu
            binary: ryno-supervisor
            package: supervisor-binary-linux-amd64
          - artifact: ryno-supervisor-aarch64-unknown-linux-gnu
            binary: ryno-supervisor
            package: supervisor-binary-linux-arm64
          - artifact: ryno-driver-vm-x86_64-unknown-linux-gnu
            binary: ryno-driver-vm
            package: driver-vm-linux-amd64
          - artifact: ryno-driver-vm-aarch64-unknown-linux-gnu
            binary: ryno-driver-vm
            package: driver-vm-linux-arm64
          - artifact: ryno-driver-vm-aarch64-apple-darwin
            binary: ryno-driver-vm
            package: driver-vm-macos
          - artifact: ryno-prover-x86_64-unknown-linux-musl
            binary: ryno-prover
            package: prover-binary-linux-amd64
          - artifact: ryno-prover-aarch64-unknown-linux-musl
            binary: ryno-prover
            package: prover-binary-linux-arm64
          - artifact: ryno-prover-aarch64-apple-darwin
            binary: ryno-prover
            package: prover-binary-macos
    steps:
      - name: Download ${{ matrix.artifact }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: raw

      - name: Create archive
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          chmod +x "raw/${BINARY}"
          tar -czf "${ARTIFACT}.tar.gz" -C raw "${BINARY}"

      - name: Upload ${{ matrix.package }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 5
          if-no-files-found: error

  smoke-prover:
    name: Smoke packaged prover (${{ matrix.triple }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-musl
            runner: linux-amd64-cpu8
            package: prover-binary-linux-amd64
          - triple: aarch64-unknown-linux-musl
            runner: linux-arm64-cpu8
            package: prover-binary-linux-arm64
          - triple: aarch64-apple-darwin
            runner: macos-15-xlarge
            package: prover-binary-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['checkout-ref'] || github.sha }}

      - name: Download packaged prover
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package }}
          path: package

      - name: Extract and run containment check
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf "package/ryno-prover-${TRIPLE}.tar.gz" -C extracted
          test "$(find extracted -type f | wc -l | tr -d ' ')" = 1
          test -x extracted/ryno-prover
          if [ "${RUNNER_OS}" = "Linux" ]; then
            tasks/scripts/verify-static-binary.sh extracted/ryno-prover
          else
            otool -L extracted/ryno-prover | tee linkage.txt
            if grep -Eiq 'libz3|/nix/store' linkage.txt; then
              echo "ERROR: packaged prover has a non-portable native dependency" >&2
              exit 1
            fi
          fi
          extracted/ryno-prover check \
            crates/ryno-prover-cli/tests/fixtures/candidate-contained.yaml \
            --boundary crates/ryno-prover-cli/tests/fixtures/boundary.yaml \
            --output json > result.json
          grep -q '"result"[[:space:]]*:[[:space:]]*"within_boundary"' result.json

          if extracted/ryno-prover check \
            crates/ryno-prover-cli/tests/fixtures/candidate-underscore-host.yaml \
            --boundary crates/ryno-prover-cli/tests/fixtures/boundary-empty.yaml \
            --output json > underscore.json; then
            echo "ERROR: underscore host unexpectedly stayed within an empty boundary" >&2
            exit 1
          else
            test "$?" = 1
          fi
          grep -q '"result"[[:space:]]*:[[:space:]]*"exceeds_boundary"' underscore.json
          grep -q '"host"[[:space:]]*:[[:space:]]*"api_internal.example.com"' underscore.json

          if extracted/ryno-prover check \
            crates/ryno-prover-cli/tests/fixtures/candidate-unicode-network-selector.yaml \
            --boundary crates/ryno-prover-cli/tests/fixtures/boundary-empty.yaml \
            --output json > unicode.json; then
            echo "ERROR: non-ASCII network selector unexpectedly produced a definitive result" >&2
            exit 1
          else
            test "$?" = 3
          fi
          grep -q '"result"[[:space:]]*:[[:space:]]*"unsupported"' unicode.json
          grep -q '"reason_code"[[:space:]]*:[[:space:]]*"unsupported_policy_shape"' unicode.json

  prover-checksums:
    name: Package prover checksums
    needs: smoke-prover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packaged prover archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prover-binary-*
          path: release
          merge-multiple: true

      - name: Generate prover checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum ryno-prover-*.tar.gz > ryno-prover-checksums-sha256.txt
          test "$(awk 'END { print NR }' ryno-prover-checksums-sha256.txt)" = 3
          sha256sum --check ryno-prover-checksums-sha256.txt

      - name: Upload prover checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prover-checksums
          path: release/ryno-prover-checksums-sha256.txt
          retention-days: 5
          if-no-files-found: error
