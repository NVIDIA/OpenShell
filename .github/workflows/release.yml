name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable version to promote from its latest passing prerelease (e.g. v0.0.4)"
        required: true
        type: string
      notes-only:
        description: "Generate a release notes artifact without promoting or publishing"
        required: false
        default: false
        type: boolean
      regenerate-notes:
        description: "Regenerate release notes instead of reusing the promoted prerelease's preview"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.notes-only && format('release-notes-preview-{0}', github.ref) || 'release-stable' }}
  cancel-in-progress: false
  queue: max

jobs:
  preview-notes:
    name: Preview Release Notes
    if: ${{ inputs.notes-only }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes.yml
    with:
      release-tag: ${{ inputs.tag }}
    secrets:
      LLM_INFERENCE_API_KEY: ${{ secrets.LLM_INFERENCE_API_KEY }}

  promote:
    name: Select Qualified Prerelease
    if: ${{ !inputs.notes-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      candidate-tag: ${{ steps.candidate.outputs.candidate_tag }}
      qualification-run-id: ${{ steps.candidate.outputs.qualification_run_id }}
      source-sha: ${{ steps.candidate.outputs.source_sha }}
      make-latest: ${{ steps.candidate.outputs.make_latest }}
    steps:
      - name: Require a release branch
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "${REF_TYPE}" = branch

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          python-version: "3.13"

      - name: Select candidate and verify qualification evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run --no-project python tasks/scripts/select-release-candidate.py \
            "${RELEASE_TAG}" --branch "${RELEASE_BRANCH}" > promotion.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' promotion.json >> "${GITHUB_OUTPUT}"
          {
            echo "## Stable release promotion"
            jq -r '"- Prerelease: `\(.candidate_tag)`\n- Stable tag: `\(.tag)`\n- Source commit: `\(.source_sha)`\n- Qualification: \(.qualification_run_url)\n- Update shared latest channels: \(.make_latest)"' promotion.json
            echo
            echo "Stable artifacts are rebuilt from this qualified commit with the stable version."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain promotion record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-promotion-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion.json
          retention-days: 90
          if-no-files-found: error

      - name: Create stable tag at the qualified commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${SOURCE_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${SOURCE_SHA}"
          fi

  reuse-notes:
    name: Reuse Release Notes Preview
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      reused: ${{ steps.notes.outputs.reused }}
    steps:
      # A missing or expired preview falls back to generating notes during publication.
      - name: Download prerelease notes preview
        id: download
        if: ${{ !inputs.regenerate-notes }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: preview/
          run-id: ${{ needs.promote.outputs.qualification-run-id }}
          github-token: ${{ github.token }}

      - name: Retag prerelease notes preview
        id: notes
        env:
          REGENERATE: ${{ inputs.regenerate-notes }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          CANDIDATE_TAG: ${{ needs.promote.outputs.candidate-tag }}
          PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.promote.outputs.qualification-run-id }}
        run: |
          set -euo pipefail
          preview=preview/release-notes.md
          reused=false
          if [[ "${REGENERATE}" == "true" ]]; then
            reason="regenerate-notes was requested"
          elif [[ "${DOWNLOAD_OUTCOME}" != "success" ]]; then
            reason="the ${CANDIDATE_TAG} preview artifact is missing or expired"
          elif [[ "$(grep -cFx "## OpenShell ${CANDIDATE_TAG}" "${preview}" || true)" != 1 ||
            "$(grep -cF "OPENSHELL_VERSION=${CANDIDATE_TAG} " "${preview}" || true)" != 1 ]]; then
            reason="the ${CANDIDATE_TAG} preview lacks the expected heading or install command"
          else
            awk -v old="${CANDIDATE_TAG}" -v new="${RELEASE_TAG}" '
              $0 == "## OpenShell " old { $0 = "## OpenShell " new }
              (i = index($0, "OPENSHELL_VERSION=" old " ")) > 0 {
                $0 = substr($0, 1, i - 1) "OPENSHELL_VERSION=" new " " substr($0, i + length("OPENSHELL_VERSION=" old " "))
              }
              { print }
            ' "${preview}" > release-notes.md
            reused=true
          fi
          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Release notes"
            if [[ "${reused}" == "true" ]]; then
              echo "Reused the \`${CANDIDATE_TAG}\` preview from ${PREVIEW_RUN_URL}, retagged as \`${RELEASE_TAG}\`."
            else
              echo "Regenerating release notes because ${reason}."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: ${{ steps.notes.outputs.reused == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: promote
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/release-build.yml
    with:
      release-tag: ${{ needs.promote.outputs.tag }}
      expected-source-sha: ${{ needs.promote.outputs.source-sha }}
      is-prerelease: false
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    name: Publish
    needs: [promote, build, reuse-notes]
    permissions:
      actions: read
      contents: write
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-publish.yml
    with:
      release-tag: ${{ needs.promote.outputs.tag }}
      source-sha: ${{ needs.build.outputs.source_sha }}
      semver: ${{ needs.build.outputs.semver }}
      python-version: ${{ needs.build.outputs.python_version }}
      npm-version: ${{ needs.build.outputs.npm_version }}
      is-prerelease: false
      make-latest: ${{ needs.promote.outputs.make-latest == 'true' }}
      generate-release-notes: ${{ needs.reuse-notes.outputs.reused != 'true' }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      GITLAB_CI_TRIGGER_TOKEN: ${{ secrets.GITLAB_CI_TRIGGER_TOKEN }}
      GITLAB_CI_TRIGGER_URL: ${{ secrets.GITLAB_CI_TRIGGER_URL }}
      LLM_INFERENCE_API_KEY: ${{ secrets.LLM_INFERENCE_API_KEY }}
