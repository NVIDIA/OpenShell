name: Docker Build

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.component }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            binary: openshell-gateway
            triple: x86_64-unknown-linux-gnu
            arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu8
          - component: gateway
            binary: openshell-gateway
            triple: aarch64-unknown-linux-gnu
            arch: arm64
            platform: linux/arm64
            runner: linux-arm64-cpu8
          - component: supervisor
            binary: openshell-sandbox
            triple: x86_64-unknown-linux-musl
            arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu8
          - component: supervisor
            binary: openshell-sandbox
            triple: aarch64-unknown-linux-musl
            arch: arm64
            platform: linux/arm64
            runner: linux-arm64-cpu8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: ghcr.io/nvidia/openshell/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /etc/buildkit:/etc/buildkit:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['checkout-ref'] || github.sha }}

      - uses: ./.github/actions/setup-buildx
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download ${{ matrix.binary }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary }}-${{ matrix.triple }}
          path: artifact

      - name: Stage ${{ matrix.binary }}
        shell: bash
        run: |
          install -d deploy/docker/.build/prebuilt-binaries/${{ matrix.arch }}
          tar -xzf artifact/${{ matrix.binary }}-${{ matrix.triple }}.tar.gz -C artifact
          install -m 0755 artifact/${{ matrix.binary }} deploy/docker/.build/prebuilt-binaries/${{ matrix.arch }}/${{ matrix.binary }}

      - name: Build ${{ matrix.component }} image
        shell: bash
        run: |
          docker buildx build \
            --builder openshell \
            --platform ${{ matrix.platform }} \
            --file deploy/docker/Dockerfile.${{ matrix.component }} \
            --target ${{ matrix.component }} \
            --tag ghcr.io/nvidia/openshell/${{ matrix.component }}:${{ github.sha }}-${{ matrix.arch }} \
            --cache-from type=gha,scope=${{ matrix.component }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }} \
            --provenance=false \
            --push \
            .

  manifest:
    name: ${{ matrix.component }} manifest
    needs: build
    strategy:
      matrix:
        component: [gateway, supervisor]
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    container:
      image: ghcr.io/nvidia/openshell/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create manifest
        shell: bash
        run: |
          image=ghcr.io/nvidia/openshell/${{ matrix.component }}
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$image:${{ github.sha }}" \
            "$image:${{ github.sha }}-amd64" \
            "$image:${{ github.sha }}-arm64"
