name: Security Scan

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Release tag to scan
        required: true
        type: string
      fail-on-static-findings:
        description: Fail when CodeQL, Trivy, or Zizmor reports HIGH/CRITICAL findings
        default: true
        type: boolean
      images:
        description: Newline-separated image references for Trivy
        default: ""
        type: string
      charts:
        description: Newline-separated packaged Helm chart OCI references for Trivy
        default: ""
        type: string
  workflow_call:
    inputs:
      candidate_ref:
        description: Release tag to scan
        required: true
        type: string
      fail-on-static-findings:
        description: Fail when CodeQL, Trivy, or Zizmor reports HIGH/CRITICAL findings
        default: true
        type: boolean
      images:
        description: Newline-separated image references for Trivy
        default: ""
        type: string
      charts:
        description: Newline-separated packaged Helm chart OCI references for Trivy
        default: ""
        type: string

permissions:
  contents: read

# Only the finding threshold is overridable; execution failures remain fatal.
jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      fail-on-findings: ${{ inputs.fail-on-static-findings }}

  trivy:
    name: Trivy
    uses: ./.github/workflows/trivy-scan.yml
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      fail-on-findings: ${{ inputs.fail-on-static-findings }}
      severity: HIGH,CRITICAL
      ignore-unfixed: false
      images: ${{ inputs.images }}
      charts: ${{ inputs.charts }}

  cargo-deny:
    name: Cargo Deny
    uses: ./.github/workflows/cargo-deny.yml
    permissions:
      contents: read
      packages: read
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      advisories-only: true

  workflow-security:
    name: Actionlint and Zizmor
    uses: ./.github/workflows/workflow-security.yml
    permissions:
      contents: read
      security-events: write
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      fail-on-findings: ${{ inputs.fail-on-static-findings }}
