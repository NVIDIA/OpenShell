# OpenShell mise configuration
# See https://mise.jdx.dev/ for documentation
#
# Tasks are defined in tasks/*.toml — run `mise tasks` to list them all.

# NOTE: keep this version in sync with what CI uses in Dockerfile.ci
min_version = { soft = "2026.4.25" }

redactions = ["*_TOKEN", "*_PASSWORD"]

[settings]
experimental = true
python.precompiled_flavor = "install_only_stripped"

lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.14.5"
rust = "1.95.0"
node = "24.15.0"
kubectl = { version = "1.36.1", version_prefix = "v" }
uv = "0.10.12"
protoc = "29.6"
go = "1.26.7"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.12"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
"go:golang.org/x/tools/cmd/goimports" = "0.48.0"
buf = "1.72.0"
helm = { version = "4.2.0", version_prefix = "v" }
helm-docs = "1.14.2"
yq = "4.53.6"
skaffold = { version = "2.20.0", os = ["linux", "macos"], version_prefix = "v" }
# Keep k3d out of Linux CI images until upstream ships a release rebuilt with
# patched Go/container dependencies. Linux Kubernetes E2E uses kind or an
# externally provided cluster context.
k3d = { version = "5.8.3", os = ["macos"] }
"github:anchore/syft" = { version = "1.44.0" }
"github:EmbarkStudios/cargo-about" = { version = "0.8.4", version_prefix = "" }
"github:EmbarkStudios/cargo-deny" = { version = "0.20.2", version_prefix = "" }
zig = "0.14.1"
"github:rust-secure-code/cargo-auditable" = "0.7.5"
"github:nextest-rs/nextest" = { version = "0.9.143", version_prefix = "cargo-nextest-" }
"github:rust-cross/cargo-zigbuild" = "0.22.3"
"npm:markdownlint-cli2" = "0.22.0"

[tools."github:mozilla/sccache"]
version = "0.16.0"

[tools."github:mozilla/sccache".platforms]
# NOTE: this override is necessary only for linux-x64, otherwise it selects an invalid artifact (sccache-dist-vx.y.z-x86_64-unknown-linux-musl.tar.gz)
linux-x64 = { asset_pattern = "sccache-v*x86_64*linux*.tar.gz" }

[env]
_.path = ["{{config_root}}/scripts/bin"]
_.python.venv = { path = ".venv", create = true }
_.file = [".env"]

KUBECONFIG = "{{config_root}}/kubeconfig"
UV_CACHE_DIR = "{{config_root}}/.cache/uv"

# Enable sccache for faster Rust builds. Preserve an SCCACHE_DIR selected by the
# caller so workstations and CI can configure their cache locations separately.
RUSTC_WRAPPER = "sccache"
SCCACHE_DIR = "{{ get_env(name='SCCACHE_DIR', default=config_root ~ '/.cache/sccache') }}"

# Shared build constants (overridable via environment).
# DOCKER_BUILDKIT enables BuildKit for Docker; ignored by podman.
DOCKER_BUILDKIT = "1"

[vars]
# Python paths to include in formatting/linting
python_paths = "python/ tasks/scripts/*.py e2e/mcp-conformance/*.py deploy/sbom/*.py"

[task_config]
includes = ["tasks/*.toml"]
