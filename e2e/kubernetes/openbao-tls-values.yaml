global:
  tlsDisable: false

server:
  extraArgs: -dev-tls -dev-tls-cert-dir=/openbao/tls
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/vault-ca.pem
  volumes:
    - name: dev-tls
      emptyDir: {}
  volumeMounts:
    - name: dev-tls
      mountPath: /openbao/tls
