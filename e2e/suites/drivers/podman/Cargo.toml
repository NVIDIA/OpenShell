[package]
name = "openshell-test-suite-podman"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"

[dependencies]
openshell-e2e-support = { path = "../../../support/rust" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.43", features = ["macros", "rt", "process", "time", "io-util"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
toml_edit = "0.22"

[features]
fixture-validation = []
