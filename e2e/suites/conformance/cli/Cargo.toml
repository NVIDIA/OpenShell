[package]
name = "openshell-test-conformance-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
openshell-e2e-support = { path = "../../../support/rust" }
tokio = { version = "1.43", features = ["macros", "process", "rt", "time"] }

[lints]
workspace = true
