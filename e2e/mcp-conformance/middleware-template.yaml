# Endpoint settings and process identity for policy-template.cedar, passed
# with --middleware when POLICY_FORMAT=cedar. The endpoint settings are the
# `mcp` options of the YAML endpoint, which configure inspection rather than
# grant access, and `process` is the YAML policy's process section.
# render-policy.py substitutes the placeholders.

process:
  run_as_user: sandbox
  run_as_group: sandbox

endpoint_settings:
  - host: ${host_json}
    port: ${port}
    mcp:
      versions: [${mcp_version}]
      max_body_bytes: 131072
