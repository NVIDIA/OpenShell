# Process identity for policy.template.cedar, passed with --middleware when
# POLICY_FORMAT=cedar. A Cedar policy has no `process` section; this is the
# `process` section of policy.template.yaml.

process:
  run_as_user: sandbox
  run_as_group: sandbox
