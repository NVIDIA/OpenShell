# Middleware configuration for the Cedar e2e suite, passed with --middleware.
# test.sh replaces __HOST__ with the upstream echo service's host.
# Middleware is configuration rather than policy, so it is not part of the
# Cedar file.
network_middlewares:
  redact-keys:
    name: Redact API keys
    middleware: openshell/regex
    order: 10
    config:
      mode: redact
    on_error: fail_closed
    endpoints:
      include: ["__HOST__"]
