version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  echo:
    name: outbound-tcp-echo
    endpoints:
      - host: echo.openshell-outbound-test.svc.cluster.local
        port: 5432
        protocol: tcp
        allowed_ips: ["ECHO_IP/32"]
    binaries:
      - path: "/**"
