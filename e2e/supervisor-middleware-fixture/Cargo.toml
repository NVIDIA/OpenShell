# Standalone test fixture. Keeping it out of the root workspace prevents the
# fixture binary from becoming part of production workspace builds or images.
[workspace]

[package]
name = "openshell-e2e-middleware-fixture"
description = "Authenticated supervisor middleware used only by OpenShell E2E tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
openshell-core = { path = "../../crates/openshell-core", default-features = false }
openshell-sdk = { path = "../../crates/openshell-sdk", features = ["extension"] }
tokio = { version = "1.43", features = ["fs", "macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
