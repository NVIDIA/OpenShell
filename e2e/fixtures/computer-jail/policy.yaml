version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /app, /proc, /dev/urandom, /fixture]
  read_write: [/tmp, /sandbox, /dev/null]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: '10001'
  run_as_group: '10001'
network_policies: {}
