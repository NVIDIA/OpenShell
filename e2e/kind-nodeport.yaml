kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Match service.nodePort in with-kube-gateway.sh. Keep the host listener local.
      - containerPort: 30080
        hostPort: 17670
        listenAddress: "127.0.0.1"
        protocol: TCP
