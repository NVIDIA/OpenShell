# Reviewed potential blockers for the schema-v2 parity campaign. A disposition
# records whether the branch must change before parity can be claimed; it does
# not record test execution results.
ledger_version = 1
issue = 2792
baseline_commit = "74960ebfaeec4673885089ed995fad902459749f"
candidate_start_commit = "8c868e430e9cd3284d7e274628419ab484ebcee0"

[[gaps]]
id = "legacy-environment-selector-upgrade"
severity = "blocker"
parity_relation = "regression"
disposition = "must_fix_before_parity"
origin_main_behavior = "OPENSHELL_DRIVERS accepts one driver name and is loaded by RPM, Debian, and Homebrew gateway services through gateway.env."
candidate_behavior = "Any presence of OPENSHELL_DRIVERS aborts startup before the canonical selector is resolved."
impact = "An otherwise valid in-place package upgrade can make the gateway unavailable without changing the operator-owned environment file."
resolution = "Accept one non-empty OPENSHELL_DRIVERS value as a deprecated environment-only alias when OPENSHELL_COMPUTE_DRIVER is absent; reject multiple values and conflicting canonical and legacy values, and emit a migration warning without logging secrets. Keep removed CLI flags rejected."
validation = "Start the candidate through package-style environment loading with one legacy driver, a conflicting canonical driver, multiple legacy drivers, and the canonical replacement; assert selection, diagnostics, and readiness."
owner_step = 6

[[gaps]]
id = "debian-snap-v1-upgrade"
severity = "blocker"
parity_relation = "upgrade_regression"
disposition = "must_fix_before_release_gate"
origin_main_behavior = "Debian auto-discovers a persistent schema-v1 XDG gateway.toml and Snap passes a persistent schema-v1 SNAP_COMMON gateway.toml."
candidate_behavior = "The schema-v2 gateway rejects those files, and neither package currently performs a package-specific migration or preflight."
impact = "Upgrading a working installation can leave its gateway service unable to start."
resolution = "Add package-specific preflight behavior that never overwrites edited configuration, recognizes any package-generated v1 default that is safe to migrate, and reports an actionable manual migration diagnostic for every preserved v1 file."
validation = "Upgrade real prior Debian and Snap artifacts with generated and edited v1 files; verify safe migration or deterministic operator guidance, file preservation, and successful restart after conversion."
owner_step = 12

[[gaps]]
id = "tls-require-client-auth-ignored"
severity = "major"
parity_relation = "preexisting_inaccessible_option"
disposition = "must_fix_or_remove_claim"
origin_main_behavior = "The TOML schema accepts and documents require_client_auth, but runtime derives the value from client CA presence and OIDC instead of using the configured boolean."
candidate_behavior = "Schema v2 retains the field and the same derived runtime behavior, so an explicit value remains silently ignored."
impact = "A security-sensitive option appears configurable but cannot change listener authentication behavior."
resolution = "Represent file-level require_client_auth as an optional value, honor an explicit value with documented precedence and OIDC interaction, or remove the field from the file schema and documentation. Require security review before changing runtime authentication semantics."
validation = "With a client CA, test explicit true, explicit false, omission, and OIDC combinations using TLS clients with and without certificates."
owner_step = 6

[[gaps]]
id = "unselected-driver-validation-claim"
severity = "minor"
parity_relation = "documentation_gap"
disposition = "documentation_fix_required"
origin_main_behavior = "Only the selected driver table receives driver-specific deserialization; unknown fields inside an unselected table are ignored."
candidate_behavior = "Schema v2 validates every driver entry is a table but still deserializes only the selected driver, while documentation broadly claims unknown driver fields fail startup."
impact = "Operators may believe a dormant driver configuration was fully validated when only its TOML table shape was checked."
resolution = "Narrow documentation to gateway fields, all driver-table shapes, and selected-driver fields unless registry-level validation for every recognized table is intentionally added."
validation = "Start Podman with an unknown Docker field present, then select Docker with the same field; assert the former is accepted and the latter fails."
owner_step = 6

[[gaps]]
id = "multi-driver-runtime-loss"
severity = "none"
parity_relation = "non_finding"
disposition = "no_action"
origin_main_behavior = "Schema v1 accepts a list-shaped selector but runtime rejects configurations containing more than one driver."
candidate_behavior = "Schema v2 represents the existing invariant as one optional scalar driver."
impact = "No working multi-driver runtime capability was removed."
resolution = "Keep the singular selector in the intentional-change ledger and validate explicit selection plus auto-detection."
validation = "Confirm origin/main rejects two configured drivers and the candidate supports one scalar or omission."
owner_step = 5

[[gaps]]
id = "generated-e2e-selector-shape"
severity = "none"
parity_relation = "non_finding"
disposition = "no_action"
origin_main_behavior = "Committed E2E fixtures select one driver through the schema-v1 list."
candidate_behavior = "Committed Docker and Podman fixtures and e2e/run.sh consistently use and require the schema-v2 scalar selector."
impact = "No committed fixture mismatch was found."
resolution = "Use the existing fixtures in live Docker and Podman parity lanes."
validation = "Run both driver E2E wrappers and confirm the selected runtime creates a sandbox."
owner_step = 5

[[gaps]]
id = "rpm-exact-default-migration"
severity = "none"
parity_relation = "non_finding"
disposition = "no_action"
origin_main_behavior = "The RPM service seeds its package-owned schema-v1 default."
candidate_behavior = "The RPM pre-start migrator replaces only a byte-identical package v1 default and preserves edited or unsafe paths."
impact = "The implemented exact-default path does not block parity, but environment-file and edited-config behavior remain covered by separate gaps."
resolution = "Retain deterministic migration tests and add a real package upgrade lane."
validation = "Upgrade an installed prior RPM with exact and edited defaults and verify restart, bytes, ownership, and mode."
owner_step = 12

[[gaps]]
id = "gateway-owned-guest-tls"
severity = "none"
parity_relation = "non_finding"
disposition = "no_action"
origin_main_behavior = "Guest callback TLS may be inherited from gateway scope or overridden in the selected local driver table."
candidate_behavior = "One complete gateway-owned bundle is validated and injected into the selected local driver; misplaced driver fields fail explicitly."
impact = "The ownership change fails closed rather than silently disabling callback TLS."
resolution = "Keep the ownership change in the intentional-change ledger and validate callback connectivity on Docker, Podman, and VM."
validation = "Exercise complete, partial, misplaced, and plaintext combinations, then establish a real sandbox callback on each local driver."
owner_step = 10
