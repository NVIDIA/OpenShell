# Step 8 records field-level Kubernetes evidence separately from the broader
# capability manifest. A core pass means both frozen schema v1 and schema v2
# successfully produced and executed the same observed Kubernetes resources.
# A platform-blocked field or value still requires its assigned qualifying lane.
manifest_version = 1
baseline_commit = "74960ebfaeec4673885089ed995fad902459749f"
validated_candidate_commit = "0f08b5822e4da98c9ced3d4b0f2bf4f30dae28fd"
core_comparison = "e2e/configs/gateway/schema-v2-kubernetes-core-comparison.json"

[[coverage]]
id = "shared-combined-core"
status = "pass"
lane = "kind-v1.36.1-rootless-podman-host-gateway"
fields = [
  "namespace",
  "default_image",
  "image_pull_policy",
  "image_pull_secrets",
  "service_account_name",
  "supervisor_image",
  "supervisor_image_pull_policy",
  "grpc_endpoint",
  "ssh_socket_path",
  "client_tls_secret_name",
  "host_gateway_ip",
  "sa_token_ttl_secs",
  "workspace_mode",
  "gateway_id",
  "workspace_default_storage_size",
  "workspace_storage_class",
  "default_runtime_class_name",
  "supervisor_sideload_method",
  "topology",
  "app_armor_profile",
  "sandbox_uid",
  "sandbox_gid",
]
evidence = [
  "Both variants reached Ready through ServiceAccount-token exchange and gateway-minted JWT authentication, then completed callback exec.",
  "The API oracle matched images, Kubernetes pull-policy spelling, pull Secret, ServiceAccount, callback and SSH environment, client TLS mount, host aliases, 600-second token projection, runc RuntimeClass, Unconfined AppArmor request, UID/GID environment, CPU/memory, managed metadata, Bound 64Mi standard PVC, and deletion.",
  "The normalized baseline and candidate results are byte-identical; comparison.json records both successes, parity=true, classification=pass, and accepted=true.",
]

[[coverage]]
id = "operator-namespace-discovery"
status = "platform_blocked"
owner = "OpenShell Kubernetes workspace-mode CI"
lane = "managed-and-operator-workspace-matrix"
fields = ["operator_namespace_label", "operator_namespace_file"]
requirement = "Run paired managed and operator workspace lifecycles with isolated namespace RBAC, label discovery, allowlist hot reload, positive placement, and negative rejection probes."

