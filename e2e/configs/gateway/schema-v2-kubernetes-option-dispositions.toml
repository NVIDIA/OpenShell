  "managed_ssh_ingress.gateway_namespace",
  "managed_ssh_ingress.gateway_pod_selector",
]
requirement = "Run paired managed-workspace creation and inspect the generated NetworkPolicy while proving the configured gateway selector can connect and a nonmatching pod cannot."

