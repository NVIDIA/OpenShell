# Minimal explicit policy for backend lifecycle suites that cannot consume the
# locally migrated community-image fixture. It retains only the community
# image's filesystem, Landlock, and process baseline; tests that need network
# access pass their own purpose-built policies.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox
