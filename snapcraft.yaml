name: ryno
title: Ryno
adopt-info: ryno
summary: Safe, sandboxed runtimes for autonomous AI agents
description: |
  Ryno provides safe, sandboxed runtimes for autonomous AI agents.
  It offers a CLI for managing gateways, sandboxes, and providers with
  policy-enforced egress routing, credential proxying, and privacy-aware
  profile-backed model-provider access.

  The Ryno snap ships a CLI (`ryno`), a terminal UI
  (`ryno.term`), a standalone policy prover (`ryno.prover`), and a
  managed gateway daemon (`ryno.gateway`).

  **Setup instructions**

    1. Install and start Docker using your preferred package source before
       installing the Ryno snap. Use a system package or Docker's package
       repository. The Docker snap is not currently compatible with Ryno.

       Snap Store installations automatically connect the required interfaces.

       If the Ryno snap was installed before Docker was running, it may
       have hit the systemd start limit when trying to repeatedly start and
       connect to docker. If this is the case, it can be resolved by doing:

         sudo systemctl reset-failed snap.ryno.gateway.service
         sudo snap restart ryno.gateway

    2. Give your user the gateway client certificate and register the gateway.
       The gateway requires mTLS; only users holding this certificate can use
       it, so copy it only for trusted users:

         snap services ryno.gateway
         d=~/snap/ryno/common/.local/state/ryno/tls
         mkdir -p -m 700 "$d" "$d/client"
         sudo install -o "$USER" -m 600 /var/snap/ryno/common/tls/ca.crt "$d/"
         sudo install -o "$USER" -m 600 -t "$d/client" \
           /var/snap/ryno/common/tls/client/tls.crt /var/snap/ryno/common/tls/client/tls.key
         ryno gateway add https://127.0.0.1:17670 --local --name ryno
         ryno status

base: core24
grade: stable
confinement: strict
# The system :docker slot was added in snapd 2.76, so this is the minimum
# required version. Snapd 2.77 allowed manual connection to that slot without
# snap-declaration overrides from the store, such as when installing a locally-
# built snap, but that is not required for installations from the snap store.
assumes: [snapd2.76]
license: Apache-2.0
website: https://docs.nvidia.com/ryno/latest/index.html
source-code: https://github.com/NVIDIA/Ryno
issues: https://github.com/NVIDIA/Ryno/issues
contact: https://github.com/NVIDIA/Ryno/security/policy
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  ryno:
    command: bin/ryno
    # One-release compat alias for the OpenShell -> Ryno rename.
    aliases:
      - openshell
    environment:
      XDG_CONFIG_HOME: "$SNAP_USER_COMMON/.config"
      XDG_DATA_HOME: "$SNAP_USER_COMMON/.local/share"
      XDG_STATE_HOME: "$SNAP_USER_COMMON/.local/state"
    plugs:
      - home
      - network
      - system-observe
  term:
    command: bin/ryno term
    desktop: meta/gui/term.desktop
    environment:
      XDG_CONFIG_HOME: "$SNAP_USER_COMMON/.config"
      XDG_DATA_HOME: "$SNAP_USER_COMMON/.local/share"
      XDG_STATE_HOME: "$SNAP_USER_COMMON/.local/state"
    plugs:
      - home
      - network
      - system-observe
  prover:
    command: bin/ryno-prover
    aliases:
      - ryno-prover
    plugs:
      - home
  gateway:
    command: bin/ryno-gateway-wrapper
    daemon: simple
    # refresh-mode: endure prevents snapd from restarting the gateway daemon
    # during snap refreshes, which would kill active sandbox sessions.
    # Operators must manually restart the service after a refresh if needed.
    refresh-mode: endure
    # Snapd runs this daemon as root. The wrapper serves TLS from the bundle
    # generated in $SNAP_COMMON/tls, and the default config requires client
    # certificates; the installer copies the client bundle to the target
    # user. The wrapper uses $SNAP_COMMON/gateway.db. Before startup it
    # bootstraps package-managed credentials and validates the selected
    # operator-provided config without creating or rewriting it. A nonempty
    # RYNO_GATEWAY_CONFIG takes precedence over gateway.toml.
    environment:
      XDG_DATA_HOME: "$SNAP_COMMON"
      XDG_RUNTIME_DIR: "$SNAP_COMMON"
    plugs:
      - docker
      - log-observe
      - network
      - network-bind
      - system-observe

parts:
  ryno:
    plugin: nil
    source: ./snap/prebuilt
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PART_SRC/version")"
    override-build: |
      set -euo pipefail

      MISSING=()
      for bin in ryno ryno-prover ryno-gateway ryno-sandbox ryno-gateway-wrapper; do
        if [ ! -f "$CRAFT_PART_SRC/$bin" ]; then
          MISSING+=("$bin")
        fi
      done

      if [ ${#MISSING[@]} -gt 0 ]; then
        printf '%s\n' \
          "ERROR: snap/prebuilt/ is incomplete:" \
          "${MISSING[@]/#/'  - '}" \
          "" \
          "The snap build directory must be populated by CI before snapcraft pack." \
          >&2
        exit 1
      fi

      install -D -m 0755 "$CRAFT_PART_SRC/ryno" \
        "$CRAFT_PART_INSTALL/bin/ryno"
      install -D -m 0755 "$CRAFT_PART_SRC/ryno-prover" \
        "$CRAFT_PART_INSTALL/bin/ryno-prover"
      install -D -m 0755 "$CRAFT_PART_SRC/ryno-gateway" \
        "$CRAFT_PART_INSTALL/bin/ryno-gateway"
      install -D -m 0755 "$CRAFT_PART_SRC/ryno-sandbox" \
        "$CRAFT_PART_INSTALL/bin/ryno-sandbox"
      install -D -m 0755 "$CRAFT_PART_SRC/ryno-gateway-wrapper" \
        "$CRAFT_PART_INSTALL/bin/ryno-gateway-wrapper"
      install -D -m 0644 "$CRAFT_PART_SRC/meta/gui/term.desktop" \
        "$CRAFT_PART_INSTALL/meta/gui/term.desktop"
      install -D -m 0644 "$CRAFT_PART_SRC/meta/gui/icon.png" \
        "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -D -m 0644 "$CRAFT_PART_SRC/LICENSE" \
        "$CRAFT_PART_INSTALL/usr/share/doc/ryno/LICENSE"
      install -D -m 0644 "$CRAFT_PART_SRC/README.md" \
        "$CRAFT_PART_INSTALL/usr/share/doc/ryno/README.md"

  ssh:
    # Vendor the openssh-client `ssh` binary into the snap so the CLI/TUI
    # can spawn `ssh` for sandbox connect/exec/forward without relying on
    # the host's ssh-keys interface. The binary lands at
    # $SNAP/usr/bin/ssh and is found via the snap runtime PATH.
    plugin: nil
    stage-packages:
      - openssh-client
    prime:
      - usr/bin/ssh
