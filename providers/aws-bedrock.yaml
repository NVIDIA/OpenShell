id: aws-bedrock
display_name: AWS Bedrock
description: |
  Anthropic + Mistral + Llama models served via the AWS Bedrock InvokeModel API.

  This built-in profile is declarative only. It does not grant egress or
  inject credentials because OpenShell does not sign AWS requests. Import an
  endpoint-bearing custom profile and use an AWS-capable client in the sandbox
  to access Bedrock directly.
category: inference
inference_capable: true
credentials:
  # Declarative-only. None are required or injected by this profile.
  - name: aws_access_key_id
    description: AWS access key ID (unused by this built-in profile)
    env_vars: [AWS_ACCESS_KEY_ID]
    required: false
  - name: aws_secret_access_key
    description: AWS secret access key (unused by this built-in profile)
    env_vars: [AWS_SECRET_ACCESS_KEY]
    required: false
  - name: aws_session_token
    description: Optional session token for temporary credentials (STS, IAM Roles for Service Accounts)
    env_vars: [AWS_SESSION_TOKEN]
    required: false
  - name: aws_region
    description: AWS region (unused by this built-in profile)
    env_vars: [AWS_REGION, AWS_DEFAULT_REGION]
    required: false
discovery:
  # The built-in profile does not consume AWS credentials, so
  # `--from-existing` does not scan for them.
  credentials: []
# Endpoints and binaries are intentionally empty. Use a custom profile to
# declare the exact Bedrock endpoint and authorized client binaries.
endpoints: []
binaries: []
