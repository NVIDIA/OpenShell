id: aws-bedrock
display_name: AWS Bedrock
description: |
  Native AWS Bedrock Runtime APIs with proxy-side SigV4 credential signing.
category: inference
inference_capable: true
credentials:
  - name: aws_access_key_id
    description: AWS access key ID
    env_vars: [AWS_ACCESS_KEY_ID]
    required: true
  - name: aws_secret_access_key
    description: AWS secret access key
    env_vars: [AWS_SECRET_ACCESS_KEY]
    required: true
  - name: aws_session_token
    description: Optional session token for temporary credentials (STS, IAM Roles for Service Accounts)
    env_vars: [AWS_SESSION_TOKEN]
    required: false
discovery:
  credentials: [aws_access_key_id, aws_secret_access_key, aws_session_token]
endpoints:
  - host: "bedrock-runtime.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4:body
    signing_service: bedrock
  - host: "bedrock-runtime-fips.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4:body
    signing_service: bedrock
  - host: "bedrock-runtime.*.amazonaws.com.cn"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4:body
    signing_service: bedrock
binaries:
  - /sandbox/.venv/bin/python
  - /sandbox/.venv/bin/python3
  - /sandbox/.uv/python/**
  - /usr/bin/python3
  - /usr/bin/python3.*
  - /usr/bin/curl
  - /usr/local/bin/aws
  - /bin/bash
