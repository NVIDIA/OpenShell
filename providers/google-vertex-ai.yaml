# Example provider profile. OpenShell does not load it; import it explicitly:
#   openshell provider profile lint   -f providers/google-vertex-ai.yaml
#   openshell provider profile import -f providers/google-vertex-ai.yaml --global
#
# Copy and edit this file rather than importing it unchanged. `binaries` is the
# least-privilege control that decides which processes may reach the endpoints
# below, so it has to name the paths in *your* image.
#
# Client binaries:   none declared. Add the binaries that call Vertex — the SDK
#                    interpreter, curl, or an agent CLI — before relying on
#                    binary-scoped attribution for this profile.
# Reference layout:  any image with a Vertex-capable client. The profile also
#                    projects VERTEX_AI_PROJECT_ID and VERTEX_AI_REGION into the
#                    sandbox so SDKs and agent CLIs pick up the target project.
# Credential scope:  a gateway-refreshed Google access token, as
#                    GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN (service-account JWT)
#                    or GOOGLE_VERTEX_AI_TOKEN (gcloud ADC), sent as a bearer
#                    authorization header. GOOGLE_SERVICE_ACCOUNT_KEY is refresh
#                    bootstrap material and is never injected into the sandbox.
# Endpoint access:   the aiplatform.googleapis.com regional and replicated hosts,
#                    read-write, L7 enforced.
# Smoke test:        openshell sandbox create --provider <name> -- \
#                      curl -sS -H "Authorization: Bearer $GOOGLE_VERTEX_AI_TOKEN" \
#                        https://us-central1-aiplatform.googleapis.com/v1/projects/$VERTEX_AI_PROJECT_ID/locations/us-central1/publishers/google/models

id: google-vertex-ai
display_name: Google Vertex AI
description: Google Vertex AI inference provider (Anthropic Claude, Gemini, and third-party models)
category: inference
inference_capable: true
credentials:
  - name: service_account_key
    description: Google service account JSON refresh bootstrap material; not injected into sandboxes
    env_vars: [GOOGLE_SERVICE_ACCOUNT_KEY]
    required: false
  - name: service_account_token
    description: Google Cloud access token refreshed from service account JWT material
    env_vars: [GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN, VERTEX_AI_SERVICE_ACCOUNT_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: google_service_account_jwt
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - name: client_email
          description: Google service account email
          required: true
        - name: private_key
          description: Google service account private key
          required: true
          secret: true
        - name: subject
          description: Optional delegated user email for domain-wide delegation
  - name: gcloud_adc_token
    description: Google Cloud access token refreshed via gcloud Application Default Credentials
    env_vars: [GOOGLE_VERTEX_AI_TOKEN, VERTEX_AI_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - name: client_id
          description: Google OAuth2 client ID from gcloud ADC
          required: true
        - name: client_secret
          description: Google OAuth2 client secret from gcloud ADC
          required: true
          secret: true
        - name: refresh_token
          description: Google OAuth2 refresh token from gcloud ADC
          required: true
          secret: true
discovery:
  credentials: [service_account_token, gcloud_adc_token]
endpoints:
  - host: "*-aiplatform.googleapis.com"
    ports: [443]
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.googleapis.com"
    ports: [443]
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.us.rep.googleapis.com"
    ports: [443]
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.eu.rep.googleapis.com"
    ports: [443]
    protocol: rest
    access: read-write
    enforcement: enforce
