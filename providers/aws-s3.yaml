# Example provider profile. OpenShell does not load it; import it explicitly:
#   openshell provider profile lint   -f providers/aws-s3.yaml
#   openshell provider profile import -f providers/aws-s3.yaml --global
#
# Copy and edit this file rather than importing it unchanged. `binaries` is the
# least-privilege control that decides which processes may reach the endpoints
# below, so it has to name the paths in *your* image.
#
# Client binaries:   python, python3, curl, aws, bash.
# Reference layout:  the venv and uv paths below (/sandbox/.venv,
#                    /sandbox/.uv/python) are OpenShell Community image paths,
#                    and /usr/local/bin/aws assumes the AWS CLI v2 installer.
#                    Edit `binaries` to match your image before importing.
#                    `binaries` also matches a process's ancestors, so the
#                    /bin/bash entry reaches every process descended from a
#                    shell — far broader than the other entries. Review it
#                    against your workload before importing.
# Credential scope:  AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
#                    AWS_SESSION_TOKEN, minted by the gateway with one STS
#                    AssumeRole call. The proxy re-signs requests with SigV4 for
#                    the s3 service, so the sandbox never holds a usable
#                    long-lived key.
# Endpoint access:   the S3 regional, dualstack and virtual-hosted-style hosts,
#                    read-write, TLS terminated for SigV4 signing.
# Smoke test:        openshell sandbox create --provider <name> -- \
#                      aws s3 ls s3://<your-bucket>

id: aws-s3
display_name: AWS S3
description: AWS S3 storage via STS temporary credentials
category: other
credentials:
  - name: access_key_id
    description: AWS access key ID (gateway-minted via STS)
    env_vars: [AWS_ACCESS_KEY_ID]
    required: true
    refresh:
      strategy: aws_sts_assume_role
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      # One AssumeRole call mints all three AWS credentials. The refresh is
      # attached to access_key_id (primary); these outputs co-manage the
      # secret key and session token on their sibling credentials.
      additional_outputs:
        - output: secret_access_key
          credential: secret_access_key
        - output: session_token
          credential: session_token
      material:
        - name: role_arn
          description: ARN of the IAM role to assume
          required: true
          secret: false
        - name: session_name
          description: Session name for CloudTrail attribution
          required: false
          secret: false
        - name: external_id
          description: External ID for cross-account role assumption
          required: false
          secret: false
        - name: aws_region
          description: AWS region for STS endpoint
          required: false
          secret: false
        - name: aws_access_key_id
          description: Long-lived IAM access key (only needed if gateway lacks ambient AWS credentials)
          required: false
          secret: false
        - name: aws_secret_access_key
          description: Long-lived IAM secret key (only needed if gateway lacks ambient AWS credentials)
          required: false
          secret: true
        - name: aws_session_token
          description: Session token for temporary source credentials (SSO or a prior AssumeRole); requires the access/secret pair
          required: false
          secret: true
  - name: secret_access_key
    description: AWS secret access key (co-managed with access_key_id)
    env_vars: [AWS_SECRET_ACCESS_KEY]
    required: true
  - name: session_token
    description: AWS session token (co-managed with access_key_id)
    env_vars: [AWS_SESSION_TOKEN]
    required: true
endpoints:
  # S3 regional endpoints. `*` matches exactly one DNS label, so the region
  # wildcard does not cover extra labels like dualstack unless listed.
  # us-east-1 uses the global endpoint without a region label.
  - host: "*.s3.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
  - host: "s3.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
  - host: "*.s3.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
  - host: "s3.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
  - host: "*.s3.dualstack.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
  - host: "s3.dualstack.*.amazonaws.com"
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
    credential_signing: sigv4
    signing_service: s3
binaries:
  - /sandbox/.venv/bin/python
  - /sandbox/.venv/bin/python3
  - /sandbox/.uv/python/**
  - /usr/bin/python3
  - /usr/bin/python3.*
  - /usr/bin/curl
  - /usr/local/bin/aws
  - /bin/bash
