# Example provider profile. OpenShell does not load it; import it explicitly:
#   openshell provider profile lint   -f providers/pypi.yaml
#   openshell provider profile import -f providers/pypi.yaml --global
#
# Copy and edit this file rather than importing it unchanged. `binaries` is the
# least-privilege control that decides which processes may reach the endpoints
# below, so it has to name the paths in *your* image.
#
# Client binaries:   python, python3, pip, uv.
# Reference layout:  the paths below are OpenShell Community image paths — a
#                    virtualenv at /sandbox/.venv or /app/.venv, uv at
#                    /usr/local/bin/uv, uv-managed interpreters under
#                    /sandbox/.uv/python. Almost every other image differs
#                    (/usr/bin/python3, /usr/local/bin/pip, a venv elsewhere).
#                    Edit `binaries` before importing or the profile is inert.
# Credential scope:  none. PyPI access here is anonymous.
# Endpoint access:   pypi.org and files.pythonhosted.org for packages;
#                    downloads.python.org for interpreters; github.com,
#                    api.github.com and objects.githubusercontent.com for
#                    sdists that build from a Git source.
# Smoke test:        openshell sandbox create --provider <name> -- \
#                      python -m pip download --no-deps -d /tmp/wheels requests

id: pypi
display_name: PyPI
description: Python package installation from PyPI and related package sources
category: data
endpoints:
  - host: pypi.org
    port: 443
  - host: files.pythonhosted.org
    port: 443
  - host: github.com
    port: 443
  - host: objects.githubusercontent.com
    port: 443
  - host: api.github.com
    port: 443
  - host: downloads.python.org
    port: 443
binaries:
  - /sandbox/.venv/bin/python
  - /sandbox/.venv/bin/python3
  - /sandbox/.venv/bin/pip
  - /app/.venv/bin/python
  - /app/.venv/bin/python3
  - /app/.venv/bin/pip
  - /usr/local/bin/uv
  - /sandbox/.uv/python/**
