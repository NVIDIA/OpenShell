version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  demo_http:
    name: demo-http-readonly
    endpoints:
      - host: example.com
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/python*
      - path: /usr/local/bin/python*
