apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ryno.clusterRoleBindingName" . }}
  labels:
    {{- include "ryno.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ryno.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ryno.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
