{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ryno.serviceAccountName" . }}
  labels:
    {{- include "ryno.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.serviceAccount.create (include "ryno.workspaceResourcesEnabled" .) .Values.sandboxServiceAccount.create }}
---
{{- end }}
{{- if and (include "ryno.workspaceResourcesEnabled" .) .Values.sandboxServiceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ryno.sandboxServiceAccountName" . }}
  namespace: {{ include "ryno.sandboxNamespace" . }}
  labels:
    {{- include "ryno.labels" . | nindent 4 }}
  {{- with .Values.sandboxServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
