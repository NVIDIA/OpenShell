apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ryno.fullname" . }}-workspace-secret-source
  namespace: {{ include "ryno.sandboxNamespace" . }}
  labels:
    {{- include "ryno.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ryno.fullname" . }}-workspace-secret-source
subjects:
  - kind: ServiceAccount
    name: {{ include "ryno.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
