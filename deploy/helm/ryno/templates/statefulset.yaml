{{- include "ryno.validateValues" . }}
{{- if eq (include "ryno.workloadKind" .) "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ryno.fullname" . }}
  labels:
    {{- include "ryno.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ryno.peerServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ryno.selectorLabels" . | nindent 6 }}
  template:
    {{- include "ryno.gatewayPodTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: ryno-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
{{- end }}
