# SPIRE hardened chart values for the local Helm dev environment.
global:
  spire:
    clusterName: ryno-dev
    jwtIssuer: https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local
    trustDomain: ryno.local

spire-server:
  defaultJwtSvidTTL: 5m
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        ryno-sandboxes:
          enabled: true
          spiffeIDTemplate: 'spiffe://{{ .TrustDomain }}/ryno/sandbox/{{ index .PodMeta.Annotations "ryno.ai/sandbox-id" }}'
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ryno
          podSelector:
            matchLabels:
              ryno.ai/managed-by: ryno
