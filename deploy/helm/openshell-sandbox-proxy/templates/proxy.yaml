{{- $modes := 0 -}}
{{- if .Values.workspace }}{{ $modes = add $modes 1 }}{{ end -}}
{{- if .Values.workspaces }}{{ $modes = add $modes 1 }}{{ end -}}
{{- if .Values.allWorkspaces }}{{ $modes = add $modes 1 }}{{ end -}}
{{- if ne (int $modes) 1 }}{{ fail "select exactly one of workspace, workspaces, or allWorkspaces" }}{{ end -}}
{{- if gt (len .Values.workspaces) 64 }}{{ fail "select at most 64 workspaces" }}{{ end -}}
{{- if ne (len .Values.workspaces) (len (uniq .Values.workspaces)) }}{{ fail "duplicate workspaces are not allowed" }}{{ end -}}
