# Default values for OpenShell

global:
  image:
    # -- Shared OpenShell image registry. Individual image registries take precedence.
    registry: ghcr.io/nvidia
    # -- Shared OpenShell image tag. Defaults to the chart appVersion when empty.
    tag: ""
    # -- Shared OpenShell image pull policy. Individual image pull policies take precedence.
    pullPolicy: IfNotPresent

# Gateway deployment configuration. Null inherits compatibility defaults or a legacy override.
# Explicit canonical values take precedence; application settings stay in gatewayConfig.
gateway:
  image:
    # -- Gateway image registry. Empty uses global.image.registry.
    registry: ""
    # -- Gateway image repository.
    repository: openshell/gateway
    # -- Gateway image pull policy. Empty uses global.image.pullPolicy.
    pullPolicy: null
    # -- Gateway image tag. Defaults to the chart appVersion when empty.
    tag: ""
    # -- Gateway image digest. When set, this takes precedence over tag.
    digest: ""
  # -- (int) Gateway replicas. Defaults to 1; more than one requires externalDbSecret.
  replicaCount: null
  # -- (object) Workload kind (statefulset by default) and multi-replica StatefulSet opt-in.
  workload: null
  # -- (object) Gateway HPA settings. Disabled by default; CPU targets require resource requests.
  autoscaling: null
  # -- (object) Node label selector. Defaults to no selector.
  nodeSelector: null
  # -- (object) Kubernetes node and pod affinity/anti-affinity rules. Defaults to none.
  affinity: null
  # -- (list) Node taint tolerations. Defaults to none.
  tolerations: null
  # -- (string) Pod PriorityClass. Empty by default.
  priorityClassName: null
  # -- (list) Pod topology spread constraints. Defaults to none.
  topologySpreadConstraints: null
  # -- (object) Container resource requests and limits. Gateway defaults to no explicit resources.
  resources: null
  # -- (object) Startup, readiness, and liveness probe timing. Defaults retain the existing probe settings.
  probes: null
  # -- (object) Pod shutdown settings. Gateway terminationGracePeriodSeconds defaults to 30.
  podLifecycle: null
  # -- (object) Additional pod annotations.
  podAnnotations: null
  # -- (object) Additional pod labels. Chart-owned identity labels take precedence.
  podLabels: null
  # -- (object) Pod security context. Gateway fsGroup defaults to 1000.
  podSecurityContext: null
  # -- (object) Container security context. Gateway defaults to non-root UID 1000, no privilege escalation, dropped capabilities, and RuntimeDefault seccomp.
  securityContext: null
  # -- (object) Account create/name/labels/annotations and optional token automount override. Gateway and sandbox create an account by default.
  serviceAccount: null
  # -- (object) Gateway RBAC creation controls. Namespaced and cluster-scoped RBAC are enabled by default.
  rbac: null
  # -- (object) Gateway Service. Defaults to ClusterIP with ports 8080 (grpc), 8081 (health), and 9090 (metrics).
  service: null
  # -- (object) Metrics listener and TLS. Enabled with plaintext transport by default.
  metrics: null
  # -- (object) Credential-driver Kubernetes resource references, namespace creation, and RBAC controls. Runtime backend settings belong in gatewayConfig.
  credentialDrivers: null
  # -- (string) Gateway StatefulSet PVC size. Empty uses 1Gi; changing an existing claim requires PVC expansion.
  dataStorageSize: null
  # -- (string) Gateway StatefulSet PVC StorageClass. Empty uses the cluster default; immutable after install.
  dataStorageClass: null
  # -- (string) Existing PostgreSQL URI Secret (key uri). Empty uses SQLite.
  externalDbSecret: null
  # -- (bool) Disable gateway TLS. Defaults to false; controls mounts, validation, and generated runtime fields.
  disableTls: null
  # -- (object) Gateway TLS Secret references and mTLS enablement. Defaults to openshell-server-tls, openshell-server-client-ca, openshell-client-tls, and enableMtls=true.
  tls: null
  # -- (object) existingSecret selects a pre-provisioned encryption KEK Secret; otherwise the chart retains a generated Secret.
  credentialStorage: null
  # -- (list) Additional gateway environment variables, including Secret-backed valueFrom entries.
  extraEnv: null
  # -- (list) Additional gateway pod volumes.
  extraVolumes: null
  # -- (list) Additional gateway container volume mounts.
  extraVolumeMounts: null
  # -- (string) Environment/CLI-only database URL. Defaults to sqlite:/var/openshell/openshell.db. Use externalDbSecret for PostgreSQL credentials.
  dbUrl: null
  # -- (bool) Environment-only anonymous telemetry enablement. Defaults to true.
  telemetryEnabled: null
  # -- (object) JWT signingSecretName and secretDefaultMode. Runtime identity and TTL belong in gatewayConfig.
  sandboxJwt: null
  # -- (object) OIDC issuer CA ConfigMap reference (caConfigMapName). Runtime authentication settings belong in gatewayConfig.
  oidc: null
  # -- (object) SPIFFE Workload API socket mounting settings (spiffe.enabled and spiffe.workloadApiSocketPath).
  providerTokenGrants: null
  # -- (string) Custom pod scheduler. Empty selects the cluster default.
  schedulerName: null
  # -- (list) Component image pull secrets. Null inherits chart-wide values; an empty list disables inheritance.
  imagePullSecrets: null

supervisor:
  image:
    # -- Supervisor image registry. Empty uses global.image.registry.
    registry: ""
    # -- Supervisor image repository.
    repository: openshell/supervisor
    # -- Supervisor image pull policy. Empty uses global.image.pullPolicy.
    # Prefer always, if_not_present, or never; the chart also accepts legacy
    # Kubernetes spellings Always, IfNotPresent, and Never.
    pullPolicy: null
    # -- Supervisor image tag. Defaults to the chart appVersion when empty.
    tag: ""
    # -- Supervisor image digest. When set, this takes precedence over tag.
    digest: ""
  # -- Shared supervisor pool members, used only when gatewayConfig selects
  # supervisor_topology = "gateway". The gateway always coordinates the shared
  # supervisor as a high-availability pool: when a member fails or leaves,
  # another member takes over its sandboxes without restarting their
  # workloads. 1 has no failover; use 2 or more to survive losing a member.
  # Only the supervisor Deployment's replica count depends on this value, so
  # changing it neither restarts the gateway nor replaces running members.
  # Ignored when supervisor.autoscaling.enabled is true.
  replicas: 1
  autoscaling:
    # -- Enable memory-based autoscaling of the shared supervisor Deployment.
    # Requires supervisor_topology = "gateway" and the Kubernetes resource
    # metrics API (usually Metrics Server). When enabled, the HPA owns the
    # replica count and supervisor.replicas is ignored.
    enabled: false
    # -- Minimum supervisor replicas. Keep at least 2 for failover capacity.
    minReplicas: 2
    # -- Maximum supervisor replicas.
    maxReplicas: 4
    # -- Target average memory working set per supervisor Pod, as a positive
    # Kubernetes quantity. This is an absolute value, not a percentage of
    # requests. Scaling up adds capacity for new sandboxes; it does not move
    # existing sandboxes away from a busy member.
    targetMemoryAverageValue: 512Mi
    # -- HPA scaling behavior. Remove at most one member every two minutes,
    # after a five-minute stabilization window, to allow ownership handoff.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  podDisruptionBudget:
    # -- Render a PodDisruptionBudget with maxUnavailable 1 for the shared
    # supervisor, used only when gatewayConfig selects supervisor_topology =
    # "gateway". Disable it only when maintenance must evict more than one
    # supervisor Pod at a time, or evict a member while another is unavailable.
    enabled: true
  # -- Seconds a sandbox workload stays frozen after losing its pool member's
  # supervision before the sandbox runtime terminates it, rendered as
  # [openshell.gateway.supervisor_pool] recovery_timeout_secs. Must be an
  # integer from 30 to 300. Null leaves the gateway's pool default of 60
  # seconds.
  recoveryTimeoutSeconds: 60
  # Pod security context for the shared supervisor Deployment, rendered only
  # when gatewayConfig selects supervisor_topology = "gateway". On OpenShift,
  # set the user and group IDs to null so the restricted-v2 SCC can assign the
  # namespace range; ci/values-openshift-scc.yaml does this.
  podSecurityContext:
    # -- Require the shared supervisor to run as a non-root user.
    runAsNonRoot: true
    # -- UID assigned to the shared supervisor pod.
    runAsUser: 65534
    # -- Primary GID assigned to the shared supervisor pod.
    runAsGroup: 65534
    # -- fsGroup assigned to the shared supervisor pod.
    fsGroup: 65534
    seccompProfile:
      # -- Seccomp profile applied to the shared supervisor pod.
      type: RuntimeDefault
  # -- Affinity rules for the shared supervisor pod, rendered only when
  # gatewayConfig selects supervisor_topology = "gateway". gateway.affinity
  # applies only to the gateway pod.
  # -- (object) Kubernetes node and pod affinity/anti-affinity rules. Defaults to none.
  affinity: {}
  network:
    # -- Name of an operator-owned ConfigMap with a `ca.crt` key containing additional destination CA certificates for sandbox supervisors. Empty disables additional destination trust.
    additionalCaConfigMapName: ""
  sandboxRuntime:
    # -- Workload boundary TLS listener port.
    boundaryPort: 5500

  # -- (object) Node label selector. Defaults to no selector.
  nodeSelector: {}
  # -- (list) Node taint tolerations. Defaults to none.
  tolerations: []
  # -- (list) Pod topology spread constraints. Defaults to none.
  topologySpreadConstraints: []
  # -- (string) Pod PriorityClass. Empty by default.
  priorityClassName: ''
  # -- (string) Custom pod scheduler. Empty selects the cluster default.
  schedulerName: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  # -- (object) Additional pod labels. Chart-owned identity labels take precedence.
  podLabels: {}
  # -- (object) Additional pod annotations.
  podAnnotations: {}
  podLifecycle:
    terminationGracePeriodSeconds: 60
  # -- (list) Component image pull secrets. Null inherits chart-wide values; an empty list disables inheritance.
  imagePullSecrets: null
  serviceAccount:
    create: false
    name: ''
    annotations: {}
    labels: {}
    automountServiceAccountToken: false

sandbox:
  image:
    # -- Default standalone sandbox image repository.
    repository: nvcr.io/nvidia/base/ubuntu
    # -- Sandbox image tag. Defaults to latest when empty.
    tag: "24.04"
    # -- Sandbox image digest. When set, this takes precedence over tag.
    digest: ""
    # -- Sandbox image pull policy. Leave unset to use the Kubernetes image default.
    pullPolicy: null

  # -- (object) Trusted sandbox runtime image registry/repository/tag/digest/pullPolicy. Defaults to the release openshell/sandbox image.
  runtime: null
  # -- (object) Account create/name/labels/annotations and optional token automount override. Gateway and sandbox create an account by default.
  serviceAccount: null
  # -- (object) Sandbox SSH ingress policy. enabled defaults to true.
  networkPolicy: null
  # -- (string) Shared sandbox namespace. Empty uses the release namespace.
  namespace: null
  # -- (list) Component image pull secrets. Null inherits chart-wide values; an empty list disables inheritance.
  imagePullSecrets: null

# -- Operator-owned corporate forward proxy for policy-approved sandbox egress.
upstreamProxy:
  # -- Proxy URL in http://host:port or https://host:port form. An https:// proxy
  # whose certificate is not publicly trusted also needs caBundle below.
  url: ""
  # -- Comma-separated destinations that bypass only the corporate proxy.
  noProxy: ""
  authSecret:
    # -- Existing Secret in the sandbox namespace containing a user:pass value.
    name: ""
    # -- Secret key containing the proxy credential.
    key: ""
  # -- Required when authSecret is configured because Basic auth to an HTTP proxy is cleartext.
  authAllowInsecure: false
  # -- Last-resort option for hostname-filtering proxy ACLs. It lets the proxy resolve CONNECT targets.
  connectByHostname: false
  caBundle:
    # -- ConfigMap in the release namespace holding the corporate proxy CA bundle.
    # Required for an https:// proxy with a private CA, and for a TLS-intercepting
    # proxy that re-signs upstream certificates. The gateway reads it and stages it
    # into each sandbox's immutable supervisor bootstrap Secret, so the anchor stays
    # in the gateway's trust domain rather than the workload namespace.
    # Supply only the CA that signs your proxy's certificate, or that the proxy
    # re-signs intercepted upstream certificates with. Public roots already come
    # from the supervisor image and its TLS stack, so a full merged trust bundle
    # (for example an OpenShift config.openshift.io/inject-trusted-cabundle
    # ConfigMap) adds hundreds of kilobytes of duplicated roots and can exceed
    # the sandbox boundary's control-frame budget.
    configMapName: ""
    # -- Key inside that ConfigMap. Change this only to reuse an existing
    # ConfigMap whose key is not ca.crt.
    key: ca.crt

# -- Image pull secrets attached to gateway and helper pods.
imagePullSecrets: []
# -- Override the chart name used in generated resource names.
nameOverride: "openshell"
# -- Override the full generated resource name.
fullnameOverride: ""

workspaceResources:
  # -- Create the sandbox ServiceAccount, Role, RoleBinding, and NetworkPolicy
  # from this chart. Disable for a gateway-only release.
  enabled: true

agentSandbox:
  preflight:
    # -- Check the live cluster for a supported Agent Sandbox API before rendering gateway resources. Disable only for offline rendering and linting.
    enabled: true

# -- Non-secret application configuration. Keys name schema-v2 TOML tables.
gatewayConfig:
  openshell:
    version: 2

# Built-in TLS PKI and JWT bootstrap.
pkiInitJob:
  # -- Run a pre-install/pre-upgrade Job that creates gateway and client mTLS
  # Secrets. When certManager.enabled=true, cert-manager owns TLS and this same
  # hook runs in JWT-only mode even if pkiInitJob.enabled remains true.
  enabled: true
  # -- Additional labels on both certificate hook Pods. Chart-owned labels take precedence.
  podLabels: {}
  # -- Additional annotations on both certificate hook Pods.
  podAnnotations: {}
  # -- Extra DNS SANs to append to the server certificate.
  serverDnsNames: []
  # -- Extra IP SANs to append to the server certificate.
  serverIpAddresses: []
  # -- Maximum time in seconds for the certgen hook to poll for cert-manager
  # certificates. When using cert-manager with BackendTLSPolicy, the hook
  # polls for this many seconds waiting for the certificate to be issued,
  # then creates the backend CA ConfigMap. The Job deadline is set to
  # (timeoutSeconds + 30) to allow time for ConfigMap creation and cleanup.
  # Increase this if cert-manager takes longer than 120 seconds to issue
  # certificates.
  timeoutSeconds: 120
  # -- Fail the helm install/upgrade if cert-manager does not issue the
  # certificate within the polling timeout. When true (default), the install
  # fails immediately if the timeout is reached, providing clear feedback that
  # BackendTLSPolicy is non-functional. When false, the hook succeeds with a
  # warning and you can run `helm upgrade` after cert-manager issues the
  # certificate to create the backend CA ConfigMap. If you set this to false and
  # see "TLS error: Secret is not supplied by SDS" when connecting to the gateway,
  # check if the TLS secret exists and run `helm upgrade` to create the ConfigMap.
  failOnTimeout: true
  # Leave runAsUser unset so the OpenShift restricted-v2 SCC can assign the
  # namespace UID.
  securityContext:
    # -- Require the certgen hook container to run as a non-root user.
    runAsNonRoot: true
    # -- Whether the certgen hook container can gain additional privileges.
    allowPrivilegeEscalation: false
    capabilities:
      # -- Linux capabilities dropped from the certgen hook container.
      drop:
        - ALL
    seccompProfile:
      # -- Seccomp profile applied to the certgen hook container.
      type: RuntimeDefault

# cert-manager Certificate/Issuer resources (requires cert-manager CRDs in-cluster).
# Does not install cert-manager itself.
certManager:
  # -- Create cert-manager Issuer and Certificate resources. When enabled,
  # cert-manager owns TLS and the chart runs a JWT-only certgen hook to create
  # the sandbox JWT signing Secret that cert-manager does not manage.
  enabled: false
  # -- Secret created for the intermediate CA (Certificate with isCA: true).
  caSecretName: openshell-ca-tls
  # -- Override the issuerRef for the external server Certificate (e.g. a real
  # LetsEncrypt/ACME ClusterIssuer for a publicly-trusted cert on an external hostname).
  # When set, the chart creates a second server certificate from this issuer
  # with only the hostnames in serverDnsNames; the internal server certificate
  # is always signed by the chart's own CA. Leave name empty to use the chart
  # CA for all server certificates (default). Requires certManager.enabled=true.
  serverIssuerRef:
    name: ""
    kind: ""
    group: ""
  # -- Mount gateway client CA from the internal server TLS secret's ca.crt.
  # The internal server certificate is always signed by the chart CA — the same
  # CA that signs the client (mTLS) certificate — so the default (true) is
  # correct for all configurations, including when serverIssuerRef is set.
  # Only set to false if you mount the client CA from a separate secret via
  # gateway.tls.clientCaSecretName.
  clientCaFromServerTlsSecret: true
  # -- Duration for cert-manager-issued certificates.
  certificateDuration: 8760h
  # -- Renewal window for cert-manager-issued certificates.
  certificateRenewBefore: 720h
  # -- DNS SANs on the cert-manager-issued server certificate.
  serverDnsNames:
    - openshell
    - openshell.openshell.svc
    - openshell.openshell.svc.cluster.local
    - localhost
    - openshell.localhost
    - "*.openshell.localhost"
    - host.docker.internal
  # -- IP SANs on the cert-manager-issued server certificate.
  serverIpAddresses:
    - 127.0.0.1

# Kubernetes Gateway API - GRPCRoute and Gateway resources.
# Requires a Gateway API controller in the cluster. OpenShell tests the
# examples with Envoy Gateway, which can be installed via skaffold.yaml or
# independently:
#   helm install eg oci://docker.io/envoyproxy/gateway-helm \
#     --version v1.4.1 -n envoy-gateway-system --create-namespace
grpcRoute:
  # -- Create a Gateway API GRPCRoute for the gateway service.
  enabled: false
  # -- Hostnames the GRPCRoute matches on. Leave empty to match all hosts.
  hostnames: []
  gateway:
    # -- When true, a Gateway resource is created in the release namespace.
    # Set to false and provide name/namespace to attach to a pre-existing
    # Gateway. Use sectionName to select a specific listener when needed.
    create: false
    # -- GatewayClass for a chart-created Gateway. Set this to the name exposed
    # by your Gateway API implementation. Envoy Gateway uses "eg" in the
    # OpenShell examples. Ignored when gateway.create is false.
    className: "eg"
    # -- Name of the Gateway resource. Defaults to `<fullname>`. Set a distinct
    # name when the selected controller creates a proxy Service with the
    # Gateway name. When gateway.create is false, set this to the name of the
    # existing Gateway.
    name: ""
    # -- Namespace of the Gateway referenced by the GRPCRoute parentRef.
    # Defaults to the release namespace. A chart-created Gateway always resides
    # in the release namespace.
    namespace: ""
    # -- Listener name on an existing Gateway. Leave empty to let Gateway API
    # listener matching select compatible listeners.
    sectionName: ""
    # Listener settings (only used when gateway.create is true).
    listener:
      # -- Listener port for the generated Gateway resource. Use 443 with protocol HTTPS.
      port: 80
      # -- Listener protocol for the generated Gateway resource: HTTP or HTTPS.
      # HTTPS terminates TLS at the Gateway listener; pair it with
      # gateway.disableTls=true so the proxy forwards plaintext to the gateway
      # pod, and use OIDC for client identity (the gateway never sees the client
      # certificate).
      protocol: HTTP
      # -- "Same" restricts attached routes to the release namespace; "All" allows any namespace.
      allowedRoutes: Same
      # TLS settings for the listener. Used only when protocol is HTTPS
      # (mode is always Terminate).
      tls:
        # -- certificateRefs for the HTTPS listener. Required when protocol is
        # HTTPS. Each entry needs a `name` pointing at a kubernetes.io/tls Secret
        # in the Gateway's namespace. May reference a cert-manager-issued Secret
        # or the existing openshell-server-tls Secret (its SANs must include the
        # external hostname).
        certificateRefs: []
  replicaRouting:
    # -- Route requests carrying an `x-openshell-replica` header straight to
    # that gateway replica. The CLI sets the header on long-lived sandbox
    # connections (SSH, port forwards, exec) using the owner the gateway
    # reports, so they skip the relay through a peer replica. Renders one
    # Service per replica. Requires workload.kind=statefulset,
    # workload.allowMultiReplicaStatefulSet=true, and at most 15 replicas.
    enabled: false
  # BackendTLSPolicy for end-to-end TLS between the Gateway proxy and the
  # OpenShell gateway pod. When enabled, the Gateway proxy terminates
  # client-facing TLS at the listener and re-encrypts when connecting to the
  # backend service, validating the backend's certificate against the
  # specified CA. Requires the gateway pod to serve TLS (gateway.disableTls
  # must be false). Supported on OpenShift 4.22+ and other platforms with
  # BackendTLSPolicy support in the Gateway API implementation.
  backendTLSPolicy:
    # -- Create a BackendTLSPolicy resource for end-to-end TLS between the
    # Gateway proxy and the OpenShell gateway pod. The traffic flow is:
    # client → HTTPS → Gateway (terminate) → TLS (re-encrypt) → gateway pod.
    # Requires gateway.disableTls=false and gateway.tls.enableMtls=false. The
    # certgen hook auto-creates the backend CA ConfigMap.
    enabled: false
    # -- Name of the ConfigMap containing the CA certificate (key: ca.crt) used
    # to validate the gateway pod's TLS certificate. Defaults to
    # `<fullname>-backend-ca` when empty. The certgen hook auto-creates this:
    # with pkiInitJob (default), immediately on install/upgrade; with
    # cert-manager, the hook polls for pkiInitJob.timeoutSeconds seconds
    # waiting for cert-manager to issue the server certificate, then creates the
    # ConfigMap. A single install usually succeeds; if cert-manager takes longer,
    # increase pkiInitJob.timeoutSeconds. By default (pkiInitJob.failOnTimeout=true),
    # the install fails if the timeout is reached; set failOnTimeout=false to allow
    # the install to succeed and run `helm upgrade` after the certificate is issued.
    caCertificateConfigMapName: ""
    # -- Hostname the Gateway proxy validates against the backend's TLS
    # certificate SAN. Defaults to the service FQDN
    # (`<fullname>.<namespace>.svc.cluster.local`) when empty, which matches
    # the SAN included by both cert-manager and the pkiInitJob.
    hostname: ""

# OpenShift Route with TLS passthrough. The gateway terminates its own
# TLS/mTLS; the router only forwards based on SNI, so it never sees plaintext
# or the client certificate. Requires gateway.disableTls=false and a server
# cert whose SANs include the Route host (see certManager.serverIssuerRef).
openshiftRoute:
  # -- Create an OpenShift Route with TLS passthrough.
  enabled: false
  # -- Hostname for the Route. Must match a SAN on the gateway's server cert.
  host: ""
  # -- Extra annotations on the Route (e.g. haproxy.router.openshift.io/*).
  annotations: {}
