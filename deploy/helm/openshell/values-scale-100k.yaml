# Sizing profile for a cluster that targets about 100,000 sandboxes on the
# shared supervisor pool: 25 gateway replicas, each serving up to 32
# supervisors, each running up to 128 sandboxes. At the HPA's maximum of 800
# supervisors the pool holds 800 * 128 = 102,400 sandboxes.
#
# Multiple gateway replicas need an external database. Set
# server.externalDbSecret, and size PostgreSQL max_connections for 25
# replicas as the High Availability guide describes:
#
#   helm install openshell deploy/helm/openshell \
#     -f deploy/helm/openshell/values-scale-100k.yaml \
#     --set server.externalDbSecret=<secret>

replicaCount: 25

workload:
  kind: deployment

gatewayConfig:
  openshell.drivers.kubernetes:
    supervisor_topology: gateway

supervisor:
  pool:
    maxInstancesPerMember: 128
    maxMembersPerGateway: 32
  autoscaling:
    enabled: true
    minReplicas: 50
    maxReplicas: 800
