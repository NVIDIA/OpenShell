{{- include "openshell.validateValues" . }}
{{- if eq (include "openshell.workloadKind" .) "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openshell.fullname" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "openshell.peerServiceName" . }}
  {{- if ne (include "openshell.autoscalingEnabled" .) "true" }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openshell.selectorLabels" . | nindent 6 }}
  template:
    {{- include "openshell.gatewayPodTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: openshell-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.gateway.dataStorageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.gateway.dataStorageSize | default "1Gi" | quote }}
{{- end }}
