{{- if and .Values.server.credentialDrivers.kubernetesSecrets.enabled .Values.server.credentialDrivers.kubernetesSecrets.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-credential-secrets
  namespace: {{ include "openshell.credentialKubernetesSecretsNamespace" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
# NOTE: This Role grants access to all Secrets in the namespace because
# OpenShell-managed Secret names are dynamic SHA-256 hashes generated at
# runtime. Kubernetes RBAC does not support label-based or prefix-based
# filtering for resourceNames. To limit blast radius, deploy the gateway
# with a dedicated namespace for credential Secrets
# (server.credentialDrivers.kubernetesSecrets.namespace).
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete
{{- end }}
