{{- $sourceSecretNames := include "openshell.workspaceSecretSourceNames" . | fromJsonArray }}
{{- if $sourceSecretNames }}
# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
# Read the TLS and image-pull Secrets the gateway stages into workspace
# namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-workspace-secret-source
  namespace: {{ include "openshell.sandboxNamespace" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range $sourceSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
{{- end }}
