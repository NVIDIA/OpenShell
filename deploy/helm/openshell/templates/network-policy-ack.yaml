{{- $gatewayConfig := .Values.gatewayConfig | default dict -}}
{{- $kubernetesConfig := get $gatewayConfig "openshell.drivers.kubernetes" | default dict -}}
{{- $sandboxRuntime := get $kubernetesConfig "sandbox_runtime" | default dict -}}
{{- if not (get $sandboxRuntime "network_policy_enforced") }}
{{- fail "gatewayConfig.openshell.drivers.kubernetes.sandbox_runtime.network_policy_enforced must be true after you verify that the cluster CNI enforces ingress and egress NetworkPolicy in every sandbox namespace" }}
{{- end }}
