{{- include "openshell.resolveValues" . -}}
{{- if and (include "openshell.supervisorEnabled" .) .Values.supervisor.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshell.supervisorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- mergeOverwrite (deepCopy (.Values.supervisor.serviceAccount.labels | default dict)) (include "openshell.labels" . | fromYaml) | toYaml | nindent 4 }}
  {{- with .Values.supervisor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
