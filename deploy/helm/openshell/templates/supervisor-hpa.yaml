{{- include "openshell.validateValues" . }}
{{- if eq (include "openshell.supervisorAutoscalingEnabled" .) "true" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openshell.supervisorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openshell.supervisorName" . }}
  minReplicas: {{ .Values.supervisor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.supervisor.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: {{ .Values.supervisor.autoscaling.targetMemoryAverageValue | quote }}
  {{- with .Values.supervisor.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
