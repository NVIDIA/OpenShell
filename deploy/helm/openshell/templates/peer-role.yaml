apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-peer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  # Gateway peer identity: TokenReview authenticates the projected token, then
  # the receiver resolves the returned pod name and UID to the live gateway pod
  # in the release namespace.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  {{- if include "openshell.supervisorEnabled" . }}
  # The Kubernetes driver reads the shared supervisor Service to scope each
  # sandbox's control egress to the supervisor Pods it selects.
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - {{ include "openshell.supervisorName" . }}
    verbs:
      - get
  # The gateway delivers the supervisor token it mints by replacing the token
  # in the chart-created Secret; it creates no Secrets here.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "openshell.supervisorName" . }}-token
    verbs:
      - get
      - patch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell.fullname" . }}-peer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell.fullname" . }}-peer
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
