{{- if .Values.gateway.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshell.serviceAccountName" . }}
  labels:
    {{- mergeOverwrite (deepCopy (.Values.gateway.serviceAccount.labels | default dict)) (include "openshell.labels" . | fromYaml) | toYaml | nindent 4 }}
  {{- with .Values.gateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.gateway.serviceAccount.create (include "openshell.workspaceResourcesEnabled" .) .Values.sandbox.serviceAccount.create }}
---
{{- end }}
{{- if and (include "openshell.workspaceResourcesEnabled" .) .Values.sandbox.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshell.sandboxServiceAccountName" . }}
  namespace: {{ include "openshell.sandboxNamespace" . }}
  labels:
    {{- mergeOverwrite (deepCopy (.Values.sandbox.serviceAccount.labels | default dict)) (include "openshell.labels" . | fromYaml) | toYaml | nindent 4 }}
  {{- with .Values.sandbox.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
