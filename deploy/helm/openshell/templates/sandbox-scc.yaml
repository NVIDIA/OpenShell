{{- if .Values.sandboxServiceAccount.openshift.nonrootSCC }}
# Grant the built-in OpenShift `nonroot-v2` SCC to the sandbox ServiceAccount.
#
# No SecurityContextConstraints object is created: `nonroot-v2` ships with
# OpenShift and already permits exactly what proxy-pod topology needs. It is
# `restricted-v2` with `runAsUser: MustRunAsNonRoot` and `fsGroup: RunAsAny`,
# which admits the driver's explicit non-root UIDs (restricted-v2 rejects them
# because MustRunAsRange only allows UIDs inside the namespace's
# openshift.io/sa.scc.uid-range annotation). It keeps requiredDropCapabilities
# ALL, allowPrivilegeEscalation false, no privileged containers, no host
# namespaces, and seccomp runtime/default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell.fullname" . }}-sandbox-nonroot-scc
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - nonroot-v2
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openshell.fullname" . }}-sandbox-nonroot-scc
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openshell.fullname" . }}-sandbox-nonroot-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell.sandboxServiceAccountName" . }}
    namespace: {{ include "openshell.sandboxNamespace" . }}
{{- end }}
