{{- $fullname := include "openshell.fullname" . }}
{{- range $i := until (int (include "openshell.maxReplicas" $)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-replica-%d" $fullname $i }}
  labels:
    {{- include "openshell.labels" $ | nindent 4 }}
spec:
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
  selector:
    {{- include "openshell.selectorLabels" $ | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ printf "%s-%d" $fullname $i }}
{{- end }}
{{- end }}
