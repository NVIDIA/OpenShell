{{- $mode := .Values.cni.mode | default "conflist" -}}
{{- if and (eq (.Values.supervisor.topology | default "combined") "cni-sidecar") (not .Values.cni.enabled) -}}
{{- fail "supervisor.topology=cni-sidecar requires cni.enabled=true so the OpenShell chained CNI plugin is installed on every node" -}}
{{- end }}
{{- if .Values.cni.enabled }}
{{- if not (has $mode (list "conflist" "multus-chain")) -}}
{{- fail "cni.mode must be \"conflist\" or \"multus-chain\"" -}}
{{- end }}
{{- if and (eq $mode "multus-chain") (not .Values.cni.chainDir) -}}
{{- fail "cni.mode=multus-chain requires cni.chainDir" -}}
{{- end }}
{{- $sandboxNamespace := .Values.server.sandboxNamespace | default .Release.Namespace }}
{{- $cniLogFile := .Values.cni.logFile | default "/var/log/openshell-cni.log" }}
{{- $cniLogDir := dir $cniLogFile }}
{{- $stateDir := .Values.cni.confDir }}
{{- if eq $mode "multus-chain" }}
{{- $stateDir = .Values.cni.stateDir | default .Values.cni.confDir }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "openshell.fullname" . }}-cni
  labels:
    {{- include "openshell.cniLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "openshell.cniSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell.cniLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "openshell.cniServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: install-cni
          image: {{ include "openshell.cniImage" . | quote }}
          imagePullPolicy: {{ include "openshell.cniImagePullPolicy" . | quote }}
          env:
            # Used by `openshell-cni node-ready` to label this node ready/unready
            # so the gateway can gate sandbox scheduling on per-node enforcement.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -ec
            - |
              bin_dir="/host{{ .Values.cni.binDir }}"
              state_dir="/host{{ $stateDir }}"
              host_state_dir="{{ $stateDir }}"
              log_file="{{ $cniLogFile }}"
              host_log_file="/host${log_file}"
              kubeconfig="${state_dir}/openshell-cni-kubeconfig"
              token_file="${state_dir}/openshell-cni-token"
              ca_file="${state_dir}/openshell-cni-ca.crt"
              plugin_config="${state_dir}/openshell-cni-plugin.json"
              mkdir -p "${bin_dir}" "${state_dir}"
              touch "${host_log_file}"
              chmod 0644 "${host_log_file}"
              install -m 0755 /openshell-cni "${bin_dir}/openshell-cni"
              cp /var/run/secrets/kubernetes.io/serviceaccount/ca.crt "${ca_file}"
              cp /var/run/secrets/kubernetes.io/serviceaccount/token "${token_file}"
              chmod 0600 "${token_file}"
              cat > "${kubeconfig}" <<EOF
              apiVersion: v1
              kind: Config
              current-context: openshell-cni
              clusters:
              - name: cluster
                cluster:
                  server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
                  certificate-authority: ${host_state_dir}/openshell-cni-ca.crt
              users:
              - name: openshell-cni
                user:
                  token-file: ${host_state_dir}/openshell-cni-token
              contexts:
              - name: openshell-cni
                context:
                  cluster: cluster
                  user: openshell-cni
              EOF
              cat > "${plugin_config}" <<EOF
              {
                "type": "openshell-cni",
                "openshell": {
                  "kubeconfig": "${host_state_dir}/openshell-cni-kubeconfig",
                  "sandboxNamespaces": [{{ $sandboxNamespace | quote }}],
                  "logLevel": {{ .Values.cni.logLevel | quote }},
                  "logFile": "${log_file}"
                }
              }
              EOF
              # Per-node readiness gate. The gateway sets a required nodeAffinity
              # on sandbox pods for this label, so a node is only eligible once
              # the chained plugin is installed. mark_ready/mark_unready are
              # best-effort: a failed set fails closed (pods keep avoiding the
              # node); a failed clear is retried on the next reconcile tick.
              openshell_cni="/openshell-cni"
              mark_ready() {
                "${openshell_cni}" node-ready --set \
                  || echo "OpenShell CNI: failed to mark node ready" >&2
              }
              mark_unready() {
                "${openshell_cni}" node-ready --clear \
                  || echo "OpenShell CNI: failed to mark node unready" >&2
              }
              {{- if eq $mode "conflist" }}
              conf_dir="/host{{ .Values.cni.confDir }}"
              resolve_conflist_target() {
              {{- if .Values.cni.configFile }}
                printf '%s' "${conf_dir}/{{ .Values.cni.configFile }}"
              {{- else }}
                find "${conf_dir}" -maxdepth 1 -type f -name '*.conflist' ! -name '*openshell*' | sort | head -n 1
              {{- end }}
              }
              patch_conflist() {
                target="$(resolve_conflist_target)"
                if [ -z "${target}" ] || [ ! -f "${target}" ]; then
                  echo "OpenShell CNI requires an existing CNI .conflist in ${conf_dir}" >&2
                  return 1
                fi
                if [ ! -f "${target}.openshell-backup" ]; then
                  cp "${target}" "${target}.openshell-backup"
                fi
                tmp="$(mktemp "${conf_dir}/openshell-cni.XXXXXX")"
                # Only replace the live conflist when jq succeeded AND wrote a
                # non-empty file. This function is invoked through `||`, which
                # disables `set -e` inside it, so a bare `jq; mv` would clobber a
                # working host conflist with an empty file on jq failure and break
                # node networking. Fail closed instead: leave the target intact.
                if jq --slurpfile openshell "${plugin_config}" '
                  .plugins = ((.plugins // []) | map(select(.type != "openshell-cni")) + [$openshell[0]])
                ' "${target}" > "${tmp}" && [ -s "${tmp}" ]; then
                  mv "${tmp}" "${target}"
                else
                  rm -f "${tmp}"
                  echo "OpenShell CNI conflist patch failed (jq error); left ${target} unchanged" >&2
                  return 1
                fi
              }
              # Re-patch only when the chained plugin is absent, so a CNI config
              # rewrite (CNO reconcile, node reimage) or a jq no-op cannot leave the
              # node forwarding sandbox traffic without OpenShell egress enforcement.
              ensure_conflist() {
                target="$(resolve_conflist_target)"
                if [ -n "${target}" ] && [ -f "${target}" ] \
                  && jq -e 'any((.plugins // [])[]; .type == "openshell-cni")' "${target}" >/dev/null 2>&1; then
                  return 0
                fi
                echo "OpenShell CNI re-patching ${target:-<none>}; chained plugin missing (CNI config rewrite or restart)" >&2
                patch_conflist
              }
              patch_conflist || exit 1
              mark_ready
              echo "OpenShell CNI installed (conflist mode); plugin log ${log_file}; firewall backend selected during CNI ADD"
              {{- else }}
              chain_dir="/host{{ .Values.cni.chainDir }}"
              chain_conf="${chain_dir}/openshell-cni.conf"
              mkdir -p "${chain_dir}"
              write_chain_conf() {
                _tmp="$(mktemp "${chain_dir}/openshell-cni.XXXXXX")"
                # Same fail-closed contract as patch_conflist: never install a
                # truncated chain config if jq fails.
                if jq -n --slurpfile openshell "${plugin_config}" \
                  '{"cniVersion": "1.0.0", "name": "openshell-cni"} + $openshell[0]' > "${_tmp}" && [ -s "${_tmp}" ]; then
                  mv "${_tmp}" "${chain_conf}"
                else
                  rm -f "${_tmp}"
                  echo "OpenShell CNI chain conf generation failed (jq error); left ${chain_conf} unchanged" >&2
                  return 1
                fi
              }
              write_chain_conf || exit 1
              mark_ready
              echo "OpenShell CNI installed (multus-chain mode) at ${chain_conf}; plugin log ${log_file}; firewall backend selected during CNI ADD"
              {{- end }}
              tail -n 0 -F "${host_log_file}" &
              tail_pid="$!"
              trap 'kill "${tail_pid}" 2>/dev/null || true; exit 0' INT TERM
              trap 'kill "${tail_pid}" 2>/dev/null || true' EXIT
              while true; do
                cp /var/run/secrets/kubernetes.io/serviceaccount/token "${token_file}"
                chmod 0600 "${token_file}"
                {{- if eq $mode "conflist" }}
                # Keep the node's readiness label in lockstep with enforcement:
                # mark unready if the chained plugin cannot be restored, so no new
                # sandbox pods schedule here until it is.
                if ensure_conflist; then mark_ready; else mark_unready; fi
                {{- else }}
                if { [ -f "${chain_conf}" ] || write_chain_conf; }; then mark_ready; else mark_unready; fi
                {{- end }}
                sleep 300
              done
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -ec
                  - |
                    # Fence the node before removing enforcement so no sandbox pod
                    # schedules here during teardown.
                    /openshell-cni node-ready --clear || true
                    {{- if eq $mode "conflist" }}
                    conf_dir="/host{{ .Values.cni.confDir }}"
                    for target in "${conf_dir}"/*.conflist; do
                      [ -f "${target}" ] || continue
                      tmp="$(mktemp "${conf_dir}/openshell-cni-cleanup.XXXXXX")"
                      jq '
                        if .plugins then
                          .plugins = (.plugins | map(select(.type != "openshell-cni")))
                        else
                          .
                        end
                      ' "${target}" > "${tmp}"
                      mv "${tmp}" "${target}"
                    done
                    {{- else }}
                    rm -f "/host{{ .Values.cni.chainDir }}/openshell-cni.conf"
                    {{- end }}
                    rm -f \
                      "/host{{ $stateDir }}/openshell-cni-ca.crt" \
                      "/host{{ $stateDir }}/openshell-cni-kubeconfig" \
                      "/host{{ $stateDir }}/openshell-cni-plugin.json" \
                      "/host{{ $stateDir }}/openshell-cni-token"
          volumeMounts:
            - name: cni-bin
              mountPath: /host{{ .Values.cni.binDir }}
            {{- if eq $mode "conflist" }}
            - name: cni-conf
              mountPath: /host{{ .Values.cni.confDir }}
            {{- else }}
            - name: cni-chain
              mountPath: /host{{ .Values.cni.chainDir }}
            - name: cni-state
              mountPath: /host{{ $stateDir }}
            {{- end }}
            - name: cni-log
              mountPath: /host{{ $cniLogDir }}
          {{- with .Values.cni.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: cni-bin
          hostPath:
            path: {{ .Values.cni.binDir | quote }}
            type: DirectoryOrCreate
        {{- if eq $mode "conflist" }}
        - name: cni-conf
          hostPath:
            path: {{ .Values.cni.confDir | quote }}
            type: Directory
        {{- else }}
        - name: cni-chain
          hostPath:
            path: {{ .Values.cni.chainDir | quote }}
            type: DirectoryOrCreate
        - name: cni-state
          hostPath:
            path: {{ $stateDir | quote }}
            type: DirectoryOrCreate
        {{- end }}
        - name: cni-log
          hostPath:
            path: {{ $cniLogDir | quote }}
            type: DirectoryOrCreate
      {{- with .Values.cni.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cni.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cni.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
