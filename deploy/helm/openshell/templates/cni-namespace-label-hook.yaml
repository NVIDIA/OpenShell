{{- if eq (.Values.supervisor.topology | default "combined") "cni-sidecar" }}
{{- $sandboxNamespace := .Values.server.sandboxNamespace | default .Release.Namespace }}
{{- $name := printf "%s-cni-ns-label" (include "openshell.fullname" .) | trunc 63 | trimSuffix "-" }}
# Labels this release's sandbox namespace openshell.ai/sandbox=true so the CNI
# singleton auto-discovers and enforces it — no manual allowlist edit, for the
# owner release and any additional cni.external release alike. The label lets the
# installer aggregate every OpenShell sandbox namespace into the plugin allowlist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: cni
---
# Minimal: get/patch on this release's sandbox namespace only (namespaces are
# cluster-scoped, so resourceNames-scoped ClusterRole is the tightest grant).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: cni
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - {{ $sandboxNamespace }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: cni
  annotations:
    # Run after the release's resources (and their RBAC) are in place, on both
    # install and upgrade. Re-runs are idempotent (label set --overwrite).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "openshell.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cni
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: label-namespace
          image: {{ include "openshell.cniImage" . | quote }}
          imagePullPolicy: {{ include "openshell.cniImagePullPolicy" . | quote }}
          command:
            - /openshell-cni
            - label-namespace
            - {{ $sandboxNamespace | quote }}
{{- end }}
