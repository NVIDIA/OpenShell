{{- $workspaceMode := .Values.server.drivers.kubernetes.workspaceMode | default "shared" }}
{{- $supervisorNetwork := .Values.supervisor.network | default dict }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell.clusterRoleName" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get"]
  {{- if and (ne $workspaceMode "shared") .Values.server.drivers.kubernetes.allowDriverConfig }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  {{- end }}
  # Validate projected ServiceAccount tokens during sandbox bootstrap and
  # internal gateway peer authentication.
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # Read namespace annotations for OpenShift SCC UID/GID range resolution.
  # Managed/operator modes additionally need list+watch for cluster-wide
  # namespace discovery. Managed mode needs create+delete for namespace
  # lifecycle.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      {{- if ne $workspaceMode "shared" }}
      - list
      - watch
      {{- end }}
      {{- if eq $workspaceMode "managed" }}
      - create
      - delete
      {{- end }}
  {{- if ne $workspaceMode "shared" }}
  # Cluster-wide sandbox CRD access for managed/operator workspace modes.
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  {{- end }}
  {{- if and (ne $workspaceMode "shared") (get $supervisorNetwork "additionalCaConfigMapName") }}
  # The Kubernetes driver creates and verifies immutable, content-addressed
  # destination-CA ConfigMaps. Kubernetes RBAC supports exact resourceNames
  # only, not the digest-bearing name prefix, and CREATE cannot be restricted
  # by resourceNames. This ClusterRole is bound cluster-wide in managed and
  # operator modes, so keep the required capability to get/create only: the
  # driver never lists, watches, patches, updates, or deletes these objects.
  # Use a dedicated gateway service account and namespace-scoped bindings when
  # this read boundary matters.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
  {{- end }}
  {{- if ne $workspaceMode "shared" }}
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  # Operator-mode namespaces receive Secret permissions from the openshell-workspace
  # chart Role instead.
  - apiGroups: [""]
    resources: ["secrets"]
    # Bootstrap and image-pull Secrets are generation-scoped. Recovery deletes
    # them by exact name.
    verbs: ["create", "delete"]
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  # ServiceAccount creation in managed namespaces.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
  {{- if .Values.networkPolicy.enabled }}
  # Apply gateway-only SSH ingress isolation in managed namespaces.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - create
      - patch
      - update
  {{- end }}
  {{- end }}
{{- end }}
