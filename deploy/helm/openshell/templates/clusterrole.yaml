{{- $gatewayConfig := .Values.gatewayConfig | default dict -}}
{{- $kubernetesConfig := get $gatewayConfig "openshell.drivers.kubernetes" | default dict -}}
{{- $workspaceMode := get $kubernetesConfig "workspace_mode" | default "shared" }}
{{- $managedSshIngress := get $gatewayConfig "openshell.drivers.kubernetes.managed_ssh_ingress" | default dict -}}
{{- $managedSshIngressEnabled := true -}}
{{- if hasKey $managedSshIngress "enabled" -}}
{{- $managedSshIngressEnabled = get $managedSshIngress "enabled" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell.fullname" . }}-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  # Validate projected sandbox ServiceAccount tokens during the
  # IssueSandboxToken bootstrap exchange.
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # Read namespace annotations for OpenShift SCC UID/GID range resolution.
  # Managed/operator modes additionally need list+watch for cluster-wide
  # namespace discovery. Managed mode needs create+delete for namespace
  # lifecycle.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      {{- if ne $workspaceMode "shared" }}
      - list
      - watch
      {{- end }}
      {{- if eq $workspaceMode "managed" }}
      - create
      - delete
      {{- end }}
  {{- if ne $workspaceMode "shared" }}
  # Cluster-wide sandbox CRD access for managed/operator workspace modes.
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  {{- end }}
  {{- $copiedSecretNames := list }}
  {{- if and (ne $workspaceMode "shared") (not .Values.server.disableTls) }}
  {{- $copiedSecretNames = append $copiedSecretNames .Values.server.tls.clientTlsSecretName }}
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  {{- range (get $kubernetesConfig "image_pull_secrets" | default list) }}
  {{- if . }}
  {{- $copiedSecretNames = append $copiedSecretNames . }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if ne $workspaceMode "shared" }}
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    # Bootstrap Secrets are generation-scoped. Recovery lists them by label and
    # deletes stale generations with UID preconditions before retrying creation.
    verbs: ["create", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]
  {{- end }}
  {{- $copiedSecretNames = uniq $copiedSecretNames }}
  {{- if $copiedSecretNames }}
  # Copy only explicitly configured TLS and image-pull Secrets into workspace
  # namespaces. Server-side apply authorizes these requests as patch operations.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range $copiedSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
      - patch
  # Server-side apply uses PATCH for an existing Secret, but the API server
  # additionally authorizes CREATE when the named Secret does not exist yet.
  # Kubernetes RBAC cannot restrict CREATE by resourceNames because create
  # authorization happens before the object name is available to RBAC. Keep
  # reads and mutations name-restricted above; this broader grant is required
  # only to create the initial copy in a gateway-owned managed namespace.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  {{- end }}
  {{- if and (ne $workspaceMode "shared") (eq (include "openshell.credentialDriverEnabled" (list . "kubernetes-secrets")) "true") }}
  # The kubernetes-secrets credential driver uses dynamic hashed names in
  # workspace namespaces, so Kubernetes RBAC cannot restrict resourceNames.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  # ServiceAccount creation in managed namespaces.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
  {{- if $managedSshIngressEnabled }}
  # Apply gateway-only SSH ingress isolation in managed namespaces.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - create
      - patch
      - update
  {{- end }}
  {{- end }}
