{{- $workspaceMode := .Values.server.drivers.kubernetes.workspaceMode | default "shared" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell.fullname" . }}-node-reader
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  # Validate projected sandbox ServiceAccount tokens during the
  # IssueSandboxToken bootstrap exchange.
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # Read namespace annotations for OpenShift SCC UID/GID range resolution.
  # Managed/operator modes additionally need list+watch for cluster-wide
  # namespace discovery. Managed mode needs create+delete for namespace
  # lifecycle.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      {{- if ne $workspaceMode "shared" }}
      - list
      - watch
      {{- end }}
      {{- if eq $workspaceMode "managed" }}
      - create
      - delete
      {{- end }}
  {{- if ne $workspaceMode "shared" }}
  # Cluster-wide sandbox CRD access for managed/operator workspace modes.
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  {{- end }}
  {{- $copiedSecretNames := list }}
  {{- if and (ne $workspaceMode "shared") (not .Values.server.disableTls) }}
  {{- $copiedSecretNames = append $copiedSecretNames .Values.server.tls.clientTlsSecretName }}
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  {{- range .Values.server.sandboxImagePullSecrets }}
  {{- if .name }}
  {{- $copiedSecretNames = append $copiedSecretNames .name }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- $copiedSecretNames = uniq $copiedSecretNames }}
  {{- if $copiedSecretNames }}
  # Copy only explicitly configured TLS and image-pull Secrets into workspace
  # namespaces. Server-side apply authorizes these requests as patch operations.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range $copiedSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
      - patch
  # Server-side apply uses PATCH for an existing Secret, but the API server
  # additionally authorizes CREATE when the named Secret does not exist yet.
  # Kubernetes RBAC cannot restrict CREATE by resourceNames because create
  # authorization happens before the object name is available to RBAC. Keep
  # reads and mutations name-restricted above; this broader grant is required
  # only to create the initial copy in a gateway-owned managed namespace.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  {{- end }}
  {{- if and (ne $workspaceMode "shared") .Values.server.credentialDrivers.kubernetesSecrets.enabled }}
  # The kubernetes-secrets credential driver uses dynamic hashed names in
  # workspace namespaces, so Kubernetes RBAC cannot restrict resourceNames.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete
  {{- end }}
  {{- if eq $workspaceMode "managed" }}
  # ServiceAccount creation in managed namespaces.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
  {{- if .Values.networkPolicy.enabled }}
  # Apply gateway-only SSH ingress isolation in managed namespaces.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - create
      - patch
      - update
  {{- end }}
  {{- end }}
  {{- if and (ne $workspaceMode "shared") (or (eq (.Values.supervisor.topology | default "combined") "proxy-pod") .Values.supervisor.proxyPod.retainCompanionRbac) }}
  # Proxy-pod topology creates a supervisor Deployment, Service, CA Secret, and
  # NetworkPolicy pair per sandbox in the sandbox's namespace. In managed and
  # operator modes that namespace is per-workspace, so these permissions must be
  # cluster-scoped; shared mode grants the same access through the namespaced
  # Role instead. Companions are owner-referenced to the Sandbox CR and removed
  # by garbage collection when it is deleted, so no `delete` verbs are granted —
  # a compromised gateway must not be able to delete cluster resources. `get`
  # supports crash-recovery reconciliation and, on deployments, readiness and
  # the ServiceAccount-bootstrap owner-chain check. `patch` on deployments scales
  # the supervisor on stop/start. The gateway never reads Secret contents, so
  # Secrets get `create` only (no cluster-wide Secret read). Note: `list`/`watch`
  # on deployments are intentionally NOT granted cluster-wide — the supervisor
  # Deployment readiness watch is enabled only in shared (single-namespace) mode
  # via the namespaced Role; managed/operator modes fold supervisor readiness in
  # through get/list and the periodic reconcile to avoid cluster-wide Deployment
  # enumeration.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  # The agent egress NetworkPolicy (the workload's egress fence) has no owner
  # reference so it can outlive the workload pod during deletion; the gateway
  # manages its lifecycle directly. `delete` tears it down after the pod is gone,
  # and `list` lets reconciliation reap fences orphaned by a gateway crash.
  # Owner-referenced NetworkPolicies (supervisor ingress) are garbage-collected
  # with the Sandbox CR.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
  {{- end }}
