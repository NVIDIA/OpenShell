apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell.fullname" . }}-sandbox
  namespace: {{ include "openshell.sandboxNamespace" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  # Per-sandbox identity: TokenReview authenticates the projected token from
  # the configured sandbox service account, then the gateway resolves the
  # returned pod name and UID to the pod's `openshell.ai/sandbox-id`
  # annotation. patch is intentionally NOT granted — the annotation is set
  # once at pod create and must remain immutable for the lifetime of the
  # sandbox. create/delete/list/watch are intentionally not granted; the Agent
  # Sandbox controller creates agent pods, and proxy-pod supervisors are
  # managed through per-sandbox Deployments.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  {{- if or (eq (.Values.supervisor.topology | default "combined") "proxy-pod") .Values.supervisor.proxyPod.retainCompanionRbac }}
  # Proxy-pod topology creates one supervisor Deployment, one supervisor
  # Service, and one CA Secret per sandbox, all owner-referenced to the Sandbox
  # CR so Kubernetes garbage collection removes them when the CR is deleted —
  # the gateway never deletes companions itself, so no `delete` verbs are
  # granted. `get` supports crash-recovery reconciliation (verifying an existing
  # companion's owner before adopting it) and, on deployments, the readiness and
  # ServiceAccount-bootstrap owner-chain checks. `list` and `watch` on
  # deployments back the supervisor Deployment watch that refreshes sandbox
  # readiness when supervisor availability changes. `patch` on deployments scales
  # the paired supervisor on stop/start. The gateway never reads Secret contents,
  # so Secrets get `create` only. These permissions render only when the
  # Kubernetes driver is configured for proxy-pod topology.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  # The agent egress NetworkPolicy (the workload's egress fence) carries no
  # owner reference so it can outlive the workload pod during deletion; the
  # gateway therefore manages its lifecycle directly. `delete` tears it down
  # after the pod is gone, and `list` lets reconciliation reap fences orphaned by
  # a gateway crash. Owner-referenced NetworkPolicies (supervisor ingress) are
  # still garbage-collected with the Sandbox CR.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
  {{- end }}
{{- end }}
