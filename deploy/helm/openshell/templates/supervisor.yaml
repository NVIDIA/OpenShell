{{- include "openshell.validateValues" . }}
{{- $kubernetes := include "openshell.effectiveKubernetesConfig" . | fromYaml -}}
{{- $imagePullSecrets := get $kubernetes "image_pull_secrets" | default list -}}
{{- range .Values.imagePullSecrets -}}
{{- $imagePullSecrets = append $imagePullSecrets .name -}}
{{- end -}}
{{- if include "openshell.supervisorEnabled" . }}
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
{{- $shared := get $kubernetes "shared_supervisor" }}
{{- $name := include "openshell.supervisorName" . }}
{{- $endpoint := get $kubernetes "grpc_endpoint" }}
{{- $endpointUrl := urlParse $endpoint }}
{{- $gatewayTls := and (not .Values.server.disableTls) .Values.server.tls.clientTlsSecretName }}
{{- $replicas := int64 (include "openshell.supervisorReplicas" .) }}
{{- $pool := gt $replicas 1 }}
# One supervisor process per replica hosts a sandbox instance for each sandbox
# generation placed on it. The process dials the gateway over TLS with the
# supervisor token the gateway mints for it and receives its assignments from
# it; nothing but sandbox runtimes and kubelet probes connect to it. The Pod
# holds no Kubernetes identity of its own: each instance acts only with the
# credentials the gateway issued for its generation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  # Each instance lives in the process hosting it. A single replica has no
  # failover, so Recreate replaces it outright. Two or more replicas form a
  # high-availability pool that rolls one member at a time, starting a new
  # member before an old one leaves; the gateway hands a failed or leaving
  # member's instances to the remaining members.
  {{- if $pool }}
  replicas: {{ $replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "openshell.supervisorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell.supervisorSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if $pool }}
      # A stopping member announces that it is leaving, and the gateway moves
      # its instances to the remaining members before it exits.
      terminationGracePeriodSeconds: 60
      {{- else }}
      terminationGracePeriodSeconds: 30
      {{- end }}
      {{- with ($imagePullSecrets | uniq) }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.supervisor.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $pool }}
      # Prefer separate nodes, so losing one node leaves members to take over
      # its instances.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "openshell.supervisorSelectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: supervisor
          image: {{ get $kubernetes "supervisor_image" | quote }}
          imagePullPolicy: {{ get (dict "always" "Always" "if_not_present" "IfNotPresent" "never" "Never") (get $kubernetes "supervisor_image_pull_policy" | default "if_not_present") | quote }}
          args:
            - --mode=shared
            - --gateway-endpoint
            - {{ $endpoint | quote }}
            - --address
            - 0.0.0.0:5501
            - --token-file
            - /etc/openshell/supervisor-token/token
            - --runtime-listen
            - 0.0.0.0:{{ get $shared "runtime_port" }}
            - --session-root
            - /run/openshell/sessions
          env:
            - name: OPENSHELL_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: OPENSHELL_LOG_LEVEL
              value: info
            {{- if $gatewayTls }}
            - name: OPENSHELL_TLS_CA
              value: /var/run/secrets/openshell-tls/ca.crt
            {{- end }}
            {{- if eq (get $endpointUrl "scheme") "https" }}
            - name: OPENSHELL_GATEWAY_TLS_SERVER_NAME
              value: {{ get $endpointUrl "hostname" | quote }}
            {{- end }}
            {{- if $pool }}
            # Pool membership: the Pod name and UID identify this member, and
            # other members redirect the runtimes of its instances to its Pod
            # IP.
            - name: OPENSHELL_SUPERVISOR_POOL_MEMBER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPENSHELL_SUPERVISOR_POOL_MEMBER_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OPENSHELL_SUPERVISOR_POOL_ADVERTISE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
          ports:
            - name: runtime
              containerPort: {{ get $shared "runtime_port" }}
              protocol: TCP
            - name: health
              containerPort: 5501
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi
          # Process health only: the health listener accepts and closes probe
          # connections. Each instance's readiness is reported to the gateway
          # over the supervisor's own connection to it.
          readinessProbe:
            tcpSocket:
              port: health
          livenessProbe:
            tcpSocket:
              port: health
          volumeMounts:
            - name: run
              mountPath: /run/openshell
            - name: logs
              mountPath: /var/log
            - name: supervisor-token
              mountPath: /etc/openshell/supervisor-token
              readOnly: true
            {{- if $gatewayTls }}
            - name: gateway-ca
              mountPath: /var/run/secrets/openshell-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: supervisor-token
          secret:
            secretName: {{ $name }}-token
        {{- if $gatewayTls }}
        - name: gateway-ca
          secret:
            secretName: {{ .Values.server.tls.clientTlsSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  selector:
    {{- include "openshell.supervisorSelectorLabels" . | nindent 4 }}
  ports:
    - name: runtime
      port: {{ get $shared "runtime_port" }}
      targetPort: runtime
      protocol: TCP
{{- if .Values.networkPolicy.enabled }}
---
# Only sandbox workloads in this gateway's sandbox namespaces reach the routed
# runtime listener. Each sandbox's own egress allowance limits its workload to
# that port, and the routing preface plus the generation's pinned TLS identity
# decide which instance it reaches. The supervisor dials the gateway itself,
# so no ingress from the gateway is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  podSelector:
    matchLabels:
      {{- include "openshell.supervisorSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- include "openshell.supervisorSandboxNamespaces" (dict "kubernetes" $kubernetes) | nindent 12 }}
          podSelector:
            matchLabels:
              openshell.ai/boundary-role: workload
      ports:
        - protocol: TCP
          port: {{ get $shared "runtime_port" }}
  # Instances carry policy-approved sandbox egress, as dedicated supervisors
  # do, and the host reaches the gateway.
  egress:
    - {}
{{- end }}
---
# Delivery of the gateway-minted supervisor token. The chart creates the
# Secret empty; the gateway replaces its `token` on every renewal, and the
# supervisor re-reads the mounted file on each connection attempt. Helm
# upgrades leave the live token in place.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
type: Opaque
{{- if $pool }}
---
# Voluntary disruptions, such as node drains, evict one member at a time, so
# the remaining members can take over its instances.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "openshell.supervisorSelectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
