# Example values for the cni-sidecar topology on vanilla Kubernetes / k3s.
#
# The OpenShell CNI installer is a CLUSTER SINGLETON: one installation enforces
# every OpenShell release's sandbox pods across all namespaces. Enable it in
# exactly one release per cluster.
#
# Copy and adjust the host CNI paths for your distro, then:
#   helm install openshell deploy/helm/openshell -n openshell \
#     -f deploy/helm/openshell/examples/cni-sidecar-k3s.yaml

cni:
  enabled: true
  # conflist (default) appends the OpenShell plugin to an existing CNI .conflist.
  mode: conflist
  # k3s configures containerd with k3s-specific CNI paths. On upstream Kubernetes
  # the defaults (/opt/cni/bin, /etc/cni/net.d) usually apply — drop these two.
  binDir: /bin
  confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d

supervisor:
  topology: cni-sidecar
