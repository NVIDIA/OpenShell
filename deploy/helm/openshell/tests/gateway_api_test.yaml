suite: Gateway API resources
templates:
  - templates/gateway.yaml
  - templates/grpcroute.yaml
release:
  name: openshell
  namespace: openshell

tests:
  - it: gives a chart-created Gateway a non-conflicting default name
    template: templates/gateway.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: true
    asserts:
      - equal:
          path: metadata.name
          value: openshell-ingress
      - equal:
          path: spec.gatewayClassName
          value: eg

  - it: references the same default Gateway from the GRPCRoute
    template: templates/grpcroute.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: true
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: openshell-ingress
      - equal:
          path: spec.parentRefs[0].namespace
          value: openshell
      - notExists:
          path: spec.parentRefs[0].sectionName

  - it: keeps a chart-created Gateway parent in the release namespace
    template: templates/grpcroute.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: true
      grpcRoute.gateway.namespace: another-namespace
    asserts:
      - equal:
          path: spec.parentRefs[0].namespace
          value: openshell

  - it: renders an arbitrary GatewayClass and explicit Gateway name
    template: templates/gateway.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: true
      grpcRoute.gateway.className: custom-class
      grpcRoute.gateway.name: custom-ingress
    asserts:
      - equal:
          path: metadata.name
          value: custom-ingress
      - equal:
          path: spec.gatewayClassName
          value: custom-class

  - it: preserves the ingress suffix for a long chart fullname
    template: templates/gateway.yaml
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijk
      grpcRoute.enabled: true
      grpcRoute.gateway.create: true
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabc-ingress

  - it: attaches to a listener on an existing Gateway
    template: templates/grpcroute.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: false
      grpcRoute.gateway.name: platform-gateway
      grpcRoute.gateway.namespace: gateway-system
      grpcRoute.gateway.sectionName: grpc
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: platform-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: grpc

  - it: does not create a Gateway when attaching to an existing Gateway
    template: templates/gateway.yaml
    set:
      grpcRoute.enabled: true
      grpcRoute.gateway.create: false
      grpcRoute.gateway.name: platform-gateway
    asserts:
      - hasDocuments:
          count: 0
