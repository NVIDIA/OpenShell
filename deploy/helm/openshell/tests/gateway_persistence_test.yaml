suite: gateway data persistence
templates:
  - templates/gateway-config.yaml
  - templates/statefulset.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: requests 1Gi from the cluster default StorageClass by default
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: openshell-data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: renders an explicitly set data storage size and StorageClass
    template: templates/statefulset.yaml
    set:
      server.dataStorageSize: 20Gi
      server.dataStorageClass: fast-ssd
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 20Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast-ssd

  - it: rejects a data storage size without a unit
    template: templates/statefulset.yaml
    set:
      server.dataStorageSize: 20
    asserts:
      - failedTemplate:
          errorMessage: "server.dataStorageSize must be a Kubernetes quantity with a unit, such as 20Gi"
