suite: cert-manager PKI issuerRef overrides
templates:
  - templates/cert-manager-pki.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: defaults both server and client Certificates to the chart's own CA issuer
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: openshell-ca-issuer
        documentIndex: 3
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
        documentIndex: 3
      - equal:
          path: spec.issuerRef.name
          value: openshell-ca-issuer
        documentIndex: 4
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
        documentIndex: 4

  - it: default server Certificate includes internal SANs, IPs, and a fixed commonName
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
    asserts:
      - equal:
          path: spec.commonName
          value: openshell
        documentIndex: 3
      - contains:
          path: spec.dnsNames
          content: openshell.my-namespace.svc.cluster.local
        documentIndex: 3
      - contains:
          path: spec.dnsNames
          content: localhost
        documentIndex: 3
      - equal:
          path: spec.ipAddresses[0]
          value: 127.0.0.1
        documentIndex: 3

  - it: overrides the server Certificate issuerRef when serverIssuerRef is set
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
      certManager.serverIssuerRef.name: letsencrypt-prod
      certManager.serverIssuerRef.kind: ClusterIssuer
      certManager.clientCaFromServerTlsSecret: false
      certManager.serverDnsNames:
        - openshell.example.com
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-prod
        documentIndex: 3
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
        documentIndex: 3
      - equal:
          path: spec.issuerRef.group
          value: cert-manager.io
        documentIndex: 3

  - it: scopes server Certificate SANs to only the configured external hostnames when serverIssuerRef is set
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
      certManager.serverIssuerRef.name: letsencrypt-prod
      certManager.serverIssuerRef.kind: ClusterIssuer
      certManager.clientCaFromServerTlsSecret: false
      certManager.serverDnsNames:
        - openshell.example.com
    asserts:
      - equal:
          path: spec.commonName
          value: openshell.example.com
        documentIndex: 3
      - equal:
          path: spec.dnsNames
          value:
            - openshell.example.com
        documentIndex: 3
      - notExists:
          path: spec.ipAddresses
        documentIndex: 3
      - notContains:
          path: spec.dnsNames
          content: localhost
        documentIndex: 3
      - notContains:
          path: spec.dnsNames
          content: openshell.my-namespace.svc.cluster.local
        documentIndex: 3

  - it: fails when serverIssuerRef is set but clientCaFromServerTlsSecret is true
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
      certManager.serverIssuerRef.name: letsencrypt-prod
      certManager.serverIssuerRef.kind: ClusterIssuer
      certManager.clientCaFromServerTlsSecret: true
      certManager.serverDnsNames:
        - openshell.example.com
    asserts:
      - failedTemplate:
          errorMessage: "certManager.serverIssuerRef.name is set but certManager.clientCaFromServerTlsSecret is still true \u2014 the server cert Secret's ca.crt comes from the external issuer, not the CA that signs the client (mTLS) certificate. Set certManager.clientCaFromServerTlsSecret=false and set server.tls.clientCaSecretName to the secret containing the client CA (e.g. the value of certManager.caSecretName, which defaults to openshell-ca-tls)."

  - it: fails when serverIssuerRef is set but serverDnsNames contains internal-only names
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
      certManager.serverIssuerRef.name: letsencrypt-prod
      certManager.clientCaFromServerTlsSecret: false
      # serverDnsNames is left at the default which contains "openshell.openshell.svc", "localhost", etc.
    asserts:
      - failedTemplate:
          errorMessage: "certManager.serverIssuerRef.name is set (external issuer) but certManager.serverDnsNames contains \"openshell.openshell.svc\" \u2014 external CAs (e.g. ACME / Let's Encrypt) reject internal-only names per CA/Browser Forum baseline requirements. Override certManager.serverDnsNames with your externally-resolvable hostname(s)."

  - it: client Certificate issuerRef is unaffected by serverIssuerRef
    template: templates/cert-manager-pki.yaml
    set:
      certManager.enabled: true
      certManager.serverIssuerRef.name: letsencrypt-prod
      certManager.serverIssuerRef.kind: ClusterIssuer
      certManager.clientCaFromServerTlsSecret: false
      certManager.serverDnsNames:
        - openshell.example.com
    asserts:
      - equal:
          path: spec.issuerRef.name
          value: openshell-ca-issuer
        documentIndex: 4
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
        documentIndex: 4
