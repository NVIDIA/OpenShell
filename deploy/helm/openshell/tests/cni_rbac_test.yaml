suite: cni rbac
templates:
  - templates/cni-rbac.yaml
release:
  name: openshell
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders service account, role and binding when cni enabled
    set:
      cni.enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: -cni$
      - documentIndex: 1
        isKind:
          of: Role
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - get
      - documentIndex: 2
        isKind:
          of: RoleBinding
      - documentIndex: 2
        matchRegex:
          path: subjects[0].name
          pattern: -cni$
      - documentIndex: 2
        matchRegex:
          path: roleRef.name
          pattern: -cni$
      # ClusterRole/ClusterRoleBinding grant the minimal cluster-scoped node
      # get/patch the installer needs to set the readiness label.
      - documentIndex: 3
        isKind:
          of: ClusterRole
      - documentIndex: 3
        contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - patch
      # daemonsets get, scoped by resourceNames to this release's DaemonSet.
      - documentIndex: 3
        contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - daemonsets
            resourceNames:
              - openshell-cni
            verbs:
              - get
      - documentIndex: 4
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 4
        matchRegex:
          path: roleRef.name
          pattern: -cni$

  - it: scopes cni pod-get role to the explicit sandbox namespace
    set:
      cni.enabled: true
      server.sandboxNamespace: agents
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: agents
      - documentIndex: 2
        equal:
          path: metadata.namespace
          value: agents
