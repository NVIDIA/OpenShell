suite: experimental supervisor deployment
templates:
  - templates/experimental-supervisor.yaml
  - templates/gateway-config.yaml
release:
  name: openshell
  namespace: gateway
tests:
  - it: adds no supervisor by default
    template: templates/experimental-supervisor.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: deploys one isolated idle process in the gateway namespace
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
          supervisor_image: example.com/supervisor:experiment
    asserts:
      - equal:
          path: metadata.namespace
          value: gateway
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: openshell-experimental-supervisor
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/supervisor:experiment
      - equal:
          path: spec.template.spec.containers[0].args
          value: [shared, --session-control-listen, "0.0.0.0:5501"]
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: session-control
              containerPort: 5501
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            tcpSocket:
              port: session-control
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            tcpSocket:
              port: session-control
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: renders the same setting into gateway TOML
    template: templates/gateway-config.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - matchRegex:
          path: data["gateway.toml"]
          pattern: 'experimental_supervisor_topology = "gateway"'
  - it: rejects workspace until implemented
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: workspace
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology=workspace is not implemented
  - it: rejects invalid topology
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: invalid
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology must be gateway or workspace; omit it to disable the experiment
  - it: rejects enabled topology for another compute driver
    template: templates/experimental-supervisor.yaml
    set:
      gatewayConfig:
        openshell.gateway:
          compute_driver: docker
        openshell.drivers.kubernetes:
          experimental_supervisor_topology: gateway
    asserts:
      - failedTemplate:
          errorMessage: experimental_supervisor_topology requires the kubernetes compute driver
