suite: gateway autoscaling
templates:
  - templates/hpa.yaml
  - templates/deployment.yaml
  - templates/statefulset.yaml
  - templates/gateway-config.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders no HorizontalPodAutoscaler by default
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps spec.replicas on the default StatefulSet
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: renders an autoscaling/v2 HPA targeting the Deployment from the CI overlay
    template: templates/hpa.yaml
    values:
      - ../ci/values-autoscaling.yaml
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: metadata.name
          value: openshell
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: openshell
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 4
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
      - contains:
          path: spec.metrics
          content:
            type: Pods
            pods:
              metric:
                name: example_adapter_metric
              target:
                type: AverageValue
                averageValue: "100"
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.behavior.scaleDown.policies[0]
          value:
            type: Pods
            value: 1
            periodSeconds: 120

  - it: omits spec.replicas from the Deployment when autoscaling is enabled
    template: templates/deployment.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.replicaCount: 3
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.replicas

  - it: renders memory utilization only when configured
    template: templates/hpa.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.targetMemoryUtilizationPercentage: 70
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 70

  - it: renders only custom metrics when utilization targets are disabled
    template: templates/hpa.yaml
    set:
      gateway.workload.kind: deployment
      gateway.externalDbSecret: my-pg-secret
      gateway.autoscaling.enabled: true
      gateway.autoscaling.targetCPUUtilizationPercentage: null
      gateway.autoscaling.metrics:
        - type: Pods
          pods:
            metric:
              name: example_adapter_metric
            target:
              type: AverageValue
              averageValue: "50"
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].type
          value: Pods

  - it: merges a scale-up policy with the default scale-down behavior
    template: templates/hpa.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
    asserts:
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 0
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300

  - it: omits behavior when set to null
    template: templates/hpa.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.behavior: null
    asserts:
      - notExists:
          path: spec.behavior

  - it: targets a multi-replica StatefulSet with the explicit override
    template: templates/hpa.yaml
    set:
      gateway.externalDbSecret: my-pg-secret
      gateway.workload.allowMultiReplicaStatefulSet: true
      gateway.resources.requests.cpu: 100m
      gateway.autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet

  - it: omits spec.replicas from the StatefulSet when autoscaling is enabled
    template: templates/statefulset.yaml
    set:
      gateway.externalDbSecret: my-pg-secret
      gateway.workload.allowMultiReplicaStatefulSet: true
      gateway.resources.requests.cpu: 100m
      gateway.autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: treats a missing autoscaling map as disabled
    template: templates/statefulset.yaml
    set:
      gateway.autoscaling: null
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: fails when autoscaling can exceed one replica on SQLite
    template: templates/statefulset.yaml
    set:
      gateway.autoscaling.enabled: true
      gateway.resources.requests.cpu: 100m
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.maxReplicas > 1 requires gateway.externalDbSecret"

  - it: fails when autoscaling a StatefulSet without the multi-replica override
    template: templates/statefulset.yaml
    set:
      gateway.autoscaling.enabled: true
      gateway.externalDbSecret: my-pg-secret
      gateway.resources.requests.cpu: 100m
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.maxReplicas > 1 with gateway.workload.kind=statefulset requires gateway.workload.allowMultiReplicaStatefulSet=true"

  - it: fails when maxReplicas is below minReplicas
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.maxReplicas: 1
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.maxReplicas must be greater than or equal to gateway.autoscaling.minReplicas"

  - it: fails when minReplicas is below one
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.minReplicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.minReplicas must be at least 1"

  - it: fails when no autoscaling metric is configured
    template: templates/statefulset.yaml
    set:
      gateway.workload.kind: deployment
      gateway.externalDbSecret: my-pg-secret
      gateway.autoscaling.enabled: true
      gateway.autoscaling.targetCPUUtilizationPercentage: null
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.enabled requires targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage, or gateway.autoscaling.metrics"

  - it: fails when a CPU target has no CPU request
    template: templates/statefulset.yaml
    set:
      gateway.workload.kind: deployment
      gateway.externalDbSecret: my-pg-secret
      gateway.autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetCPUUtilizationPercentage requires a positive gateway.resources.requests.cpu"

  - it: fails when a memory target has no memory request
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.targetMemoryUtilizationPercentage: 70
      gateway.resources.requests.memory: null
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetMemoryUtilizationPercentage requires a positive gateway.resources.requests.memory"

  # Kubernetes copies a limit only into an unset request, so an explicit zero
  # request stays zero and the HPA cannot compute utilization.
  - it: fails when the CPU request is zero even with a CPU limit
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.resources.requests.cpu: 0
      gateway.resources.limits.cpu: "1"
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetCPUUtilizationPercentage requires a positive gateway.resources.requests.cpu"

  - it: fails when the memory request is zero even with a memory limit
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.targetMemoryUtilizationPercentage: 70
      gateway.resources.requests.memory: 0Mi
      gateway.resources.limits.memory: 1Gi
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetMemoryUtilizationPercentage requires a positive gateway.resources.requests.memory"

  - it: fails when the CPU request is a zero quantity string
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.resources.requests.cpu: 0m
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetCPUUtilizationPercentage requires a positive gateway.resources.requests.cpu"

  # The chart renders a null request, which Kubernetes stores as zero instead
  # of copying the limit.
  - it: fails when the CPU request is null even with a CPU limit
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.resources.requests.cpu: null
      gateway.resources.limits.cpu: "1"
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetCPUUtilizationPercentage requires a positive gateway.resources.requests.cpu"

  - it: fails when the CPU request is zero in exponent form
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.resources.requests.cpu: "0e3"
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetCPUUtilizationPercentage requires a positive gateway.resources.requests.cpu"

  - it: fails when the memory request is zero in exponent form
    template: templates/statefulset.yaml
    values:
      - ../ci/values-autoscaling.yaml
    set:
      gateway.autoscaling.targetMemoryUtilizationPercentage: 70
      gateway.resources.requests.memory: "0E+6"
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.targetMemoryUtilizationPercentage requires a positive gateway.resources.requests.memory"

  - it: accepts CPU and memory limits in place of requests
    template: templates/hpa.yaml
    set:
      gateway.workload.kind: deployment
      gateway.externalDbSecret: my-pg-secret
      gateway.autoscaling.enabled: true
      gateway.autoscaling.targetMemoryUtilizationPercentage: 70
      gateway.resources.limits.cpu: "1"
      gateway.resources.limits.memory: 1Gi
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 70

  - it: explains --reuse-values when the autoscaling defaults are missing
    template: templates/statefulset.yaml
    set:
      gateway.workload.kind: deployment
      gateway.externalDbSecret: my-pg-secret
      gateway.resources.requests.cpu: 100m
      # --reuse-values from a release without autoscaling values leaves only
      # the enabled flag that the upgrade sets.
      gateway.autoscaling.enabled: true
      gateway.autoscaling.minReplicas: null
      gateway.autoscaling.maxReplicas: null
      gateway.autoscaling.targetCPUUtilizationPercentage: null
      gateway.autoscaling.metrics: null
      gateway.autoscaling.behavior: null
    asserts:
      - failedTemplate:
          errorPattern: "gateway.autoscaling.minReplicas and gateway.autoscaling.maxReplicas are not set.*--reset-then-reuse-values"

  - it: keeps the replicaCount wording when autoscaling is disabled
    template: templates/statefulset.yaml
    set:
      gateway.replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "gateway.replicaCount > 1 requires gateway.externalDbSecret"
