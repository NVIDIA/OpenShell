suite: workspace Secret source RBAC
templates:
  - templates/workspace-secret-source-role.yaml
  - templates/workspace-secret-source-rolebinding.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders nothing in shared mode
    set:
      server.drivers.kubernetes.workspaceMode: shared
      server.sandboxImagePullSecrets:
        - name: registry-one
    asserts:
      - hasDocuments:
          count: 0

  - it: grants reads of staged Secret sources in the sandbox namespace only
    template: templates/workspace-secret-source-role.yaml
    set:
      server.drivers.kubernetes.workspaceMode: managed
      server.sandboxNamespace: sandboxes
      server.tls.clientTlsSecretName: custom-client-tls
      server.sandboxImagePullSecrets:
        - name: registry-one
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: sandboxes
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["custom-client-tls", "registry-one"]
              verbs: ["get"]

  - it: grants the operator-mode TLS Secret read without image-pull Secrets
    template: templates/workspace-secret-source-role.yaml
    set:
      server.drivers.kubernetes.workspaceMode: operator
      server.sandboxImagePullSecrets:
        - name: registry-one
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: ["openshell-client-tls"]

  - it: renders nothing in operator mode when TLS is disabled
    set:
      server.drivers.kubernetes.workspaceMode: operator
      server.disableTls: true
    asserts:
      - hasDocuments:
          count: 0

  - it: binds the gateway ServiceAccount
    template: templates/workspace-secret-source-rolebinding.yaml
    set:
      server.drivers.kubernetes.workspaceMode: managed
      server.sandboxNamespace: sandboxes
    asserts:
      - equal:
          path: metadata.namespace
          value: sandboxes
      - equal:
          path: subjects[0].name
          value: openshell
      - equal:
          path: subjects[0].namespace
          value: my-namespace
