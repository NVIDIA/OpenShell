suite: ClusterRole RBAC
templates:
  - templates/clusterrole.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: grants managed namespace NetworkPolicy apply permissions
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: omits managed NetworkPolicy permissions when isolation is disabled
    set:
      server.drivers.kubernetes.workspaceMode: managed
      networkPolicy.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
          any: true

  - it: grants secrets patch and delete when credential driver is enabled (operator)
    set:
      server.drivers.kubernetes.workspaceMode: operator
      server.credentialDrivers.kubernetesSecrets.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "update", "patch", "delete"]

  - it: grants secrets patch for TLS sync even when credential driver is disabled (operator)
    set:
      server.drivers.kubernetes.workspaceMode: operator
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "update", "patch"]

  - it: omits secrets rule entirely in shared mode
    set:
      server.drivers.kubernetes.workspaceMode: shared
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
          any: true
