suite: ClusterRole RBAC
templates:
  - templates/clusterrole.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: includes the release namespace in the ClusterRole name
    asserts:
      - equal:
          path: metadata.name
          value: openshell-node-reader-my-namespace

  - it: grants managed namespace NetworkPolicy apply permissions when managed SSH ingress is enabled
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
        openshell.drivers.kubernetes.managed_ssh_ingress:
          enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: preserves sandbox-runtime fence permissions when gateway isolation is disabled
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
        openshell.drivers.kubernetes.managed_ssh_ingress:
          enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["create", "get"]
      - notContains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: grants managed NetworkPolicy permissions independently of the shared-namespace policy toggle
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
        openshell.drivers.kubernetes.managed_ssh_ingress:
          enabled: true
      networkPolicy.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "create", "patch", "update"]

  - it: grants broad secret access when credential driver is enabled (operator)
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: operator
        openshell.gateway:
          credential_drivers: [kubernetes-secrets]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "patch", "delete"]

  - it: restricts operator TLS sync to the configured secret
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: operator
      server.tls.clientTlsSecretName: custom-client-tls
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["custom-client-tls"]
            verbs: ["get", "patch"]

  - it: grants operator bootstrap secret lifecycle permissions when TLS and credential storage are disabled
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: operator
      server.disableTls: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "list", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "create", "patch", "delete"]

  - it: restricts managed copies to TLS and configured image-pull secrets
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
          image_pull_secrets: [registry-one, registry-two]
      server.tls.clientTlsSecretName: custom-client-tls
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["custom-client-tls", "registry-one", "registry-two"]
            verbs: ["get", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "list", "delete"]

  - it: restricts managed copies to image-pull secrets when TLS is disabled
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: managed
          image_pull_secrets: [registry-one]
      server.disableTls: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["registry-one"]
            verbs: ["get", "patch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "list", "delete"]

  - it: omits secrets rule entirely in shared mode
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          workspace_mode: shared
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
          any: true

  - it: grants managed sandbox-runtime companion permissions
    set:
      server.drivers.kubernetes.workspaceMode: managed
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "list", "delete"]

  - it: grants operator sandbox-runtime companion permissions
    set:
      server.drivers.kubernetes.workspaceMode: operator
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["create", "delete", "get", "list", "patch", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "list", "delete"]
