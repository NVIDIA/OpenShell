suite: gateway ConfigMap secret boundary
templates:
  - templates/gateway-config.yaml
  - templates/statefulset.yaml

tests:
  - it: rejects a database URL in gatewayConfig before creating the ConfigMap
    template: templates/statefulset.yaml
    set:
      gatewayConfig.example.database_url: postgresql://gateway:password@database:5432/openshell
    asserts:
      - failedTemplate:
          errorMessage: "gatewayConfig must not contain database_url; provide database credentials through the chart's Secret-backed OPENSHELL_DB_URL environment variable"

  - it: rejects an inline PEM private key before creating the ConfigMap
    template: templates/statefulset.yaml
    set:
      gatewayConfig.example.private_key: "-----BEGIN PRIVATE KEY-----"
    asserts:
      - failedTemplate:
          errorMessage: gatewayConfig must not contain an inline private key; provide it through a Secret-backed file mount

  - it: rejects inline credentials embedded in a URL
    template: templates/statefulset.yaml
    set:
      gatewayConfig.example.endpoint: https://gateway:password@database.example.com
    asserts:
      - failedTemplate:
          errorMessage: gatewayConfig must not contain inline URL credentials; provide them through a Secret-backed environment variable, file, or volume

  - it: rejects URL credentials with an empty username
    template: templates/statefulset.yaml
    set:
      gatewayConfig.example.endpoint: https://:password@database.example.com
    asserts:
      - failedTemplate:
          errorMessage: gatewayConfig must not contain inline URL credentials; provide them through a Secret-backed environment variable, file, or volume

  - it: keeps external database credentials out of gateway.toml
    template: templates/gateway-config.yaml
    set:
      server.externalDbSecret: gateway-database
    asserts:
      - notMatchRegex:
          path: data["gateway.toml"]
          pattern: '(?i)postgresql://|gateway-database|password'

  - it: references external database credentials through an environment variable
    template: templates/statefulset.yaml
    set:
      server.externalDbSecret: gateway-database
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSHELL_DB_URL
            valueFrom:
              secretKeyRef:
                name: gateway-database
                key: uri

  - it: rejects malformed Secret references
    template: templates/statefulset.yaml
    set:
      server.credentialStorage.existingSecret: contains spaces
    asserts:
      - failedTemplate:
          errorMessage: server.credentialStorage.existingSecret must be a valid Kubernetes Secret name

  - it: rejects Secret references longer than the Kubernetes limit
    template: templates/statefulset.yaml
    set:
      server.credentialStorage.existingSecret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorMessage: server.credentialStorage.existingSecret must be no more than 253 characters
