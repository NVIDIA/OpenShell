suite: supervisor gateway wiring
templates:
  - templates/certgen.yaml
  - templates/peer-role.yaml
  - templates/statefulset.yaml
  - templates/gateway-config.yaml
release:
  name: openshell
  namespace: gateway
tests:
  - it: issues no extra PKI for the shared supervisor
    template: templates/certgen.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentIndex: 3
      - equal:
          path: spec.template.spec.containers[0].name
          value: certgen
        documentIndex: 3
  - it: needs no hook for the shared supervisor when the gateway PKI is external
    template: templates/certgen.yaml
    set:
      pkiInitJob:
        enabled: false
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - hasDocuments:
          count: 0
  - it: lets the gateway read only the shared supervisor Service
    template: templates/peer-role.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
            resourceNames:
              - openshell-supervisor
            verbs:
              - get
        documentIndex: 0
  - it: lets the gateway replace only the supervisor token in its Secret
    template: templates/peer-role.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - openshell-supervisor-token
            verbs:
              - get
              - patch
        documentIndex: 0
  - it: grants no supervisor Secret access without the topology
    template: templates/peer-role.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - openshell-supervisor-token
            verbs:
              - get
              - patch
        documentIndex: 0
  - it: keeps the supervisor token Secret off the gateway
    template: templates/statefulset.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: supervisor-token
            secret:
              secretName: openshell-supervisor-token
