suite: supervisor gateway wiring
templates:
  - templates/certgen.yaml
  - templates/peer-role.yaml
  - templates/statefulset.yaml
  - templates/gateway-config.yaml
release:
  name: openshell
  namespace: gateway
tests:
  - it: issues the supervisor host identity with the hook
    template: templates/certgen.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - generate-certs
            - --client-only
            - --client-secret-name=openshell-supervisor-host
        documentIndex: 3
  - it: issues only the supervisor host identity when the gateway PKI is external
    template: templates/certgen.yaml
    set:
      pkiInitJob:
        enabled: false
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentIndex: 3
      - equal:
          path: spec.template.spec.containers[0].name
          value: supervisor-certgen
        documentIndex: 3
  - it: lets the gateway read only the shared supervisor Service
    template: templates/peer-role.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
            resourceNames:
              - openshell-supervisor
            verbs:
              - get
        documentIndex: 0
  - it: projects only the supervisor host CA onto the gateway
    template: templates/statefulset.yaml
    set:
      gatewayConfig:
        openshell.drivers.kubernetes:
          supervisor_topology: gateway
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: supervisor-host-ca
            secret:
              secretName: openshell-supervisor-host
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: supervisor-host-ca
            mountPath: /etc/openshell-tls/supervisor-host
            readOnly: true
