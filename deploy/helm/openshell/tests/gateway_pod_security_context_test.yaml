suite: gateway pod securityContext
templates:
  - templates/gateway-config.yaml
  - templates/statefulset.yaml
  - templates/deployment.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders the pod securityContext from podSecurityContext by default
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: renders an explicitly set podSecurityContext
    template: templates/statefulset.yaml
    set:
      podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: omits the pod securityContext block when podSecurityContext is null
    template: templates/statefulset.yaml
    set:
      podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: keeps the StatefulSet gateway image filesystem read-only
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: keeps the Deployment gateway image filesystem read-only
    template: templates/deployment.yaml
    set:
      workload.kind: deployment
      server.externalDbSecret: openshell-db
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
