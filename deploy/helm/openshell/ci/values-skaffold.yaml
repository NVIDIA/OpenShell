# Merge with values.yaml for Skaffold-driven local image builds (see skaffold.yaml).
gatewayConfig:
  openshell.drivers.kubernetes:
    image_pull_policy: if_not_present
  openshell.gateway.otlp:
    endpoint: http://openshell-collector.observability.svc.cluster.local:4317
  openshell.gateway.auth:
    allow_unauthenticated_users: true

server:
  otlp:
    endpoint: http://openshell-collector.observability.svc.cluster.local:4317
  # Comment out to enforce mTLS (uses PKI secrets generated by pkiInitJob).
  disableTls: true
  # UNSAFE, local development and CI only. With disableTls, PostgreSQL-backed
  # installs (the high-availability profile, the HA and external-PostgreSQL e2e
  # lanes) send gateway peer traffic in plaintext. Ignored when an overlay
  # turns TLS back on, such as ci/values-high-availability-tls.yaml.
  peer:
    allowInsecureTransport: true
  auth:
    allowUnauthenticatedUsers: true

sandbox:
  image:
    pullPolicy: if_not_present

supervisor:
  image:
    pullPolicy: if_not_present
