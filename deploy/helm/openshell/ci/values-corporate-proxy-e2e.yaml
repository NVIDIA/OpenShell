# The Kubernetes corporate-proxy e2e wrapper supplies the generated proxy URL
# and creates `openshell-e2e-proxy-auth` before Helm installs the gateway.
upstreamProxy:
  # The e2e wrapper replaces this endpoint with its dynamically allocated port.
  # Keep the overlay valid when rendered independently as well.
  url: http://host.openshell.internal:8080
  authSecret:
    name: openshell-e2e-proxy-auth
    key: proxy-auth
  authAllowInsecure: true
