# E2E overlay: deploy the gateway in operator workspace mode.
# Namespaces must be pre-provisioned and labeled before sandbox creation.
server:
  drivers:
    kubernetes:
      workspaceMode: "operator"
      operatorNamespaceLabel: "openshell.ai/e2e-operator-workspace=true"
