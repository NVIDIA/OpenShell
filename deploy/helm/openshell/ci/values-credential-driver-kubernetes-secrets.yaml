# Local Kubernetes Secrets credential-driver validation overlay.
#
# Use with:
#   skaffold run -p credential-driver-kubernetes-secrets
#
gatewayConfig:
  openshell.gateway:
    credential_drivers:
      - kubernetes-secrets
  openshell.credential_drivers.kubernetes-secrets:
    namespace: openshell
