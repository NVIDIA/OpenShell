# Create a dedicated agentgateway Gateway and GRPCRoute in the OpenShell
# namespace. Agentgateway names its generated proxy Service after the Gateway,
# so the Gateway must use a name distinct from the OpenShell Service.
grpcRoute:
  enabled: true
  gateway:
    create: true
    className: agentgateway
    name: openshell-ingress
