# Attach OpenShell's GRPCRoute to the shared agentgateway Gateway installed by
# tasks/scripts/agentgateway-k8s-setup.sh. Keeping the proxy Gateway in a
# separate namespace avoids a name collision with OpenShell's Service.
grpcRoute:
  enabled: true
  gateway:
    create: false
    name: openshell-ingress
    namespace: agentgateway-system
    sectionName: grpc
