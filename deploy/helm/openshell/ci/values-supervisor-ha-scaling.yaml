#
# E2E overlay: supervise new sandbox generations with a high-availability pool
# of shared supervisors that starts with one member, so the test can scale it
# to two members and back with `helm upgrade --set supervisor.replicas=N`
# without changing the gateway configuration or the supervisor Pod template.
gatewayConfig:
  openshell.drivers.kubernetes:
    supervisor_topology: gateway

supervisor:
  highAvailability: true
  replicas: 1
  recoveryTimeoutSeconds: 60
