gateway:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Exists
      effect: NoSchedule
  serviceAccount:
    create: true
    name: helm-component-gateway
supervisor:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 1Gi
  serviceAccount:
    create: true
    name: helm-component-supervisor
sandbox:
  serviceAccount:
    create: true
    name: helm-component-workload
