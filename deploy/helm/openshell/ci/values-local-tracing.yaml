# Export gateway traces to the collector that `mise run helm:k3s:create`
# installs. Layer only onto clusters that run that collector.
gatewayConfig:
  openshell.gateway.otlp:
    endpoint: http://openshell-collector.observability.svc.cluster.local:4317
  openshell.gateway.otlp.agent:
    enabled: true
