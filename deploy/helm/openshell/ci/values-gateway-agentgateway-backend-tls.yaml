# Terminate frontend TLS at an OpenShell-owned ListenerSet on the shared
# agentgateway Gateway, then re-encrypt traffic to the OpenShell gateway pod.
# The frontend TLS Secret must exist in the Helm release namespace. The chart's
# certgen hook creates the backend server certificate and CA ConfigMap.
grpcRoute:
  enabled: true
  gateway:
    create: false
    name: openshell-ingress
    namespace: agentgateway-system
  listenerSet:
    enabled: true
    create: true
    name: openshell-tls
    listener:
      name: grpc-tls
      port: 443
      protocol: HTTPS
      allowedRoutes: Same
      tls:
        certificateRefs:
          - name: openshell-ingress-tls
  backendTLSPolicy:
    enabled: true

server:
  # Keep pod TLS enabled for agentgateway's re-encrypted backend connection.
  disableTls: false
  tls:
    # Gateway API BackendTLSPolicy provides one-way TLS; the proxy does not
    # present an OpenShell client certificate to the backend.
    enableMtls: false
