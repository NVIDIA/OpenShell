{{- include "ryno-workspace.validateValues" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ryno-workspace.fullname" . }}-sandbox-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ryno-workspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ryno.ai/managed-by: ryno
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.serviceAccount.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.gateway.networkPolicy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 2222
{{- end }}
