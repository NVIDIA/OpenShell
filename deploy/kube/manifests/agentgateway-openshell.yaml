# Shared agentgateway data-plane Gateway for OpenShell GRPCRoutes.
# No AgentgatewayPolicy timeout override is needed: agentgateway leaves request
# and backend response deadlines unset unless explicitly configured. Unlike
# Envoy Gateway, agentgateway does not use 0s to disable these timeouts.
# See https://agentgateway.dev/docs/kubernetes/latest/documentation/resiliency/timeouts/about/.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshell-ingress
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  # Allow the OpenShell release to add its namespace-local HTTPS listener and
  # certificate through a ListenerSet without owning the shared Gateway.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          kubernetes.io/metadata.name: openshell
  listeners:
    - name: grpc
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
