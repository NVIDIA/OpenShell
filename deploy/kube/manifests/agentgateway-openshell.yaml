# Shared agentgateway data-plane Gateway for OpenShell GRPCRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshell-ingress
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
