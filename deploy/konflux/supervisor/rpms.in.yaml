# RPM dependencies for Dockerfile.konflux.supervisor
# Build + runtime stages combined.
#
# Resolved with `context.bare: true` so the lockfile pins the full dependency
# closure. The image installs RPMs into two different bases (the ubi:9.6 build
# stage and the ubi-minimal runtime stage); bare guarantees every package is
# pinned and prefetched regardless of which base already provides it.
#
# Target arches and repos are declared in this file (not passed on the command
# line) so Konflux MintMaker can regenerate the lockfile with no CLI flags.
# Regenerate manually with:
#   rpm-lockfile-prototype --outfile deploy/konflux/supervisor/rpms.lock.yaml \
#       deploy/konflux/supervisor/rpms.in.yaml
#
# UBI content is public, so repos are inlined here rather than copied from the
# image; rpm-lockfile-prototype resolves versions from the CDN and cannot read
# /etc/yum.repos.d from inside the base image.
contentOrigin:
  repos:
    - repoid: ubi-9-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/baseos/os/
    - repoid: ubi-9-appstream-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/appstream/os/
    # glibc-static (for `-C target-feature=+crt-static`) ships in CodeReady
    # Builder, whose content is public on the UBI CDN.
    - repoid: ubi-9-codeready-builder-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi9/9/$basearch/codeready-builder/os/
packages:
  # Build stage: static glibc + build tools
  - gcc
  - make
  - tar
  - xz
  - glibc-static
  # Build stage: Rust compilation (rustup provides rust/cargo)
  - gcc-c++
  - cmake
  - openssl-devel
  - git-core
  # Runtime stage: network enforcement
  - nftables
  - iptables-nft
  # Runtime stage: network namespace setup
  - iproute
  # Runtime stage: namespace entry
  - util-linux-core
arches:
  - x86_64
  - aarch64
# Exclude weak dependencies (Recommends/Supplements) so the closure is minimal
# and deterministic regardless of the regenerating host's DNF default. Must stay
# in sync with the `--setopt=install_weak_deps=0` flags in the Dockerfile.
installWeakDeps: false
context:
  bare: true
