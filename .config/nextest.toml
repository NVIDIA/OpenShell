[profile.ci]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Print slow test names after 30 seconds and terminate them after two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }
