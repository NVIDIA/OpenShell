[profile.ci]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Print slow test names after 30 seconds and terminate them after two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.e2e-kubernetes]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Flag slow tests after 60s and terminate them after five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# The HA tests scale and roll the shared gateway Deployment, so they cannot
# overlap. Nextest runs each test in its own process. The filter matches test
# names because binary() fails in workspaces without the HA test binary.
[test-groups]
kubernetes-ha = { max-threads = 1 }
kubernetes-shared-supervisor-pool = { max-threads = 1 }

[[profile.e2e-kubernetes.overrides]]
filter = "test(/gateway_(scale_and_rollout|pod_rolls)$/)"
test-group = "kubernetes-ha"

# These change the shared supervisor pool of the release they run against:
# they kill members or gateways, or scale the pool. Never run them at once.
# Test names, not binary(), for the reason above.
[[profile.e2e-kubernetes.overrides]]
filter = "test(/^(losing_a_supervisor_pod_moves_its_sandboxes_without_restarting_them|scaling_a_supervisor_pool_up_and_down_keeps_its_sandboxes_running|pool_sessions_follow_their_supervisors_gateway)$/)"
test-group = "kubernetes-shared-supervisor-pool"

# Scaling the pool runs two bounded Helm upgrades (up to 6 minutes each), waits
# for each member to join or leave, and creates sandboxes until one lands on
# the new member, so it gets 20 minutes instead of five.
[[profile.e2e-kubernetes.overrides]]
filter = "test(/^scaling_a_supervisor_pool_up_and_down_keeps_its_sandboxes_running$/)"
slow-timeout = { period = "60s", terminate-after = 20 }

# Three bounded rollouts (up to 5 minutes each) and four settle and exec rounds.
[[profile.e2e-kubernetes.overrides]]
filter = "test(/^pool_sessions_follow_their_supervisors_gateway$/)"
slow-timeout = { period = "60s", terminate-after = 20 }

# Relative to the profile store dir (`e2e/rust/target/nextest/e2e-kubernetes/`).
[profile.e2e-kubernetes.junit]
path = "../../../../../results/e2e-kubernetes.xml"
