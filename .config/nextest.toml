[profile.ci]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Print slow test names after 30 seconds and terminate them after two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.e2e-kubernetes]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Flag slow tests after 60s and terminate them after five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# The HA tests scale and roll the shared gateway Deployment, so they cannot
# overlap. Nextest runs each test in its own process. The filter matches test
# names because binary() fails in workspaces without the HA test binary.
[test-groups]
kubernetes-ha = { max-threads = 1 }

[[profile.e2e-kubernetes.overrides]]
filter = "test(/gateway_(scale_and_rollout|pod_rolls)$/)"
test-group = "kubernetes-ha"

# Relative to the profile store dir (`e2e/rust/target/nextest/e2e-kubernetes/`).
[profile.e2e-kubernetes.junit]
path = "../../../../../results/e2e-kubernetes.xml"
