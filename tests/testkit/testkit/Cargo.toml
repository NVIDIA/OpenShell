[package]
name = "openshell-testkit"
description = "Shared support for OpenShell end-to-end test suites"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[lib]
name = "testkit"

[dependencies]
openshell-bootstrap = { path = "../../../crates/openshell-bootstrap" }
openshell-core = { path = "../../../crates/openshell-core", default-features = false }
openshell-policy = { path = "../../../crates/openshell-policy" }
openshell-sdk = { path = "../../../crates/openshell-sdk" }
openshell-testkit-macros = { path = "../testkit-macros" }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libtest-mimic = "0.8"
linkme = "0.3"
quick-junit = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
tempfile = "3"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tonic = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A test program, run by `cargo test` and nextest through `testkit::main`'s
# libtest interface, that checks the program's own subcommands.
[[test]]
name = "program"
harness = false
