# The sandbox policy tests start from (testkit::policy::base()): the image's
# system directories read-only, the sandbox's home and /tmp writable, the
# sandbox user, and no network access. Tests add the network access they need
# with testkit::policy::allow().
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
