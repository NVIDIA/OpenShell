# The sandbox policy tests start from (testkit::policy::base()): the image's
# system directories read-only, the sandbox's home and /tmp writable, and no
# network access. Tests add the network access they need with
# testkit::policy::allow(). It names no workload user, so the driver runs the
# image's non-root user, or a default non-root user when the image has none.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
