environments:
  - id: tmachine.ubuntu2404-amd64.k3s.k3s
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: amd64 }
    runtime: k3s
    installer: k3s
    tmachine: { environment: ubuntu-k3s, installer: k3s }
    capabilities: { compute_driver: kubernetes, rootless: false, gpu: false, persistent_workspace: true }
  - id: tmachine.ubuntu2404-arm64.k3s.k3s
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: arm64 }
    runtime: k3s
    installer: k3s
    tmachine: { environment: ubuntu-k3s, installer: k3s }
    capabilities: { compute_driver: kubernetes, rootless: false, gpu: false, persistent_workspace: true }
  - id: tmachine.ubuntu2404-amd64.k3s.k3s-ha
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: amd64 }
    runtime: k3s
    installer: k3s-ha
    tmachine: { environment: ubuntu-k3s, installer: k3s-ha }
    capabilities: { compute_driver: kubernetes, rootless: false, gpu: false, persistent_workspace: true }
  - id: tmachine.ubuntu2404-arm64.k3s.k3s-ha
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: arm64 }
    runtime: k3s
    installer: k3s-ha
    tmachine: { environment: ubuntu-k3s, installer: k3s-ha }
    capabilities: { compute_driver: kubernetes, rootless: false, gpu: false, persistent_workspace: true }
