[package]
name = "openshell-test-runner"
description = "Runs OpenShell test plans against provisioned environments"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[[bin]]
name = "openshell-test-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
openshell-testkit-spec = { path = "../testkit/testkit-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
tempfile = "3"
tmachine = { path = "../tmachine" }
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.9"

[workspace]
