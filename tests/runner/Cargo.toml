[package]
name = "openshell-test-runner"
description = "Runs an OpenShell test family in a tmachine environment"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[[bin]]
name = "openshell-test-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tmachine = { path = "../tmachine" }
tokio = { version = "1", features = ["macros", "rt"] }

[workspace]
