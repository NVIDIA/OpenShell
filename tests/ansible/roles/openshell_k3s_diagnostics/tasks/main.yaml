---
- name: Check for K3s
  become: true
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_diagnostics_binary
  failed_when: false

- name: Preserve K3s diagnostics before the VM exits
  when: k3s_diagnostics_binary.stat.exists | default(false)
  become: true
  block:
    - name: Collect bounded K3s diagnostics
      ansible.builtin.script: collect.sh
      register: k3s_diagnostics_collection
      changed_when: false
      failed_when: false

    - name: Show K3s diagnostics
      ansible.builtin.debug:
        var: k3s_diagnostics_collection.stdout_lines

    - name: Fetch K3s diagnostics
      ansible.builtin.fetch:
        src: /var/lib/openshell/diagnostics/k3s.txt
        dest: "{{ lookup('env', 'TMACHINE_DIAGNOSTICS_DIR') | default(role_path + '/../../../../artifacts/tmachine-diagnostics', true) }}/{{ inventory_hostname }}/k3s.txt"
        flat: true
      failed_when: false
