---
- name: Enable lingering for gateway user
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ tmachine_user_manager_user | default('tmachine') }}"
  changed_when: false

- name: Start gateway user manager
  become: true
  ansible.builtin.systemd_service:
    name: "user@{{ tmachine_user_manager_uid | default('1000') }}.service"
    state: started
