---
- name: Enable lingering for tmachine
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - tmachine
  changed_when: false

- name: Start tmachine user manager
  become: true
  ansible.builtin.systemd_service:
    name: user@1000.service
    state: started
