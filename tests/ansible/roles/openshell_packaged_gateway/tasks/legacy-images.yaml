---
# pre.4 predates runtime-image environment overrides.
- name: Create legacy upgrade source metadata directory
  become: true
  ansible.builtin.file:
    path: /var/lib/openshell-qualification
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure legacy upgrade source runtime images
  become: true
  ansible.builtin.copy:
    dest: /var/lib/openshell-qualification/gateway.toml
    owner: root
    group: root
    mode: "0644"
    content: |
      [openshell]
      version = 2

      [openshell.gateway]
      compute_driver = "{{ openshell_gateway_driver }}"

      [openshell.drivers.{{ openshell_gateway_driver }}]
      {% if openshell_gateway_driver == 'podman' %}
      socket_path = "{{ openshell_runtime_socket }}"
      {% endif %}
      sandbox_runtime_image = "docker.io/openshell/sandbox:tmachine"
      supervisor_image = "docker.io/openshell/supervisor:tmachine"

- name: Select legacy upgrade source configuration
  become: true
  ansible.builtin.copy:
    dest: "{{ openshell_gateway_home }}/.config/openshell/gateway.env"
    owner: "{{ openshell_gateway_user }}"
    group: "{{ openshell_gateway_user }}"
    mode: "0600"
    content: |
      OPENSHELL_GATEWAY_CONFIG=/var/lib/openshell-qualification/gateway.toml
