---
- name: Restart installed gateway
  block:
    - name: Restart gateway service with the active configuration
      become: true
      become_user: "{{ openshell_test_gateway.service_user }}"
      ansible.builtin.systemd_service:
        name: openshell-gateway.service
        scope: "{{ openshell_test_gateway.service_scope }}"
        state: restarted
      environment: "{{ openshell_test_gateway_service_environment }}"

    - name: Wait for authenticated gateway readiness
      ansible.builtin.command:
        argv: ["{{ openshell_test_cli.stdout }}", gateway, info, --output, json]
      environment:
        OPENSHELL_GATEWAY: "{{ openshell_test_gateway.name }}"
      changed_when: false
      register: openshell_test_gateway_ready
      retries: 30
      delay: 2
      until: >-
        openshell_test_gateway_ready.rc == 0 and
        (openshell_test_gateway_ready.stdout | from_json).status == 'healthy'

  rescue:
    - name: Collect gateway restart diagnostics
      ansible.builtin.include_tasks: journal.yaml

    - name: Report gateway restart failure
      ansible.builtin.fail:
        msg: Installed gateway failed to restart with the driver fixture
