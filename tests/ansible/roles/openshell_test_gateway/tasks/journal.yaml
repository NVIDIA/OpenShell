---
# Root's packaged user unit can log to the system journal. Match journal
# fields instead of --user so both root and tmachine user units are captured.
- name: Capture installed gateway journal
  become: true
  ansible.builtin.command:
    argv: >-
      {{ ['journalctl']
         + (['_SYSTEMD_USER_UNIT=openshell-gateway.service', '_UID=' ~ openshell_test_gateway.service_uid]
            if openshell_test_gateway.service_scope == 'user'
            else ['--unit', 'openshell-gateway.service'])
         + ['--no-pager', '--lines', '200'] }}
  register: openshell_test_gateway_journal
  changed_when: false
  failed_when: false

- name: Show installed gateway journal
  ansible.builtin.debug:
    var: openshell_test_gateway_journal.stdout_lines
