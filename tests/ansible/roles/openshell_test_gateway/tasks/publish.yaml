---
# Installation and suite execution are separate Ansible processes. Persist only
# non-secret metadata; the CLI keeps registration and mTLS credentials itself.
- name: Create test gateway metadata directory
  become: true
  ansible.builtin.file:
    path: /var/lib/openshell-test
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish installed gateway context
  become: true
  ansible.builtin.copy:
    dest: /var/lib/openshell-test/gateway.yaml
    owner: root
    group: root
    mode: "0644"
    content: "{{ {'openshell_test_gateway': openshell_test_gateway_context} | to_nice_yaml }}"
