---
- name: Copy Ryno runtime images
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/var/lib/ryno/{{ item.name }}.tar"
    owner: "{{ ryno_gateway_user }}"
    group: "{{ ryno_gateway_user }}"
    mode: "0600"
  loop:
    - name: sandbox
      src: "{{ ryno_sandbox_image }}"
    - name: supervisor
      src: "{{ ryno_supervisor_image }}"

- name: Load Ryno runtime images
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - load
      - --input
      - "/var/lib/ryno/{{ item }}.tar"
  loop:
    - sandbox
    - supervisor
