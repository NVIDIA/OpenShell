---
- name: Wait for SSH
  ansible.builtin.wait_for_connection:

- name: Resolve K3s gateway configuration
  ansible.builtin.set_fact:
    k3s_ha: "{{ openshell_k3s_ha | default(false) | bool }}"

- name: Prepare K3s gateway
  block:
    - name: Wait for K3s API
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --request-timeout=10s, get, nodes, --output, name]
      register: k3s_api
      until: k3s_api.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for K3s node
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --request-timeout=190s, wait, --for=condition=Ready, nodes, --all, --timeout=180s]
      changed_when: false

    - name: Wait for PostgreSQL after boot
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, rollout, status, deployment/openshell-e2e-postgres, --timeout=300s]
      changed_when: false
      when: k3s_ha

    - name: Wait for Agent Sandbox controller
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, agent-sandbox-system, rollout, status, deployment/agent-sandbox-controller, --timeout=300s]
      changed_when: false

    - name: Wait for gateway workload
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, rollout, status, "{{ 'deployment' if k3s_ha else 'statefulset' }}/openshell", --timeout=300s]
      changed_when: false

    - name: Start gateway port-forward service
      ansible.builtin.systemd_service:
        name: openshell-k3s-port-forward.service
        state: started

    - name: Wait for gateway listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 17670
        timeout: 120

    - name: Install mTLS client identity
      when: k3s_ha
      block:
        - name: Read chart client TLS Secret
          ansible.builtin.command:
            argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, get, secret, openshell-client-tls, --output, json]
          register: k3s_client_tls
          changed_when: false
          no_log: true

        - name: Create guest client config directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: tmachine
            group: tmachine
            mode: "0700"
          loop:
            - /home/tmachine/.config
            - /home/tmachine/.config/openshell
            - /home/tmachine/.config/openshell/gateways
            - /home/tmachine/.config/openshell/gateways/tmachine
            - /home/tmachine/.config/openshell/gateways/tmachine/mtls

        - name: Write guest client TLS bundle
          ansible.builtin.copy:
            content: "{{ (k3s_client_tls.stdout | from_json).data[item] | b64decode }}"
            dest: "/home/tmachine/.config/openshell/gateways/tmachine/mtls/{{ item }}"
            owner: tmachine
            group: tmachine
            mode: "0600"
          loop: [ca.crt, tls.crt, tls.key]
          no_log: true

    - name: Register guest gateway
      ansible.builtin.include_role:
        name: openshell_client
        apply:
          become: false
      vars:
        openshell_client_gateway_endpoint: "{{ 'https://localhost:17670' if k3s_ha else 'http://127.0.0.1:17670' }}"

    # gateway add can warn about an unreachable endpoint and still return zero.
    # A sandbox-list RPC exercises TLS, authentication and the shared database.
    - name: Wait for authenticated gateway API
      become: false
      ansible.builtin.command:
        argv: [/usr/local/bin/openshell, sandbox, list, --output, json]
      register: k3s_gateway_api
      until: k3s_gateway_api.rc == 0
      retries: 24
      delay: 5
      changed_when: false

  rescue:
    - name: Collect K3s diagnostics
      ansible.builtin.include_role:
        name: openshell_k3s_diagnostics

    - name: Fail K3s preparation
      ansible.builtin.fail:
        msg: K3s gateway preparation failed; see the cluster diagnostics above.
