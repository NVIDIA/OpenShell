---
- name: Run OpenShell conformance tests
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Gather package platform facts
      ansible.builtin.setup:
        filter:
          - ansible_os_family

    - name: Detect container runtime
      ansible.builtin.include_role:
        name: tmachine_container_runtime

    - name: Install conformance test dependencies
      become: true
      ansible.builtin.package:
        name:
          - git
          - iptables
          - "{{ 'iproute' if ansible_facts.os_family == 'RedHat' else 'iproute2' }}"
        state: present

    - name: Install Docker supervisor reconnect helper
      become: true
      ansible.builtin.copy:
        src: ../../files/disconnect-docker-supervisor-session
        dest: /usr/local/bin/disconnect-docker-supervisor-session
        owner: root
        group: root
        mode: "0755"
      when: tmachine_container_runtime_name == 'docker'

    - name: Install Podman supervisor reconnect helper
      become: true
      ansible.builtin.copy:
        src: ../../files/disconnect-podman-supervisor-session
        dest: /usr/local/bin/disconnect-podman-supervisor-session
        owner: root
        group: root
        mode: "0755"
      when: tmachine_container_runtime_name == 'podman'

    - name: Create OpenShell conformance test directory
      become: true
      ansible.builtin.file:
        path: /var/lib/openshell-conformance/tests
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract OpenShell conformance test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ openshell_conformance_test_bundle }}"
        dest: /var/lib/openshell-conformance/tests
        owner: tmachine
        group: tmachine

    # Report a malformed outer bundle directly instead of failing later with
    # an opaque cargo-nextest missing-archive error.
    - name: Check OpenShell conformance nextest archive
      ansible.builtin.stat:
        path: /var/lib/openshell-conformance/tests/tests.tar.zst
      register: conformance_archive

    - name: Require OpenShell conformance nextest archive
      ansible.builtin.assert:
        that:
          - conformance_archive.stat.isreg | default(false)
        fail_msg: OpenShell conformance test bundle did not contain tests.tar.zst

    - name: Resolve installed OpenShell CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v openshell
      register: openshell_cli
      changed_when: false

    - name: Run OpenShell conformance archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - /var/lib/openshell-conformance/tests/tests.tar.zst
          - --workspace-remap
          - /var/lib/openshell-conformance/tests
          - --test-threads
          - "2"
          - --no-fail-fast
      environment:
        OPENSHELL_BIN: "{{ openshell_cli.stdout }}"
        OPENSHELL_PODMAN_ROOTLESS: >-
          {{ tmachine_container_runtime_is_rootless | ternary('true', 'false') }}
        OPENSHELL_RELAY_RECONNECT_HELPER: >-
          {{ '/usr/local/bin/disconnect-docker-supervisor-session'
             if tmachine_container_runtime_name == 'docker'
             else '/usr/local/bin/disconnect-podman-supervisor-session'
             if tmachine_container_runtime_name == 'podman' else '' }}
      register: conformance_result
      changed_when: false
      failed_when: false

    # Preserve both streams for failures without adding passing-test output to
    # every tmachine run.
    - name: Show OpenShell conformance diagnostics
      ansible.builtin.debug:
        var: conformance_result
      when: conformance_result.rc != 0

    - name: Read OpenShell gateway logs
      become: true
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit
          - openshell-gateway.service
          - --no-pager
          - --lines
          - "500"
      register: openshell_gateway_logs
      changed_when: false
      failed_when: false
      when: conformance_result.rc != 0

    - name: Show OpenShell gateway logs
      ansible.builtin.debug:
        var: openshell_gateway_logs.stdout_lines
      when: conformance_result.rc != 0

    - name: Require OpenShell conformance success
      ansible.builtin.assert:
        that:
          - conformance_result.rc == 0
        fail_msg: OpenShell conformance test failed
