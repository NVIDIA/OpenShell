---
- name: Run Ryno conformance tests
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install conformance test dependencies
      become: true
      ansible.builtin.package:
        name:
          - git
        state: present

    - name: Create Ryno conformance test directory
      become: true
      ansible.builtin.file:
        path: /var/lib/ryno-conformance/tests
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract Ryno conformance test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ ryno_conformance_test_bundle }}"
        dest: /var/lib/ryno-conformance/tests
        owner: tmachine
        group: tmachine

    # Report a malformed outer bundle directly instead of failing later with
    # an opaque cargo-nextest missing-archive error.
    - name: Check Ryno conformance nextest archive
      ansible.builtin.stat:
        path: /var/lib/ryno-conformance/tests/tests.tar.zst
      register: conformance_archive

    - name: Require Ryno conformance nextest archive
      ansible.builtin.assert:
        that:
          - conformance_archive.stat.isreg | default(false)
        fail_msg: Ryno conformance test bundle did not contain tests.tar.zst

    - name: Resolve installed Ryno CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v ryno
      register: ryno_cli
      changed_when: false

    - name: Run Ryno conformance archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - /var/lib/ryno-conformance/tests/tests.tar.zst
          - --workspace-remap
          - /var/lib/ryno-conformance/tests
          - --no-capture
          # The guest has 4 GiB; keep sandbox creates from competing for it.
          - --test-threads
          - "1"
          - --filterset
          - "{{ conformance_filter | default('all()') }}"
          - --no-fail-fast
      environment:
        RYNO_BIN: "{{ ryno_cli.stdout }}"
      register: conformance_result
      changed_when: false
      failed_when: false

    # Preserve both streams for failures without adding passing-test output to
    # every tmachine run.
    - name: Show Ryno conformance diagnostics
      ansible.builtin.debug:
        var: conformance_result
      when: conformance_result.rc != 0

    - name: Read Ryno gateway logs
      become: true
      ansible.builtin.command:
        argv:
          - journalctl
          - --no-pager
          - --lines
          - "500"
          - _SYSTEMD_UNIT=ryno-gateway.service
          - "+"
          - _SYSTEMD_USER_UNIT=ryno-gateway.service
      register: ryno_gateway_logs
      changed_when: false
      failed_when: false
      when: conformance_result.rc != 0

    - name: Show Ryno gateway logs
      ansible.builtin.debug:
        var: ryno_gateway_logs.stdout_lines
      when: conformance_result.rc != 0

    - name: Require Ryno conformance success
      ansible.builtin.assert:
        that:
          - conformance_result.rc == 0
        fail_msg: Ryno conformance test failed
