---
- name: Run OpenShell conformance tests
  hosts: all
  gather_facts: false
  vars:
    # Conformance is skipped when the gateway never connects.
    conformance_failed: "{{ gateway_status is failed or conformance_result.rc != 0 }}"
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install conformance test dependencies
      become: true
      ansible.builtin.package:
        name:
          - git
        state: present

    - name: Create OpenShell conformance test directory
      become: true
      ansible.builtin.file:
        path: /var/lib/openshell-conformance/tests
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract OpenShell conformance test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ openshell_conformance_test_bundle }}"
        dest: /var/lib/openshell-conformance/tests
        owner: tmachine
        group: tmachine

    # Report a malformed outer bundle directly instead of failing later with
    # an opaque cargo-nextest missing-archive error.
    - name: Check OpenShell conformance nextest archive
      ansible.builtin.stat:
        path: /var/lib/openshell-conformance/tests/tests.tar.zst
      register: conformance_archive

    - name: Require OpenShell conformance nextest archive
      ansible.builtin.assert:
        that:
          - conformance_archive.stat.isreg | default(false)
        fail_msg: OpenShell conformance test bundle did not contain tests.tar.zst

    - name: Resolve installed OpenShell CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v openshell
      register: openshell_cli
      changed_when: false

    # Every test boot restarts the gateway, and some installers take minutes to
    # recover. Wait once here; the runner's per-scenario preflight stays short.
    - name: Wait for the registered gateway
      ansible.builtin.command:
        argv: [timeout, 10s, "{{ openshell_cli.stdout }}", status, --output, json]
      register: gateway_status
      changed_when: false
      until: >-
        gateway_status.rc == 0 and
        (gateway_status.stdout | from_json).status == 'connected'
      retries: 60
      delay: 5
      ignore_errors: true

    - name: Run OpenShell conformance archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - /var/lib/openshell-conformance/tests/tests.tar.zst
          - --workspace-remap
          - /var/lib/openshell-conformance/tests
          - --no-capture
          # The guest has 4 GiB; keep sandbox creates from competing for it.
          - --test-threads
          - "1"
          - --filterset
          - "{{ conformance_filter | default('all()') }}"
          - --no-fail-fast
      environment:
        OPENSHELL_BIN: "{{ openshell_cli.stdout }}"
      register: conformance_result
      changed_when: false
      failed_when: false
      when: gateway_status is succeeded

    # Preserve both streams for failures without adding passing-test output to
    # every tmachine run.
    - name: Show OpenShell conformance diagnostics
      ansible.builtin.debug:
        var: conformance_result
      when: conformance_failed

    - name: Collect OpenShell gateway diagnostics
      ansible.builtin.include_role:
        name: openshell_diagnostics
      when: conformance_failed

    - name: Require a connected gateway
      ansible.builtin.assert:
        that:
          - gateway_status is succeeded
        fail_msg: OpenShell gateway did not connect before conformance; see gateway diagnostics

    - name: Require OpenShell conformance success
      ansible.builtin.assert:
        that:
          - conformance_result.rc == 0
        fail_msg: OpenShell conformance test failed
