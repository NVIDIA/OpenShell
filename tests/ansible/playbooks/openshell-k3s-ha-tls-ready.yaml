---
- name: Prepare PostgreSQL and mTLS gateway for conformance
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Wait for K3s node
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --request-timeout=190s, wait, --for=condition=Ready, nodes, --all, --timeout=180s]
      register: k3s_node
      until: k3s_node.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Wait for PostgreSQL, controller and gateway
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, "{{ item.namespace }}", rollout, status, "{{ item.workload }}", --timeout=300s]
      loop:
        - namespace: openshell
          workload: deployment/openshell-e2e-postgres
        - namespace: agent-sandbox-system
          workload: deployment/agent-sandbox-controller
        - namespace: openshell
          workload: deployment/openshell
      changed_when: false

    - name: Restart gateway forwarder after workload readiness
      ansible.builtin.systemd_service:
        name: openshell-k3s-port-forward.service
        state: restarted

    - name: Read chart client TLS Secret
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, get, secret, openshell-client-tls, --output, json]
      register: k3s_client_tls
      changed_when: false
      no_log: true

    - name: Create guest mTLS directory
      ansible.builtin.file:
        path: /home/tmachine/.config/openshell/gateways/tmachine/mtls
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Write guest client TLS bundle
      ansible.builtin.copy:
        content: "{{ (k3s_client_tls.stdout | from_json).data[item] | b64decode }}"
        dest: "/home/tmachine/.config/openshell/gateways/tmachine/mtls/{{ item }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
      loop: [ca.crt, tls.crt, tls.key]
      no_log: true

    - name: Register guest gateway
      ansible.builtin.include_role:
        name: openshell_client
        apply:
          become: false
      vars:
        openshell_client_gateway_endpoint: https://localhost:17670

    - name: Wait for authenticated gateway API
      become: false
      ansible.builtin.command:
        argv: [/usr/local/bin/openshell, sandbox, list, --output, json]
      register: k3s_gateway_api
      until: k3s_gateway_api.rc == 0
      retries: 24
      delay: 5
      changed_when: false
