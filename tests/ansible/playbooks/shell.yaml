---
- name: Prepare an interactive tmachine shell
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Set the tmachine SSH password
      become: true
      ansible.builtin.command:
        argv: [chpasswd]
        stdin: tmachine:tmachine
      no_log: true
      changed_when: false
