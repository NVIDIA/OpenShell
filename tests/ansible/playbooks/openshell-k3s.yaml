---
- name: Install OpenShell on K3s
  hosts: all
  become: true
  gather_facts: false
  vars:
    k3s_ha: "{{ openshell_k3s_ha | default(false) | bool }}"
  tasks:
    - name: Install K3s gateway and fixtures
      block:
        - name: Wait for SSH
          ansible.builtin.wait_for_connection:

        - name: Install OpenShell CLI
          ansible.builtin.copy:
            src: "{{ openshell_cli_binary }}"
            dest: /usr/local/bin/openshell
            mode: "0755"

        - name: Create OpenShell artifact directory
          ansible.builtin.file:
            path: /var/lib/openshell/artifacts
            state: directory
            mode: "0700"

        - name: Copy OpenShell images
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "/var/lib/openshell/artifacts/{{ item.name }}.tar"
            mode: "0600"
          loop:
            - name: gateway
              src: "{{ openshell_gateway_image }}"
            - name: sandbox
              src: "{{ openshell_sandbox_image }}"
            - name: supervisor
              src: "{{ openshell_supervisor_image }}"

        - name: Import OpenShell images into K3s
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - ctr
              - --namespace
              - k8s.io
              - images
              - import
              - "/var/lib/openshell/artifacts/{{ item }}.tar"
          loop:
            - gateway
            - sandbox
            - supervisor

        - name: Copy OpenShell Helm chart
          ansible.builtin.copy:
            src: "{{ openshell_helm_chart }}"
            dest: /var/lib/openshell/artifacts/helm-chart.tgz
            mode: "0600"

        - name: Write OpenShell Helm values
          ansible.builtin.copy:
            dest: /var/lib/openshell/artifacts/values.yaml
            mode: "0600"
            content: |
              global:
                image:
                  registry: ""
              replicaCount: {{ 3 if k3s_ha else 1 }}
              workload:
                kind: {{ 'deployment' if k3s_ha else 'statefulset' }}
              gateway:
                image:
                  repository: openshell/gateway
                  tag: tmachine
                  pullPolicy: Never
              sandboxRuntime:
                image:
                  repository: openshell/sandbox
                  tag: tmachine
                  pullPolicy: never
              supervisor:
                image:
                  repository: openshell/supervisor
                  tag: tmachine
                  pullPolicy: never
              networkPolicy:
                enabled: true
              server:
                auth:
                  allowUnauthenticatedUsers: {{ (not k3s_ha) | to_json }}
                disableTls: {{ (not k3s_ha) | to_json }}
                telemetryEnabled: false
              {% if k3s_ha %}
                externalDbSecret: openshell-e2e-postgres-credentials
                peer:
                  allowInsecureTransport: false
                credentialDrivers:
                  kubernetesSecrets:
                    enabled: true
                    namespace: openshell
              {% endif %}

        - name: Install PostgreSQL fixture
          when: k3s_ha
          block:
            - name: Create OpenShell namespace
              ansible.builtin.command:
                argv: [/usr/local/bin/k3s, kubectl, create, namespace, openshell]

            - name: Copy pinned PostgreSQL fixture
              ansible.builtin.copy:
                src: "{{ openshell_postgres_fixture }}"
                dest: /var/lib/openshell/artifacts/postgres.yaml
                mode: "0600"

            - name: Apply PostgreSQL fixture
              ansible.builtin.command:
                argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, apply, --filename, /var/lib/openshell/artifacts/postgres.yaml]

            - name: Wait for PostgreSQL
              ansible.builtin.command:
                argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, rollout, status, deployment/openshell-e2e-postgres, --timeout=300s]
              changed_when: false

        - name: Install Agent Sandbox
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - apply
              - --filename
              - "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v{{ agent_sandbox_version }}/manifest.yaml"

        - name: Wait for Agent Sandbox CRD
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - wait
              - --for=condition=Established
              - crd/sandboxes.agents.x-k8s.io
              - --timeout=120s
          changed_when: false

        - name: Wait for Agent Sandbox controller
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - --namespace
              - agent-sandbox-system
              - rollout
              - status
              - deployment/agent-sandbox-controller
              - --timeout=300s
          changed_when: false

        - name: Install OpenShell Helm chart
          ansible.builtin.command:
            argv:
              - /usr/local/bin/helm
              - install
              - openshell
              - /var/lib/openshell/artifacts/helm-chart.tgz
              - --namespace
              - openshell
              - --create-namespace
              - --values
              - /var/lib/openshell/artifacts/values.yaml
              - --wait
              - --timeout=5m
          environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml

        - name: Install gateway port-forward service
          ansible.builtin.copy:
            dest: /etc/systemd/system/openshell-k3s-port-forward.service
            mode: "0644"
            content: |
              [Unit]
              Description=OpenShell K3s gateway port forward
              After=k3s.service
              Requires=k3s.service
              StartLimitIntervalSec=0

              [Service]
              ExecStart=/usr/local/bin/k3s kubectl --namespace openshell port-forward --address 127.0.0.1 service/openshell 17670:8080
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target

        - name: Start gateway port-forward service
          ansible.builtin.systemd_service:
            name: openshell-k3s-port-forward.service
            daemon_reload: true
            enabled: true
            state: started

        - name: Wait for OpenShell gateway
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 17670
            timeout: 60

      rescue:
        - name: Collect installation diagnostics
          ansible.builtin.include_role:
            name: openshell_k3s_diagnostics

        - name: Fail K3s installation
          ansible.builtin.fail:
            msg: K3s gateway installation failed; see the cluster diagnostics above.

- name: Prepare OpenShell gateway for test client
  hosts: all
  become: true
  gather_facts: false
  roles:
    - openshell_k3s_ready
