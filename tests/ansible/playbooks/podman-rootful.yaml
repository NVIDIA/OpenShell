---
- name: Configure rootful Podman
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Enable rootful Podman socket
      become: true
      ansible.builtin.systemd_service:
        name: podman.socket
        enabled: true
        state: started
