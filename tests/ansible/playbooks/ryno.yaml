---
- name: Install Ryno
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install Ryno CLI
      become: true
      ansible.builtin.copy:
        src: "{{ ryno_cli_binary }}"
        dest: /usr/local/bin/ryno
        mode: "0755"

    - name: Install Ryno gateway
      become: true
      ansible.builtin.copy:
        src: "{{ ryno_gateway_binary }}"
        dest: /usr/local/bin/ryno-gateway
        mode: "0755"
