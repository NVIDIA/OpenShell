---
- name: Install Ryno Debian package
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Copy Ryno Debian package
      become: true
      ansible.builtin.copy:
        src: "{{ ryno_deb }}"
        dest: /var/tmp/ryno.deb
        mode: "0644"

    - name: Install Ryno Debian package
      become: true
      ansible.builtin.apt:
        deb: /var/tmp/ryno.deb

    - name: Prepare packaged Ryno gateway
      ansible.builtin.include_role:
        name: ryno_packaged_gateway
