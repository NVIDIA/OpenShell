---
- name: Install Ryno on K3s
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install Ryno CLI
      ansible.builtin.copy:
        src: "{{ ryno_cli_binary }}"
        dest: /usr/local/bin/ryno
        mode: "0755"

    - name: Create Ryno artifact directory
      ansible.builtin.file:
        path: /var/lib/ryno/artifacts
        state: directory
        mode: "0700"

    - name: Copy Ryno images
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/var/lib/ryno/artifacts/{{ item.name }}.tar"
        mode: "0600"
      loop:
        - name: gateway
          src: "{{ ryno_gateway_image }}"
        - name: sandbox
          src: "{{ ryno_sandbox_image }}"
        - name: supervisor
          src: "{{ ryno_supervisor_image }}"

    - name: Import Ryno images into K3s
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - import
          - "/var/lib/ryno/artifacts/{{ item }}.tar"
      loop:
        - gateway
        - sandbox
        - supervisor

    - name: Copy Ryno Helm chart
      ansible.builtin.copy:
        src: "{{ ryno_helm_chart }}"
        dest: /var/lib/ryno/artifacts/helm-chart.tgz
        mode: "0600"

    - name: Write Ryno Helm values
      ansible.builtin.copy:
        dest: /var/lib/ryno/artifacts/values.yaml
        mode: "0600"
        content: |
          global:
            image:
              registry: ""
          gateway:
            image:
              repository: ryno/gateway
              tag: tmachine
              pullPolicy: Never
          sandboxRuntime:
            image:
              repository: ryno/sandbox
              tag: tmachine
              pullPolicy: never
          supervisor:
            image:
              repository: ryno/supervisor
              tag: tmachine
              pullPolicy: never
          networkPolicy:
            enabled: true
          server:
            auth:
              allowUnauthenticatedUsers: true
            disableTls: true
            telemetryEnabled: false

    - name: Install Agent Sandbox
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --filename
          - "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v{{ agent_sandbox_version }}/manifest.yaml"

    - name: Wait for Agent Sandbox CRD
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Established
          - crd/sandboxes.agents.x-k8s.io
          - --timeout=120s
      changed_when: false

    - name: Wait for Agent Sandbox controller
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - agent-sandbox-system
          - rollout
          - status
          - deployment/agent-sandbox-controller
          - --timeout=300s
      changed_when: false

    - name: Install Ryno Helm chart
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - install
          - ryno
          - /var/lib/ryno/artifacts/helm-chart.tgz
          - --namespace
          - ryno
          - --create-namespace
          - --values
          - /var/lib/ryno/artifacts/values.yaml
          - --wait
          - --timeout=5m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install gateway port-forward service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ryno-k3s-port-forward.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ryno K3s gateway port forward
          After=k3s.service
          Requires=k3s.service

          [Service]
          ExecStart=/usr/local/bin/k3s kubectl --namespace ryno port-forward --address 127.0.0.1 service/ryno 17670:8080
          Restart=always
          RestartSec=1

          [Install]
          WantedBy=multi-user.target

    - name: Start gateway port-forward service
      ansible.builtin.systemd_service:
        name: ryno-k3s-port-forward.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for Ryno gateway
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 17670
        timeout: 60

- name: Register Ryno gateway for test client
  hosts: all
  gather_facts: false
  roles:
    - ryno_client
