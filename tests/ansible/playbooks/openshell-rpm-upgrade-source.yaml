---
- name: Install released OpenShell RPM upgrade source
  ansible.builtin.import_playbook: openshell-rpm.yaml
  vars:
    openshell_packaged_gateway_released_source: true

- name: Record OpenShell RPM upgrade source
  hosts: all
  gather_facts: false
  tasks:
    - name: Create upgrade source metadata directory
      become: true
      ansible.builtin.file:
        path: /var/lib/openshell-qualification
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record installed source package versions
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        rpm --query --queryformat '%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' openshell openshell-gateway \
          > /var/lib/openshell-qualification/upgrade-source-versions
      args:
        executable: /bin/bash
      changed_when: true
