---
- name: Configure rootless Podman
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Enable lingering for tmachine
      become: true
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - tmachine
      changed_when: false

    - name: Resolve tmachine UID
      ansible.builtin.command:
        argv:
          - id
          - -u
          - tmachine
      changed_when: false
      register: tmachine_uid

    - name: Start tmachine user manager
      become: true
      ansible.builtin.systemd_service:
        name: "user@{{ tmachine_uid.stdout }}.service"
        state: started

    - name: Enable rootless Podman socket
      become: true
      become_user: tmachine
      ansible.builtin.systemd_service:
        name: podman.socket
        scope: user
        enabled: true
        state: started
      environment:
        HOME: /home/tmachine
        XDG_RUNTIME_DIR: "/run/user/{{ tmachine_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ tmachine_uid.stdout }}/bus"
