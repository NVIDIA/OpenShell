---
- name: Run OpenShell smoke tests
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install OpenShell conformance runner
      become: true
      ansible.builtin.copy:
        src: "{{ openshell_conformance_binary }}"
        dest: /usr/local/bin/openshell-conformance
        mode: "0755"

    - name: Wait for OpenShell gateway
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 17670
        timeout: 60

    - name: Register OpenShell gateway
      ansible.builtin.command:
        argv:
          - /usr/local/bin/openshell
          - gateway
          - add
          - http://127.0.0.1:17670
          - --local
          - --name
          - tmachine

    - name: Run OpenShell smoke conformance test
      ansible.builtin.command:
        argv:
          - /usr/local/bin/openshell-conformance
          - run
          - smoke
          - --openshell-bin
          - /usr/local/bin/openshell
      register: conformance_result
      changed_when: false
      failed_when: false

    - name: Show OpenShell smoke conformance diagnostics
      ansible.builtin.debug:
        var: conformance_result.stderr_lines

    - name: Show OpenShell smoke conformance result
      ansible.builtin.debug:
        var: conformance_result.stdout_lines

    - name: Require OpenShell smoke conformance success
      ansible.builtin.assert:
        that:
          - conformance_result.rc == 0
        fail_msg: OpenShell smoke conformance test failed
