---
- name: Configure and capture a Podman user-namespace reference
  hosts: all
  gather_facts: false
  vars:
    podman_reference_image: "{{ openshell_podman_reference_image }}"
    podman_reference_uid_map: /var/lib/openshell-test-inputs/podman/reference-uid-map
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Require the rootless Podman gateway user
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - openshell-gateway.service
          - --property
          - User
          - --value
      changed_when: false
      register: openshell_gateway_service_user

    - name: Assert the rootless Podman gateway user
      ansible.builtin.assert:
        that:
          - openshell_gateway_service_user.stdout == "tmachine"
        fail_msg: >-
          The Podman {{ podman_userns_profile }} suite requires a rootless Podman gateway
          running as tmachine, not {{ openshell_gateway_service_user.stdout | default("unknown") }}

    - name: Apply the Podman user-namespace fixture
      become: true
      ansible.builtin.blockinfile:
        path: /etc/openshell/gateway.toml
        marker: "# {mark} OpenShell Podman userns test fixture"
        block: "{{ lookup('ansible.builtin.file', podman_userns_config) | trim }}"

    - name: Restart OpenShell gateway with the Podman user-namespace fixture
      become: true
      ansible.builtin.systemd_service:
        name: openshell-gateway.service
        state: restarted

    - name: Wait for the configured OpenShell gateway
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 17670
        timeout: 60

    - name: Resolve tmachine UID
      ansible.builtin.command:
        argv:
          - id
          - -u
          - tmachine
      changed_when: false
      register: tmachine_uid

    - name: Capture direct Podman user-namespace mapping
      become: true
      become_user: tmachine
      ansible.builtin.command:
        argv: "{{ [\"podman\", \"run\", \"--rm\", \"--pull\", \"never\"] + podman_userns_reference_args + [\"--entrypoint\", \"/bin/cat\", podman_reference_image, \"/proc/self/uid_map\"] }}"
      environment:
        HOME: /home/tmachine
        XDG_RUNTIME_DIR: "/run/user/{{ tmachine_uid.stdout }}"
      changed_when: false
      register: podman_userns_uid_map

    - name: Require a direct Podman user-namespace mapping
      ansible.builtin.assert:
        that:
          - podman_userns_uid_map.stdout | trim | length > 0
        fail_msg: >-
          Direct rootless Podman {{ podman_userns_profile }} reference container
          returned no UID mapping

    - name: Create Podman test-input directory
      become: true
      ansible.builtin.file:
        path: "{{ podman_reference_uid_map | dirname }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Store direct Podman user-namespace mapping
      become: true
      ansible.builtin.copy:
        content: "{{ podman_userns_uid_map.stdout | trim }}\n"
        dest: "{{ podman_reference_uid_map }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
