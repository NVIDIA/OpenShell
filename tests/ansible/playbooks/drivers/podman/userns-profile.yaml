---
- name: Configure and capture a Podman user-namespace reference
  hosts: all
  gather_facts: false
  vars:
    podman_reference_image: "{{ openshell_podman_reference_image }}"
    podman_reference_uid_map: /var/lib/openshell-test-inputs/podman/reference-uid-map
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Detect tmachine container runtime
      ansible.builtin.include_role:
        name: tmachine_container_runtime

    - name: Require a Podman gateway
      ansible.builtin.assert:
        that:
          - tmachine_container_runtime_name == "podman"
        fail_msg: >-
          The Podman {{ podman_userns_profile }} suite requires a Podman gateway, not
          {{ tmachine_container_runtime_name }}

    # podman_reference_user only selects who runs the direct `podman`
    # reference command below; it must match the daemon's rootful/rootless
    # mode. The captured reference file itself stays owned by tmachine
    # (the inventory's ansible_user), since the archived test binary that
    # later reads it always runs unprivileged as tmachine, in both modes.
    - name: Resolve the Podman reference execution context
      ansible.builtin.set_fact:
        podman_reference_user: "{{ 'tmachine' if tmachine_container_runtime_is_rootless else 'root' }}"
        podman_reference_home: "{{ '/home/tmachine' if tmachine_container_runtime_is_rootless else '/root' }}"
        podman_reference_uid: "{{ tmachine_container_runtime_tmachine_uid.stdout if tmachine_container_runtime_is_rootless else '0' }}"

    - name: Apply the Podman user-namespace fixture
      become: true
      ansible.builtin.blockinfile:
        path: /etc/openshell/gateway.toml
        marker: "# {mark} OpenShell Podman userns test fixture"
        block: "{{ lookup('ansible.builtin.file', podman_userns_config) | trim }}"

    - name: Restart OpenShell gateway with the Podman user-namespace fixture
      become: true
      ansible.builtin.systemd_service:
        name: openshell-gateway.service
        state: restarted

    - name: Wait for the configured OpenShell gateway
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 17670
        timeout: 60

    - name: Capture direct Podman user-namespace mapping
      become: true
      become_user: "{{ podman_reference_user }}"
      ansible.builtin.command:
        argv: "{{ [\"podman\", \"run\", \"--rm\", \"--pull\", \"never\"] + podman_userns_reference_args + [\"--entrypoint\", \"/bin/cat\", podman_reference_image, \"/proc/self/uid_map\"] }}"
      environment:
        HOME: "{{ podman_reference_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_reference_uid }}"
      changed_when: false
      register: podman_userns_uid_map

    - name: Require a direct Podman user-namespace mapping
      ansible.builtin.assert:
        that:
          - podman_userns_uid_map.stdout | trim | length > 0
        fail_msg: >-
          Direct Podman {{ podman_userns_profile }} reference container
          returned no UID mapping

    - name: Create Podman test-input directory
      become: true
      ansible.builtin.file:
        path: "{{ podman_reference_uid_map | dirname }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Store direct Podman user-namespace mapping
      become: true
      ansible.builtin.copy:
        content: "{{ podman_userns_uid_map.stdout | trim }}\n"
        dest: "{{ podman_reference_uid_map }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
