---
- name: Capture the default Podman user-namespace mapping
  hosts: all
  gather_facts: false
  vars:
    podman_reference_image: "{{ openshell_podman_reference_image }}"
    podman_reference_uid_map: /var/lib/openshell-test-inputs/podman/reference-uid-map
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Detect tmachine container runtime
      ansible.builtin.include_role:
        name: tmachine_container_runtime

    - name: Require a Podman gateway
      ansible.builtin.assert:
        that:
          - tmachine_container_runtime_name == "podman"
        fail_msg: >-
          The Podman default-userns suite requires a Podman gateway, not
          {{ tmachine_container_runtime_name }}

    # podman_reference_user only selects who runs the direct `podman`
    # reference commands below; it must match the daemon's rootful/rootless
    # mode. The captured reference file itself stays owned by tmachine
    # (the inventory's ansible_user), since the archived test binary that
    # later reads it always runs unprivileged as tmachine, in both modes.
    - name: Resolve the Podman reference execution context
      ansible.builtin.set_fact:
        podman_reference_user: "{{ 'tmachine' if tmachine_container_runtime_is_rootless else 'root' }}"
        podman_reference_home: "{{ '/home/tmachine' if tmachine_container_runtime_is_rootless else '/root' }}"
        podman_reference_uid: "{{ tmachine_container_runtime_tmachine_uid.stdout if tmachine_container_runtime_is_rootless else '0' }}"

    - name: Read OpenShell gateway configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/openshell/gateway.toml
      register: openshell_gateway_config

    - name: Require unconfigured Podman user namespaces
      ansible.builtin.assert:
        that:
          - >-
            (openshell_gateway_config.content | b64decode)
            is not regex('(?m)^\\s*(userns|uidmap|gidmap)\\s*=')
        fail_msg: >-
          The Podman default-userns suite requires gateway.toml to omit userns,
          uidmap, and gidmap.

    - name: Create Podman test-input directory
      become: true
      ansible.builtin.file:
        path: "{{ podman_reference_uid_map | dirname }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Pull the Podman reference image
      become: true
      become_user: "{{ podman_reference_user }}"
      ansible.builtin.command:
        argv: [podman, pull, "{{ podman_reference_image }}"]
      environment:
        HOME: "{{ podman_reference_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_reference_uid }}"
      changed_when: false

    - name: Capture direct Podman default UID mapping
      become: true
      become_user: "{{ podman_reference_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --pull
          - never
          - --entrypoint
          - /bin/cat
          - "{{ podman_reference_image }}"
          - /proc/self/uid_map
      environment:
        HOME: "{{ podman_reference_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_reference_uid }}"
      changed_when: false
      register: podman_default_uid_map

    - name: Require a direct Podman UID mapping
      ansible.builtin.assert:
        that:
          - podman_default_uid_map.stdout | trim | length > 0
        fail_msg: Direct Podman reference container returned no UID mapping

    - name: Store direct Podman default UID mapping
      become: true
      ansible.builtin.copy:
        content: "{{ podman_default_uid_map.stdout | trim }}\n"
        dest: "{{ podman_reference_uid_map }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
