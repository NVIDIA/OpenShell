---
- name: Run Podman E2E archive tests
  hosts: all
  gather_facts: false
  vars:
    podman_e2e_test_root: /var/lib/openshell-driver-tests/podman-e2e
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Resolve installed gateway context
      ansible.builtin.include_role:
        name: openshell_test_gateway

    - name: Detect tmachine container runtime
      ansible.builtin.include_role:
        name: tmachine_container_runtime

    - name: Require rootless Podman for the E2E workload fixtures
      ansible.builtin.assert:
        that:
          - tmachine_container_runtime_name == 'podman'
          - tmachine_container_runtime_is_rootless
        fail_msg: The Podman E2E archive requires the rootless Podman environment

    - name: Create Podman E2E test directory
      become: true
      ansible.builtin.file:
        path: "{{ podman_e2e_test_root }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Install Podman E2E test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ openshell_podman_e2e_test_bundle }}"
        dest: "{{ podman_e2e_test_root }}"
        owner: tmachine
        group: tmachine

    - name: Install Podman E2E workload image
      become: true
      ansible.builtin.copy:
        src: "{{ openshell_podman_e2e_workload_image }}"
        dest: "{{ podman_e2e_test_root }}/openshell-e2e-python-dev.tar"
        owner: tmachine
        group: tmachine
        mode: "0600"

    - name: Load Podman E2E workload image
      ansible.builtin.command:
        argv:
          - podman
          - load
          - --input
          - "{{ podman_e2e_test_root }}/openshell-e2e-python-dev.tar"
      environment:
        HOME: /home/tmachine
        XDG_RUNTIME_DIR: "/run/user/{{ tmachine_container_runtime_tmachine_uid.stdout }}"

    - name: Run Podman E2E archive tests
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - "{{ podman_e2e_test_root }}/tests.tar.zst"
          - --workspace-remap
          - "{{ podman_e2e_test_root }}"
          - --test-threads
          - "1"
          - --no-fail-fast
      environment:
        CONTAINER_ENGINE: podman
        CONTAINER_HOST: "unix://{{ tmachine_container_runtime_socket }}"
        HOME: /home/tmachine
        OPENSHELL_BIN: "{{ openshell_test_cli.stdout }}"
        OPENSHELL_E2E_CONTAINER_ENGINE_UNSET_XDG_CONFIG_HOME: "1"
        OPENSHELL_E2E_DRIVER: podman
        OPENSHELL_E2E_NETWORK_NAME: "{{ openshell_test_gateway.network_name }}"
        OPENSHELL_E2E_SANDBOX_NAMESPACE: tmachine
        OPENSHELL_GATEWAY: "{{ openshell_test_gateway.name }}"
        OPENSHELL_PODMAN_SOCKET: "{{ tmachine_container_runtime_socket }}"
        XDG_RUNTIME_DIR: "/run/user/{{ tmachine_container_runtime_tmachine_uid.stdout }}"
      register: podman_e2e_test_result
      changed_when: false
      failed_when: false

    - name: Show Podman E2E test diagnostics
      ansible.builtin.debug:
        var: podman_e2e_test_result.stderr_lines

    - name: Show Podman E2E test result
      ansible.builtin.debug:
        var: podman_e2e_test_result.stdout_lines

    - name: Collect installed gateway diagnostics after test failure
      ansible.builtin.include_role:
        name: openshell_test_gateway
        tasks_from: journal.yaml
      when: podman_e2e_test_result.rc != 0

    - name: Require Podman E2E archive success
      ansible.builtin.assert:
        that: [podman_e2e_test_result.rc == 0]
        fail_msg: Podman E2E archive tests failed
