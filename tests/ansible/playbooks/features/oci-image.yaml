---
- name: Run OCI image feature tests
  hosts: all
  gather_facts: false
  vars:
    oci_image_test_root: /var/lib/openshell-oci-image/tests
    # The tests are skipped when the gateway never connects.
    oci_image_failed: "{{ gateway_status is failed or oci_image_result.rc != 0 }}"
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Detect tmachine container runtime
      ansible.builtin.include_role:
        name: tmachine_container_runtime

    # Tests build images into the store the gateway reads. Rootful Podman's
    # store belongs to root, so the unprivileged test user builds through sudo.
    - name: Select the gateway's container engine command
      ansible.builtin.set_fact:
        oci_image_container_engine: >-
          {{ 'docker' if tmachine_container_runtime_name == 'docker'
             else 'podman' if tmachine_container_runtime_is_rootless
             else 'sudo -n podman' }}

    - name: Create OCI image test directory
      become: true
      ansible.builtin.file:
        path: "{{ oci_image_test_root }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract OCI image test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ oci_image_test_bundle }}"
        dest: "{{ oci_image_test_root }}"
        owner: tmachine
        group: tmachine

    - name: Check OCI image nextest archive
      ansible.builtin.stat:
        path: "{{ oci_image_test_root }}/tests.tar.zst"
      register: oci_image_archive

    - name: Require OCI image nextest archive
      ansible.builtin.assert:
        that:
          - oci_image_archive.stat.isreg | default(false)
        fail_msg: OCI image test bundle did not contain tests.tar.zst

    - name: Resolve installed OpenShell CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v openshell
      register: openshell_cli
      changed_when: false

    # Every test boot restarts the gateway, and some installers take minutes to
    # recover. Wait once here; the runner's per-scenario preflight stays short.
    - name: Wait for the registered gateway
      ansible.builtin.command:
        argv: [timeout, 10s, "{{ openshell_cli.stdout }}", status, --output, json]
      register: gateway_status
      changed_when: false
      until: >-
        gateway_status.rc == 0 and
        (gateway_status.stdout | from_json).status == 'connected'
      retries: 60
      delay: 5
      ignore_errors: true

    - name: Run OCI image archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - "{{ oci_image_test_root }}/tests.tar.zst"
          - --workspace-remap
          - "{{ oci_image_test_root }}"
          - --no-capture
          # The guest has 4 GiB; keep sandbox creates from competing for it.
          - --test-threads
          - "1"
          - --no-fail-fast
      environment:
        HOME: /home/tmachine
        OPENSHELL_BIN: "{{ openshell_cli.stdout }}"
        OPENSHELL_TEST_CONTAINER_ENGINE: "{{ oci_image_container_engine }}"
        XDG_RUNTIME_DIR: "/run/user/{{ tmachine_container_runtime_tmachine_uid.stdout }}"
      register: oci_image_result
      changed_when: false
      failed_when: false
      when: gateway_status is succeeded

    - name: Show OCI image diagnostics
      ansible.builtin.debug:
        var: oci_image_result
      when: oci_image_failed

    - name: Collect OpenShell gateway diagnostics
      ansible.builtin.include_role:
        name: openshell_diagnostics
      when: oci_image_failed

    - name: Require a connected gateway
      ansible.builtin.assert:
        that:
          - gateway_status is succeeded
        fail_msg: OpenShell gateway did not connect before the OCI image tests; see gateway diagnostics

    - name: Require OCI image success
      ansible.builtin.assert:
        that:
          - oci_image_result.rc == 0
        fail_msg: OCI image feature tests failed
