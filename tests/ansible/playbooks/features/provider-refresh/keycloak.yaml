---
- name: Run Keycloak provider refresh tests
  hosts: all
  gather_facts: false
  roles:
    - keycloak
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Create Keycloak provider refresh test directory
      become: true
      ansible.builtin.file:
        path: /var/lib/ryno-provider-refresh/tests
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Install Keycloak provider refresh test bundle
      become: true
      ansible.builtin.copy:
        src: "{{ provider_refresh_keycloak_test_bundle }}"
        dest: /var/lib/ryno-provider-refresh/tests/bundle.tar
        owner: tmachine
        group: tmachine
        mode: "0600"

    - name: Extract Keycloak provider refresh test bundle
      become: true
      ansible.builtin.unarchive:
        src: /var/lib/ryno-provider-refresh/tests/bundle.tar
        dest: /var/lib/ryno-provider-refresh/tests
        owner: tmachine
        group: tmachine
        remote_src: true

    - name: Check Keycloak provider refresh test archive
      ansible.builtin.stat:
        path: /var/lib/ryno-provider-refresh/tests/tests.tar.zst
      register: provider_refresh_keycloak_test_archive

    - name: Require Keycloak provider refresh test archive
      ansible.builtin.assert:
        that:
          - provider_refresh_keycloak_test_archive.stat.isreg | default(false)
        fail_msg: Keycloak provider refresh test bundle did not contain tests.tar.zst

    - name: Resolve installed Ryno CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v ryno
      register: ryno_cli
      changed_when: false

    - name: Run Keycloak provider refresh archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --archive-file
          - /var/lib/ryno-provider-refresh/tests/tests.tar.zst
          - --workspace-remap
          - /var/lib/ryno-provider-refresh/tests
          - --no-capture
      environment:
        RYNO_BIN: "{{ ryno_cli.stdout }}"
        RYNO_E2E_OIDC_ISSUER: http://127.0.0.1:8180/realms/ryno
        RYNO_E2E_OIDC_USERNAME: admin@test
        RYNO_E2E_OIDC_PASSWORD: admin
      register: provider_refresh_result
      changed_when: false
      failed_when: false

    - name: Show Keycloak provider refresh result
      ansible.builtin.debug:
        var: provider_refresh_result
      when: provider_refresh_result.rc != 0

    - name: Read Ryno gateway logs
      become: true
      ansible.builtin.command:
        argv:
          - journalctl
          - --no-pager
          - --lines
          - "500"
          - _SYSTEMD_UNIT=ryno-gateway.service
          - "+"
          - _SYSTEMD_USER_UNIT=ryno-gateway.service
      register: ryno_gateway_logs
      changed_when: false
      failed_when: false
      when: provider_refresh_result.rc != 0

    - name: Show Ryno gateway logs
      ansible.builtin.debug:
        var: ryno_gateway_logs.stdout_lines
      when: provider_refresh_result.rc != 0

    - name: Require Keycloak provider refresh success
      ansible.builtin.assert:
        that: provider_refresh_result.rc == 0
        fail_msg: Keycloak provider refresh test failed
