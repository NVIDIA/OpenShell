---
- import_playbook: openshell-k3s.yaml

- name: Add PostgreSQL and TLS to the K3s test installation
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Copy PostgreSQL fixture
      ansible.builtin.copy:
        src: "{{ openshell_postgres_fixture }}"
        dest: /var/lib/openshell/artifacts/postgres.yaml
        mode: "0600"

    - name: Apply PostgreSQL fixture
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, apply, --filename, /var/lib/openshell/artifacts/postgres.yaml]

    - name: Wait for PostgreSQL
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, rollout, status, deployment/openshell-e2e-postgres, --timeout=300s]
      changed_when: false

    - name: Write PostgreSQL and TLS values overlay
      ansible.builtin.copy:
        dest: /var/lib/openshell/artifacts/values-ha-tls.yaml
        mode: "0600"
        content: |
          replicaCount: 3
          workload:
            kind: deployment
          server:
            externalDbSecret: openshell-e2e-postgres-credentials
            disableTls: false
            auth:
              # Kubernetes has no mTLS user-identity mode. Require the client
              # certificate at the TLS layer and use the fixture's dev user.
              allowUnauthenticatedUsers: true

    - name: Apply PostgreSQL and TLS overlay to OpenShell
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - upgrade
          - openshell
          - /var/lib/openshell/artifacts/helm-chart.tgz
          - --namespace
          - openshell
          - --values
          - /var/lib/openshell/artifacts/values.yaml
          - --values
          - /var/lib/openshell/artifacts/values-ha-tls.yaml
          - --wait
          - --timeout=5m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # The chart's server certificate covers the Service DNS name but not its
    # ClusterIP, and the node resolver cannot reach cluster DNS.
    - name: Resolve the gateway Service name to its ClusterIP
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\sopenshell\.openshell\.svc\.cluster\.local$'
        line: "{{ k3s_gateway_address.stdout.split(':')[0] }} openshell.openshell.svc.cluster.local"

    - name: Read chart client TLS Secret
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, get, secret, openshell-client-tls, --output, json]
      register: k3s_client_tls
      changed_when: false
      no_log: true

    - name: Create guest mTLS directory
      ansible.builtin.file:
        path: /home/tmachine/.config/openshell/gateways/tmachine/mtls
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Write guest client TLS bundle
      ansible.builtin.copy:
        content: "{{ (k3s_client_tls.stdout | from_json).data[item] | b64decode }}"
        dest: "/home/tmachine/.config/openshell/gateways/tmachine/mtls/{{ item }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
      loop: [ca.crt, tls.crt, tls.key]
      no_log: true

    - name: Remove baseline guest gateway registration
      become: false
      ansible.builtin.command:
        argv: [/usr/local/bin/openshell, gateway, remove, tmachine]

    - name: Register guest gateway
      ansible.builtin.include_role:
        name: openshell_client
        apply:
          become: false
      vars:
        openshell_client_gateway_endpoint: "https://openshell.openshell.svc.cluster.local:{{ k3s_gateway_address.stdout.split(':')[1] }}"

    - name: Wait for authenticated gateway API
      become: false
      ansible.builtin.command:
        argv: [timeout, 10s, /usr/local/bin/openshell, sandbox, list, --output, json]
      register: k3s_gateway_api
      until: k3s_gateway_api.rc == 0
      retries: 24
      delay: 5
      changed_when: false
