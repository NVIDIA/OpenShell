# An environment overrides gateway settings by writing the tables to change,
# such as `[openshell.drivers.podman]`, to
# /etc/openshell-test/gateway-overrides.toml before the installer runs (for
# example playbooks/drivers/podman/userns.yaml). The file declares
# `[openshell] version = 2` like any gateway configuration. Install it as a
# drop-in config in the `gateway.d` directory next to
# `openshell_gateway_merge_target`; the gateway merges it over the base file
# without that file being edited.
#
# `openshell_gateway_merge_default`, when set, is the package's default
# configuration. When the package has no default, or it is absent, and the
# target doesn't exist, write a minimal base file for the drop-in to merge over.
# `openshell_gateway_merge_user` owns the files.
---
- name: Check for environment gateway overrides
  ansible.builtin.stat:
    path: /etc/openshell-test/gateway-overrides.toml
  register: openshell_gateway_overrides

- name: Create the gateway drop-in directory
  become: true
  become_user: "{{ openshell_gateway_merge_user | default('root') }}"
  ansible.builtin.file:
    path: "{{ openshell_gateway_merge_target | dirname }}/gateway.d"
    state: directory
    mode: "0755"
  when: openshell_gateway_overrides.stat.exists

- name: Install environment gateway overrides as a drop-in
  become: true
  become_user: "{{ openshell_gateway_merge_user | default('root') }}"
  ansible.builtin.copy:
    src: /etc/openshell-test/gateway-overrides.toml
    remote_src: true
    dest: "{{ openshell_gateway_merge_target | dirname }}/gateway.d/90-test-overrides.toml"
    mode: "0644"
  when: openshell_gateway_overrides.stat.exists

- name: Remove stale environment gateway overrides
  become: true
  become_user: "{{ openshell_gateway_merge_user | default('root') }}"
  ansible.builtin.file:
    path: "{{ openshell_gateway_merge_target | dirname }}/gateway.d/90-test-overrides.toml"
    state: absent
  when: not openshell_gateway_overrides.stat.exists

- name: Check for the package's default gateway configuration
  ansible.builtin.stat:
    path: "{{ openshell_gateway_merge_default }}"
  register: openshell_gateway_default
  when:
    - openshell_gateway_overrides.stat.exists
    - openshell_gateway_merge_default | default('') | length > 0

- name: Write a minimal base for a package with no default configuration
  become: true
  become_user: "{{ openshell_gateway_merge_user | default('root') }}"
  ansible.builtin.copy:
    dest: "{{ openshell_gateway_merge_target }}"
    content: "[openshell]\nversion = 2\n"
    mode: "0644"
    force: false
  when:
    - openshell_gateway_overrides.stat.exists
    - openshell_gateway_default is skipped or not openshell_gateway_default.stat.exists
