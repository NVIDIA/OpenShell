---
# Tests run sandboxes from the e2e-python workload image (the testkit's
# python_image()), so load it next to the runtime images.
- name: Copy OpenShell runtime and test workload images
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/var/lib/openshell/{{ item.name }}.tar"
    owner: "{{ openshell_gateway_user }}"
    group: "{{ openshell_gateway_user }}"
    mode: "0600"
  loop:
    - name: sandbox
      src: "{{ openshell_sandbox_image }}"
    - name: supervisor
      src: "{{ openshell_supervisor_image }}"
    - name: e2e-python
      src: "{{ openshell_e2e_python_image }}"

- name: Load OpenShell runtime and test workload images
  become: true
  become_user: "{{ openshell_gateway_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - load
      - --input
      - "/var/lib/openshell/{{ item }}.tar"
  loop:
    - sandbox
    - supervisor
    - e2e-python
  environment:
    HOME: "{{ openshell_gateway_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ openshell_gateway_uid }}"
