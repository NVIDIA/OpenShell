---
- name: Copy OpenShell runtime images
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/var/lib/openshell/{{ item.name }}.tar"
    owner: "{{ openshell_gateway_user }}"
    group: "{{ openshell_gateway_user }}"
    mode: "0600"
  loop:
    - name: sandbox
      src: "{{ openshell_sandbox_image }}"
    - name: supervisor
      src: "{{ openshell_supervisor_image }}"

- name: Load OpenShell runtime images
  become: true
  become_user: "{{ openshell_gateway_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - load
      - --input
      - "/var/lib/openshell/{{ item }}.tar"
  loop:
    - sandbox
    - supervisor
  environment:
    HOME: "{{ openshell_gateway_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ openshell_gateway_uid }}"

# An environment can add [openshell.drivers.podman] settings, such as the
# user-namespace mode (playbooks/drivers/podman/userns.yaml).
- name: Check for environment Podman driver settings
  ansible.builtin.stat:
    path: /etc/openshell-test/podman-driver.toml
  register: openshell_gateway_podman_driver_file

- name: Read environment Podman driver settings
  ansible.builtin.slurp:
    src: /etc/openshell-test/podman-driver.toml
  register: openshell_gateway_podman_driver_slurp
  when: openshell_gateway_podman_driver_file.stat.exists

- name: Select environment Podman driver settings
  ansible.builtin.set_fact:
    openshell_gateway_podman_driver_settings: >-
      {{ openshell_gateway_podman_driver_slurp.content | b64decode | trim
         if openshell_gateway_podman_driver_file.stat.exists else '' }}
