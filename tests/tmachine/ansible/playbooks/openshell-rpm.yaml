---
- name: Install OpenShell RPM packages
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Copy OpenShell RPM packages
      become: true
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/var/tmp/{{ item.name }}.rpm"
        mode: "0644"
      loop:
        - { name: openshell, src: "{{ openshell_rpm }}" }
        - { name: openshell-gateway, src: "{{ openshell_gateway_rpm }}" }

    - name: Install OpenShell RPM packages
      become: true
      ansible.builtin.dnf:
        name:
          - /var/tmp/openshell.rpm
          - /var/tmp/openshell-gateway.rpm
        state: present
        disable_gpg_check: true
        allow_downgrade: true

    - name: Prepare packaged OpenShell gateway
      ansible.builtin.include_role:
        name: openshell_packaged_gateway
