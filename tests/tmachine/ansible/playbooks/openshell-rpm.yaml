---
- name: Install OpenShell RPM packages
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Copy OpenShell RPM packages
      become: true
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/var/tmp/{{ item.name }}.rpm"
        mode: "0644"
      loop:
        - { name: openshell, src: "{{ openshell_rpm }}" }
        - { name: openshell-gateway, src: "{{ openshell_gateway_rpm }}" }

    - name: Install OpenShell RPM packages
      become: true
      ansible.builtin.dnf:
        name:
          - /var/tmp/openshell.rpm
          - /var/tmp/openshell-gateway.rpm
        state: present
        disable_gpg_check: true
        allow_downgrade: true

    - name: Prepare packaged OpenShell gateway
      ansible.builtin.include_role:
        name: openshell_packaged_gateway

    # The packaged configuration sets no network_name, so the gateway uses the
    # Podman driver's default. See tests/support/container-engine.
    - name: Publish the container network test variable
      ansible.builtin.include_tasks: test-env.yaml
      when: openshell_gateway_driver == "podman"
      vars:
        test_env_name: container-network
        test_env_vars:
          OPENSHELL_TEST_CONTAINER_NETWORK: openshell
