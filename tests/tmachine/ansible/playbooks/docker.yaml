---
- name: Docker
  hosts: all
  gather_facts: false
  vars:
    docker_users:
      - tmachine
  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: geerlingguy.docker
      become: true
  tasks:
    # tmachine is in the docker group, so tests reach the gateway's engine
    # directly. See tests/support/container-engine.
    - name: Publish container engine test variables
      ansible.builtin.include_tasks: test-env.yaml
      vars:
        test_env_name: container-engine
        test_env_vars:
          OPENSHELL_TEST_CONTAINER_ENGINE: docker
