# Set how the gateway delivers configuration to supervisors, and publish it.
#
# `gateway_config_delivery_mode` is push or poll. The playbook writes
# `[openshell.gateway] config_delivery_mode` to
# /etc/openshell-test/gateway-overrides.toml, which the `binaries`, `deb` and
# `rpm` installers apply to the gateway's configuration (k3s installers ignore
# it). It publishes the mode as OPENSHELL_TEST_CONFIG_DELIVERY_MODE, which the
# config-push feature suite (tests/suites/features/config-push) checks against
# the supervisor's own report.
---
- name: Gateway configuration delivery for tests
  hosts: all
  gather_facts: false
  vars:
    config_delivery_overrides: /etc/openshell-test/gateway-overrides.toml
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Require a known configuration delivery mode
      ansible.builtin.assert:
        that:
          - gateway_config_delivery_mode is defined
          - gateway_config_delivery_mode in ['push', 'poll']
        fail_msg: >-
          gateway_config_delivery_mode must be push or poll, not
          {{ gateway_config_delivery_mode | default('unset') }}

    - name: Create the test configuration directory
      become: true
      ansible.builtin.file:
        path: "{{ config_delivery_overrides | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # A managed block, so other playbooks can add their own tables to the
    # file. `[openshell] version` is what the gateway's own configuration
    # already declares; a drop-in configuration must state it too.
    - name: Write the configuration delivery mode
      become: true
      ansible.builtin.blockinfile:
        path: "{{ config_delivery_overrides }}"
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} config-delivery.yaml"
        block: |
          [openshell]
          version = 2

          [openshell.gateway]
          config_delivery_mode = "{{ gateway_config_delivery_mode }}"

    - name: Publish the configuration delivery mode
      ansible.builtin.include_tasks: test-env.yaml
      vars:
        test_env_name: config-delivery
        test_env_vars:
          OPENSHELL_TEST_CONFIG_DELIVERY_MODE: "{{ gateway_config_delivery_mode }}"
