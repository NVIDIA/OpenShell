---
- name: Stage PostgreSQL for the HA gateway
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    # The install layer boots fresh, so the K3s API may still be starting.
    - name: Apply OpenShell namespace
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, --filename, "-"]
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshell
      register: k3s_namespace
      until: k3s_namespace.rc == 0
      retries: 30
      delay: 2

    - name: Apply PostgreSQL fixture
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, apply, --filename, "-"]
        stdin: "{{ lookup('ansible.builtin.file', openshell_postgres_fixture) }}"

    # Gateway Pods that start before the database crash-loop with growing backoff.
    - name: Wait for PostgreSQL
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - openshell
          - rollout
          - status
          - deployment/openshell-e2e-postgres
          - --timeout=300s
      changed_when: false

- import_playbook: openshell-k3s.yaml
  vars:
    openshell_k3s_helm_values_overlay: |
      replicaCount: 3
      workload:
        kind: deployment
      server:
        externalDbSecret: openshell-e2e-postgres-credentials
        disableTls: false

- name: Register the HA gateway over mTLS
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # The chart's server certificate covers the Service DNS name but not its
    # ClusterIP, and the node resolver cannot reach cluster DNS.
    - name: Resolve the gateway Service name to its ClusterIP
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\sopenshell\.openshell\.svc\.cluster\.local$'
        line: "{{ k3s_gateway_address.stdout.split(':')[0] }} openshell.openshell.svc.cluster.local"

    - name: Read chart client TLS Secret
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, --namespace, openshell, get, secret, openshell-client-tls, --output, json]
      register: k3s_client_tls
      changed_when: false
      no_log: true

    - name: Create guest mTLS directory
      ansible.builtin.file:
        path: /home/tmachine/.config/openshell/gateways/tmachine/mtls
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Write guest client TLS bundle
      ansible.builtin.copy:
        content: "{{ (k3s_client_tls.stdout | from_json).data[item] | b64decode }}"
        dest: "/home/tmachine/.config/openshell/gateways/tmachine/mtls/{{ item }}"
        owner: tmachine
        group: tmachine
        mode: "0600"
      loop: [ca.crt, tls.crt, tls.key]
      no_log: true

    # The base playbook registered a plaintext endpoint; replace it.
    - name: Remove baseline guest gateway registration
      become: false
      ansible.builtin.command:
        argv: [/usr/local/bin/openshell, gateway, remove, tmachine]

    - name: Register guest gateway
      ansible.builtin.include_role:
        name: openshell_client
        apply:
          become: false
      vars:
        openshell_client_gateway_endpoint: "https://openshell.openshell.svc.cluster.local:{{ k3s_gateway_address.stdout.split(':')[1] }}"
