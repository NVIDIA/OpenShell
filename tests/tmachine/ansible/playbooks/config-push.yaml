# Make the gateway push configuration to supervisors.
#
# Writes `[openshell.gateway] config_delivery_mode = "push"` to
# /etc/openshell-test/gateway-overrides.toml, which the `binaries`, `deb` and
# `rpm` installers apply to the gateway's configuration (k3s installers ignore
# it). The config-push feature suite (tests/suites/features/config-push) fails
# unless a supervisor reports a pushed-configuration session.
---
- name: Gateway configuration push for tests
  hosts: all
  gather_facts: false
  vars:
    config_push_overrides: /etc/openshell-test/gateway-overrides.toml
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Create the test configuration directory
      become: true
      ansible.builtin.file:
        path: "{{ config_push_overrides | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # A managed block keeps tables that earlier playbooks wrote. A playbook
    # that replaces the whole file, such as drivers/podman/userns.yaml, must
    # run before this one.
    - name: Write the configuration delivery mode
      become: true
      ansible.builtin.blockinfile:
        path: "{{ config_push_overrides }}"
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} config-push.yaml"
        block: |
          [openshell.gateway]
          config_delivery_mode = "push"
