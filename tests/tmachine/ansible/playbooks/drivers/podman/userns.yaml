# Configure the Podman gateway's user-namespace mode and publish it.
#
# `podman_userns_mode` is default, auto, keep-id or private. Every mode except
# default adds its `[openshell.drivers.podman]` settings to the gateway
# overrides (the gateway_overrides role), which every installer applies to the
# gateway's configuration. Default mode removes them, so userns, uidmap and
# gidmap stay unset. The Podman support crate (tests/support/podman) reads the
# published mode and runs Podman's own reference container in it.
---
- name: Podman user namespaces for tests
  hosts: all
  gather_facts: false
  vars:
    podman_userns_settings:
      default: ""
      auto: |
        [openshell.drivers.podman]
        userns = "auto"
      keep-id: |
        [openshell.drivers.podman]
        userns = "keep-id"
      private: |
        [openshell.drivers.podman]
        userns = "private"
        uidmap = ["0:0:1", "1:1:65535"]
        gidmap = ["0:0:1", "1:1:65535"]
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Require a known user-namespace mode
      ansible.builtin.assert:
        that:
          - podman_userns_mode is defined
          - podman_userns_mode in podman_userns_settings
        fail_msg: >-
          podman_userns_mode must be one of
          {{ podman_userns_settings.keys() | join(', ') }}, not
          {{ podman_userns_mode | default('unset') }}

    - name: Write the Podman driver user-namespace settings
      ansible.builtin.include_role:
        name: gateway_overrides
      vars:
        gateway_overrides_name: podman-userns
        gateway_overrides_content: "{{ podman_userns_settings[podman_userns_mode] }}"
        gateway_overrides_state: "{{ 'absent' if podman_userns_mode == 'default' else 'present' }}"

    - name: Publish Podman user-namespace test variables
      ansible.builtin.include_tasks: ../../test-env.yaml
      vars:
        test_env_name: podman-userns
        test_env_vars:
          OPENSHELL_TEST_PODMAN_USERNS: "{{ podman_userns_mode }}"
