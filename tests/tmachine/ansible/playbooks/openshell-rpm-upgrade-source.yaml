---
# Install released RPM packages as the baseline of an upgrade test. The
# released packages keep their own runtime image tags and defaults.
- name: Install released OpenShell RPM packages
  ansible.builtin.import_playbook: openshell-rpm.yaml
  vars:
    openshell_packaged_gateway_released_source: true

# Stage the candidate, and the `upgrade` disruption that installs it. How a
# candidate is installed depends on the package type, so the installer that
# knows it provides the step. The runner runs it from the disruptions directory.
- name: Stage the OpenShell upgrade candidate
  hosts: all
  gather_facts: false
  tasks:
    - name: Create candidate and disruptions directories
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/openshell-qualification/candidate
        - /var/lib/openshell-qualification/disruptions

    - name: Copy candidate packages and runtime images
      become: true
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/var/lib/openshell-qualification/candidate/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { name: openshell.rpm, src: "{{ openshell_candidate_rpm }}" }
        - { name: openshell-gateway.rpm, src: "{{ openshell_candidate_gateway_rpm }}" }
        - { name: sandbox.tar, src: "{{ openshell_candidate_sandbox_image }}" }
        - { name: supervisor.tar, src: "{{ openshell_candidate_supervisor_image }}" }

    # Rendered for the user that runs the gateway, which the packaged-gateway
    # role detected: the login user under rootless Podman, root under rootful.
    - name: Stage the upgrade disruption
      become: true
      ansible.builtin.template:
        src: "{{ playbook_dir }}/upgrade/rpm.sh.j2"
        dest: /var/lib/openshell-qualification/disruptions/upgrade
        owner: root
        group: root
        mode: "0755"
