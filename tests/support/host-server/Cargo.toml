[package]
name = "host-server-support"
description = "Servers on the test host that sandboxes reach through host.openshell.internal"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ai-openshell/openshell"
publish = false

[dependencies]
openshell-testkit = { path = "../../testkit/testkit" }
serde_json = "1"
tokio = { version = "1.43", features = ["io-util", "net", "rt", "time"] }
tungstenite = "0.26"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt"] }
