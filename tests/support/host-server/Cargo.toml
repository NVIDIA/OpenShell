[package]
name = "host-server-support"
description = "Servers on the test host that sandboxes reach through host.openshell.internal"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
openshell-crypto = { path = "../../../crates/openshell-crypto" }
openshell-testkit = { path = "../../testkit/testkit" }
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
serde_json = "1"
tokio = { version = "1.43", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["macros", "rt"] }
