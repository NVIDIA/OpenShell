[package]
name = "sandbox-clients-support"
description = "Network clients that tests run in a sandbox, and typed probes for their results"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
httparse = "1"
openshell-testkit = { path = "../../testkit/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
