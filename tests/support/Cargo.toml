# Support crates for test suites, one per concern, such as a service the
# environment runs. Suites depend on them by path.
[workspace]
resolver = "2"
members = ["container-engine", "keycloak", "podman"]

[patch.crates-io]
# Temporary SQLite security backport; see vendor/sqlx-sqlite/README.openshell.md.
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite" }
