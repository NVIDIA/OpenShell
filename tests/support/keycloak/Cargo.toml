[package]
name = "keycloak-support"
description = "Keycloak fixture for test suites that need an OIDC issuer"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
openshell-testkit = { path = "../../testkit/testkit" }
base64 = "0.22"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.43", features = ["fs", "io-util", "process", "time"] }
url = "2"
