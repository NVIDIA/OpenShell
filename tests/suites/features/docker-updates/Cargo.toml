[package]
name = "docker-updates"
description = "Authenticated Docker persistent-workspace image-update qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[[test]]
name = "docker-updates"
path = "tests/update.rs"
harness = false

[dependencies]
openshell-testkit = { path = "../../../testkit/testkit" }
serde_json = "1"
tokio = { version = "1.43", features = ["process", "time"] }
tonic = "0.14"
uuid = { version = "1.10", features = ["v4"] }
