[package]
name = "routable-host-ip"
description = "Features suite: sandboxes reach the test host by an IP literal policy endpoint"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ai-openshell/openshell"
publish = false

[[test]]
name = "routable-host-ip"
path = "tests/routable_host_ip.rs"
