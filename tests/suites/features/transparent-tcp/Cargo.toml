[package]
name = "transparent-tcp"
description = "Features suite: native TCP from Docker and Podman sandboxes goes through policy DNS and fails closed"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
container-engine-support = { path = "../../../support/container-engine" }
host-server-support = { path = "../../../support/host-server" }
openshell-testkit = { path = "../../../testkit/testkit" }
sandbox-clients-support = { path = "../../../support/sandbox-clients" }
tokio = { version = "1", features = ["time"] }
