[package]
name = "ocsf"
description = "Features suite: a container supervisor writes opt-in OCSF JSON audit records to its stderr that conform to the OCSF schema and cover network, HTTP and SSH activity"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
container-engine-support = { path = "../../../support/container-engine" }
host-server-support = { path = "../../../support/host-server" }
openshell-ocsf-validate = { path = "../../../../crates/openshell-ocsf-validate" }
openshell-testkit = { path = "../../../testkit/testkit" }
sandbox-clients-support = { path = "../../../support/sandbox-clients" }
serde_json = "1"
