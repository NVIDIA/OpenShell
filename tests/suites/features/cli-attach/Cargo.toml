[package]
name = "cli-attach"
description = "Features suite: `sandbox connect` recovers its SSH transport and forwards termination"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
openshell-testkit = { path = "../../../testkit/testkit" }
tokio = { version = "1.43", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "term"] }
