# Conformance tests an environment can't pass yet. CI turns the entries for an
# environment into OPENSHELL_TEST_UNSUPPORTED, and openshell-conformance skips
# those tests there; every other environment still runs them.
#
# Each entry is one issue and the environments it breaks the test in:
#
#   - test: conformance::<module>::<name>
#     issue: https://github.com/NVIDIA/OpenShell/issues/<n>
#     environments:
#       - ubuntu-k3s/k3s-ha   # a tmachine row: <environment>/<installer>
#       - vm                  # a host lane: docker, podman, kubernetes or vm
#
# Add an entry when a migration finds a bug, and delete it in the PR that fixes
# the bug. A test can appear more than once with different issues, but not twice
# for one environment. Branch Checks runs the program with each environment's
# entries to validate this file; see tests/suites/conformance/README.md.
[]
