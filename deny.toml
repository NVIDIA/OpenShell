# Lower-level implementations used by the dependency-owned SSH stack.
[[bans.deny]]
name = "bcrypt-pbkdf"
wrappers = ["ssh-key"]
reason = "SSH key derivation is dependency-owned."

[[bans.deny]]
name = "des"
reason = "No DES implementation is enabled; compatibility exceptions require explicit review."

[[bans.deny]]
name = "ecdsa"
wrappers = ["p256", "p384", "p521", "russh"]
reason = "Use the facade for signing; dependency-owned implementations remain permitted."

[[bans.deny]]
name = "fiat-crypto"
wrappers = ["curve25519-dalek", "p384"]
reason = "Curve arithmetic belongs behind the dependency-owned implementations."

[[bans.deny]]
name = "ml-kem"
wrappers = ["russh"]
reason = "Post-quantum SSH cryptography is dependency-owned."

[[bans.deny]]
name = "rfc6979"
wrappers = ["ecdsa"]
reason = "Signature nonce generation belongs behind the signing implementation."

[[bans.deny]]
name = "ssh-cipher"
wrappers = ["ssh-key"]
reason = "SSH ciphers are dependency-owned."

