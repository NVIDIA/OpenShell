# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

# -- Advisories (RustSec + NVD) ------------------------------------------------
[advisories]
yanked = "warn"
unmaintained = "workspace"
maximum-db-staleness = "P30D"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack — required by russh/ssh-key and RSA test fixtures; no patched release is available" },
]

# -- Licenses ------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Permissive, non-copyleft license pulled in by the prebuilt Z3 archive
    # path (z3-sys -> zip -> bzip2); compatible with this Apache-2.0 project.
    "bzip2-1.0.6",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true
registries = []

# -- Bans ----------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crypto implementations must stay behind the facade or an explicit wrapper.
# See crates/openshell-crypto/CRYPTO.md#dependency-guardrail for classifications.
# Wrappers permit only direct parents, not arbitrary descendants. Keep this
# catalog and its exceptions reviewed when changing cryptographic dependencies.

[[bans.deny]]
name = "ring"
wrappers = ["rustls", "rustls-webpki"]
reason = "Use the selected crypto backend instead. These wrappers are allowed for z3-sys's prebuilt archive downloader."

[[bans.deny]]
name = "aws-lc-rs"
reason = "Use openshell-crypto; exceptions are classified in CRYPTO.md."
wrappers = [
    "jsonwebtoken",
    "openshell-crypto",
    "rcgen",
    "russh",
    "rustls",
    "rustls-webpki",
]

[[bans.deny]]
name = "aws-lc-sys"
reason = "Native crypto bindings belong behind their provider libraries, not application crates."
wrappers = [
    "aws-lc-rs",
]

[[bans.deny]]
name = "aws-lc-fips-sys"
# Keep this boundary even when the FIPS build feature is disabled.
# The aws-lc-rs wrapper is intentionally unused in the current resolved graph;
# cargo-deny's unused-wrapper warning for this entry is expected. Revisit this
# acknowledgement if the FIPS dependency is enabled; other unused wrappers
# still require review.
reason = "Native crypto bindings belong behind their provider libraries, not application crates."
wrappers = [
    "aws-lc-rs",
]

[[bans.deny]]
name = "openssl"
reason = "Use openshell-crypto; exceptions are classified in CRYPTO.md."
wrappers = [
    "jsonwebtoken-openssl",
    "openshell-crypto",
    "rustls-openssl",
]

[[bans.deny]]
name = "openssl-src"
reason = "Use system-provided OpenSSL; vendored OpenSSL is not permitted."

[[bans.deny]]
name = "openssl-sys"
reason = "Native crypto bindings belong behind their provider libraries, not application crates."
wrappers = [
    "openssl",
    "rustls-openssl",
]

[[bans.deny]]
name = "rustls-openssl"
reason = "OpenSSL protocol adapters are owned by openshell-crypto."
wrappers = [
    "openshell-crypto",
]

[[bans.deny]]
name = "jsonwebtoken-openssl"
reason = "OpenSSL protocol adapters are owned by openshell-crypto."
wrappers = [
    "openshell-crypto",
