# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

# -- Advisories (RustSec + NVD) ------------------------------------------------
[advisories]
yanked = "warn"
unmaintained = "workspace"
maximum-db-staleness = "P30D"
ignore = [
    # Patched rsa 0.10.0 conflicts with russh 0.65.0 (also 0.65.1), which pins
    # rsa =0.10.0-rc.18 and ssh-key =0.7.0-rc.11. RSA test fixtures use 0.9.10.
    # https://rustsec.org/advisories/RUSTSEC-2023-0071.html
    # https://docs.rs/crate/russh/0.65.1/source/Cargo.toml
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; remove when a released russh accepts rsa >=0.10.0 and all SSH and test-fixture occurrences are upgraded and validated" },
    # Temporary: SQLx's SQLite dependency-bound update is merged but unreleased.
    # https://github.com/transact-rs/sqlx/pull/4502
    { id = "RUSTSEC-2026-0459", reason = "sqlx-sqlite 0.9.0 requires libsqlite3-sys <0.38.0; remove this exception when a released SQLx accepts patched libsqlite3-sys >=0.39.0" },
]

# -- Licenses ------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Permissive, non-copyleft license pulled in by the prebuilt Z3 archive
    # path (z3-sys -> zip -> bzip2); compatible with this Apache-2.0 project.
    "bzip2-1.0.6",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true
registries = []

# -- Bans ----------------------------------------------------------------------
[bans]
deny = [
    { name = "ring", wrappers = ["rustls", "rustls-webpki", "x509-parser"], reason = "Use the AWS-LC crypto backend instead. These wrappers are required only by rcgen's CA certificate parser and z3-sys's prebuilt archive downloader." },
]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# -- Sources -------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
