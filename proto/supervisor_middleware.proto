syntax = "proto3";

package openshell.middleware.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "extension.proto";

// SupervisorMiddleware discovers and configures one operator-run middleware.
// It evaluates HTTP requests, HTTP responses, and WebSocket messages.
// Phase-specific services share the same registration.
service SupervisorMiddleware {
  // Describe returns the service manifest and declared bindings.
  rpc Describe(MiddlewareDescribeRequest) returns (MiddlewareManifest);

  // ValidateConfig checks service-specific configuration for one binding.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);

  // HTTP protocol 1. Deprecated: removed in 0.2.0; use EvaluateHttp.
  // EvaluateHttpRequest returns an allow, deny, or mutation decision for one
  // buffered HTTP request. OpenShell calls it for HTTP_REQUEST bindings.
  rpc EvaluateHttpRequest(HttpRequestEvaluation) returns (HttpRequestResult);

  // HTTP protocol 2. One stream per HTTP message (request or response) and
  // middleware stage, or per uninspectable connection. The first event is a
  // preflight that says what is being evaluated. OpenShell calls it for
  // HTTP_REQUEST_V2 and HTTP_RESPONSE_V2 bindings.
  rpc EvaluateHttp(stream HttpEvent) returns (stream HttpResult);

  // EvaluateWebSocketSession opens one ordered, phase-specific stream for a
  // single middleware stage and WebSocket upgrade attempt. The current
  // implementation supports client-to-upstream text messages at
  // PRE_CREDENTIALS; PRE_RETURN is reserved for upstream-to-client messages.
  // A request may go unanswered when the session terminates. For every opened
  // stage stream, OpenShell attempts at most one session_end before closing the
  // stream when its transport is still writable.
  rpc EvaluateWebSocketSession(stream WebSocketSessionEvent)
      returns (stream WebSocketSessionEventResult);
}

message MiddlewareDescribeRequest {
  // Gateway or supervisor protocol metadata. Middleware must reject unmet
  // requirements before accepting traffic.
  openshell.extension.v1.PeerMetadata gateway = 1;
}

// HttpResponsePreReturn evaluates one response for one middleware stage before
// OpenShell returns it to the sandbox.
service HttpResponsePreReturn {
  // HTTP protocol 1. Deprecated: removed in 0.2.0; use
  // SupervisorMiddleware.EvaluateHttp.
  // Evaluate starts with preflight and may continue with selected body units
  // and trailers. A body unit marked end_of_stream ends body inspection, not
  // the event stream. Trailers and one best-effort session_end may follow.
  rpc Evaluate(stream HttpResponseEvent)
      returns (stream HttpResponseEventResult);
}

// MiddlewareManifest describes one middleware service and its bindings.
message MiddlewareManifest {
  // Human-readable middleware service name used only for diagnostics. This is
  // not required to match an operator-owned registration name.
  string name = 1;
  // Deprecated diagnostic compatibility field. Use
  // extension.implementation_version.
  string service_version = 2;
  // Bindings exposed by this middleware service.
  repeated MiddlewareBinding bindings = 3;
  // Exact JWT audience this service verifies on inbound OpenShell calls.
  // After authenticated Describe succeeds, OpenShell rejects the registration
  // unless this matches the operator-configured audience. A strict verifier may
  // reject an incorrect audience before returning this manifest. Empty skips
  // this post-authentication consistency check.
  string expected_audience = 4;
  // Supervisor-middleware protocol metadata. Required for negotiation.
  openshell.extension.v1.PeerMetadata extension = 5;
}

// MiddlewareBinding declares one operation and phase supported by a service.
message MiddlewareBinding {
  reserved 4;
  reserved "timeout";
  // Supported operation.
  SupervisorMiddlewareOperation operation = 1;
  // Supported phase.
  SupervisorMiddlewarePhase phase = 2;
  // Maximum request body, WebSocket message, or response body unit/replacement.
  // Required for payload-bearing operations. An HTTP_REQUEST_V2 or
  // HTTP_RESPONSE_V2 binding may leave this zero: OpenShell then offers it no
  // body modes, so it can only continue or reject at preflight.
  uint64 max_payload_bytes = 3;
  // Optional binding-specific RPC timeout. Empty uses the operator-configured
  // service timeout, or the 500ms platform default when that is also omitted.
  // A non-empty value may shorten but cannot extend the operator timeout.
  // Values must be between 10ms and 30s.
  google.protobuf.Duration request_timeout = 104;
}

// ValidateConfigRequest contains one policy configuration to validate.
message ValidateConfigRequest {
  // Service-specific policy configuration.
  google.protobuf.Struct config = 1;
  // Built-in middleware name or operator-owned registration name.
  string middleware_name = 2;
}

// ValidateConfigResponse reports whether a policy configuration is accepted.
message ValidateConfigResponse {
  // True when the service accepts the configuration.
  bool valid = 1;
  // Human-readable validation failure reason. Empty when valid is true.
  string reason = 2;
}

// HTTP protocol 2. One ordered event in an EvaluateHttp stream. Preflight is
// always first. An inspect result is followed by begin and exactly one body
// lifecycle: buffered_body for BUFFERED, or input_chunk events ending with
// input_end for STREAM. session_end is best effort and has no result.
message HttpEvent {
  oneof event {
    HttpPreflight preflight = 1;
    HttpBegin begin = 2;
    HttpBufferedBody buffered_body = 3;
    HttpInputChunk input_chunk = 4;
    HttpInputEnd input_end = 5;
    MiddlewareSessionEnd session_end = 6;
  }
}

// HTTP protocol 2. One ordered result in an EvaluateHttp stream. Preflight
// requires preflight_result or reject. BUFFERED ends with buffered_result or
// reject. STREAM sends output_start before any output_chunk and ends with
// finish or reject. An unset or unknown result fails the exchange closed.
//
// A service may close its result stream right after the result that ends its
// part in the exchange (continue_without_body, buffered_result, finish, or
// reject), or keep it open until session_end. OpenShell accepts both.
//
// A stage that cannot inspect the message ends the stream with gRPC status
// FAILED_PRECONDITION. OpenShell fails the exchange closed with the
// platform-owned reason middleware_cannot_inspect and does not record the
// status message. Reject denies the content itself.
message HttpResult {
  oneof result {
    HttpPreflightResult preflight_result = 1;
    HttpBufferedResult buffered_result = 2;
    HttpOutputStart output_start = 3;
    HttpOutputChunk output_chunk = 4;
    HttpFinish finish = 5;
    HttpReject reject = 6;
  }
}

// HTTP protocol 2 body lifecycle a stage selects at preflight.
enum HttpBodyMode {
  HTTP_BODY_MODE_UNSPECIFIED = 0;
  // One complete body and one terminal result. OpenShell holds the body in
  // memory, up to the selected max_body_bytes.
  HTTP_BODY_MODE_BUFFERED = 1;
  // Independent ordered input and output streams. The stage returns every
  // output byte and owns any working storage. No total size or time limit.
  HTTP_BODY_MODE_STREAM = 2;
}

// Why OpenShell does not offer a body mode the binding supports.
enum HttpBodyUnavailableReason {
  HTTP_BODY_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // The response has no body: the request method is HEAD, or the status is
  // 1xx, 204, or 304.
  HTTP_BODY_UNAVAILABLE_REASON_BODYLESS = 1;
  // The response carries part of a representation: status 206, a
  // Content-Range header, or multipart/byteranges content.
  HTTP_BODY_UNAVAILABLE_REASON_PARTIAL = 2;
  // Cache-Control no-transform forbids changing the response body.
  HTTP_BODY_UNAVAILABLE_REASON_NO_TRANSFORM = 3;
  // The response body has a content coding other than identity.
  HTTP_BODY_UNAVAILABLE_REASON_ENCODED = 4;
  // The declared body length exceeds the stage's payload limit.
  HTTP_BODY_UNAVAILABLE_REASON_OVER_LIMIT = 5;
  // The response is open-ended, such as text/event-stream or
  // multipart/x-mixed-replace, and has no complete body to buffer.
  HTTP_BODY_UNAVAILABLE_REASON_OPEN_ENDED = 6;
  // The client could not detect a truncated response body, because the
  // client request or the response status line uses HTTP/1.0 and the
  // response cannot be chunked.
  HTTP_BODY_UNAVAILABLE_REASON_TRUNCATION_UNDETECTABLE = 7;
}

// A body mode the binding supports that this preflight does not offer.
message HttpBodyModeUnavailable {
  HttpBodyMode mode = 1;
  HttpBodyUnavailableReason reason = 2;
}

// Why OpenShell cannot show a connection to middleware as HTTP messages.
enum UninspectableTrafficReason {
  UNINSPECTABLE_TRAFFIC_REASON_UNSPECIFIED = 0;
  // The endpoint sets tls: skip, so OpenShell relays the TLS tunnel without
  // terminating it.
  UNINSPECTABLE_TRAFFIC_REASON_TLS_SKIP = 1;
  // HTTP/2 with prior knowledge (h2c).
  UNINSPECTABLE_TRAFFIC_REASON_H2C = 2;
  // A tunnel protocol OpenShell does not parse.
  UNINSPECTABLE_TRAFFIC_REASON_UNSUPPORTED_TUNNEL = 3;
  // A raw TCP connection, such as transparent TCP or a non-HTTP tunnel.
  UNINSPECTABLE_TRAFFIC_REASON_RAW_TCP = 4;
  // A SQL endpoint relayed without inspection.
  UNINSPECTABLE_TRAFFIC_REASON_SQL_PASSTHROUGH = 5;
}

// A connection that selects the stage but that OpenShell cannot show to it as
// HTTP messages. Such a preflight never permits a body mode: the stage either
// continues without a body, which allows the connection, or rejects it.
message UninspectableTraffic {
  // Destination host selected by network policy.
  string host = 1;
  // Destination TCP port.
  uint32 port = 2;
  // Network policy that admitted the connection.
  string endpoint = 3;
  UninspectableTrafficReason reason = 4;
}

// HTTP protocol 2 preflight for one stage: what is evaluated, the body modes
// offered, and limits.
message HttpPreflight {
  oneof subject {
    // A request after network-policy admission and before credentials.
    HttpRequestPreflightHead request = 1;
    // A final upstream response before it reaches the sandbox.
    HttpResponsePreflightHead response = 2;
    // A connection OpenShell cannot inspect as HTTP.
    UninspectableTraffic uninspectable = 3;
  }
  // Sandbox and request identity. Limited to 4 KiB encoded.
  RequestContext context = 4;
  // Built-in middleware name or operator-owned registration name.
  string middleware_name = 5;
  // Validated service configuration. Limited to 64 KiB encoded.
  google.protobuf.Struct config = 6;
  // Body modes this message is eligible for. Empty permits only
  // continue_without_body or reject. The stage selects one of them, or
  // continues or rejects when none suits it.
  repeated HttpBodyMode permitted_body_modes = 7;
  // One entry for each body mode that permitted_body_modes omits, with the
  // rule that removed it. A stage can tell a bodyless response, which it
  // may let continue, from a body it cannot inspect.
  repeated HttpBodyModeUnavailable unavailable_body_modes = 8;
  HttpBodyLimits limits = 9;
  // Declared length of the original message body, when known. An earlier
  // stage may replace the body, so a stage enforces its limits on the body
  // events it receives.
  optional uint64 declared_body_bytes = 10;
}

// Request head after network-policy admission and before credentials.
message HttpRequestPreflightHead {
  // Admitted destination and request target. Limited to 32 KiB encoded.
  HttpRequestTarget target = 1;
  // Request headers after earlier stages' preflight mutations, in wire order.
  // Repeated names stay separate. Credential, routing, framing, and hop-by-hop
  // headers are omitted. Limited to 128 lines and 64 KiB encoded.
  repeated HttpHeader headers = 2;
}

// Final upstream response head before delivery to the sandbox.
message HttpResponsePreflightHead {
  // Admitted request target with a redacted query. Limited to 32 KiB encoded.
  HttpRequestTarget target = 1;
  // Final non-informational upstream status. Upgrades are not evaluated.
  uint32 status_code = 2;
  // Response headers after earlier stages' preflight mutations, in wire order.
  // Credential, routing, and hop-by-hop headers are omitted. Limited to 128
  // lines and 64 KiB encoded.
  repeated HttpHeader headers = 3;
}

// Limits for one stage exchange. max_buffered_body_bytes is 0 unless BUFFERED
// is permitted, and the chunk and queue limits are 0 when no body mode is
// permitted. STREAM has no total byte cap and no total deadline. BUFFERED has
// 2 minutes to receive, process, and deliver one body, and each body exchange
// is also bounded by the binding timeout.
message HttpBodyLimits {
  // Largest input_chunk and output_chunk payload.
  uint64 max_chunk_bytes = 1;
  // Largest BUFFERED input and replacement.
  uint64 max_buffered_body_bytes = 2;
  uint64 max_input_queue_bytes = 3;
  uint64 max_input_queue_messages = 4;
  uint64 max_output_queue_bytes = 5;
  uint64 max_output_queue_messages = 6;
  // STREAM middleware-stall timeout. A STREAM stage fails when it does not
  // accept the next input within this duration, or returns nothing within
  // this duration after input_end. Time the sandbox or upstream takes to
  // produce input does not count. OpenShell uses 30 seconds.
  google.protobuf.Duration idle_timeout = 7;
}

// Preflight decision. To deny, return HttpReject instead.
message HttpPreflightResult {
  oneof decision {
    // Let the message continue without this stage seeing its body. For
    // uninspectable traffic, allow the connection.
    HttpContinue continue_without_body = 1;
    // Inspect the body in one permitted mode.
    HttpInspect inspect = 2;
  }
  // Ordered head mutations, validated before the next stage sees the head.
  // Only visible end-to-end headers may change. Credential, routing, framing,
  // and hop-by-hop headers are protected; response coding and range headers
  // are protected and response integrity headers may only be removed. Not
  // allowed for uninspectable traffic. Limited to 64 operations, 32 KiB of
  // name/value data, and 64 KiB encoded.
  repeated HeaderMutation header_mutations = 3;
  MiddlewareDiagnostics diagnostics = 4;
}

// The body bypasses this stage but remains eligible for later stages.
message HttpContinue {}

// Selects one permitted body mode.
message HttpInspect {
  oneof mode {
    HttpBufferedMode buffered = 1;
    HttpStreamMode stream = 2;
  }
}

message HttpBufferedMode {
  // Positive and no larger than the offered max_buffered_body_bytes. The cap
  // applies separately to the input and the replacement.
  uint64 max_body_bytes = 1;
}

// STREAM makes the stage responsible for all output from accepted preflight.
message HttpStreamMode {}

// Starts the selected body lifecycle.
message HttpBegin {
  // This stage's current head: the original head, every preflight mutation,
  // and the late mutations of earlier stages. OpenShell sends begin only after
  // every earlier inspecting stage started its output, so the head is final up
  // to this stage. Late mutations returned in buffered_result or output_start
  // apply on top of it.
  repeated HttpHeader headers = 1;
}

// BUFFERED input: exactly one complete body, possibly empty.
message HttpBufferedBody {
  bytes data = 1;
  // Trailers of a chunked message, in wire order.
  repeated HttpHeader trailers = 2;
}

// BUFFERED terminal success.
message HttpBufferedResult {
  oneof body {
    // Keep the body.
    HttpUnchanged unchanged = 1;
    // Replace the body. Present empty bytes delete it.
    bytes replacement = 2;
  }
  // Late head mutations, applied after every preflight mutation.
  repeated HeaderMutation header_mutations = 3;
  repeated HeaderMutation trailer_mutations = 4;
  MiddlewareDiagnostics diagnostics = 5;
}

message HttpUnchanged {}

message HttpInputChunk {
  // Nonempty bytes without transfer framing. Boundaries carry no meaning.
  bytes data = 1;
}

message HttpInputEnd {
  // Sent exactly once after the input, including for an empty body. Trailers
  // of a chunked message, in wire order.
  repeated HttpHeader trailers = 1;
}

// Starts STREAM output. OpenShell commits the outgoing head when the last
// stage in the chain starts output.
message HttpOutputStart {
  // Late head mutations, applied after every preflight mutation.
  repeated HeaderMutation header_mutations = 1;
  // When present, the output is exactly this many bytes, and OpenShell frames
  // the outgoing message with Content-Length. Otherwise a streamed message is
  // chunked.
  optional uint64 output_body_bytes = 2;
}

message HttpOutputChunk {
  // Nonempty output bytes. Input and output chunk counts are independent.
  bytes data = 1;
}

// STREAM terminal success. Valid only after input_end was consumed.
message HttpFinish {
  repeated HeaderMutation trailer_mutations = 1;
  MiddlewareDiagnostics diagnostics = 2;
}

// Terminal denial at preflight or during body processing. Before a request
// reaches the upstream or a response head reaches the sandbox, OpenShell
// returns the canonical 403 middleware denial with the validated reason_code.
// After a response head is committed, OpenShell aborts delivery without a
// terminating chunk, trailers, or an error body. For uninspectable traffic,
// OpenShell refuses the connection.
message HttpReject {
  MiddlewareDiagnostics diagnostics = 1;
}

message MiddlewareDiagnostics {
  // Service text, never copied to denied responses or security logs. Maximum
  // 4 KiB.
  string reason = 1;
  // Optional stable audit-safe code that OpenShell may return to the sandbox
  // with a denial. Codes start with a lowercase ASCII letter and contain only
  // lowercase ASCII letters, digits, and underscores, at most 64 bytes.
  string reason_code = 2;
  // Up to 32 audit-safe findings, each limited to 4 KiB encoded.
  repeated Finding findings = 3;
  // Non-secret diagnostic metadata, limited to 64 entries and 32 KiB.
  map<string, string> metadata = 4;
}

// HTTP protocol 1. Deprecated: removed in 0.2.0.
// HttpRequestEvaluation contains one buffered HTTP request to evaluate.
message HttpRequestEvaluation {
  // Evaluation phase selected for this request.
  SupervisorMiddlewarePhase phase = 1;
  // Sandbox and request identity available to the supervisor.
  // The encoded context is limited to 4 KiB.
  RequestContext context = 2;
  // Validated service-specific policy configuration.
  // The encoded configuration is limited to 64 KiB.
  google.protobuf.Struct config = 3;
  // Destination and HTTP request target.
  // The encoded target is limited to 32 KiB.
  HttpRequestTarget target = 4;
  // HTTP request headers before OpenShell injects credentials, in wire
  // order. Repeated header names are preserved as separate entries. Protected
  // credential, routing, framing, and hop-by-hop headers are omitted.
  // At most 128 lines and 64 KiB of encoded headers are included.
  repeated HttpHeader headers = 5;
  // Buffered request body, limited to 4 MiB. Empty for a bodyless request.
  bytes body = 6;
  // Built-in middleware name or operator-owned registration name.
  string middleware_name = 7;
}

// HttpHeader is one HTTP header line.
message HttpHeader {
  // Lowercased header name.
  string name = 1;
  // Header value with surrounding whitespace trimmed.
  string value = 2;
}

// HTTP protocol 1. Deprecated: removed in 0.2.0.
// One ordered response event. A stream starts with preflight, may continue with
// body units ending in end_of_stream, may then include trailers, and may end
// with one best-effort session_end.
message HttpResponseEvent {
  oneof event {
    // Initial response head and request context.
    HttpResponsePreflight preflight = 1;
    // Next normalized body unit.
    HttpResponseBodyUnit body = 2;
    // Normalized trailers after the final body result.
    HttpResponseTrailers trailers = 4;
    // Optional terminal notification.
    MiddlewareSessionEnd session_end = 3;
  }
}

// HTTP protocol 1. Deprecated: removed in 0.2.0.
// Each preflight, body, and trailers event requires one ordered result.
// session_end has no result.
message HttpResponseEventResult {
  oneof result {
    // Result for preflight.
    HttpResponsePreflightResult preflight_result = 1;
    // Result for the next body unit.
    HttpResponseBodyResult body_result = 2;
    // Result for response trailers.
    HttpResponseTrailersResult trailers_result = 3;
  }
}

// HttpResponsePreflight exposes the current final response head to one stage.
message HttpResponsePreflight {
  // Request identity. request_id links request and response evaluations.
  // Limited to 4 KiB encoded.
  RequestContext context = 1;
  // Admitted request target with a redacted query. Limited to 32 KiB encoded.
  HttpRequestTarget target = 2;
  // Final non-informational upstream status. Upgrades are not evaluated.
  uint32 status_code = 3;
  // Response headers after prior stages, in wire order. Repeated names remain
  // separate. Credential, routing, and hop-by-hop headers are omitted.
  // Content-Length, Content-Encoding, and Content-Range retain their read-only
  // upstream values. OpenShell may recompute or remove Content-Length later.
  // Limited to 128 lines and 64 KiB encoded.
  repeated HttpHeader headers = 4;
  // Built-in middleware name or operator-owned registration name.
  string middleware_name = 5;
  // Validated service configuration. Limited to 64 KiB encoded.
  google.protobuf.Struct config = 6;
  // Effective minimum of platform, registration, and binding limits. Applies to
  // whole-body input/replacement and each stream input/replacement. Stream
  // inputs use at most min(64 KiB, max_payload_bytes).
  uint64 max_payload_bytes = 7;
  // Modes derived independently for this stage. OpenShell first determines
  // response-shape eligibility from the original final response head, then
  // applies this stage's effective max_payload_bytes. Different stages may
  // receive different lists. HEADERS_ONLY is always present and is the only
  // mode for bodyless, partial, encoded, or no-transform responses. For an
  // otherwise eligible response, a known body larger than this stage's limit
  // omits WHOLE_BODY_BYTES. An eligible unknown-length response may select
  // WHOLE_BODY_BYTES and later fail with whole_body_over_capacity according to
  // this stage's on_error. STREAM_BYTES is omitted when
  // max_payload_bytes is zero. Selecting an unlisted mode fails according to
  // on_error.
  repeated HttpResponseBodyMode permitted_body_modes = 8;
}

// Selects skip, inspect, or block. Diagnostic fields apply to every action.
// Invalid diagnostics make the entire result a middleware failure handled
// according to on_error.
message HttpResponsePreflightResult {
  oneof action {
    // Deliver unchanged without invoking on_error.
    HttpResponsePreflightSkip skip = 1;
    // Inspect with the selected body mode and mutations.
    HttpResponsePreflightInspect inspect = 2;
    // Prevent delivery to the sandbox.
    HttpResponseBlockDelivery block_delivery = 7;
  }
  // Service diagnostic, never sent to the sandbox or security logs. Maximum
  // 4 KiB.
  string reason = 3;
  // Optional audit code using the HttpRequestResult.reason_code format and
  // 64-byte maximum. Returned to the sandbox only for block_delivery.
  string reason_code = 4;
  // Up to 32 audit-safe findings, each limited to 4 KiB encoded.
  repeated Finding findings = 5;
  // Non-secret diagnostic metadata, limited to 64 entries and 32 KiB.
  map<string, string> metadata = 6;
}

// Ends this stage successfully without body inspection.
message HttpResponsePreflightSkip {}

// Blocks delivery as a successful decision regardless of on_error. OpenShell
// evaluates results in policy order. Once it accepts a valid block, it stops
// later middleware evaluation and ends every still-writable opened stage with
// MIDDLEWARE_DENIAL. A failure handled earlier may already have stopped
// evaluation, so a later block does not override it. An invalid block result
// is a middleware failure handled according to on_error. The upstream request
// has already run; blocking its response does not reject or roll back that
// request.
//
// Before response commitment, including at preflight and during
// WHOLE_BODY_BYTES, OpenShell replaces the upstream response with the canonical
// 403 Forbidden middleware-denial response. Its JSON body has
// error = "middleware_denied" and includes a validated reason_code when the
// result supplies one. OpenShell never returns the free-form reason or writes it
// to security logs. For HEAD, OpenShell sends the canonical response headers
// and Content-Length but no body. It closes the downstream connection after the
// denial response.
//
// After response commitment, including during STREAM_BYTES, OpenShell aborts
// downstream delivery. It does not inject an error body, a terminating chunk,
// or an error trailer. OpenShell does not reuse the upstream connection.
message HttpResponseBlockDelivery {}

// Selects body inspection and response-header mutations.
message HttpResponsePreflightInspect {
  // Required mode from permitted_body_modes. Invalid values fail according to
  // on_error.
  HttpResponseBodyMode body_mode = 1;
  // Ordered mutations applied atomically before the next stage. Only visible
  // end-to-end headers may change. Routing, credential, framing, coding, range,
  // and hop-by-hop headers are protected; integrity headers may only be removed.
  // Limited to 64 operations, 32 KiB of name/value data, and 64 KiB encoded.
  repeated HeaderMutation header_mutations = 2;
}

// Controls which response-body units a stage receives.
enum HttpResponseBodyMode {
  // Invalid value handled according to on_error.
  HTTP_RESPONSE_BODY_MODE_UNSPECIFIED = 0;
  // Inspect only the response head.
  HTTP_RESPONSE_BODY_MODE_HEADERS_ONLY = 1;
  // Buffer the normalized body as one final unit before committing the head.
  // Input and replacement must fit max_payload_bytes. Capacity failures use
  // whole_body_over_capacity and follow this stage's on_error.
  HTTP_RESPONSE_BODY_MODE_WHOLE_BODY_BYTES = 2;
  // Receive normalized units ending with end_of_stream. Each input is at most
  // min(64 KiB, max_payload_bytes), and each replacement must fit
  // max_payload_bytes. Each result fully accounts for its input unit; V1 does
  // not permit retaining input across units. The full body may exceed the
  // limit. STREAM_BYTES has no total response-lifetime deadline.
  HTTP_RESPONSE_BODY_MODE_STREAM_BYTES = 3;
}

// One normalized body unit. Boundaries have no transport or application
// meaning.
message HttpResponseBodyUnit {
  // Contiguous and stage-local, starting at 1.
  uint64 sequence = 1;
  oneof payload {
    // Bytes without transfer framing. A body-capable response with no body bytes
    // has present empty data in sequence 1. STREAM_BYTES input size is at most
    // min(64 KiB, max_payload_bytes). A unit may be shorter to preserve
    // flushing.
    bytes data = 2;
  }
  // Marks the final body unit. Every normally completed body inspection receives
  // exactly one. For a body-capable response with no body bytes, this is the
  // empty sequence-1 unit. OpenShell does not read ahead, so it may send an empty
  // final unit after the last nonempty unit. Trailers and session_end may
  // follow. A stage ended by skip_remaining, block, or failure receives no
  // later final unit.
  bool end_of_stream = 3;
}

// Result for one body unit. Units are processed in lockstep; V1 does not
// support ownership transfer or cross-unit retention. Diagnostic fields apply
// to every action. Invalid diagnostics make the entire result a middleware
// failure handled according to on_error. OpenShell retains the current input
// until it validates the result, so fail-open can continue from the last input
// OpenShell still owns.
message HttpResponseBodyResult {
  // Must match the next unit. Zero, gaps, duplicates, and regressions fail.
  uint64 sequence = 1;
  // Exactly one explicit action is required.
  oneof action {
    // Forward the input unit unchanged.
    HttpResponseBodyPassThrough pass_through = 2;
    // Replace the complete input unit.
    HttpResponseBodyTransform transform = 3;
    // Stop delivery. See HttpResponseBlockDelivery.
    HttpResponseBlockDelivery block_delivery = 8;
    // Finalize this unit and stop inspecting.
    HttpResponseBodySkipRemaining skip_remaining = 9;
  }
  // Service diagnostic, never sent to the sandbox or security logs. Maximum
  // 4 KiB.
  string reason = 4;
  // Optional audit code using the HttpRequestResult.reason_code format and
  // 64-byte maximum. When OpenShell accepts block_delivery before response
  // commitment, it includes this code in the canonical denial response. It is
  // never returned after commitment.
  string reason_code = 5;
  // Up to 32 audit-safe findings, each limited to 4 KiB encoded.
  repeated Finding findings = 6;
  // Non-secret diagnostic metadata, limited to 64 entries and 32 KiB.
  map<string, string> metadata = 7;
}

// Preserves the input unit.
message HttpResponseBodyPassThrough {}

// Finalizes this unit and ends the stage. This stage receives no later body or
// trailer events. The current and later units continue through other stages.
// For WHOLE_BODY_BYTES, this equals its nested action.
message HttpResponseBodySkipRemaining {
  // Exactly one action for the current unit.
  oneof current {
    // Forward the current unit unchanged.
    HttpResponseBodyPassThrough pass_through = 1;
    // Replace the current unit.
    HttpResponseBodyTransform transform = 2;
  }
}

// Replaces the complete input unit.
message HttpResponseBodyTransform {
  // Required replacement, limited to max_payload_bytes. Present empty data
  // deletes the input unit. The replacement fully accounts for this input unit;
  // middleware must not retain input bytes for a later unit in V1.
  oneof replacement {
    // Normalized replacement bytes.
    bytes data = 1;
  }
}

// The current normalized response trailers in wire order. Repeated names stay
// as separate fields. A stage that completes WHOLE_BODY_BYTES or STREAM_BYTES
// receives exactly one trailers event after its final body result, including
// when this set is empty. SKIP, HEADERS_ONLY, semantically bodyless responses,
// and stages ended by block, failure, or skip_remaining receive no trailers.
message HttpResponseTrailers {
  repeated HttpHeader headers = 1;
}

// Applies ordered trailer mutations atomically. An empty mutation list
// preserves the current trailers. A write may target only a case-insensitive
// name present in the trailers event; V1 cannot create a trailer name. Removal
// of an absent name is a no-op. Credential, routing, framing, coding, range,
// hop-by-hop, and connection-nominated fields are protected. Diagnostic fields
// apply whether mutations are empty or nonempty. Invalid diagnostics or
// mutations make the entire result a middleware failure handled according to
// on_error.
message HttpResponseTrailersResult {
  // At most 64 operations, 32 KiB of validated name/value data, and 64 KiB
  // encoded are accepted.
  repeated HeaderMutation trailer_mutations = 1;
  // Service diagnostic, never sent to the sandbox or security logs. Maximum
  // 4 KiB.
  string reason = 2;
  // Optional audit code using the HttpRequestResult.reason_code format and
  // 64-byte maximum. Never sent to the sandbox.
  string reason_code = 3;
  // Up to 32 audit-safe findings, each limited to 4 KiB encoded.
  repeated Finding findings = 4;
  // Non-secret diagnostic metadata, limited to 64 entries and 32 KiB.
  map<string, string> metadata = 5;
}

// Stable reason OpenShell ended a middleware stage stream.
enum MiddlewareSessionEndReason {
  // Invalid reason.
  MIDDLEWARE_SESSION_END_REASON_UNSPECIFIED = 0;
  // Evaluation completed.
  MIDDLEWARE_SESSION_END_REASON_NORMAL = 1;
  // The sandbox peer disconnected.
  MIDDLEWARE_SESSION_END_REASON_DOWNSTREAM_DISCONNECT = 2;
  // A policy reload replaced the active middleware chain.
  MIDDLEWARE_SESSION_END_REASON_POLICY_RELOAD = 3;
  // A stage denied the operation or blocked the response.
  MIDDLEWARE_SESSION_END_REASON_MIDDLEWARE_DENIAL = 4;
  // A selected stage failed.
  MIDDLEWARE_SESSION_END_REASON_MIDDLEWARE_FAILURE = 5;
  // A proxied or middleware protocol was violated.
  MIDDLEWARE_SESSION_END_REASON_PROTOCOL_ERROR = 6;
  // Evaluation was canceled for another reason.
  MIDDLEWARE_SESSION_END_REASON_CANCELLATION = 7;
  // Upstream rejected or failed before a valid response or upgrade.
  MIDDLEWARE_SESSION_END_REASON_UPSTREAM_FAILURE = 8;
  // Network policy denied the operation.
  MIDDLEWARE_SESSION_END_REASON_POLICY_DENIAL = 9;
  // The stage successfully declined inspection during preflight.
  MIDDLEWARE_SESSION_END_REASON_STAGE_SKIPPED = 10;
  // Upstream disconnected after a valid response or upgrade.
  MIDDLEWARE_SESSION_END_REASON_UPSTREAM_DISCONNECT = 11;
}

// Best-effort terminal notification. A stage receives at most one and sends no
// result.
message MiddlewareSessionEnd {
  // Terminal reason. Producers never send UNSPECIFIED.
  MiddlewareSessionEndReason reason = 1;
  // Set only for PROTOCOL_ERROR. Missing or unknown details mean a generic
  // protocol error.
  MiddlewareSessionProtocolError protocol_error = 2;
}

// Details for a protocol-error session end.
message MiddlewareSessionProtocolError {
  oneof domain {
    // WebSocket protocol violation.
    WebSocketProtocolError web_socket = 1;
    // Middleware event/result protocol violation.
    MiddlewareExchangeProtocolError middleware_exchange = 2;
  }
}

// WebSocket protocol error details, reserved for future categories.
message WebSocketProtocolError {}

// Middleware exchange error details, reserved for future categories.
message MiddlewareExchangeProtocolError {}

// Supervisor operation selected for middleware evaluation.
enum SupervisorMiddlewareOperation {
  SUPERVISOR_MIDDLEWARE_OPERATION_UNSPECIFIED = 0;
  // HTTP protocol 1 (EvaluateHttpRequest). Deprecated: removed in 0.2.0; use
  // HTTP_REQUEST_V2.
  SUPERVISOR_MIDDLEWARE_OPERATION_HTTP_REQUEST = 1;
  SUPERVISOR_MIDDLEWARE_OPERATION_WEBSOCKET_MESSAGE = 2;
  // HTTP protocol 1 (HttpResponsePreReturn.Evaluate). Deprecated: removed in
  // 0.2.0; use HTTP_RESPONSE_V2.
  SUPERVISOR_MIDDLEWARE_OPERATION_HTTP_RESPONSE = 3;
  // HTTP protocol 2 (EvaluateHttp) for requests, at PRE_CREDENTIALS. Peers
  // that predate HTTP protocol 2 reject this operation at Describe. A service
  // implements one HTTP protocol, so it cannot also bind HTTP_REQUEST or
  // HTTP_RESPONSE.
  SUPERVISOR_MIDDLEWARE_OPERATION_HTTP_REQUEST_V2 = 4;
  // HTTP protocol 2 (EvaluateHttp) for responses, at PRE_RETURN.
  SUPERVISOR_MIDDLEWARE_OPERATION_HTTP_RESPONSE_V2 = 5;
}

// Ordered phase within a supervisor operation.
enum SupervisorMiddlewarePhase {
  SUPERVISOR_MIDDLEWARE_PHASE_UNSPECIFIED = 0;
  SUPERVISOR_MIDDLEWARE_PHASE_PRE_CREDENTIALS = 1;
  SUPERVISOR_MIDDLEWARE_PHASE_PRE_RETURN = 2;
}

// WebSocketSessionEvent is one ordered event in a stage-local stream.
// Message sequence numbers identify logical messages session-wide. A stage
// receives a strictly increasing subset of those numbers; gaps are valid when
// session messages are not delivered to that stage.
message WebSocketSessionEvent {
  oneof event {
    WebSocketPreflight preflight = 1;
    WebSocketSessionStart session_start = 2;
    WebSocketMessage message = 3;
    MiddlewareSessionEnd session_end = 4;
  }
}

// WebSocketPreflight lets a service decline this upgrade before OpenShell
// contacts upstream. It deliberately excludes query data, arbitrary request
// headers, and message payloads.
message WebSocketPreflight {
  string session_id = 1;
  SupervisorMiddlewarePhase phase = 2;
  RequestContext context = 3;
  // Admitted HTTP WebSocket-upgrade target. The method is GET, query is always
  // empty, and path never includes a query string.
  HttpRequestTarget target = 4;
  repeated string requested_subprotocols = 5;
  // Built-in middleware name or operator-owned registration name.
  string middleware_name = 6;
  google.protobuf.Struct config = 7;
}

// WebSocketSessionStart reports bounded metadata known only after the
// upstream 101 response validates. Empty selected_subprotocol means none.
message WebSocketSessionStart {
  string selected_subprotocol = 1;
}

// WebSocketMessage contains one complete reconstructed logical message.
message WebSocketMessage {
  // Session-global sequence starting at 1. Values delivered to one stage must
  // strictly increase but need not be contiguous. Reject zero, duplicates, and
  // regressions; accept gaps.
  uint64 sequence = 1;
  // One complete logical payload. Protobuf string decoding enforces UTF-8 for
  // text messages. Raw frame mechanics are never exposed. Limited to 4 MiB by
  // the platform and the binding-specific cap.
  oneof payload {
    string text = 2;
    bytes binary = 3;
  }
}

// WebSocketPreflightAction is the service's one-time scoping decision.
enum WebSocketPreflightAction {
  // Invalid response value handled according to the policy failure mode.
  WEB_SOCKET_PREFLIGHT_ACTION_UNSPECIFIED = 0;
  // Inspect this session after the upstream accepts the upgrade.
  WEB_SOCKET_PREFLIGHT_ACTION_INSPECT = 1;
  // Voluntarily decline inspection without denying the upgrade. This is a
  // successful decision and does not engage on_error.
  WEB_SOCKET_PREFLIGHT_ACTION_SKIP = 2;
  // Authoritatively deny the upgrade before upstream contact. This is a
  // successful decision and is enforced regardless of on_error.
  WEB_SOCKET_PREFLIGHT_ACTION_DENY = 3;
}

message WebSocketPreflightDecision {
  WebSocketPreflightAction action = 1;
  // Free-form service diagnostic. OpenShell never exposes this to the
  // workload or security logs. Limited to 4 KiB before discarding.
  string reason = 2;
  // Optional stable machine-readable code for a deny decision. Because
  // preflight runs before the HTTP upgrade completes, OpenShell may return
  // this code to the requester. Codes follow the same format and 64-byte
  // maximum as HttpRequestResult.reason_code.
  string reason_code = 3;
  // Audit-safe findings produced during preflight. At most 32 findings of at
  // most 4 KiB encoded each are accepted.
  repeated Finding findings = 4;
  // Non-secret service-defined metadata included in diagnostics. At most 64
  // entries and 32 KiB of combined key/value data are accepted.
  map<string, string> metadata = 5;
}

// WebSocketMessageResult contains the decision and optional replacement for
// one message. A replacement must use the same variant as the input payload.
message WebSocketMessageResult {
  // Must exactly match the sequence of the corresponding WebSocketMessage.
  uint64 sequence = 1;
  Decision decision = 2;
  // Absence preserves the input unchanged. Oneof presence distinguishes an
  // empty replacement from no replacement, and string decoding enforces UTF-8.
  oneof replacement {
    string text = 3;
    bytes binary = 4;
  }
  // Free-form service diagnostic. OpenShell never exposes this to the
  // workload or security logs. Limited to 4 KiB before discarding.
  string reason = 5;
  // Optional stable machine-readable code for OCSF only. Unlike the HTTP
  // reason_code, this value is never put in a WebSocket close frame.
  string reason_code = 6;
  repeated Finding findings = 7;
  map<string, string> metadata = 8;
}

// WebSocketSessionEventResult is an evaluation result for a preflight or message
// event. Session start and end events do not produce results.
message WebSocketSessionEventResult {
  oneof result {
    WebSocketPreflightDecision preflight_decision = 1;
    WebSocketMessageResult message_result = 2;
  }
}

// RequestContext identifies the sandbox request being evaluated.
message RequestContext {
  // Request id used to correlate middleware and supervisor logs.
  string request_id = 1;
  // Sandbox id that originated the request.
  string sandbox_id = 2;
  // Workload process that originated the request, when available.
  Process originating_process = 3;
  // Sandbox name that originated the request. For display and logging only.
  // Names are workspace-scoped and may be reused for different sandbox
  // instances, so consumers must use sandbox_id for authorization, persistence,
  // durable correlation, and identity.
  string sandbox = 4;
  // Workspace the sandbox belongs to. For display and logging only; see the
  // sandbox guidance above.
  string workspace = 5;
}

// HttpRequestTarget describes the admitted HTTP destination and request target.
message HttpRequestTarget {
  // Request scheme, such as "http", "https", "ws", or "wss".
  string scheme = 1;
  // Destination hostname selected by network policy.
  string host = 2;
  // Destination TCP port.
  uint32 port = 3;
  // HTTP request method.
  string method = 4;
  // Request path without the query string.
  string path = 5;
  // Raw request query string without the leading question mark.
  string query = 6;
}

// Process identifies a workload process and its executable ancestry.
message Process {
  // Executable path for the originating process.
  string binary = 1;
  // Process id within the sandbox.
  uint32 pid = 2;
  // Executable paths for ancestor processes, nearest parent first.
  repeated string ancestors = 3;
}

// Decision controls whether OpenShell continues processing the current
// evaluation unit.
enum Decision {
  // Invalid response value handled according to the policy failure mode.
  DECISION_UNSPECIFIED = 0;
  // Continue processing the current request or message and apply any returned
  // mutations.
  DECISION_ALLOW = 1;
  // Reject the current request or message. The operation-specific result
  // defines the enclosing protocol behavior.
  DECISION_DENY = 2;
}

// Finding is an audit-safe observation produced during evaluation.
message Finding {
  // Stable, service-defined finding type.
  string type = 1;
  // Human-readable finding label that does not contain request content.
  string label = 2;
  // Number of matching observations represented by this finding.
  uint32 count = 3;
  // Service-defined confidence level.
  string confidence = 4;
  // Service-defined severity level.
  string severity = 5;
}

// ExistingHeaderAction controls how a header write behaves when the
// case-insensitive header name is already present. Every action writes the
// value when the header is absent.
enum ExistingHeaderAction {
  EXISTING_HEADER_ACTION_UNSPECIFIED = 0;
  // Add another field value without changing existing values.
  EXISTING_HEADER_ACTION_APPEND = 1;
  // Remove every existing value, then add the new value.
  EXISTING_HEADER_ACTION_OVERWRITE = 2;
  // Leave the existing values unchanged.
  EXISTING_HEADER_ACTION_SKIP = 3;
}

// WriteHeader proposes one header value and defines collision behavior.
message WriteHeader {
  string name = 1;
  string value = 2;
  ExistingHeaderAction on_existing = 3;
}

// RemoveHeader removes every value for a case-insensitive header name.
message RemoveHeader {
  string name = 1;
}

// HeaderMutation is one ordered HTTP header operation.
message HeaderMutation {
  oneof operation {
    WriteHeader write = 1;
    RemoveHeader remove = 2;
  }
}

// HTTP protocol 1. Deprecated: removed in 0.2.0.
// HttpRequestResult contains the decision and optional request mutations.
message HttpRequestResult {
  // Allow or deny decision for this request.
  Decision decision = 1;
  // Free-form service diagnostic. OpenShell does not relay this text into
  // denied responses or security logs. Limited to 4 KiB before discarding.
  string reason = 2;
  // Replacement request body when has_body is true. Limited to 4 MiB.
  bytes body = 3;
  // True when body should replace the request body, including with an empty body.
  bool has_body = 4;
  // Ordered request-header mutations applied before the next middleware and
  // before forwarding. Writes and removals may target visible end-to-end
  // request headers, but credential, routing, framing, and hop-by-hop headers
  // are always protected. Written values cannot contain OpenShell credential
  // placeholder syntax. A violating result is a middleware failure handled
  // according to the policy failure mode. At most 64 operations, 32 KiB of
  // validated name/value data, and 64 KiB encoded are accepted.
  repeated HeaderMutation header_mutations = 5;
  // Audit-safe findings produced during evaluation. For operator-run services,
  // OpenShell logs platform-owned fields derived from the operator-owned
  // registration name rather than service-provided type, label, confidence,
  // or metadata text.
  // At most 32 findings of at most 4 KiB encoded each are accepted per stage.
  // A policy selects at most 10 stages, so one chain retains at most 320.
  repeated Finding findings = 6;
  // Non-secret service-defined metadata included in diagnostics. At most 64
  // entries and 32 KiB of combined key/value data are accepted.
  map<string, string> metadata = 7;
  // Optional stable machine-readable code for a deny decision. Codes must
  // start with a lowercase ASCII letter and contain only lowercase ASCII
  // letters, digits, and underscores, with a maximum length of 64 bytes.
  // OpenShell may return this code to the requester, unlike free-form reason.
  string reason_code = 8;
}
