syntax = "proto3";

package openshell.compute.v1;

import "options.proto";

// EXPERIMENTAL: This contract is under active development. Its API and wire
// format may change incompatibly before stabilization.
//
// The launch credentials (the launch authentication) the gateway hands to a compute driver. It lives in
// its own file so that compute_driver.proto, which carries it in
// DriverSandboxSpec and StartSandboxRequest, and sandbox_runtime.proto, which
// imports compute_driver.proto, can both import it without an import cycle.
// The package is shared with compute_driver.proto because buf rejects import
// cycles between packages: sandbox_runtime.proto uses compute types, so these
// messages cannot sit in its package. The protobuf JSON form is unaffected by
// the package.

// TLS material for one of the supervisor's telemetry collectors.
message OtlpTlsMaterial {
  // Certificates trusted to verify the collector instead of the platform roots.
  optional string ca_pem = 1;
  // Client identity presented to the collector.
  optional OtlpClientIdentity client = 2;
}

message OtlpClientIdentity {
  string cert_pem = 1;
  string key_pem = 2 [(openshell.options.v1.secret) = true];
}

// Trusted launch input delivered only to the supervisor, never to the workload.
// Created by the gateway and passed through the compute driver unchanged, as the
// supervisor member of SandboxLaunchCredentials.
message SupervisorAuthBundle {
  // "1.0". Present only when the bundle is written as a document of its own.
  string contract_version = 1;
  // Correlates the two ends of one Sandbox Protocol launch. Not carried in JWTs
  // and not an authorization identity.
  string session_id = 2;
  string runtime_generation = 3;
  // Orders protocol attachment replacement. Nonzero.
  uint64 session_rotation = 4;
  // Durable authorization epoch. Nonzero.
  uint64 auth_epoch = 5;
  // JWT the supervisor presents to the gateway.
  string gateway_token = 6 [(openshell.options.v1.secret) = true];
  // Unix seconds.
  int64 gateway_expires_at = 7;
  // Sandbox Protocol bearer the supervisor presents to the boundary.
  string sandbox_token = 8 [(openshell.options.v1.secret) = true];
  // Unix seconds.
  int64 sandbox_expires_at = 9;
  optional string ssh_host_private_key = 10 [(openshell.options.v1.secret) = true];
  // Headers for the supervisor's trace, OCSF and agent-trace collectors,
  // present only when the gateway configures them.
  optional string traces_otlp_headers = 11 [(openshell.options.v1.secret) = true];
  optional string ocsf_otlp_headers = 12 [(openshell.options.v1.secret) = true];
  optional string agent_otlp_headers = 13 [(openshell.options.v1.secret) = true];
  // Each distinct collector TLS material once. The indexes below point into it
  // and are each less than the length of this list.
  repeated OtlpTlsMaterial otlp_tls = 14;
  optional uint32 traces_otlp_tls = 15;
  optional uint32 ocsf_otlp_tls = 16;
  optional uint32 agent_otlp_tls = 17;
}

// A public key of the gateway's verification set, as the gateway hands it to the
// driver.
message LaunchVerificationKey {
  string key_id = 1;
  bytes public_key_pem = 2;
}

// Gateway-created authentication input, delivered to the driver in
// CreateSandbox and StartSandbox. The driver splits it: the supervisor receives
// `supervisor`, while the sandbox receives only the gateway identity and the
// public keys, which with the bundle's session rotation and auth epoch are the
// GatewayTrust. The driver never exposes the supervisor tokens to the workload.
message SandboxLaunchCredentials {
  // "1.0".
  string contract_version = 1;
  SupervisorAuthBundle supervisor = 2;
  string gateway_id = 3;
  repeated LaunchVerificationKey verification_keys = 4;
}
