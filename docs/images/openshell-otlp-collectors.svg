<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell OTLP collectors</title>
  <desc id="desc">The gateway and its compute drivers export their own spans, and the gateway exports its own OCSF events. The gateway gives each sandbox supervisor its collector settings with the launch credentials. The supervisor exports its own spans and OCSF events, and relays the agent's traces: the agent sends OTLP/HTTP to 192.0.0.8:4318 through the mediated channel, and the relay tags each batch with the sandbox ID and forwards it to the agent trace collector.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .settings { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .send { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="20" fill="#ffffff"/>

  <text x="45" y="45" class="section">TRUSTED</text>
  <text x="965" y="45" class="section">COLLECTORS</text>

  <!-- Gateway -->
  <rect x="40" y="65" width="260" height="115" rx="16" class="trusted"/>
  <text x="170" y="106" text-anchor="middle" class="label">Gateway</text>
  <text x="170" y="130" text-anchor="middle" class="tiny">AND COMPUTE DRIVERS</text>
  <text x="170" y="160" text-anchor="middle" class="small">Own spans and OCSF events</text>

  <!-- Supervisor -->
  <rect x="420" y="230" width="330" height="330" rx="16" class="trusted"/>
  <text x="585" y="270" text-anchor="middle" class="label">Supervisor</text>
  <text x="585" y="294" text-anchor="middle" class="tiny">ONE PER SANDBOX</text>
  <rect x="445" y="315" width="280" height="80" rx="12" class="lane"/>
  <text x="585" y="348" text-anchor="middle" class="label">Supervisor telemetry</text>
  <text x="585" y="374" text-anchor="middle" class="small">spans · OCSF events</text>
  <rect x="445" y="420" width="280" height="115" rx="12" class="lane"/>
  <text x="585" y="452" text-anchor="middle" class="label">Agent trace relay</text>
  <text x="585" y="479" text-anchor="middle" class="small">serves 192.0.0.8:4318</text>
  <text x="585" y="505" text-anchor="middle" class="small">tags openshell.sandbox.id</text>

  <!-- Sandbox boundary -->
  <rect x="30" y="360" width="290" height="200" rx="18" fill="#ffffff" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="175" y="395" text-anchor="middle" class="tiny">SANDBOX · NETWORK ISOLATED</text>
  <rect x="55" y="444" width="230" height="62" rx="14" class="dark"/>
  <text x="170" y="472" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="170" y="493" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text>

  <!-- Collectors -->
  <rect x="960" y="60" width="280" height="100" rx="14" class="box"/>
  <text x="1100" y="102" text-anchor="middle" class="label">Trace collector</text>
  <text x="1100" y="130" text-anchor="middle" class="code">[openshell.gateway.otlp.traces]</text>

  <rect x="960" y="185" width="280" height="100" rx="14" class="box"/>
  <text x="1100" y="227" text-anchor="middle" class="label">OCSF collector</text>
  <text x="1100" y="255" text-anchor="middle" class="code">[openshell.gateway.otlp.ocsf]</text>

  <rect x="960" y="425" width="280" height="115" rx="14" class="box"/>
  <text x="1100" y="463" text-anchor="middle" class="label">Agent trace collector</text>
  <text x="1100" y="491" text-anchor="middle" class="code">[openshell.gateway.otlp.agent]</text>
  <text x="1100" y="517" text-anchor="middle" class="small">such as MLflow</text>

  <!-- Gateway exports -->
  <path d="M300 90 H960" class="send"/>
  <text x="320" y="80" class="small">spans</text>
  <path d="M300 150 C 620 150, 700 215, 960 215" class="send"/>
  <text x="320" y="140" class="small">gateway OCSF events</text>

  <!-- Collector settings -->
  <path d="M170 180 V260 H420" class="settings"/>
  <text x="190" y="250" class="tiny">COLLECTOR SETTINGS</text>
  <text x="190" y="282" class="small">with launch credentials</text>

  <!-- Supervisor exports -->
  <path d="M750 340 C 900 340, 860 130, 960 130" class="send"/>
  <text x="762" y="328" class="small">spans</text>
  <path d="M750 370 C 900 370, 870 255, 960 255" class="send"/>
  <text x="762" y="392" class="small">OCSF events</text>

  <!-- Agent traces -->
  <path d="M285 475 H445" class="line"/>
  <text x="370" y="463" text-anchor="middle" class="tiny">OTLP/HTTP</text>
  <path d="M750 475 H960" class="send"/>
  <text x="855" y="463" text-anchor="middle" class="small">agent spans</text>

  <text x="40" y="610" class="small">Each collector has its own protocol (gRPC or HTTP/protobuf), headers, and TLS settings. A table without an endpoint uses [openshell.gateway.otlp].</text>
</svg>
