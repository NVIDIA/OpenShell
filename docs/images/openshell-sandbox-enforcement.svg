<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell sandbox enforcement flow</title>
  <desc id="desc">The sandbox workload and trusted supervisor are separate boundaries. All workload network egress is denied except the authenticated Sandbox Protocol connection to the supervisor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .section { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
      .blocked { fill: none; stroke: #c2413b; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1280" height="620" rx="20" fill="#ffffff"/>
  <text x="40" y="52" class="title">Sandbox enforcement flow</text>
  <text x="40" y="80" class="small">The supervisor channel is the workload's only allowed network path. All other egress is denied.</text>

  <rect x="40" y="120" width="360" height="310" rx="18" fill="#f8fafc" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="65" y="150" class="section">SANDBOX · NETWORK ISOLATED</text>
  <text x="65" y="172" class="tiny">(CONTAINER · VM)</text>
  <rect x="75" y="205" width="125" height="94" rx="14" class="dark"/>
  <text x="137" y="245" text-anchor="middle" style="font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="137" y="270" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">process</text>
  <rect x="240" y="190" width="130" height="124" rx="14" class="box"/>
  <text x="305" y="230" text-anchor="middle" class="label">OpenShell</text>
  <text x="305" y="254" text-anchor="middle" class="label">Sandbox</text>
  <text x="305" y="282" text-anchor="middle" class="small">process owner</text>
  <path d="M200 252 H240" class="flow"/>
  <circle cx="220" cy="228" r="13" fill="#579000"/>
  <text x="220" y="233" text-anchor="middle" class="step">1</text>
  <text x="220" y="335" text-anchor="middle" class="small">TCP or DNS request</text>
  <text x="305" y="362" text-anchor="middle" class="small">Attributes executable</text>
  <text x="305" y="383" text-anchor="middle" class="small">identity and ancestry</text>
  <path d="M137 299 V390 H365" class="blocked"/>
  <line x1="368" y1="380" x2="386" y2="398" stroke="#c2413b" stroke-width="3"/>
  <line x1="386" y1="380" x2="368" y2="398" stroke="#c2413b" stroke-width="3"/>
  <text x="205" y="416" text-anchor="middle" class="tiny" fill="#9f2f2a">ALL OTHER NETWORK EGRESS DENIED</text>

  <text x="525" y="188" text-anchor="middle" class="section">ONLY ALLOWED EGRESS</text>
  <text x="525" y="215" text-anchor="middle" class="label">Sandbox Protocol</text>
  <text x="525" y="238" text-anchor="middle" class="small">authenticated UDS · mTLS · vsock</text>
  <path d="M370 252 H680" class="flow"/>
  <circle cx="525" cy="252" r="13" fill="#579000"/>
  <text x="525" y="257" text-anchor="middle" class="step">2</text>

  <rect x="650" y="120" width="390" height="310" rx="18" class="trusted"/>
  <text x="675" y="150" class="section">SUPERVISOR · TRUSTED BOUNDARY</text>
  <rect x="680" y="190" width="150" height="124" rx="14" class="box"/>
  <text x="755" y="230" text-anchor="middle" class="label">Isolation</text>
  <text x="755" y="254" text-anchor="middle" class="label">backend</text>
  <text x="755" y="282" text-anchor="middle" class="small">verifies boundary</text>
  <rect x="860" y="190" width="150" height="124" rx="14" class="green"/>
  <text x="935" y="230" text-anchor="middle" class="label">Policy</text>
  <text x="935" y="254" text-anchor="middle" class="label">enforcement</text>
  <text x="935" y="282" text-anchor="middle" class="small">policy · credentials</text>
  <path d="M830 252 H860" class="flow"/>
  <circle cx="845" cy="228" r="13" fill="#579000"/>
  <text x="845" y="233" text-anchor="middle" class="step">3</text>
  <text x="755" y="360" text-anchor="middle" class="small">Receives request with</text>
  <text x="755" y="381" text-anchor="middle" class="small">trusted process identity</text>
  <text x="935" y="360" text-anchor="middle" class="small">Checks destination, binary,</text>
  <text x="935" y="381" text-anchor="middle" class="small">L7 rules, and credentials</text>

  <rect x="1080" y="190" width="160" height="124" rx="14" class="box"/>
  <text x="1160" y="230" text-anchor="middle" class="label">Upstream</text>
  <text x="1160" y="254" text-anchor="middle" class="label">service</text>
  <text x="1160" y="282" text-anchor="middle" class="small">approved connection</text>
  <path d="M1010 252 H1080" class="flow"/>
  <circle cx="1045" cy="228" r="13" fill="#579000"/>
  <text x="1045" y="233" text-anchor="middle" class="step">4</text>

  <text x="40" y="485" class="section">LAUNCH GATE</text>
  <line x1="150" y1="520" x2="1130" y2="520" stroke="#cbd5e1" stroke-width="4"/>
  <g>
    <circle cx="180" cy="520" r="20" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text x="180" y="555" text-anchor="middle" class="tiny">ATTACH</text>
    <circle cx="380" cy="520" r="20" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text x="380" y="555" text-anchor="middle" class="tiny">BOUND</text>
    <circle cx="580" cy="520" r="20" fill="#f2f9e8" stroke="#76b900" stroke-width="4"/>
    <text x="580" y="555" text-anchor="middle" class="tiny">CONFIRMED</text>
    <circle cx="780" cy="520" r="20" fill="#f2f9e8" stroke="#76b900" stroke-width="4"/>
    <text x="780" y="555" text-anchor="middle" class="tiny">READY</text>
    <circle cx="980" cy="520" r="20" fill="#76b900" stroke="#579000" stroke-width="4"/>
    <text x="980" y="526" text-anchor="middle" class="step">✓</text>
    <text x="980" y="555" text-anchor="middle" class="tiny">RUNNING</text>
  </g>
  <path d="M600 485 H950" stroke="#76b900" stroke-width="2"/>
  <text x="775" y="477" text-anchor="middle" class="small">Agent cannot start until the boundary is confirmed</text>
</svg>
