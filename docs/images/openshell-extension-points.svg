<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell extension points</title>
  <desc id="desc">Gateway interceptors and drivers extend the control plane. Middleware and isolation backends extend the OpenShell runtime. Middleware connects approved traffic to external services, while the compute driver provisions the sandbox boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #579000; letter-spacing: .06em; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .extension { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .provision { fill: none; stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1440" height="920" rx="20" fill="#ffffff"/>

  <text x="35" y="50" class="section">GATEWAY (CONTROL PLANE)</text>
  <text x="1115" y="50" class="section">EXTERNAL SERVICES</text>
  <text x="785" y="240" class="section">OPENSHELL RUNTIME (DATA PLANE)</text>

  <g transform="translate(0,40)">

  <!-- Gateway control plane -->
  <rect x="30" y="30" width="710" height="780" rx="20" class="panel"/>

  <rect x="250" y="105" width="270" height="100" rx="15" class="trusted"/>
  <text x="385" y="148" text-anchor="middle" class="label">API Server</text>
  <text x="385" y="177" text-anchor="middle" class="small">auth · state · lifecycle</text>

  <rect x="235" y="270" width="300" height="110" rx="15" class="extension"/>
  <text x="385" y="300" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="385" y="332" text-anchor="middle" class="label">Gateway interceptors</text>
  <text x="385" y="360" text-anchor="middle" class="small">modify · validate · observe</text>

  <rect x="80" y="475" width="270" height="115" rx="15" class="extension"/>
  <text x="215" y="505" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="215" y="537" text-anchor="middle" class="label">Credential driver</text>
  <text x="215" y="565" text-anchor="middle" class="small">stores secret handles</text>

  <rect x="420" y="475" width="270" height="115" rx="15" class="extension"/>
  <text x="555" y="505" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="555" y="537" text-anchor="middle" class="label">Compute driver</text>
  <text x="555" y="565" text-anchor="middle" class="small">places sandboxes</text>

  <rect x="80" y="670" width="270" height="70" rx="14" class="box"/>
  <text x="215" y="712" text-anchor="middle" class="label">Credential store</text>

  <path d="M385 205 V270" class="line"/>
  <path d="M385 380 V425 H215 V475" class="line"/>
  <path d="M385 425 H555 V475" class="line"/>
  <path d="M215 590 V670" class="line"/>

  <!-- External services -->
  <rect x="1110" y="30" width="250" height="80" rx="14" class="box"/>
  <text x="1235" y="64" text-anchor="middle" class="label">Services and models</text>
  <text x="1235" y="90" text-anchor="middle" class="small">APIs · tools · inference</text>

  <!-- Runtime data plane -->
  <rect x="780" y="220" width="630" height="590" rx="20" class="panel"/>

  <rect x="820" y="265" width="240" height="120" rx="15" class="trusted"/>
  <text x="940" y="308" text-anchor="middle" class="label">Supervisor</text>
  <text x="940" y="337" text-anchor="middle" class="small">policy · credentials</text>
  <text x="940" y="360" text-anchor="middle" class="small">network mediation</text>

  <rect x="1110" y="265" width="250" height="120" rx="15" class="extension"/>
  <text x="1235" y="295" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="1235" y="327" text-anchor="middle" class="label">Middleware</text>
  <text x="1235" y="355" text-anchor="middle" class="small">inspect · transform · deny</text>

  <rect x="820" y="500" width="240" height="115" rx="15" class="extension"/>
  <text x="940" y="530" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="940" y="562" text-anchor="middle" class="label">Isolation backend</text>
  <text x="940" y="590" text-anchor="middle" class="small">controls the workload</text>

  <rect x="1110" y="475" width="250" height="175" rx="16" fill="#ffffff" stroke="#76b900" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="1235" y="512" text-anchor="middle" class="tag">SANDBOX BOUNDARY</text>
  <rect x="1140" y="540" width="190" height="78" rx="13" class="dark"/>
  <text x="1235" y="574" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="1235" y="600" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">workload</text>

  <path d="M1060 325 H1110" class="line"/>
  <path d="M940 385 V500" class="line"/>
  <path d="M1060 557 H1110" class="line"/>
  <path d="M1235 265 V110" class="flow"/>

  <path d="M690 532 H760 V700 H1235 V650" class="provision"/>
  <text x="795" y="688" class="tiny">PROVISION</text>

  <!-- Legend -->
  <rect x="780" y="835" width="18" height="18" rx="4" class="trusted"/>
  <text x="810" y="850" class="small">Core component</text>
  <rect x="960" y="835" width="18" height="18" rx="4" class="extension"/>
  <text x="990" y="850" class="small">Extension point</text>
  <rect x="1145" y="835" width="18" height="18" rx="4" class="dark"/>
  <text x="1175" y="850" class="small">Workload</text>
  <rect x="1250" y="835" width="18" height="18" rx="4" fill="#ffffff" stroke="#76b900" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1280" y="850" class="small">Sandbox boundary</text>
  </g>
</svg>
