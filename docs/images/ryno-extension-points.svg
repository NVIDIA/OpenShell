<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="395" viewBox="0 0 1220 395" role="img" aria-labelledby="title desc">
  <title id="title">Ryno extension points</title>
  <desc id="desc">Two rows read left to right. Data plane: the sandboxed agent reaches the supervisor through the isolation backend, and supervisor middleware processes requests before they reach models and APIs. Control plane: you reach the gateway through interceptors, and gateway drivers connect it to runtimes and secret stores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #579000; letter-spacing: .06em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .extension { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1220" height="395" rx="20" fill="#ffffff"/>

  <text x="30" y="41" class="section">DATA PLANE</text>
  <rect x="30" y="70" width="180" height="90" rx="14" class="dark"/>
  <text x="120.0" y="112" text-anchor="middle" class="label" style="fill:#fff">Agent</text>
  <text x="120.0" y="136" text-anchor="middle" class="small" style="fill:#d1d5db">sandboxed workload</text>
  <rect x="250" y="70" width="200" height="90" rx="15" class="extension"/>
  <text x="350.0" y="96" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="350.0" y="123" text-anchor="middle" class="label">Isolation backend</text>
  <text x="350.0" y="145" text-anchor="middle" class="small">launch · exec · mediate</text>
  <rect x="490" y="55" width="430" height="120" rx="18" class="trusted"/>
  <text x="510" y="112" class="label">Supervisor</text>
  <text x="510" y="136" class="small">policy · credentials</text>
  <rect x="690" y="70" width="210" height="90" rx="15" class="extension"/>
  <text x="795.0" y="96" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="795.0" y="123" text-anchor="middle" class="label">Middleware</text>
  <text x="795.0" y="145" text-anchor="middle" class="small">inspect · transform · deny</text>
  <rect x="970" y="70" width="220" height="90" rx="14" class="box"/>
  <text x="1080.0" y="112" text-anchor="middle" class="label">Models, APIs</text>
  <text x="1080.0" y="136" text-anchor="middle" class="small">external services</text>
  <path d="M210 115 H248" class="line"/>
  <path d="M450 115 H488" class="line"/>
  <path d="M650 115 H688" class="line"/>
  <path d="M900 115 H968" class="flow"/>

  <text x="30" y="231" class="section">CONTROL PLANE</text>
  <rect x="30" y="260" width="180" height="90" rx="14" class="box"/>
  <text x="120.0" y="302" text-anchor="middle" class="label">You</text>
  <text x="120.0" y="326" text-anchor="middle" class="small">CLI · SDK · TUI</text>
  <rect x="250" y="260" width="200" height="90" rx="15" class="extension"/>
  <text x="350.0" y="286" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="350.0" y="313" text-anchor="middle" class="label">Interceptors</text>
  <text x="350.0" y="335" text-anchor="middle" class="small">modify · validate · observe</text>
  <rect x="490" y="245" width="430" height="120" rx="18" class="trusted"/>
  <text x="510" y="302" class="label">Gateway</text>
  <text x="510" y="326" class="small">auth · state · API</text>
  <rect x="690" y="260" width="210" height="90" rx="15" class="extension"/>
  <text x="795.0" y="286" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="795.0" y="313" text-anchor="middle" class="label">Drivers</text>
  <text x="795.0" y="335" text-anchor="middle" class="small">compute · credentials</text>
  <rect x="970" y="260" width="220" height="90" rx="14" class="box"/>
  <text x="1080.0" y="302" text-anchor="middle" class="label">Infrastructure</text>
  <text x="1080.0" y="326" text-anchor="middle" class="small">runtimes · secret stores</text>
  <path d="M210 305 H248" class="line"/>
  <path d="M450 305 H488" class="line"/>
  <path d="M650 305 H688" class="line"/>
  <path d="M900 305 H968" class="line"/>
</svg>
