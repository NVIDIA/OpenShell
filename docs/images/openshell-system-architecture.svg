<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell system architecture</title>
  <desc id="desc">User interfaces connect to the gateway, which uses the policy prover to formally verify proposed policy changes before approval. The OpenShell Runtime places a trusted supervisor separately from a network-isolated sandbox workload. The workload's only allowed network path is its mediated connection to the supervisor, which connects to approved external services. The policy lifecycle strip shows the supervisor proposing a policy change, the gateway's policy prover checking it, a human approving it, and the supervisor reloading the approved policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .owned { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
      .blocked { fill: none; stroke: #c2413b; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .dashed { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="870" rx="20" fill="#ffffff"/>

  <g transform="translate(0,-80)">
  <text x="45" y="116" class="section">USER INTERFACES</text>
  <rect x="40" y="130" width="760" height="84" rx="18" class="soft"/>
  <rect x="75" y="146" width="180" height="48" rx="12" class="box"/>
  <text x="165" y="177" text-anchor="middle" class="label">CLI</text>
  <rect x="310" y="146" width="180" height="48" rx="12" class="box"/>
  <text x="400" y="177" text-anchor="middle" class="label">SDK</text>
  <rect x="545" y="146" width="180" height="48" rx="12" class="box"/>
  <text x="635" y="177" text-anchor="middle" class="label">TUI</text>

  <text x="845" y="116" class="section">EXTERNAL SERVICES</text>
  <rect x="840" y="130" width="400" height="84" rx="18" class="soft"/>
  <rect x="865" y="146" width="160" height="48" rx="12" class="box"/>
  <text x="945" y="165" text-anchor="middle" class="label">Services</text>
  <text x="945" y="185" text-anchor="middle" class="small">APIs and tools</text>
  <rect x="1045" y="146" width="170" height="48" rx="12" class="box"/>
  <text x="1130" y="165" text-anchor="middle" class="label">Models</text>
  <text x="1130" y="185" text-anchor="middle" class="small">inference APIs</text>

  <text x="45" y="286" class="section">GATEWAY (CONTROL PLANE)</text>
  <rect x="40" y="300" width="360" height="450" rx="18" class="soft"/>
  <rect x="85" y="340" width="290" height="70" rx="14" class="trusted"/>
  <text x="230" y="370" text-anchor="middle" class="label">API Server</text>
  <text x="230" y="394" text-anchor="middle" class="small">API, authentication, lifecycle, relays</text>
  <rect x="85" y="450" width="290" height="50" rx="14" class="box"/>
  <text x="230" y="481" text-anchor="middle" class="label">Policy prover</text>
  <rect x="85" y="540" width="290" height="70" rx="14" class="box"/>
  <text x="230" y="570" text-anchor="middle" class="label">Durable state</text>
  <text x="230" y="594" text-anchor="middle" class="small">sandboxes · policies · providers · settings</text>
  <rect x="85" y="650" width="290" height="70" rx="14" class="green"/>
  <text x="230" y="680" text-anchor="middle" class="label">Compute driver</text>
  <text x="230" y="704" text-anchor="middle" class="small">places and fences each sandbox</text>
  <path d="M 230 410 V 450" class="line"/>
  <path d="M 85 375 H 60 V 575 H 85" class="line"/>
  <path d="M 230 610 V 650" class="line"/>

  <text x="485" y="286" class="section">OPENSHELL RUNTIME (DATA PLANE)</text>
  <rect x="480" y="300" width="760" height="450" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>

  <rect x="530" y="365" width="240" height="290" rx="16" class="trusted"/>
  <text x="650" y="405" text-anchor="middle" class="label">Supervisor</text>
  <text x="650" y="429" text-anchor="middle" class="tiny">GOVERNS THE AGENT</text>
  <text x="650" y="475" text-anchor="middle" class="small">Policy evaluation</text>
  <text x="650" y="505" text-anchor="middle" class="small">Credential resolution</text>
  <text x="650" y="535" text-anchor="middle" class="small">DNS and proxying</text>
  <text x="650" y="565" text-anchor="middle" class="small">Agent session multiplexing</text>
  <line x1="565" y1="590" x2="735" y2="590" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="650" y="622" text-anchor="middle" class="small">Maintains the gateway session</text>

  <rect x="880" y="350" width="315" height="270" rx="18" fill="#ffffff" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1037" y="383" text-anchor="middle" class="tiny">SANDBOX · NETWORK ISOLATED</text>
  <text x="1037" y="402" text-anchor="middle" class="tiny">(CONTAINER · VM)</text>
  <rect x="910" y="412" width="255" height="86" rx="14" class="box"/>
  <text x="1037" y="449" text-anchor="middle" class="label">Sandbox</text>
  <text x="1037" y="474" text-anchor="middle" class="small">process owner and syscall boundary</text>
  <rect x="910" y="530" width="255" height="60" rx="14" class="dark"/>
  <text x="1037" y="557" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="1037" y="578" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text>
  <path d="M 1037 498 V 530" class="line"/>

  <path d="M 910 455 H 770" class="flow"/>
  <text x="840" y="434" text-anchor="middle" class="tiny">MEDIATED CHANNEL</text>
  <path d="M 1037 590 V 611" class="blocked"/>
  <line x1="1028" y1="611" x2="1046" y2="629" stroke="#c2413b" stroke-width="3"/>
  <line x1="1046" y1="611" x2="1028" y2="629" stroke="#c2413b" stroke-width="3"/>

  <rect x="880" y="650" width="315" height="84" rx="12" class="green"/>
  <text x="1037" y="674" text-anchor="middle" class="tiny">WORKLOAD NETWORK RULE</text>
  <text x="1037" y="699" text-anchor="middle" class="label">Deny all egress</text>
  <text x="1037" y="720" text-anchor="middle" class="small">except to the supervisor</text>

  <path d="M 420 214 V 246 H 330 V 340" class="line"/>
  <text x="438" y="239" class="tiny">gRPC / HTTP</text>
  <path d="M 530 460 H 420 V 395 H 375" class="line"/>
  <path d="M 375 675 H 480" class="line"/>

  <path d="M 750 365 V 246 H 1040 V 214" class="flow"/>
  <text x="790" y="239" class="tiny">POLICY-APPROVED EGRESS</text>
  </g>

  <text x="45" y="740" class="section">POLICY LIFECYCLE</text>
  <rect x="40" y="754" width="1200" height="100" rx="18" class="soft"/>

  <path d="M700 575 V737 H1070 V769" class="dashed"/>
  <text x="850" y="720" text-anchor="middle" class="tiny">SUPERVISOR PROPOSES</text>
  <path d="M200 769 V727 H600 V575" class="dashed"/>
  <text x="400" y="705" text-anchor="middle" class="tiny">APPROVED POLICY RELOADED</text>

  <rect x="65" y="769" width="270" height="70" rx="14" class="box"/>
  <text x="200" y="799" text-anchor="middle" class="label">Policy reloads</text>
  <text x="200" y="821" text-anchor="middle" class="small">supervisor retries</text>

  <rect x="355" y="769" width="270" height="70" rx="14" class="box"/>
  <text x="490" y="795" text-anchor="middle" class="label">You approve</text>
  <text x="490" y="815" text-anchor="middle" class="small">manual by default</text>
  <text x="490" y="833" text-anchor="middle" class="tiny">or auto — no new risk found</text>

  <rect x="645" y="769" width="270" height="70" rx="14" class="box"/>
  <text x="780" y="799" text-anchor="middle" class="label">Gateway prover checks</text>
  <text x="780" y="821" text-anchor="middle" class="small">flags risky new access</text>

  <rect x="935" y="769" width="270" height="70" rx="14" class="box"/>
  <text x="1070" y="799" text-anchor="middle" class="label">Agent proposes</text>
  <text x="1070" y="821" text-anchor="middle" class="small">via policy.local</text>

  <path d="M935 804 H915" class="dashed"/>
  <path d="M645 804 H625" class="dashed"/>
  <path d="M355 804 H335" class="dashed"/>
</svg>
