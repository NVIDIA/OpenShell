[package]
name = "openshell-driver-sdk"
description = "Narrow shared contract for OpenShell compute drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openshell-otel = { path = "../openshell-otel", optional = true }
base64 = { workspace = true }
clap = { workspace = true, optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true, features = ["channel"] }
tonic-prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
miette = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tempfile = "3"

[features]
## Conversions to `openshell-otel` types.
otel = ["dep:openshell-otel"]
## Command-line flags shared by compute drivers.
clap = ["dep:clap"]

[build-dependencies]
tonic-prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[lints]
workspace = true
