[package]
name = "openshell-driver-sdk"
description = "Startup document contract between the OpenShell gateway and launched compute drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true, optional = true }
base64 = { workspace = true }
sha2 = { workspace = true }
openshell-core = { path = "../openshell-core", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
## Helpers for drivers that parse their command line with clap.
clap = ["dep:clap", "openshell-core/clap"]

[lints]
workspace = true
