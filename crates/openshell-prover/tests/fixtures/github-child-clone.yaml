version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /etc
    - /app
    - /opt
    - /var/log
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /home/sandbox
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  github_repository:
    name: github-repository-read-only
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /nicobailon/pi-subagents.git/info/refs
              query:
                service: git-upload-pack
          - allow:
              method: POST
              path: /nicobailon/pi-subagents.git/git-upload-pack
          - allow:
              method: GET
              path: /nicobailon/pi-subagents/info/refs
              query:
                service: git-upload-pack
          - allow:
              method: POST
              path: /nicobailon/pi-subagents/git-upload-pack
    binaries:
      - path: /usr/bin/git
      - path: /usr/local/bin/git
