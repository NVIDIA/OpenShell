version: 1
network_policies:
  git:
    binaries:
      - path: /usr/bin/git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /org/repo.git/info/refs
              query:
                service: "git-receive-pack"
