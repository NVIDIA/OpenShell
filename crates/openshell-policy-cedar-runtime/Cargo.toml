[package]
name = "openshell-policy-cedar-runtime"
description = "Cedar implementation of the supervisor policy runtime contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }
openshell-policy = { path = "../openshell-policy", features = ["experimental"] }
openshell-policy-cedar-adapter = { path = "../openshell-policy-cedar-adapter" }
openshell-policy-cedar = { path = "../openshell-policy-cedar" }
openshell-policy-runtime-interface = { path = "../openshell-policy-runtime-interface" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-supervisor-middleware = { path = "../openshell-supervisor-middleware" }
miette = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
globset = { version = "0.4", default-features = false }
ipnet = "2"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
