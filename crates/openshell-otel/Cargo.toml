[package]
name = "openshell-otel"
description = "Shared OpenTelemetry trace and log export support for OpenShell services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { version = "0.1", optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true }
http-body-util = { workspace = true, optional = true }
hyper-rustls = { version = "0.27", default-features = false, optional = true, features = ["http1", "logging", "tls12"] }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
metrics = { workspace = true, optional = true }
openshell-crypto = { workspace = true, optional = true }
openshell-ocsf = { path = "../openshell-ocsf", optional = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["gzip-http", "http-proto", "logs"] }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
tonic = { workspace = true }
tower-http = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
openshell-otel-test-support = { path = "../openshell-otel-test-support" }
opentelemetry-proto = { workspace = true, features = ["logs"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[features]
default = ["export"]
# OTLP/gRPC export: tracer providers, tracing layers, compute-driver and
# gRPC tracing machinery, and the OCSF log bridge. Services that report to
# a collector keep the default; clients that only forward trace context
# (e.g. the CLI) opt out with `default-features = false` so the exporter
# stack stays out of their binaries.
export = [
    "dep:async-trait",
    "dep:bytes",
    "dep:futures",
    "dep:http-body-util",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:metrics",
    "dep:openshell-crypto",
    "dep:openshell-ocsf",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:zeroize",
    "opentelemetry_sdk/logs",
]

[lints]
workspace = true
