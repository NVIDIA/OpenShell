[package]
name = "openshell-supervisor-control"
description = "Gateway-side control of a supervisor shared by many sandboxes: assignments, launch registrations, recovery, and host observations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false, features = ["jwt"] }
openshell-otel = { path = "../openshell-otel" }
openshell-sandbox-backend = { path = "../openshell-sandbox-backend" }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
