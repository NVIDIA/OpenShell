[package]
name = "openshell-supervisor"
description = "OpenShell policy and workload supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-supervisor"
path = "src/main.rs"

[dependencies]
openshell-crypto = { workspace = true }
openshell-core = { path = "../openshell-core", default-features = false, features = ["jwt", "trace-context"] }
openshell-extension-core = { path = "../openshell-extension-core" }
openshell-isolation-interface = { path = "../openshell-isolation-interface" }
openshell-sandbox-backend = { path = "../openshell-sandbox-backend" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-otel = { path = "../openshell-otel" }
openshell-policy = { path = "../openshell-policy" }
openshell-supervisor-middleware = { path = "../openshell-supervisor-middleware" }
openshell-supervisor-middleware-builtins = { path = "../openshell-supervisor-middleware-builtins" }
openshell-supervisor-network = { path = "../openshell-supervisor-network", default-features = false }
openshell-supervisor-process = { path = "../openshell-supervisor-process" }

bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
miette = { workspace = true }
nix = { workspace = true }
opentelemetry = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true, features = ["channel", "tls-native-roots"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
default = ["telemetry", "bundled-ca-roots"]
system-ca-roots = ["telemetry"]
defaults-without-telemetry = ["bundled-ca-roots"]
telemetry = ["openshell-core/telemetry"]
bundled-ca-roots = ["openshell-supervisor-network/bundled-ca-roots"]

[dev-dependencies]
openshell-sandbox-backend = { path = "../openshell-sandbox-backend", features = ["test-support"] }
tonic-prost = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
temp-env = "0.3"
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
