[package]
name = "openshell-supervisor"
description = "OpenShell policy and workload supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-supervisor"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }
openshell-extension-core = { path = "../openshell-extension-core" }
openshell-isolation-interface = { path = "../openshell-isolation-interface" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-policy = { path = "../openshell-policy" }
openshell-supervisor-middleware = { path = "../openshell-supervisor-middleware" }
openshell-supervisor-middleware-builtins = { path = "../openshell-supervisor-middleware-builtins" }
openshell-supervisor-network = { path = "../openshell-supervisor-network", default-features = false }
openshell-supervisor-process = { path = "../openshell-supervisor-process" }

clap = { workspace = true }
miette = { workspace = true }
nix = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["channel", "tls-native-roots"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
default = ["telemetry", "bundled-ca-roots"]
system-ca-roots = ["telemetry"]
defaults-without-telemetry = ["bundled-ca-roots"]
telemetry = ["openshell-core/telemetry"]
bundled-ca-roots = ["openshell-supervisor-network/bundled-ca-roots"]

[dev-dependencies]
futures = { workspace = true }
temp-env = "0.3"
tempfile = "3"
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
