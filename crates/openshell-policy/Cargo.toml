[package]
name = "openshell-policy"
description = "Shared sandbox policy parsing and defaults for OpenShell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hickory-proto = { workspace = true }
openshell-core = { path = "../openshell-core", default-features = false }
openshell-policy-cedar = { path = "../openshell-policy-cedar", optional = true }
openshell-policy-schema = { path = "../openshell-policy-schema" }
serde = { workspace = true }
serde_json = { workspace = true }
miette = { workspace = true }
prost-types = { workspace = true }

[features]
default = ["cedar"]
# Validates Cedar-authored policies (`cedar_policy_source`). Without it, any
# policy with Cedar source fails validation as unsupported. Crates that only
# use this crate's constants and defaults disable it to avoid linking Cedar.
cedar = ["dep:openshell-policy-cedar"]

[lints]
workspace = true
