version: 1

network_policies:
  versioned_mcp:
    name: versioned_mcp
    endpoints:
      - host: mcp.example.com
        port: 443
        protocol: mcp
        enforcement: enforce
        mcp:
          versions:
            - "2025-11-25"
            - "2025-03-26"
            - "2025-06-18"
        rules:
          - allow:
              method: initialize
    binaries:
      - path: /usr/bin/mcp-client
