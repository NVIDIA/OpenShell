[package]
name = "openshell-sandbox"
description = "OpenShell process sandbox and monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-sandbox"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }
openshell-binary-identity = { path = "../openshell-binary-identity" }
openshell-isolation-interface = { path = "../openshell-isolation-interface" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-policy = { path = "../openshell-policy" }

anyhow = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
hex = "0.4"
ipnet = "2"
rand = "0.10"
sha2 = { workspace = true }

# Async runtime
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
miette = { workspace = true }

# Unix identity and bootstrap ownership
nix = { workspace = true }

# TLS crypto provider install (main.rs)
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }

# Serialization (serde_json::json! for OCSF unmapped fields)
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
capctl = "0.2.4"
landlock = "0.4"
seccompiler = "0.5"
socket2 = { workspace = true }
tempfile = "3"

[dev-dependencies]
rcgen = { workspace = true }
tempfile = "3"

[lints]
workspace = true
