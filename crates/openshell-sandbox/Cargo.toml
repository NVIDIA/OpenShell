[package]
name = "openshell-sandbox"
description = "OpenShell process sandbox and monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-sandbox"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }
openshell-extension-core = { path = "../openshell-extension-core" }
openshell-ocsf = { path = "../openshell-ocsf" }
openshell-policy = { path = "../openshell-policy" }
openshell-supervisor-network = { path = "../openshell-supervisor-network", default-features = false }
openshell-supervisor-middleware = { path = "../openshell-supervisor-middleware" }
openshell-supervisor-middleware-builtins = { path = "../openshell-supervisor-middleware-builtins" }
openshell-supervisor-process = { path = "../openshell-supervisor-process" }

# Async runtime
tokio = { workspace = true }

# gRPC (tonic::Status downcast in error mapping)
tonic = { workspace = true, features = ["channel", "tls-native-roots"] }
prost-types = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
miette = { workspace = true }

# Unix ownership for Kubernetes sidecar init setup
nix = { workspace = true }

# TLS crypto provider install (main.rs)
rustls = { workspace = true }

# Serialization (serde_json::json! for OCSF unmapped fields)
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

# Logging
tracing = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[features]
default = ["telemetry", "bundled-ca-roots"]
## Convenience alias: all defaults except bundled CA roots. Use
## `--no-default-features --features system-ca-roots` to build a supervisor
## that uses the platform trust store with telemetry intact.
system-ca-roots = ["telemetry"]

telemetry = ["openshell-core/telemetry"]
bundled-ca-roots = ["openshell-supervisor-network/bundled-ca-roots"]

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
tokio-tungstenite = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
