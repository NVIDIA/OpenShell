syntax = "proto3";

// A new private format; frozen openshell.storage.v1 remains unchanged.
package openshell.storage.secret.v1;

import "datamodel.proto";
import "google/protobuf/timestamp.proto";

// Stored workspace secret. The value lives in credential storage; only its
// handle is kept here, and the handle never appears on the public Secret.
message StoredWorkspaceSecret {
  openshell.datamodel.v1.ObjectMeta metadata = 1;
  string description = 2;
  // Present only when the value may be used as refresh material. Immutable.
  StoredSecretRefreshUse refresh_use = 3;
  google.protobuf.Timestamp value_update_time = 4;
  // Credential storage handle for the current value. Absent once tombstoned.
  openshell.datamodel.v1.CredentialHandle value_handle = 5;
  // Superseded handles whose backend deletion has not completed yet.
  repeated openshell.datamodel.v1.CredentialHandle pending_handle_deletions = 6;
  // ID of the workspace the secret was created in.
  string workspace_id = 7;
  // Set from insert until CreateSecret confirms that the workspace is still
  // the active one it resolved. A pending record is invisible to every read
  // and reference but still blocks workspace deletion. The sweep discards it
  // once stale or once its workspace is gone, so a crash between insert and
  // publication cannot leave a live secret behind.
  google.protobuf.Timestamp create_pending_since = 8;
}

message StoredSecretRefreshUse {
  // Normalized token endpoints the value may be sent to. Never empty.
  repeated string allowed_endpoints = 1;
}
