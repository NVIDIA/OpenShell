# Test-only Windows variant of the built-in GitHub profile. MXC's host proxy
# uses the first per-sandbox command element as its static process identity, so
# this profile names inbox Windows PowerShell rather than the Linux gh/git paths
# in the production GitHub profile.

id: mxc-github-e2e
display_name: MXC GitHub credential e2e
description: Test-only GitHub profile for the MXC provider credential example
category: source_control
credentials:
  - name: api_token
    description: GitHub token
    env_vars: [GITHUB_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - "C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"
