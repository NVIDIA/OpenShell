#
# A filesystem grant plus a supervisor-owned network policy. The historical
# filename is retained for existing demo packages. The network-policy scenario
# checks admission and execution, not HTTP or network enforcement.
version: 1

filesystem_policy:
  include_workdir: false
  read_only: []
  read_write:
    - "C:/work/openshell-mxc-e2e"

network_policies:
  test_rule:
    name: test-network-policy
    endpoints:
      - host: api.example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: "C:/Windows/System32/cmd.exe"
