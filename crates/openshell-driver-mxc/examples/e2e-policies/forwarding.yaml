# The listener reports its dynamically assigned port in the per-run workdir.
# No Internet egress policy is needed for this ingress-only test.
version: 1

filesystem_policy:
  include_workdir: false
  read_only: []
  read_write:
    - "C:/work/openshell-mxc-e2e"
