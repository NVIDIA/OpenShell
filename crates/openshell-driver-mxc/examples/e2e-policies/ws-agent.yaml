#
# ws-agent.yaml - Sandbox policy for the WebSocket agent (mxc-ws-agent.exe,
# wrapped by openshell-supervisor-relay.exe -- see mxc-ws-gateway.toml).
#
# The wrapped server process only needs:
#   - Execute access to mxc-ws-agent.exe / openshell-supervisor-relay.exe and
#     their runtime DLLs (provided by the AppContainer inheriting access to
#     system paths and share_dir).
#   - TCP socket binding on port 22000 (governed by pc_capabilities in the
#     gateway TOML, not by filesystem policy here).
#   - Private/loopback client access for openshell-supervisor-relay to dial
#     the driver's on-demand relay — granted by pc_capabilities in the TOML.
#   - No writes to the host filesystem.
#
# workload directory (passed by run-ws-agent-test.ps1, default C:\work\openshell-mxc-ws)
# is granted explicitly below via read_only, since the policy is the only
# source of filesystem grants (the driver no longer adds gateway-configured
# host paths on its own) -- this makes the binary directory accessible even
# with an otherwise-empty filesystem_policy, without granting more than the
# no-writes-needed requirement above actually calls for. run-ws-agent-test.ps1
# patches this path and the per-sandbox driver config when -AgentDir overrides
# the default below.
#
# This example intentionally omits network_policies because it does not need
# governed Internet egress. The driver therefore does not start a host CONNECT
# proxy or inject proxy environment variables for this sandbox.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - "C:/work/openshell-mxc-ws"
  read_write: []
