#
# mxc-ws-gateway.toml - Gateway config for the WebSocket agent test.
#
# Used by run-ws-agent-test.ps1.  Fields that contain host-specific paths
# (wxc_exec_path and pc_relay_spawner_path)
# are patched at test runtime by the script; the values below are
# safe-to-commit placeholders.
#
# Layout:
#   sandbox command = mxc-ws-agent.exe server
#                     Binds WebSocket on 0.0.0.0:22000, echoes messages back.
#                     No relay awareness -- launched the same way OpenClaw's
#                     gateway is in mxc-openclaw-gateway.toml.
#
#   pc_relay_spawner_path / pc_relay_target_port
#                     Wrap the sandbox command in openshell-supervisor-relay.exe
#                     instead of launching it directly (see driver.rs's
#                     launch handshake). This is what gives the driver a
#                     control channel for launch, readiness, shutdown, and
#                     dynamic forwarding.
#
# Connectivity: entirely on-demand via `openshell forward service
# --target-port 22000` (ForwardSink::open_dynamic_forward / the control
# channel's "forward" op) -- there is no static/always-on bridge and no
# port pre-declared in this config beyond pc_relay_target_port's own
# startup liveness check.
#
# Shutdown sequence on `sandbox delete`:
#   driver sends "shutdown" over the control channel (see driver.rs)
#   openshell-supervisor-relay kills the server directly and exits
#   driver also kills wxc-exec as a backstop regardless

[openshell]
version = 2

[openshell.drivers.mxc]
# Path to wxc-exec.exe.  Patched at runtime by run-ws-agent-test.ps1.
# Leave commented for mock-mode smoke tests (pass -Mock to the script).
wxc_exec_path = "C:\\mxc\\wxc-exec.exe"

# One-shot AppContainer backend: genuinely default-deny at the OS level.
backend = "process_container"

# AppContainer capability required for the server to bind a TCP socket on
# 0.0.0.0:22000.  "privateNetworkClientServer" allows the sandbox to act as
# both a client and a server on private (home/work/loopback) networks.
pc_capabilities = ["privateNetworkClientServer"]

# process_container only: keep standard privilege level (not LPA).
pc_least_privilege = false

# No governed Internet egress is needed. This forwarding test deliberately
# leaves proxy-peer mode disabled because MXC 1.0 proxy peers are egress-only.
egress_proxy      = false
egress_proxy_addr = ""

# MXC 1.0 requires the broad local-network posture for the in-sandbox relay to
# dial the workload's loopback listener. This also permits private-network
# server ingress and host-loopback access; the test documents that residual
# exposure instead of claiming sandbox-local-only networking.
pc_allow_local_network = true

# The workload command and cwd are supplied per sandbox by
# run-ws-agent-test.ps1 through `sandbox create --driver-config-json`.

# Launch the per-sandbox command via the generic openshell-supervisor-relay binary.
# Patched at runtime by run-ws-agent-test.ps1.
pc_relay_spawner_path = "C:/work/openshell-mxc-ws/openshell-supervisor-relay.exe"
pc_relay_target_port  = 22000
pc_proxy_peer_path    = ""

# Enable for verbose wxc-exec output during debugging.
debug = true
