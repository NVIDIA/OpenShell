# Base policy for the MXC provider-credential example. The attached provider
# profile contributes the api.github.com rule. This base rule separately allows
# github.com so the probe can prove credential endpoint binding independently of
# network admission: traffic is allowed, but use of GITHUB_TOKEN is not. Keeping
# the negative probe within GitHub avoids risking a token leak to an unrelated
# service if the behavior under test regresses.

version: 1

ui:
  # Windows PowerShell loads USER32 during startup and therefore requires the
  # graphical UI subsystem. Clipboard and input injection remain denied.
  allow_graphical_ui: true
  clipboard: none
  allow_input_injection: false

filesystem_policy:
  include_workdir: false
  read_only: []
  read_write:
    - "C:/work/openshell-mxc-provider"

network_policies:
  credential_endpoint_mismatch_probe:
    name: credential-endpoint-mismatch-probe
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: "C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"
