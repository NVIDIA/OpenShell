# Gateway configuration for run-provider-credential-test.ps1. The runner writes
# a disposable copy with the requested wxc-exec path.

[openshell.drivers.mxc]
wxc_exec_path = "C:\\mxc-kit\\bin\\wxc-exec.exe"
backend = "process_container"
default_configuration_id = "composable"

# The split mapper gives MXC a loopback redirect and the driver starts the
# per-sandbox host CONNECT proxy that enforces L4/L7 policy and rewrites
# provider credential placeholders.
egress_proxy = true
egress_proxy_addr = "127.0.0.1:18080"

debug = false
