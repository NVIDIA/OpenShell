[package]
name = "openshell-pi-conversation-middleware"
description = "Standalone reference gRPC middleware for the Pi conversation prototype"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }

base64 = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
prost-types = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["server"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
