[package]
name = "ryno-supervisor-middleware"
description = "Supervisor middleware registry and chain execution for Ryno"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ryno-core = { path = "../ryno-core", default-features = false }
ryno-extension-core = { path = "../ryno-extension-core" }

miette = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["channel", "server", "tls-native-roots"] }

[dev-dependencies]
ryno-supervisor-middleware-builtins = { path = "../ryno-supervisor-middleware-builtins" }
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
