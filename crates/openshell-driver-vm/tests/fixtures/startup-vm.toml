# Startup document the gateway writes for the VM driver, with every VM setting
# populated. The gateway's conversion test and the driver's overlay test both
# read this file, so a key one side stops writing or reading fails a test.

schema_version = 1

[gateway]
bind_socket = "/var/lib/openshell/vm/run/compute-driver.sock"
expected_peer_pid = 4242
log_level = "debug"
gateway_name = "gateway-a"
grpc_endpoint = "https://127.0.0.1:8080"
tls_ca = "/etc/openshell/tls/ca.pem"
upstream_proxy_ca_bundle = "/etc/openshell/proxy-ca.pem"

[gateway.admission]
allow_driver_config = true

[gateway.admission.resource_admission]
enabled = true

[gateway.admission.resource_admission.required_labels]
"openshell.ai/sandbox-attachable" = "true"

[gateway.telemetry.traces]
endpoint = "https://collector.example:4317"
protocol = "grpc"

[gateway.telemetry.ocsf]
endpoint = "https://collector.example:4318"
protocol = "http/protobuf"

[gateway.telemetry.agent]
endpoint = "https://collector.example:4319"
protocol = "grpc"

[gateway.telemetry.collector]
ca_file = "/etc/openshell/otlp/ca.pem"
cert_file = "/etc/openshell/otlp/cert.pem"
key_file = "/etc/openshell/otlp/key.pem"

[gateway.upstream_proxy]
https_proxy = "http://proxy.example:3128"
no_proxy = "localhost,127.0.0.1"
proxy_auth_file = "/etc/openshell/proxy-auth"
proxy_auth_allow_insecure = true
proxy_connect_by_hostname = true

[gateway.network_trust]
path = "/var/lib/openshell/trust/bundle.pem"
digest = "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
certificate_count = 3

[driver_config]
state_dir = "/var/lib/openshell/vm"
default_image = "openshell/sandbox:default"
bootstrap_image = "openshell/sandbox-bootstrap:latest"
krun_log_level = 2
vcpus = 4
mem_mib = 4096
overlay_disk_mib = 8192
sandbox_uid = 2000
sandbox_gid = 3000
rootfs_tar_staging_dir = "/var/lib/openshell/rootfs-staging"
rootfs_tar_max_bytes = 1073741824
enable_bind_mounts = true
provider_spiffe_workload_api_tcp_endpoint = "tcp:10.0.0.5:8081"
provider_spiffe_allow_guest_tcp = true
