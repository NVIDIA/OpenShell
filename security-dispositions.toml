# Reviewed decisions for HIGH/CRITICAL CodeQL, Trivy, and Zizmor findings.
# The release gate (tasks/scripts/security_dispositions.py) passes a finding
# only when a current entry covers its rule and path. See CI.md, "Security
# finding dispositions", for the workflow and SLAs.
#
# Fields:
#   id                 <rule>/<lowest alert number>, prefixed codeql/ or trivy/
#   scanner            codeql | trivy | zizmor
#   rule               code-scanning rule ID
#   disposition        deferred | rejected
#   scanner_severity   critical | high
#   assessed_severity  critical | high | medium | low | none (none: rejected only)
#   reason             why this decision
#   approver           GitHub login of the deciding maintainer
#   first_seen         date the earliest alert was created
#   first_seen_at      Actions run that first reported it
#   expires            deferred only; at most first_seen + SLA unless sla_exception
#   sla_exception      deferred only; why expires exceeds the SLA
#   [disposition.alerts]  alert number = path (package name for image CVEs)

[[disposition]]
id = "codeql/rust/disabled-certificate-check/170"
scanner = "codeql"
rule = "rust/disabled-certificate-check"
disposition = "deferred"
scanner_severity = "high"
assessed_severity = "medium"
reason = "OIDC clients skip IdP TLS verification whenever --gateway-insecure is set; scope the flag to the gateway connection."
approver = "purp"
first_seen = 2026-08-27
first_seen_at = "https://github.com/NVIDIA/OpenShell/actions/runs/33080368521"
expires = 2026-10-06
sla_exception = "Pre-GA backlog detected during alpha while static findings were not enforced (#3552). Timeline granted in #3671."

[disposition.alerts]
170 = "crates/openshell-cli/src/oidc_auth.rs"
171 = "crates/openshell-sdk/src/oidc.rs"

