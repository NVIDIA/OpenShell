<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell system architecture</title>
  <desc id="desc">User interfaces connect to the gateway, which uses the policy prover to formally verify proposed policy changes before approval. The OpenShell Runtime places a trusted supervisor separately from a network-isolated sandbox workload. The workload's only allowed network path is its mediated connection to the supervisor, which connects to approved external services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
      .blocked { fill: none; stroke: #c2413b; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1280" height="760" rx="20" fill="#ffffff"/>

  <g transform="translate(0,-80)">
  <text x="45" y="116" class="section">USER INTERFACES</text>
  <rect x="40" y="130" width="760" height="120" rx="18" class="soft"/>
  <rect x="75" y="156" width="180" height="68" rx="12" class="box"/>
  <text x="165" y="197" text-anchor="middle" class="label">CLI</text>
  <rect x="310" y="156" width="180" height="68" rx="12" class="box"/>
  <text x="400" y="197" text-anchor="middle" class="label">SDK</text>
  <rect x="545" y="156" width="180" height="68" rx="12" class="box"/>
  <text x="635" y="197" text-anchor="middle" class="label">TUI</text>

  <text x="845" y="116" class="section">EXTERNAL SERVICES</text>
  <rect x="840" y="130" width="400" height="120" rx="18" class="soft"/>
  <rect x="865" y="156" width="160" height="68" rx="12" class="box"/>
  <text x="945" y="185" text-anchor="middle" class="label">Services</text>
  <text x="945" y="207" text-anchor="middle" class="small">APIs and tools</text>
  <rect x="1045" y="156" width="170" height="68" rx="12" class="box"/>
  <text x="1130" y="185" text-anchor="middle" class="label">Models</text>
  <text x="1130" y="207" text-anchor="middle" class="small">inference APIs</text>

  <text x="45" y="326" class="section">GATEWAY (CONTROL PLANE)</text>
  <rect x="40" y="340" width="360" height="460" rx="18" class="soft"/>
  <rect x="85" y="380" width="290" height="70" rx="14" class="trusted"/>
  <text x="230" y="410" text-anchor="middle" class="label">API Server</text>
  <text x="230" y="434" text-anchor="middle" class="small">API, authentication, lifecycle, relays</text>
  <rect x="85" y="490" width="290" height="70" rx="14" class="box"/>
  <text x="230" y="520" text-anchor="middle" class="label">Policy prover</text>
  <text x="230" y="544" text-anchor="middle" class="small">formal verification of policy changes</text>
  <rect x="85" y="600" width="290" height="70" rx="14" class="box"/>
  <text x="230" y="630" text-anchor="middle" class="label">Durable state</text>
  <text x="230" y="654" text-anchor="middle" class="small">sandboxes · policies · providers · settings</text>
  <rect x="85" y="710" width="290" height="70" rx="14" class="green"/>
  <text x="230" y="740" text-anchor="middle" class="label">Compute driver</text>
  <text x="230" y="764" text-anchor="middle" class="small">places and fences each sandbox</text>
  <path d="M230 450 V490" class="line"/>
  <path d="M85 415 H60 V635 H85" class="line"/>
  <path d="M230 670 V710" class="line"/>

  <text x="485" y="326" class="section">OPENSHELL RUNTIME (DATA PLANE)</text>
  <rect x="480" y="340" width="760" height="460" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>

  <rect x="530" y="405" width="240" height="290" rx="16" class="trusted"/>
  <text x="650" y="445" text-anchor="middle" class="label">Supervisor</text>
  <text x="650" y="469" text-anchor="middle" class="tiny">GOVERNS THE AGENT</text>
  <text x="650" y="515" text-anchor="middle" class="small">Policy evaluation</text>
  <text x="650" y="545" text-anchor="middle" class="small">Credential resolution</text>
  <text x="650" y="575" text-anchor="middle" class="small">DNS and proxying</text>
  <text x="650" y="605" text-anchor="middle" class="small">Agent session multiplexing</text>
  <line x1="565" y1="630" x2="735" y2="630" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="650" y="662" text-anchor="middle" class="small">Maintains the gateway session</text>

  <rect x="880" y="390" width="315" height="270" rx="18" fill="#ffffff" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1037" y="423" text-anchor="middle" class="tiny">SANDBOX · NETWORK ISOLATED</text>
  <text x="1037" y="442" text-anchor="middle" class="tiny">(CONTAINER · VM)</text>
  <rect x="910" y="452" width="255" height="86" rx="14" class="box"/>
  <text x="1037" y="489" text-anchor="middle" class="label">OpenShell Sandbox</text>
  <text x="1037" y="514" text-anchor="middle" class="small">process owner and syscall boundary</text>
  <rect x="910" y="570" width="255" height="60" rx="14" class="dark"/>
  <text x="1037" y="597" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="1037" y="618" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text>
  <path d="M1037 538 V570" class="line"/>

  <path d="M910 495 H770" class="flow"/>
  <text x="840" y="474" text-anchor="middle" class="tiny">MEDIATED CHANNEL</text>
  <path d="M1037 630 V651" class="blocked"/>
  <line x1="1028" y1="651" x2="1046" y2="669" stroke="#c2413b" stroke-width="3"/>
  <line x1="1046" y1="651" x2="1028" y2="669" stroke="#c2413b" stroke-width="3"/>

  <rect x="880" y="690" width="315" height="84" rx="12" class="green"/>
  <text x="1037" y="714" text-anchor="middle" class="tiny">WORKLOAD NETWORK RULE</text>
  <text x="1037" y="739" text-anchor="middle" class="label">Deny all egress</text>
  <text x="1037" y="760" text-anchor="middle" class="small">except to the supervisor</text>

  <path d="M420 250 V286 H330 V380" class="line"/>
  <text x="438" y="279" class="tiny">gRPC / HTTP</text>
  <path d="M530 500 H420 V435 H375" class="line"/>
  <text x="465" y="468" text-anchor="middle" class="tiny">OUTBOUND</text>
  <text x="465" y="484" text-anchor="middle" class="tiny">SESSION</text>
  <path d="M375 735 H480" class="line"/>
  <text x="427" y="717" text-anchor="middle" class="tiny">PROVISION</text>

  <path d="M750 405 V286 H1040 V250" class="flow"/>
  <text x="790" y="279" class="tiny">POLICY-APPROVED EGRESS</text>
  </g>
</svg>
