# Fern site config — merged with skills/convert-to-fern/assets/theme/nvidia/docs-theme.yml pattern
# Production: https://docs.nvidia.com/ryno/ — preview + custom-domain share path prefix `ryno`.
# Source checkouts and pull request previews expose the current documentation at /dev.
# Redirect `source:` entries below intentionally keep the legacy /openshell/ prefix
# so previously published URLs keep resolving after the OpenShell -> Ryno rename.
instances:
  - url: ryno.docs.buildwithfern.com/ryno
    custom-domain: docs.nvidia.com/ryno
    multi-source: true

title: NVIDIA Ryno

global-theme: nvidia

footer: ./components/CustomFooter.tsx

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: "#76B900"
    light: "#76B900"
  background:
    light: "#FFFFFF"
    dark: "#000000"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /ryno
  right-text: Ryno

favicon: ./assets/NVIDIA_symbol.svg

css:
  - ./main.css

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/Ryno

experimental:
  mdx-components:
    - ../docs/_components
    - ./components

versions:
  - display-name: Dev
    path: ../docs/index.yml
    slug: dev
    announcement:
      message: '<span style="display: block; padding: 0.375rem 0; text-align: left;"><strong>New in Ryno 0.1.x:</strong> a stable release cadence, new isolation primitives, an expanded extension surface, and new APIs. <a href="https://docs.nvidia.com/ryno/dev/upgrade/0-1-0" target="_blank" rel="noreferrer">Read the 0.1.0 upgrade guide</a>.</span>'

redirects:
  - source: "/openshell/latest/kubernetes/sandbox-runtime"
    destination: "/ryno/latest/kubernetes/setup"
  - source: "/openshell/dev/kubernetes/sandbox-runtime"
    destination: "/ryno/dev/kubernetes/setup"
  - source: "/openshell/latest/about/how-it-works"
    destination: "/ryno/latest/about/architecture"
  - source: "/openshell/dev/about/how-it-works"
    destination: "/ryno/dev/about/architecture"
  - source: "/openshell/latest/extensibility/extension-negotiation"
    destination: "/ryno/latest/extensibility/overview#protocol-negotiation"
  - source: "/openshell/dev/extensibility/extension-negotiation"
    destination: "/ryno/dev/extensibility/overview#protocol-negotiation"
  - source: "/openshell/latest/providers/google-vertex-ai"
    destination: "/ryno/latest/how-it-works/providers/google#vertex-ai"
  - source: "/openshell/dev/providers/google-vertex-ai"
    destination: "/ryno/dev/how-it-works/providers/google#vertex-ai"
  - source: "/openshell/latest/about/supported-agents"
    destination: "/ryno/latest/about/run-your-first-agent"
  - source: "/openshell/dev/about/supported-agents"
    destination: "/ryno/dev/about/run-your-first-agent"
  - source: "/openshell/latest/get-started/quickstart"
    destination: "/ryno/latest/about/run-your-first-agent"
  - source: "/openshell/dev/get-started/quickstart"
    destination: "/ryno/dev/about/run-your-first-agent"
  - source: "/openshell/latest/sandboxes/providers-v2"
    destination: "/ryno/latest/how-it-works/providers/profiles"
  # Preserve published URLs when page names and slugs change.
  - source: "/openshell/about/why-open-shell"
    destination: "/ryno/latest/about/overview"
  - source: "/openshell/sdk/type-script"
    destination: "/ryno/latest/sdk/typescript"
  - source: "/openshell/latest/about/why-open-shell"
    destination: "/ryno/latest/about/overview"
  - source: "/openshell/dev/about/why-open-shell"
    destination: "/ryno/dev/about/overview"
  - source: "/openshell/latest/sdk/type-script"
    destination: "/ryno/latest/sdk/typescript"
  - source: "/openshell/dev/sdk/type-script"
    destination: "/ryno/dev/sdk/typescript"
  # Paths are relative to the site root; subpath prefix matches instances + custom-domain.
  # Legacy HTML URLs used .../path/to/page/index.html; Fern canonical URLs omit index.html.
  # List explicit /index.html routes before :path*/index.html so empty path segments do not
  # mis-resolve (see NeMo-Curator fern/docs.yml). :path*.html must follow :path*/index.html rules.
  # https://www.buildwithfern.com/learn/docs/configuration/site-level-settings#redirects-configuration
  - source: "/openshell/index.html"
    destination: "/ryno/latest"
  - source: "/openshell/index"
    destination: "/ryno/latest"
  - source: "/openshell/latest/index.html"
    destination: "/ryno/latest"
  - source: "/openshell/latest/index"
    destination: "/ryno/latest"
  - source: "/openshell/latest/:path*/index.html"
    destination: "/ryno/latest/:path*"
  - source: "/openshell/:path*/index.html"
    destination: "/ryno/:path*"
  - source: "/openshell/:path*.html"
    destination: "/ryno/:path*"
  - source: "/openshell/tutorials"
    destination: "/ryno/latest/tutorials"
  - source: "/openshell/tutorials/:path*"
    destination: "/ryno/latest/tutorials/:path*"
