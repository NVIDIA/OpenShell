instances:
- url: openshell.docs.buildwithfern.com/openshell
  custom-domain: docs.nvidia.com/openshell
  multi-source: true
title: NVIDIA OpenShell
global-theme: nvidia
footer: ./components/CustomFooter.tsx
layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true
colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /openshell/latest
  right-text: OpenShell
favicon: ./assets/NVIDIA_symbol.svg
css:
- ./main.css
navbar-links:
- type: github
  value: https://github.com/NVIDIA/OpenShell
experimental:
  mdx-components:
  - ./pages-latest/_components
  - ./pages-dev/_components
  - ./pages-v0.0.116/_components
  - ./pages-v0.1.0/_components
  - ./pages-v0.1.1/_components
  - ./pages-v0.1.2/_components
  - ./pages-v0.1.3/_components
  - ./components
versions:
- display-name: Latest (v0.1.3)
  path: ./versions/latest.yml
  slug: latest
  announcement:
    message: '<span style="display: block; padding: 0.375rem 0; text-align: left;"><strong>New
      in OpenShell 0.1.x:</strong> a stable release cadence, new isolation primitives,
      an expanded extension surface, and new APIs. <a href="https://docs.nvidia.com/openshell/dev/upgrade/0-1-0"
      target="_blank" rel="noreferrer">Read the 0.1.0 upgrade guide</a>.</span>'
