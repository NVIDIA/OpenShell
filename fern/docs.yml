instances:
- url: openshell.docs.buildwithfern.com/openshell
  custom-domain: docs.nvidia.com/openshell
  multi-source: true
title: NVIDIA OpenShell
global-theme: nvidia
footer: ./components/CustomFooter.tsx
layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true
colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /openshell/latest
  right-text: OpenShell
favicon: ./assets/NVIDIA_symbol.svg
css:
- ./main.css
navbar-links:
- type: github
  value: https://github.com/NVIDIA/OpenShell
experimental:
  mdx-components:
  - ./pages-latest/_components
  - ./pages-dev/_components
  - ./components
versions:
- display-name: Latest (v0.0.116)
  path: ./versions/latest.yml
  slug: latest
  announcement:
    message: '<span style="display: block; padding: 0.375rem 0; text-align: left;"><strong>OpenShell
      0.1.0 is coming soon.</strong> <a href="https://github.com/NVIDIA/OpenShell/milestone/10"
      target="_blank" rel="noreferrer">Track progress in the 0.1.0 milestone</a>,
      <a href="https://docs.nvidia.com/openshell/dev/index.html" target="_blank" rel="noreferrer">read
      the prerelease documentation</a>, or <a href="https://docs.nvidia.com/openshell/dev/about/installation#install-a-prerelease"
      target="_blank" rel="noreferrer">install a prerelease</a>.<br/>Version 0.0.116
      will reach end of support and upgrading will require migration; notes will be
      provided with 0.1.0 release.</span>'
- display-name: Dev
  path: ./versions/dev.yml
  slug: dev
  availability: beta
  announcement:
    message: '<span style="display: block; padding: 0.375rem 0; text-align: left;"><strong>New
      in OpenShell 0.1.0:</strong> a stable release cadence, an improved security
      model, an expanded extension surface, and new APIs. <a href="https://docs.nvidia.com/openshell/dev/upgrade/0-1-0"
      target="_blank" rel="noreferrer">Read the 0.1.0 upgrade guide</a>.</span>'
redirects:
- source: /openshell/index.html
  destination: /openshell/latest
- source: /openshell/index
  destination: /openshell/latest
- source: /openshell/latest/index.html
  destination: /openshell/latest
- source: /openshell/latest/index
  destination: /openshell/latest
- source: /openshell/latest/:path*/index.html
  destination: /openshell/latest/:path*
- source: /openshell/:path*/index.html
  destination: /openshell/:path*
- source: /openshell/:path*.html
  destination: /openshell/:path*
- source: /openshell/tutorials
  destination: /openshell/latest/get-started/tutorials
- source: /openshell/tutorials/:path*
  destination: /openshell/latest/get-started/tutorials/:path*
- source: /openshell/latest/tutorials
  destination: /openshell/latest/get-started/tutorials
- source: /openshell/latest/tutorials/:path*
  destination: /openshell/latest/get-started/tutorials/:path*
