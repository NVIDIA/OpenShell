<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell sandbox authentication</title>
  <desc id="desc">The compute driver gives the supervisor a bootstrap credential. The supervisor presents it to the gateway, which issues a gateway JWT and a sandbox JWT. The supervisor uses the gateway JWT with the gateway and the sandbox JWT over mutual TLS with the OpenShell Sandbox, which holds only the gateway's public key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1280" height="560" rx="20" fill="#ffffff"/>

  <text x="45" y="50" class="section">GATEWAY (CONTROL PLANE)</text>
  <text x="535" y="50" class="section">TRUSTED</text>
  <text x="925" y="50" class="section">SANDBOX · NETWORK ISOLATED</text>

  <!-- Gateway -->
  <rect x="40" y="70" width="360" height="420" rx="18" class="soft"/>
  <rect x="75" y="105" width="290" height="110" rx="14" class="trusted"/>
  <text x="220" y="145" text-anchor="middle" class="label">API Server</text>
  <text x="220" y="171" text-anchor="middle" class="small">signs every JWT</text>
  <text x="220" y="192" text-anchor="middle" class="small">checks the sandbox record</text>
  <rect x="75" y="360" width="290" height="100" rx="14" class="green"/>
  <text x="220" y="398" text-anchor="middle" class="label">Compute driver</text>
  <text x="220" y="424" text-anchor="middle" class="small">delivers or verifies the</text>
  <text x="220" y="444" text-anchor="middle" class="small">bootstrap credential</text>

  <!-- Supervisor -->
  <rect x="530" y="105" width="240" height="355" rx="16" class="trusted"/>
  <text x="650" y="150" text-anchor="middle" class="label">Supervisor</text>
  <text x="650" y="174" text-anchor="middle" class="tiny">HOLDS TOKENS IN MEMORY</text>
  <text x="650" y="225" text-anchor="middle" class="small">Gateway JWT for the gateway</text>
  <text x="650" y="255" text-anchor="middle" class="small">Sandbox JWT for the sandbox</text>
  <line x1="560" y1="285" x2="740" y2="285" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="650" y="315" text-anchor="middle" class="small">Renews both together</text>
  <text x="650" y="345" text-anchor="middle" class="small">while the sandbox exists</text>

  <!-- Sandbox -->
  <rect x="920" y="70" width="320" height="420" rx="18" fill="#ffffff" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="945" y="105" width="270" height="210" rx="14" class="box"/>
  <text x="1080" y="150" text-anchor="middle" class="label">OpenShell Sandbox</text>
  <text x="1080" y="174" text-anchor="middle" class="tiny">VERIFIES, NEVER SIGNS</text>
  <text x="1080" y="225" text-anchor="middle" class="small">Gateway public key only</text>
  <text x="1080" y="255" text-anchor="middle" class="small">Checks the sandbox JWT</text>
  <text x="1080" y="285" text-anchor="middle" class="small">Fresh TLS certs per run</text>
  <rect x="945" y="398" width="270" height="62" rx="14" class="dark"/>
  <text x="1080" y="426" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="1080" y="447" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">sees no credentials</text>
  <path d="M1080 315 V398" class="line"/>

  <!-- Flows -->
  <path d="M365 410 H530" class="line"/>
  <text x="466" y="398" text-anchor="middle" class="tiny">1 · BOOTSTRAP</text>

  <path d="M530 140 H365" class="line"/>
  <text x="466" y="128" text-anchor="middle" class="tiny">2 · AUTHENTICATES</text>

  <path d="M365 185 H530" class="line"/>
  <text x="466" y="207" text-anchor="middle" class="tiny">3 · ISSUES JWT PAIR</text>

  <path d="M770 210 H945" class="flow"/>
  <text x="845" y="198" text-anchor="middle" class="tiny">4 · SANDBOX JWT</text>
  <text x="845" y="232" text-anchor="middle" class="tiny">MUTUAL TLS</text>

  <text x="40" y="530" class="small">Every JWT names one sandbox and one run of it. Restarting a sandbox issues new tokens and TLS certificates.</text>
</svg>
