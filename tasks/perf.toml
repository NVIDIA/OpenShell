["perf:docker:build"]
description = "Build the shared Docker/OpenShell benchmark workload image"
run = "docker build -t openshell-perf-workload:local benchmarks/docker"

["perf:docker"]
description = "Compare Docker and the OpenShell Docker driver (requires a running Docker gateway)"
run = "uv run --no-project tasks/scripts/perf-docker.py"

["perf:docker:test"]
description = "Test the Docker benchmark runner's case selection, validation, and report"
run = "uv run --no-project --with pytest pytest -o \"python_files=*_test.py\" tasks/scripts/perf_docker_test.py"
