# Standalone gateway tasks

["build:gateway"]
description = "Build the standalone openshell-gateway binary (OPENSHELL_BUILD_CEDAR=1 enables the Cedar policy engine)"
run = "bash -c 'source tasks/scripts/build-env.sh && ensure_build_nofile_limit && cedar_feature=\"$(openshell_cedar_feature)\" && cargo build -p openshell-gateway --bin openshell-gateway --features \"$cedar_feature\"'"
hide = true

["gateway"]
description = "Run a standalone gateway with the detected compute driver"
run = "bash tasks/scripts/gateway.sh"

["gateway:docker"]
description = "Run a standalone gateway with the bundled Docker compute driver"
run = "bash tasks/scripts/gateway-docker.sh"

["gateway:podman"]
description = "Run a standalone gateway with the bundled Podman compute driver"
run = "bash tasks/scripts/gateway-podman.sh"

["gateway:vm"]
description = "Run a standalone gateway with the bundled VM compute driver"
run = "bash tasks/scripts/gateway-vm.sh"
