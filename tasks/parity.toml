["test:e2e-parity"]
description = "Run deterministic schema-v1/schema-v2 parity harness tests"
run = "bash e2e/parity/test.sh"
hide = true

["e2e:parity:podman"]
description = "Compare frozen schema-v1 and current schema-v2 conformance against Podman (opt-in live test)"
run = "bash e2e/parity/run.sh --driver podman"

["e2e:parity:podman-options"]
description = "Compare paired Podman sandbox option semantics across schema v1 and v2 (opt-in live test)"
run = "bash e2e/parity/run.sh --driver podman --scenario podman-options"

["e2e:parity:podman-external-driver"]
description = "Compare paired external Podman driver lifecycle semantics across schema v1 and v2 (opt-in live test)"
run = "bash e2e/parity/run.sh --driver podman --scenario external-driver"

["e2e:parity:gateway-options"]
description = "Compare process-level gateway option behavior across schema v1 and v2 (opt-in live test)"
run = "bash e2e/parity/gateway-options.sh"

["test:e2e-parity:kubernetes-options"]
description = "Run deterministic Kubernetes schema parity harness tests"
run = "bash e2e/parity/kubernetes-options-test.sh"
hide = true

["e2e:parity:kubernetes-options"]
description = "Compare Kubernetes driver options on an explicitly supplied disposable kind cluster"
run = "bash e2e/parity/kubernetes-options.sh"
