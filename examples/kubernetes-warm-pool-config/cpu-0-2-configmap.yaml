apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-warm-pool-cpu-0-2
  namespace: openshell
  labels:
    openshell.ai/warm-pool-profile: "true"
data:
  warm-pool.toml: |
    version = 1
    workspace = "openshell"
    replicas = 1

    [resources]
    cpu = "0.2"
