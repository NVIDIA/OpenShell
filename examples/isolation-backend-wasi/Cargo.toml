[workspace]

[package]
name = "openshell-wasi-backend-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "46.0", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "46.0", default-features = false, features = ["p1"] }
wat = "1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wasi-backend"
path = "src/main.rs"
