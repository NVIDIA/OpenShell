# Allow curl to call the nv-inference chat/completions API.
# DELETE is blocked by the "read-write" preset.
# Credential resolution is bound explicitly to the "nv-inference" provider
# instance, which uses the endpointless custom profile in
# nv-inference-profile.yaml.

version: 1

# Default sandbox filesystem and Landlock settings. Process identity is omitted
# so the active compute driver can select it. These fields are required when
# using `openshell policy set` because it replaces the entire policy.
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  nv_inference_api:
    name: nv_inference_api
    endpoints:
      - host: inference-api.nvidia.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
        credential_binding:
          provider: nv-inference
    binaries:
      - { path: /usr/bin/curl }
