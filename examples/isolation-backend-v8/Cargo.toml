[workspace]

[package]
name = "js-sbx"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
openshell-core = { path = "../../crates/openshell-core", default-features = false, features = ["jwt"] }
openshell-isolation-interface = { path = "../../crates/openshell-isolation-interface" }
openshell-sandbox-backend = { path = "../../crates/openshell-sandbox-backend" }
rustix = { version = "1", features = ["process"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }

v8 = "152.2.0"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[[bin]]
name = "js-sbx"
path = "src/main.rs"
