[workspace]

[package]
name = "openshell-supervisor-middleware-response-transform"
description = "Example OpenShell HTTP response middleware service"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
openshell-core = { path = "../../crates/openshell-core", default-features = false }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }

[dev-dependencies]
openshell-policy = { path = "../../crates/openshell-policy" }

[[bin]]
name = "supervisor-middleware-response-transform"
path = "src/main.rs"
