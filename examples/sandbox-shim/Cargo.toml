[workspace]

[package]
name = "openshell-sandbox-shim"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
openshell-binary-identity = { path = "../../crates/openshell-binary-identity" }
openshell-core = { path = "../../crates/openshell-core", default-features = false, features = ["jwt"] }
openshell-crypto = { path = "../../crates/openshell-crypto" }
openshell-isolation-interface = { path = "../../crates/openshell-isolation-interface" }
openshell-sandbox = { path = "../../crates/openshell-sandbox" }
openshell-sandbox-backend = { path = "../../crates/openshell-sandbox-backend" }
prost = "0.14"
prost-types = "0.14"
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "fs", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-vsock = "0.7"
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[[bin]]
name = "sandbox-shim"
path = "src/main.rs"

[profile.release]
strip = true
