version: 1

network_middlewares:
  prototype-protocol:
    name: Protocol demonstration
    middleware: protocol-example
    order: 10
    config: {}
    on_error: fail_closed
    endpoints:
      include:
        - host.openshell.internal

network_policies:
  response-framing-demo:
    name: Response framing demo
    endpoints:
      - host: host.openshell.internal
        port: 18081
        protocol: rest
        rules:
          - allow:
              method: POST
              path: /request
          - allow:
              method: GET
              path: /ws
          - allow:
              method: GET
              path: /headers-only
          - allow:
              method: GET
              path: /whole-body
          - allow:
              method: GET
              path: /stream
          - allow:
              method: GET
              path: /stream-close
          - allow:
              method: GET
              path: /block
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/python3
      - path: /usr/local/bin/python3
