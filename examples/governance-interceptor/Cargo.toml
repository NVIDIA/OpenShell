[workspace]

[package]
name = "ryno-governance-interceptor-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[dependencies]
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
ryno-core = { path = "../../crates/ryno-core", default-features = false }
ryno-policy = { path = "../../crates/ryno-policy" }
ryno-providers = { path = "../../crates/ryno-providers" }
prost = "0.14"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = { package = "noyalib", version = "0.0.28", default-features = false, features = ["std", "compat-serde-yaml"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tonic = { version = "0.14", features = ["transport"] }

[[bin]]
name = "governance-interceptor"
path = "src/main.rs"

[[bin]]
name = "governance-smoke-client"
path = "src/smoke_client.rs"
