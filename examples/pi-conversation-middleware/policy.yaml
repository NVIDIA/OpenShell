version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /opt/pi-conversation
  read_write:
    - /tmp
    - /dev/null

network_middlewares:
  pi-conversation:
    name: Pi conversation attestation
    middleware: pi-conversation-prototype
    order: 10
    config:
      policy_revision: prototype-v1
    on_error: fail_closed
    endpoints:
      include:
        - inference-api.nvidia.com

network_policies:
  nvidia-inference-chat-completions:
    name: NVIDIA Inference API Chat Completions
    endpoints:
      - host: inference-api.nvidia.com
        port: 443
        protocol: rest
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/node
