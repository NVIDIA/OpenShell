agent {
    data_dir = "/run/spire/agent/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/agent/sockets/agent.sock"
    trust_domain = "openshell.local"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/run/spire/agent/data"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }

    # Podman exposes a Docker-compatible API. The demo mounts the Podman socket
    # here so SPIRE can use Docker-style selectors for the sandbox container
    # when the local SPIRE version supports them.
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///run/podman/podman.sock"
        }
    }
}
